slug: endothelial-dysfunction
name: Endothelial dysfunction (impaired function of the blood-vessel lining)
core_claim:
  text: >-
    The hypothesis proposes that in people with ME/CFS the lining of the blood vessels (the
    endothelium) does not work properly, so that blood vessels widen less well when the tissues need
    more blood flow.
  sources: [pmid:32154656, pmid:33829023]
level: 3
level_reason:
  - text: >-
      A study from Berlin measured how far the finger's blood vessels widen after the blood flow to
      the arm is briefly stopped (the reactive hyperaemia index) in 35 patients meeting the Canadian
      Consensus Criteria and 20 healthy people of similar age. The index was lower in patients (1.95
      against 2.21), and 18 of 35 patients (51%) and 4 of 20 controls (20%) were below the cut-off the
      authors used for endothelial dysfunction. The card is at level 2 because of this study.
    sources: [pmid:32154656]
  - text: >-
      A later study from Bergen, Norway, with no authors shared with the Berlin study, tested patients
      meeting the Canadian Consensus Criteria with two other methods. The rise in skin blood flow after
      blood flow to the arm was briefly stopped (post-occlusive reactive hyperaemia), the measure
      closest to the Berlin index, was lower in 39 patients than in 30 healthy people. Widening of the
      arm artery (flow-mediated dilation) was lower in 35 patients than in 66 healthy women (median
      5.9% against 7.7%); this control group was all women, while 78% of the patients were women. The
      card is at level 3 because this independent group found reduced endothelial function in a
      separate cohort. The repeat is partial: the two groups used different methods, and the paper
      says it had no designated control group of its own, but used healthy people from two other
      studies by the same authors.
    sources: [pmid:33829023, pmid:32154656]
  - text: >-
      The Bergen group found the same in 39 patients from the RituxME rituximab trial, which selected
      patients on the Canadian Consensus Criteria, compared with the same
      control groups (flow-mediated dilation 5.1% against 8.2%). Because the group and the controls
      are the same, this does not count as an independent repeat.
    sources: [pmid:36730360, pmid:33829023]
  - text: >-
      Two studies of people whose ME/CFS began after COVID-19, both checked against the Canadian
      Consensus Criteria, point the same way. The Berlin group found a low reactive hyperaemia index
      in 5 of 14 such patients and in none of 15 healthy controls. A study from Munich, which recorded
      ME/CFS status against the Canadian Consensus Criteria as part of patient-reported measures, found
      narrower small arteries relative to veins at the back of the eye in 62 such patients than in 96 people
      never infected with the virus.
    sources: [pmid:35317812, pmid:42625188]
  - text: >-
      Blood levels of endothelin-1, a substance made by the vessel lining that narrows blood vessels,
      were higher in patients than in controls in the Berlin post-COVID study (14 patients and 15
      controls, and again in a second group of 25 patients and 47 controls) and in two studies from
      one clinic in Barcelona using the International Consensus Criteria (32 patients and 29
      controls; 31 patients and 31 controls). The two Barcelona studies recruited in overlapping
      periods, so their patients may overlap.
    sources: [pmid:35317812, pmid:36902264, pmid:38600563]
  - text: >-
      Against these findings, a study from California of 24 patients and 24 sedentary controls, using
      the Fukuda definition with post-exertional malaise required, found no statistically significant
      difference in the reactive hyperaemia index at rest (p = 0.07), during recovery or 18 hours after
      an exercise test. The authors applied the Fukuda definition with post-exertional malaise required
      and say this corresponds to the International Consensus Criteria; the card records Fukuda.
      Fukuda ranks below the Canadian Consensus Criteria
      on the published ladder, so this study does not contest the level. A study from New Zealand
      using the International Consensus Criteria found no difference in arterial stiffness between
      patients and controls at rest; arterial stiffness is a different measure from the widening tested
      above.
    sources: [pmid:29426834, pmid:33671082]
  - text: >-
      Studies of abnormal clotting, shown here as background, are without a confirmed recognised case
      definition. A study from Stellenbosch, South Africa, of 25 patients described only as diagnosed
      for more than six months and 15 healthy controls found a larger area of microclots in plasma,
      faster clot formation and more activated-looking platelets in patients; a protein study of 15 of
      these patients and 10 controls found differences in clotting-related proteins. These findings
      have not been repeated by an independent group. An earlier study
      from Dundee, Scotland, whose case definition is not yet verified, found no sign of platelet
      activation or of blood clotting too easily in 17 patients and 16 controls. These studies cannot
      raise the level.
    sources: [pmid:36015078, pmid:39014464, pmid:16479189]
  - text: >-
      The card does not reach level 4: no controlled study has changed endothelial function or
      clotting and measured the effect on the illness. In a placebo-controlled trial of 50 patients,
      high-dose vitamin D did not change arterial stiffness, flow-mediated dilation or fatigue. In the
      rituximab trial substudy, vessel measures did not differ between the rituximab and placebo
      groups. Without a control group, endothelial function improved in 5 of 6 patients with low
      values (P = 0.06, not statistically significant) 12 months after immunoadsorption, and changes in endothelial function did not follow
      clinical response after cyclophosphamide.
    sources: [pmid:25455721, pmid:36730360, pmid:32154656, pmid:33829023]
contested: null
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        No study on this card tests a cut-off from one patient group in a second, independent group.
        The Berlin studies used different cut-offs for the reactive hyperaemia index (1.81 and 1.67) in
        different patient groups, and the Munich eye study tested its combined model within one cohort.
      sources: [pmid:32154656, pmid:35317812, pmid:42625188]
  explains_pem:
    value: false
    reason:
      text: >-
        No study on this card tracks symptoms after an exertion challenge and links them to endothelial
        function or clotting in the same patients. Two studies measured vessel function after an
        exercise test, without tracking symptoms: one found no difference in the reactive hyperaemia
        index 18 hours later, and one found that arterial stiffness 48 hours later fell within the
        control group but not within the patient group (7 each at 48 hours; the groups were not
        compared directly).
      sources: [pmid:29426834, pmid:33671082]
subgroups:
  - text: >-
      Reduced endothelial function may apply to a subset of patients: in the Berlin study about half of
      the patients (18 of 35) were below the cut-off, and they reported more severe disease than the
      patients above it.
    sources: [pmid:32154656]
working_on_it: []
early_signals:
  - text: >-
      A study of n=31 patients and 31 sedentary healthy controls found higher blood levels of
      plasminogen activator inhibitor-1 (serpin E1), a protein that slows the breakdown of clots, in
      patients than in controls and than in people with long COVID. Not yet repeated.
    sources: [pmid:38600563]
  - text: >-
      A study of n=62 patients whose ME/CFS began after COVID-19 and 96 people never infected found a
      lower ratio of small-artery to small-vein width at the back of the eye in patients. Not yet
      repeated.
    sources: [pmid:42625188]
