slug: gut-microbiome
name: Altered gut microbiome and gut barrier
core_claim:
  text: >-
    The hypothesis proposes that in people with ME/CFS the community of gut bacteria is altered, and
    that this contributes to the illness through what the bacteria make or fail to make, such as
    butyrate, or through a gut wall that lets bacterial products into the blood.
  sources: [pmid:36758522, pmid:27338587, pmid:37396339]
level: 3
level_reason:
  - text: >-
      A controlled study of 106 patients meeting both the 1994 CDC (Fukuda) and the Canadian Consensus
      Criteria and 91 healthy controls from five US sites found less of two butyrate-making bacteria,
      Faecalibacterium prausnitzii and Eubacterium rectale, fewer copies of a bacterial butyrate gene,
      and lower butyrate and acetate in stool. The butyrate-making bacteria and the butyrate gene were
      still lower after adjusting for irritable bowel syndrome, site and other factors, and stool
      butyrate was lower both in patients with and in patients without irritable bowel syndrome,
      compared with controls without it. Rung 2 rests on this study.
    sources: [pmid:36758522]
  - text: >-
      A study from Jinan, China, with no authors shared with the US study, compared 40 patients meeting
      the 2015 IOM criteria with 40 age- and sex-matched healthy controls. It also found lower butyrate
      and acetate in stool after correcting for multiple testing. Faecalibacterium was lower before that
      correction but not after it, so this study repeats the lower stool butyrate, not the specific
      fall in Faecalibacterium.
    sources: [pmid:41387992]
  - text: >-
      The card is at level 3 because an independent group found lower stool butyrate in a separate
      cohort. Both studies measured patients once and compared them with controls. They show an
      association, not that the changes in gut bacteria come before the illness or cause it; in the
      Chinese study, patients who ate more fibre had higher stool acetate.
    sources: [pmid:36758522, pmid:41387992]
  - text: >-
      Two earlier US studies also found less Faecalibacterium prausnitzii in patients: one of 48
      patients (Fukuda) and 39 controls from Cornell University, and one of 50 patients (Fukuda and/or
      Canadian criteria) and 50 controls from the Columbia University group that later ran the
      106-patient study. The Cornell patients came from the practice of Dr Susan Levine, and an author
      listed as Levine S is on all three papers; the papers do not say whether any patient took part in
      more than one study.
    sources: [pmid:27338587, pmid:28441964, pmid:36758522]
  - text: >-
      Studies disagree on gut bacterial diversity. The Cornell study and the Chinese study found lower
      diversity. A Polish study of 25 patients (Fukuda) and 16 controls found fewer bacterial types
      (lower richness) but no significant difference in diversity or evenness. In the 106-patient
      study, diversity was lower in the simple comparison, but after adjustment this was tied to
      irritable bowel syndrome rather than ME/CFS. A Bulgarian study whose
      case definition is not yet verified found no difference in diversity within samples, but small
      differences in overall make-up.
    sources: [pmid:27338587, pmid:41387992, pmid:41006438, pmid:36758522, pmid:42351611]
  - text: >-
      Other studies report different bacteria. A study of Norwegian and Belgian patients (case
      definition not yet verified) found more Alistipes in Norwegian patients, while the Chinese study
      found Alistipes lower; its text says the fall did not survive correction for multiple testing,
      while its Fig. 4 lists Alistipes among taxa that differed after correction. A study of 75 patients ill for under
      4 years and 79 ill for over 10 years (case definition not yet verified) found clear differences
      in gut bacteria mainly in the shorter-ill group, and reported less bacterial butyrate production
      and lower butyrate in blood.
    sources: [pmid:23791918, pmid:41387992, pmid:36758521]
  - text: >-
      Blood markers of bacterial products crossing the gut wall give mixed results. The Cornell study
      found higher LPS (a bacterial toxin), LPS-binding protein and soluble CD14 in patients, and a
      Spanish study of 30 patients meeting the International Consensus Criteria and 26 controls found
      higher LPS, soluble CD14 and zonulin-1. A Columbia University study of 131 patients meeting both the
      Fukuda and Canadian criteria and 86 controls found neither LPS-binding protein nor soluble CD14
      significantly raised, but found more antibodies against LPS and flagellin and more FABP2, a
      marker of damage to gut lining cells, which the Cornell study had found not significantly raised.
      The level does not rest on these blood markers; the rungs rest on lower stool butyrate.
    sources: [pmid:27338587, pmid:37744357, pmid:37396339, pmid:36758522, pmid:41387992]
  - text: >-
      No controlled trial on this card shows that changing gut bacteria changes the illness, so the card
      does not reach level 4. In a randomised trial of 39 patients, a probiotic raised Lactobacillus and
      Bifidobacteria in stool; the abstract reports a fall in anxiety with the probiotic (p = 0.01), but
      the only comparable p value in the paper's Table 3 is the probiotic group's before-and-after change
      (p = 0.011); the group-by-time interaction is not significant (p = 0.729). A pilot trial of 11 patients meeting the 2015 IOM
      criteria found no significant change in fatigue or quality of life after faecal transplant from a
      donor or from the patient's own stool, the placebo.
    sources: [pmid:19338686, pmid:37516837]
# Contested: PROPOSED NONE (founder decision). Comparable quality (spec section 3): same or stricter case definition,
# a control group, and at least half the measured patients of the study contradicted.
# - Rung 3 rests on 36758522 (CCC, 106) and 41387992 (IOM 2015, 40). No study on the card reports normal or higher
#   stool butyrate; none of the other studies measured stool butyrate.
# - Translocation markers (not the line the level rests on): 37396339 (CCC, recorded from "met both the Fukuda and
#   the Canadian diagnostic criteria", controlled, 131 measured for sCD14 and LBP per its Fig. 4 legend) contradicts
#   27338587 (Fukuda, 48) on LBP and sCD14: CCC ranks above Fukuda, 131 >= 24 -> comparable. It also contradicts
#   37744357 (ICC, 30) on sCD14: CCC and ICC rank equal, 131 >= 15 -> comparable. If the founder counts the
#   translocation markers as part of rung 2 or 3, the rung that rests on them would be contested. (37744357 did not
#   measure LBP; 37396339 reports no patient-control LPS comparison in the primary cohorts; in the exercise cohort
#   LPS rose after exercise in patients (P = 0.008) but not in controls.)
# - Faecalibacterium (not the line the level rests on): 41387992 (IOM 2015, 40) found it lower before FDR correction
#   only, against 27338587 (Fukuda, 48): IOM 2015 ranks above Fukuda, 40 >= 24 -> comparable quality. Proposed as
#   non-confirmation, not contradiction (same direction, not significant after correction). Founder decides.
contested: null
badges:
  diagnostic_marker:
    # Guo 2023 full text: classifier of bacterial species; "external validation metagenomic dataset from ME/CFS cases
    # (n = 50) and healthy controls (n = 50) recruited and sampled years earlier from our Chronic Fatigue Initiative
    # (CFI) study"; "GLM: CFI-AUC = 0.734; GBM: CFI-AUC = 0.687"; Limitations: "both the primary cohort and external
    # validation cohort were derived from individuals from the same five sites in the US" (the authors write five; the
    # earlier paper 28441964 names four). The CFI cohort is the one
    # in 28441964 (case definition stated). Proposed no; founder decides whether this is an independent patient group.
    value: false
    reason:
      - text: >-
          The 106-patient study tested its bacterial classifier in a second cohort of 50 patients and 50
          controls that the same research group had collected years earlier at the same US sites; the
          authors write that both cohorts came from the same five sites and that a wider geographic range
          is needed. No study on this card from another research group tests the marker.
        sources: [pmid:36758522, pmid:28441964]
      - text: >-
          Other studies on the card classified patients and controls within their own cohort only: the
          Cornell study with bacteria and blood markers, the Polish study with gut bacteria, and the
          Spanish study with blood markers of the gut wall.
        sources: [pmid:27338587, pmid:41006438, pmid:37744357]
  explains_pem:
    # 26683192 full text: symptoms assessed before, after, 48 h and 72 h after a maximal exercise test; no analysis
    # relating microbial change to symptoms in the same patients was found in the cached text. Role early_signal, not
    # supports, so it cannot carry the badge (V7). 37396339's exercise cohort (9 vs 7) followed the same protocol and
    # shares authors (Shukla SK, Cook DB, Vernon SD); the paper reports no symptom tracking for it.
    value: false
    reason:
      - text: >-
          No study at level 2 or above on this card links gut bacteria or the gut wall to symptoms after
          exertion in the same patients. A study of 10 patients and 10 controls tracked symptoms for 72
          hours after a maximal exercise test and found shifts in stool bacteria and bacterial DNA in blood
          that differed from controls, but did not relate these to the patients' symptoms. It has not been
          repeated.
        sources: [pmid:26683192]
      - text: >-
          A Columbia University exercise cohort of 9 patients and 7 controls, recruited under the Fukuda
          criteria only, found that LPS-binding protein and soluble CD14 rose after exercise in controls
          (P = 0.007, P = 0.008); in patients LPS-binding protein did not rise significantly and soluble
          CD14 rose more modestly (P = 0.021). The paper does not relate these changes to symptoms.
        sources: [pmid:37396339]
subgroups:
  - text: >-
      Irritable bowel syndrome may mark a subgroup. In a study of 50 patients and 50 controls, the
      bacteria that best separated patients with irritable bowel syndrome from controls differed from
      those that separated patients without it; in a later study of 106 patients from the same group,
      lower bacterial diversity was found only in patients with irritable bowel syndrome.
    sources: [pmid:28441964, pmid:36758522]
working_on_it: []
early_signals:
  - text: >-
      A study of n=10 patients and 10 matched healthy controls found that after a maximal exercise test,
      more of the major groups of stool bacteria rose in patients than in controls by 72 hours, and
      bacterial DNA stayed longer in patients' blood. Not yet repeated.
    sources: [pmid:26683192]
