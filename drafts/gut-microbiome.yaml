# Other reading: The card could also sit in the dysfunction layer (what goes wrong in the body); a 2025 review says it cannot be said whether gut changes precede, cause or follow immune or metabolic changes (pmid:41516296), and no source given here states a link that expresses the dysfunction reading.
# Second pass 2026-11-06 (data/pipeline/2026-11-06-map-pass2/): links from review full texts.
layer: mechanism
links:
  - to: symptom:gastrointestinal-symptoms
    support: associated
    text: >-
      A study of n=106 patients meeting both the Fukuda and Canadian criteria and 91 healthy controls found self-reported irritable bowel syndrome in 35 patients and 3 controls. Lower diversity within samples (evenness and Shannon diversity) was found only in patients with irritable bowel syndrome, differences in the overall make-up of gut bacteria were not tied to it, and stool butyrate was lower in patients with and without it. An earlier study of n=50 patients and 50 controls from the same research group also found that gut bacteria differed between patients with and without irritable bowel syndrome. Both studies come from the same research group; no independent group has repeated it.
    sources: [pmid:36758522, pmid:28441964]
  - to: symptom:cognitive-impairment
    support: proposed
    text: >-
      A 2025 review proposes that changes in the gut microbiome may lead to distinct neurocognitive impairments in ME/CFS through the gut-brain axis; it was not studied directly in patients.
    sources: [pmid:41516296]
  - to: tryptophan-kynurenine-metabolism
    support: proposed
    text: >-
      A 2025 review proposes that, because gut bacteria also metabolise tryptophan, dysbiosis can change the production of tryptophan- and phenylalanine-derived products made by gut bacteria, potentially affecting the gut, the brain and the microbiota-gut-brain axis; it was not studied directly in patients. The review does not say that this changes the body's own breakdown of tryptophan along the kynurenine pathway, which is what the linked card is about.
    sources: [pmid:41516296]
  - to: neuroinflammation
    support: proposed
    text: >-
      A 2025 review reports that some researchers believe the passage of gut bacteria or their products into the body, which can cause inflammation throughout the body and alter the blood-brain barrier, may trigger neuroinflammation and underlie neurological problems in ME/CFS; the review reports no study that measured both in the same patients.
    sources: [pmid:41516296]
  - to: oxidative-nitrosative-stress
    support: proposed
    text: >-
      Two reviews propose that bacterial products crossing the gut wall may drive the production of reactive oxygen molecules in ME/CFS, and one also names reactive nitrogen molecules and ties the more permeable gut wall to patients with irritable bowel syndrome; neither was a study in patients, and both note that it is not known which comes first.
    sources: [pmid:41516296, pmid:31330791]
