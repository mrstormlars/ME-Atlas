slug: tryptophan-kynurenine-metabolism
name: Disturbed tryptophan and kynurenine metabolism
core_claim:
  text: >-
    The hypothesis proposes that in people with ME/CFS the body breaks down the amino acid
    tryptophan differently, mostly along the kynurenine pathway, which turns tryptophan into
    kynurenine and then into several other substances, and that this altered breakdown contributes
    to the illness.
  sources: [pmid:34423789, pmid:34829952, pmid:40903540]
level: 3
level_reason:
  - text: >-
      A study from Bergen, Norway, of 83 patients meeting the Canadian criteria and 35 healthy
      controls found lower kynurenic acid in serum in each of three metabolic subsets of patients.
      No study of comparable size has found otherwise; two smaller studies, of 39 and 38 patients,
      did not find a difference in kynurenic acid. This study places the card at level 2.
    sources: [pmid:34423789, pmid:34829952, pmid:39302151]
  - text: >-
      A study from Padova, Italy, measured tryptophan and its breakdown products in serum in 39 of
      its 40 patients meeting the Canadian criteria and in 40 healthy controls. Patients had lower
      kynurenine and higher 3-hydroxykynurenine, and the ratios of kynurenic acid to kynurenine and
      of 3-hydroxykynurenine to kynurenine were higher. Tryptophan itself tended to be lower
      (p = 0.05), kynurenic acid and quinolinic acid did not differ, and the ratio of kynurenine to
      tryptophan did not differ.
    sources: [pmid:34829952]
  - text: >-
      A later study from Columbia University in New York, with no authors shared with the Padova
      study, measured blood plasma in 56 patients meeting the Canadian criteria and 52 healthy
      controls. Before exercise, the ratio of kynurenic acid to kynurenine was higher in patients,
      the same ratio the Padova study found higher, and the ratio of kynurenine to tryptophan was
      lower; the Padova study found no difference in the kynurenine to tryptophan ratio. The card
      is at level 3 because of this repeat; a study of 38 patients did not find a difference in
      this ratio (see the contested reason). The two studies used different sample types (serum and
      plasma), and the repeat rests on one ratio.
    sources: [pmid:40903540, pmid:34829952, pmid:39302151]
  - text: >-
      A study from Uppsala, Sweden, of 38 patients meeting the Canadian, International and 2015 IOM
      criteria and 24 healthy controls found lower 3-hydroxykynurenine and 3-hydroxyanthranilic acid
      in plasma, the opposite direction for 3-hydroxykynurenine to the Padova study, and a higher
      ratio of kynurenine to 3-hydroxykynurenine, the opposite of the Padova result for that ratio.
      These results have not been repeated.
    sources: [pmid:39302151, pmid:34829952]
  - text: >-
      A study of stool from 19 patients (diagnosis checked with a symptom survey) and 23 controls
      found higher tryptophan, indole and indole acetate, substances made from tryptophan by gut
      bacteria. This is a measure of gut-bacterial metabolism, not of the body's kynurenine
      pathway, so it does not count towards the level.
    sources: [pmid:42325052]
  - text: >-
      Several studies cannot count towards the level because their case definition is not yet
      verified. They point in different directions: higher kynurenine with lower downstream
      products; a lower ratio of kynurenic acid to quinolinic acid in 49 patients compared with 54
      controls; higher free tryptophan in 23 patients compared with 42 controls; lower free
      tryptophan in patients in a study at the University of Oxford (case definition not stated in
      the abstract); and no difference in plasma tryptophan or kynurenine in a study from New
      Jersey.
    sources: [pmid:38015302, pmid:34090138, pmid:15982993, pmid:11352361, pmid:20384451]
  - text: >-
      Level 4 is not reached. In a placebo-controlled crossover pilot of 5 women meeting CDC criteria
      (version not stated, so the definition does not require post-exertional malaise), acute
      tryptophan depletion lowered the plasma ratio of tryptophan to other large neutral amino acids
      but did not change fatigue, depression score or concentration compared with placebo. The
      trial tested the serotonin side of tryptophan metabolism, not the kynurenine pathway. The
      authors write that a much larger sample is needed.
    sources: [pmid:25227994]
# Proposal for the founder: contested at rung 3 (39302151 Figure 2c against 34829952 and 40903540).
contested:
  rungs: [3]
  reason:
    - text: >-
        Level 3 rests on two studies that found a higher ratio of kynurenic acid to kynurenine in
        patients: one from Padova of 39 patients and 40 healthy controls (serum), and a later one
        from Columbia University of 56 patients and 52 healthy controls (plasma, before exercise),
        both with patients meeting the Canadian criteria.
      sources: [pmid:34829952, pmid:40903540]
    - text: >-
        A study from Uppsala of 38 patients meeting the Canadian, International and IOM criteria and
        24 healthy controls plotted the ratio of kynurenine to kynurenic acid in plasma and marked no
        significant difference between the groups (its Figure 2c). This is the same ratio turned the
        other way up.
      sources: [pmid:39302151]
    - text: >-
        The Uppsala study has a case definition of equal rank, a control group and at least half as
        many patients as either study (38 against 39 and 56), so it is of comparable quality and
        contradicts a study that level 3 needs. Rung 3 is therefore contested.
      sources: [pmid:39302151, pmid:34829952, pmid:40903540]
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        Two independent studies found a higher ratio of kynurenic acid to kynurenine in patients; a
        third study of comparable size did not. None tested it as a diagnostic marker with a
        cut-off, and no tryptophan-pathway marker has been tested in a second, independent patient
        group.
      sources: [pmid:34829952, pmid:40903540, pmid:39302151]
  explains_pem:
    value: false
    reason:
      text: >-
        One study measured symptoms before and 24 and 48 hours after an exercise test. Its only
        reported link between the tryptophan pathway and symptoms is a correlation, in patients,
        between a kynurenine-pathway product measured after exercise, 3-methoxyanthranilate, and a
        general fatigue score taken at the same time. That is not a correlation with the change in
        symptoms after exertion, the fatigue score does not measure post-exertional malaise
        specifically, and the result has not been repeated.
      sources: [pmid:40903540]
subgroups:
  - text: >-
      In the Padova study, the 19 patients whose illness began after an infection had lower
      kynurenine and a lower kynurenine to tryptophan ratio than the 21 whose illness did not, a
      comparison within patients. Not yet repeated.
    sources: [pmid:34829952]
  - text: >-
      In the Bergen study, serum tryptophan was lower in one metabolic subset of patients and higher
      in another, compared with controls. Not yet repeated.
    sources: [pmid:34423789]
working_on_it: []
early_signals:
  - text: >-
      A study of n=83 patients and 35 controls found lower kynurenic acid in serum in each of three
      patient subsets; two smaller studies did not find a difference. Not yet repeated.
    sources: [pmid:34423789, pmid:34829952, pmid:39302151]
