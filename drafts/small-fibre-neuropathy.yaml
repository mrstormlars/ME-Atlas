    direction: mixed  # tortuosity higher; density, length, heat latency and skin conductance no difference
    group: Gómez-Esteban JC and Del Pino R, Biocruces Bizkaia, Cruces University Hospital, Bilbao, Spain (same group as 37968647, 42286686, 42082542)
