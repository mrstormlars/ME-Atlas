slug: small-fibre-neuropathy
name: Small nerve fibre damage (small fibre neuropathy)
core_claim:
  text: >-
    The hypothesis proposes that in people with ME/CFS the small nerve fibres of the skin and other
    tissues, which carry pain and temperature signals and control sweating and blood vessels, are
    damaged or work abnormally. Researchers look for this with skin biopsies, corneal confocal
    microscopy of the nerves in the eye's surface, heat and cold evoked potentials, and sweat-function
    tests.
  sources: [pmid:37968647, pmid:39888240, pmid:41576003]
level: 1
level_reason:
  - text: >-
      A study from Boston of 170 patients meeting the International Consensus Criteria or the 2015 IOM
      criteria found small fibre neuropathy on skin biopsy in 52.6% of the ME/CFS patients with biopsy
      results and 0.0% of the healthy controls with results; the paper has 54 missing values across its
      groups and does not give the number per group. Mean calf nerve fibre density was 8.79 fibres/mm
      in patients and 10.15 in controls; the paper reports one test across all four groups and no test
      of ME/CFS against controls. For skin conductance, a measure of sweat-gland nerve function, the
      Boston study reports a lower mean in patients (75.76 against 82.96 µS) but no test against
      controls. The patients were referred to a dysautonomia centre, which the authors say may not be
      representative, and the controls came from another university's research database. The card is
      at level 1 because of this study.
    sources: [pmid:41576003]
  - text: >-
      A study from Bilbao, Spain, of 59 patients meeting the Fukuda definition (which does not require
      post-exertional malaise) and 36 healthy controls, mainly about autoantibodies, found no
      significant difference in skin conductance of the palms or soles. This null result does not make
      the card contested, because level 1 rests on the Boston study's means, which were not tested
      against controls.
    sources: [pmid:42082542]
  - text: >-
      The card is not at level 2 because no controlled comparison of ME/CFS patients with controls on
      small fibre damage has both a verified case definition and a result that points to damage. Two
      controlled studies from Bilbao included patients with a prior ME/CFS diagnosis or meeting the
      Fukuda definition; because a prior diagnosis does not name a definition, these cannot count
      towards the level. A Boston study of 160 patients, in which 31% of skin biopsies were consistent
      with small fibre neuropathy, cannot count either because its case definition is not yet verified.
    sources: [pmid:37968647, pmid:39888240, pmid:33577778]
  - text: >-
      In the Bilbao studies, 30 patients and 30 matched healthy controls had more tortuous (winding)
      corneal nerve fibres in patients, while corneal nerve fibre density, branch density and length did
      not differ; the authors write that inconsistent corneal results across studies "might suggest that
      SFN is not an inherent characteristic of these diseases". An earlier study of 50 patients and 50
      controls found later brain responses to heat stimuli in patients; the later study used the same
      heat test and found no significant difference in response time, but a lower heat response
      amplitude in patients than in controls (p = 0.028), which the earlier study did not report for
      ME/CFS against controls. Skin conductance did not differ between patients and controls in three
      Bilbao studies. The patients in these studies may overlap.
    sources: [pmid:39888240, pmid:37968647, pmid:42082542]
contested: null
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        No marker of small fibre damage has been tested in a second, independent patient group with a
        verified case definition. In one study whose case definition is not verified, corneal nerve
        tortuosity separated 30 patients from 30 healthy controls with an area under the curve of 0.690.
      sources: [pmid:39888240]
  explains_pem:
    # Checked: every abstract on the card and the five open full texts. No study tracks symptoms after an exertion
    # challenge and links them to small fibre damage. 33577778 (unverified) found that denervation did not correlate
    # with exertional measures on invasive exercise testing, which is not a PEM measure.
    value: false
    reason:
      text: >-
        No study on this card measures post-exertional malaise directly and links it to small fibre
        damage. In one study, whose case definition is not yet verified, the severity of nerve fibre
        loss in skin biopsies did not correlate with measures from an exercise test.
      sources: [pmid:33577778]
subgroups: []
working_on_it: []
