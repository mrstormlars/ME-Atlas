    title: Shared autonomic phenotype of long COVID and myalgic encephalomyelitis/chronic fatigue syndrome.
    year: 2026
    cohort: me_cfs
    # ICC or the National Academy of Medicine (IOM 2015) criteria; both rank at the top. Recorded as ICC, named first.
    # 143 Long COVID patients ("the exact diagnostic criteria were still evolving") not ME/CFS-defined, not used.
    case_definition: ICC
    case_definition_source: fulltext
    case_definition_quote: "The diagnosis of ME/CFS was based on myalgic encephalomyelitis international consensus criteria (ME-ICC) [26] or newer National Academy of Medicine diagnostic criteria [27]."
    design: controlled  # historical healthy controls "from our autonomic research database at the University of Massachusetts"
    # n: calf ENFD (Table 3, "Missing" 0): control 10.15 (2.25), ME/CFS 8.79 (3.55) fibres/mm, Kruskal-Wallis across
    # four groups p < 0.001; thigh 13.44 vs 12.78, p = 0.033. Pairwise tests (Dunn) are reported only between
    # patient groups. Table 4: "SFN, any from biopsy" 0.0% control, 52.6% ME/CFS, chi-square across four groups
    # p < 0.001, 54 missing values across groups (per-group number not stated). The abstract gives 53%; one results
    # sentence gives "63%/67%" for Long COVID/ME/CFS, which does not match Table 4. ESC 82.96 vs 75.76 uS, four-group
    # p = 0.004, 79 missing. Limitations: "We are a referral center for dysautonomia, so we may not see a
    # representative group of patients."
    n_patients: 170
    n_controls: 73
    measures_pem: false
    preregistered: null
    role: supports  # rung 1 (founder ruling 2026-11-02)
    direction: lower  # epidermal nerve fibre density
    group: Novak P and Systrom DM, Brigham and Women's Faulkner Hospital, Boston, USA
    finding: >-
      A study of n=170 patients and 73 historical healthy controls found small fibre neuropathy on skin
      biopsy in 52.6% of the patients with biopsy results and 0.0% of the controls with results, and a
      lower mean calf nerve fibre density in patients, in tests across four groups with no test of
      ME/CFS against controls.
