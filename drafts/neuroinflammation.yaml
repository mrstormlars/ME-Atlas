    case_definition_quote: "All patients with CFS were diagnosed with CFS at the Department of Internal Medicine and Expert Center for Chronic Fatigue of the Radboud University Medical Center, Nijmegen, the Netherlands, after a uniform workup according to the Fukuda 1994 criteria for CFS."
    design: controlled
    n_patients: 9  # CFS group only
    n_controls: 9
    measures_pem: false
