    title: "Neuroinflammation in Patients with Chronic Fatigue Syndrome/Myalgic Encephalomyelitis: An ¹¹C-(R)-PK11195 PET Study."
    year: 2014
    cohort: me_cfs
    case_definition: unverified  # TODO: verify — abstract names no case definition; no open full text in Europe PMC
    case_definition_source: null
    case_definition_quote: null
    design: controlled
    n_patients: 9
    n_controls: 10
    measures_pem: false
    preregistered: null  # not stated in abstract
    role: context  # stays context while unverified (V9); its PET finding has a failed repeat in pmid:34815320
    direction: higher
    group: null
    finding: >-
      A study of n=9 patients and 10 healthy controls found that binding of the PET tracer
      11C-(R)-PK11195, which marks a protein expressed by activated microglia or astrocytes, was 45%-199%
      higher in the cingulate cortex, hippocampus, amygdala, thalamus, midbrain and pons of patients, and that
      binding in some of these areas correlated with cognitive impairment, pain and depression scores.
