slug: herpesvirus-reactivation
name: Reactivated herpesvirus infection (Epstein-Barr virus, HHV-6, HHV-7)
core_claim:
  text: >-
    The hypothesis proposes that in at least some people with ME/CFS, herpesviruses that stay in the
    body for life after a first infection, such as Epstein-Barr virus and human herpesviruses 6 and
    7, become active again and help drive the illness.
  sources: [pmid:22927850, pmid:32129496, pmid:23959519]
level: 2
level_reason:
  - text: >-
      A study from Riga, Latvia, of 200 patients meeting the Fukuda definition, which does not require
      post-exertional malaise, and 150 healthy controls looked for viral DNA in cell-free blood
      plasma, which the authors use as a marker of active infection. Active double HHV-6 and HHV-7
      infection was found only in patients (p < 0.0001); the paper gives no counts for it. Markers of
      active HHV-6, HHV-7 or parvovirus B19 (not a herpesvirus) infection together were found in 45%
      of patients and 8.7% of controls. The card is at level 2 because of the herpesvirus-only result
      of this study. No independent group has repeated it, so it is unreplicated.
    sources: [pmid:36653846]
  - text: >-
      An earlier study by the same Riga group, of 108 patients meeting the 1994 CDC (Fukuda) definition
      and 90 healthy controls, found active HHV-6, HHV-7 or parvovirus B19 infection in 70 of 108
      patients and 12 of 90 controls. Active HHV-7 infection alone was found in 28 patients and 10
      controls, and the paper reports HHV-6 in plasma in 16 of 108 patients. The two Riga studies may
      share patients; the papers do not say.
    sources: [pmid:22927850, pmid:36653846]
  - text: >-
      A study from Bulgaria of 58 patients meeting the Fukuda definition and 50 healthy controls, with
      one author shared with the Riga group, found active HHV-6 infection in no patient and no
      control, HHV-6 DNA in cell-free plasma in 1 of 58 patients and no control, and no difference in
      HHV-6 antibodies. It did not test HHV-7. With 58 patients, fewer than half of the 200 in the
      larger Riga study, it does not contest level 2.
    sources: [pmid:32129496, pmid:36653846]
  - text: >-
      A study from London, with no authors shared with the Riga studies, measured herpesvirus DNA in
      saliva every month for six months in 30 patients from the UK ME/CFS Biobank (16 severely, 14
      mildly or moderately affected), meeting the Canadian Consensus Criteria and/or the Fukuda
      definition, and 16 healthy controls in the saliva measurements (the abstract says 14 controls).
      It found higher HHV-6B and HHV-7 DNA levels in saliva: HHV-6B was higher in the 16 severely
      affected patients than in controls at three of six monthly time points, and HHV-7 was higher in
      the mildly or moderately affected patients at two time points, with trends at the others.
      Epstein-Barr virus and herpes simplex virus 1 did not differ. The authors read the viral DNA
      as longstanding, persistent infection rather than acute or recent infection. The card does not
      reach level 3: this study measured viral DNA load in saliva, found differences only in
      subgroups at a few time points, and does not repeat the finding of active infection in blood.
    sources: [pmid:34422848]
  - text: >-
      Placebo-controlled trials of antiviral drugs have been run, but for each the case definition is
      not yet verified, so they cannot count towards level 4. In a trial of 24 patients selected by
      their Epstein-Barr virus antibodies and given acyclovir and placebo in turn, similar numbers
      improved on each (11 and 10). In a trial of 30 patients with raised HHV-6 and Epstein-Barr virus
      antibodies, randomised 2 to 1 to valganciclovir or placebo for six months, the difference in the
      MFI-20 fatigue score at nine months was not statistically significant; mental fatigue, a second
      fatigue score and self-reported cognitive function changed differently between the groups over
      time, patients on valganciclovir were more often classed as responders (7.4 times, P = 0.029),
      and antibody levels did not differ between groups.
    sources: [pmid:2849717, pmid:23959519]
  - text: >-
      A third randomised trial, of valacyclovir in a subset of patients with Epstein-Barr virus
      markers, reported a larger rise in an activity score with valacyclovir than with placebo; its
      abstract gives no sample size or statistical test. A non-randomised study of 192 patients the
      authors classed as having reactivated HHV-6 or HHV-7 infection by PCR of blood white cells, given
      valaciclovir, valganciclovir or artesunate, compared with 63 untreated patients, reported how
      often the viruses became undetectable in blood, not whether symptoms changed.
    sources: [pmid:18019402, pmid:35102619]
  - text: >-
      For Epstein-Barr virus the findings are mixed. The Bulgarian study found Epstein-Barr virus DNA
      in cell-free plasma in 24.1% of patients and 4% of controls, and active infection by the
      study's criteria in 12 patients and 1 control. A Berlin study of 50 patients meeting the
      Canadian criteria and 50 healthy donors found Epstein-Barr virus DNA in throat washings in 30%
      of patients and 42% of donors, a difference that was not significant.
    sources: [pmid:32129496, pmid:28604802]
  - text: >-
      Some studies whose case definitions are not yet verified found no difference. One of 26 patients
      and 50 matched controls in Atlanta (52 recruited) isolated no HHV-6 or HHV-7 from anyone's blood
      cells and found no difference in HHV-6 or HHV-7 DNA in blood cells, which this card treats as a
      marker of latent rather than active infection. A multicentre search for viral genetic material
      in blood, stool and saliva found no consistent differences between patients and controls other
      than fewer anelloviruses (a family of viruses that are not herpesviruses) in patients.
    sources: [pmid:10913395, pmid:37526404]
# Contested: null (founder ruling 2026-11-02). Rung 2 rests on 36653846 (200 patients); a comparable contradicting
# study would need at least 100 patients; 32129496 has 58.
contested: null
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        No marker on this card has been tested in a second, independent patient group with a verified
        case definition. Antibodies against the Epstein-Barr virus dUTPase were higher in patients in
        two studies by the same Ohio group; the later study also found higher antibodies against the
        HHV-6 and varicella zoster virus dUTPases. Both studies have case definitions not yet
        verified.
      sources: [pmid:28303641, pmid:41451845]
  explains_pem:
    # Checked: abstracts of all studies on the card and the full texts of 22927850, 36653846, 32129496, 34422848,
    # 40143349 and 28604802 as far as read. 22927850 links active infection to "malaise after exertion" as a
    # reported symptom (Table 3, Fatigue Severity Scale item), not an exertion challenge. 34422848 scored
    # post-exertional symptoms by questionnaire only.
    value: false
    reason:
      text: >-
        No study on this card measures post-exertional malaise directly, for example with an exertion
        challenge. The 108-patient Riga study reported that malaise after exertion, recorded as a
        symptom, was more frequent in patients with active infection than in those with latent or no
        infection.
      sources: [pmid:22927850]
subgroups:
  - text: >-
      The antiviral trials selected patients by their antibodies to Epstein-Barr virus or HHV-6. In
      the London saliva study, HHV-6B was higher mainly in severely affected patients.
    sources: [pmid:2849717, pmid:23959519, pmid:34422848]
working_on_it: []
early_signals:
  - text: >-
      A study of n=13 patients and 10 healthy controls found that Epstein-Barr virus was shed in
      sputum by 11 of 13 patients and 5 of 10 controls, with a higher viral load in patients; HHV-6
      levels did not differ. Not yet repeated.
    sources: [pmid:40143349]
