slug: mast-cell-activation
name: Mast cell abnormalities and mast cell activation
core_claim:
  text: >-
    The hypothesis proposes that mast cells, immune cells that release histamine and other
    inflammatory substances, are abnormal in number or behaviour or are overactive in people with
    ME/CFS, and that this contributes to their symptoms.
  sources: [pmid:27362406, pmid:41300853]
level: 2
level_reason:
  - text: >-
      A study from Griffith University, Australia, of 12 patients with moderately severe and 6
      with severe ME/CFS meeting the International Consensus Criteria, and 13 healthy controls, found
      more of a type of immature mast cell (CD117+CD34+FcεRI-chymase-) among blood immune cells in
      moderately severe and severe patients compared with healthy controls. The card is at level 2 because of this study. It is small and has not
      been repeated by an independent group.
    sources: [pmid:27362406]
  - text: >-
      The same group later studied mast cell precursors in 11 patients meeting the International
      Consensus Criteria, 9 people with systemic mastocytosis and 12 healthy controls, using a different
      method that first separates these cells from the blood. It found no significant differences
      between groups in the maturity markers CD34 and FcεRI, the markers that defined the population
      the first study found increased. Because the group is the same, this study cannot be a repeat.
      The card treats its maturity markers, measured within the separated precursor cells, as a
      different measure from the share of blood immune cells reported in the first study (the
      abstracts do not give the exact denominator), so it is not counted as contradicting it.
    sources: [pmid:29223146, pmid:27362406]
  - text: >-
      No other study has measured mast cells, or substances released mainly by mast cells such as
      tryptase or histamine, in patients with a recognised case definition against a control group.
      Higher blood MMP-9, an enzyme that mast cells and other cells can release, in 18 patients than
      in 18 controls does not show that the patients' mast cells were the source.
    sources: [pmid:42327760]
  - text: >-
      Two older studies, whose case definitions are not yet verified, cannot count. A study from Harvard
      of lip salivary gland tissue from 11 patients and controls found that the presence of mast cells
      was the only one of seven features that differed significantly between the groups. A study from
      Washington, DC, of 95 patients and 109 controls found no difference in IgE, the antibody that arms
      mast cells in allergy.
    sources: [pmid:10884641, pmid:11570618]
  - text: >-
      An Austrian study of patients meeting the 2015 Institute of Medicine criteria reports how often
      patients' records met symptom and treatment-response criteria for mast cell activation, not a
      measurement against controls (see below). The only
      controlled treatment trial, of the antihistamine terfenadine in 28 patients, has a case
      definition that is not yet verified, found no benefit, and blocks one effect of histamine rather
      than changing mast cells, so it cannot count towards level 4.
    sources: [pmid:41300853, pmid:8568124]
contested: null
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        No mast cell marker has been tested in a second, independent patient group. The only later
        study of blood mast cells came from the same group and did not test the first study's finding as
        a marker.
      sources: [pmid:27362406, pmid:29223146]
  explains_pem:
    value: false
    reason:
      text: >-
        No study on this card measured post-exertional malaise directly, so none links mast cells to
        symptoms after exertion.
      sources: [pmid:27362406, pmid:41300853]
subgroups:
  - text: >-
      Severity: in the Griffith University study, two surface markers (CD40 ligand and MHC-II) on
      mature mast cells were higher in the 6 severe patients than in the 12 moderate patients and the
      13 controls. This rests on 6 patients and has not been repeated.
    sources: [pmid:27362406]
  - text: >-
      Orthostatic intolerance: in the Austrian study, orthostatic intolerance confirmed by a tilt or
      standing test was found more often in patients judged to have mast cell activation (70.3%
      against 49.7%, of 233 patients with usable data). Postural tachycardia syndrome was also more
      frequent, but the difference was not statistically significant. Mast cell activation was judged
      from symptoms and response to medicines, not from measured mediators.
    sources: [pmid:41300853]
working_on_it: []
early_signals:
  - text: >-
      A study of n=3 adolescents and young adults who met ME/CFS criteria six months after confirmed
      or probable COVID-19 (infection confirmed by test in one of the three) found strong histories of
      allergies in all three, and raised plasma histamine in two judged against the laboratory
      reference range, with no control group; serum tryptase, reported for one patient, was normal.
      Not yet repeated.
    sources: [pmid:33996867]
