last_checked:
  date: 2026-11-08
  by: ai_pair
# Causal map (founder ruling 2026-11-08): layer `dysfunction`, answering "what goes wrong in the body?". The card
# grades a measured abnormality (heart rate variability, baroreflex, catecholamines), like the orthostatic card.
# Other reading: a perpetuating mechanism. 24493300's authors suggest the raised sympathetic activity may instead be
# compensatory; that reading is written here and in level_reason, not as a link.
# Links: all step 1 (proposed).
#   - symptom:sleep-disturbance: 31957647 relates nocturnal HF to self-reported sleep quality in the same patients,
#     but its case definition is unverified, which allows step 1 only (DECISIONS 2026-11-06 precedent). 31906988
#     (Fukuda) correlates daytime HRV with PSQI "in the sample" (full-text Table 2, patients and controls pooled),
#     so it is a second source but not a within-patient relation; the step stays proposed.
#   - symptom:cognitive-impairment: 23166694 (Fukuda) measured both, but its regression pooled patients and controls
#     (condition as a predictor, full text), so it is not clearly a relation within patients; proposed, not
#     associated. Founder may read it as step 2.
#   - orthostatic-intolerance-cerebral-blood-flow: 38251045's discussion (full text): "baroreflex dysfunction
#     possibly contributes to the reduction in cerebral blood flow, which has been reported in ME/CFS and PCC"; it
#     did not measure blood flow to the brain. Proposed only.
#   No link to symptom:post-exertional-neuroimmune-exhaustion: 34073494's association did not survive correction.
layer: dysfunction
links:
  - to: symptom:sleep-disturbance
    support: proposed
    text: >-
      One study of 24 patients and 24 controls found that lower parasympathetic heart rate variability during
      deeper sleep was associated with poorer self-reported sleep quality in the same people; its case
      definition is not yet verified. A second study, of 45 patients meeting the Fukuda definition and 25
      controls, found that lower daytime resting heart rate variability correlated with poorer self-reported
      sleep, in an analysis of patients and controls together.
    sources: [pmid:31957647, pmid:31906988]
  - to: symptom:cognitive-impairment
    support: proposed
    text: >-
      One study of 30 patients and 40 controls found that resting heart rate variability predicted how fast
      people did cognitive tasks; patients were slower but not less accurate. The analysis included patients
      and controls together, and the finding has not been repeated.
    sources: [pmid:23166694]
  - to: orthostatic-intolerance-cerebral-blood-flow
    support: proposed
    text: >-
      The authors of one study that found a weaker baroreflex in patients suggest that baroreflex dysfunction
      possibly contributes to the reduction in blood flow to the brain reported in ME/CFS. They did not
      measure blood flow to the brain.
    sources: [pmid:38251045]
