# FOUNDER RULING (2026-11-08): level 3, contested at rung 3 (Duprez 1998 as contradicting), both badges no, layer
# `dysfunction`, the three proposed links accepted. Two card-reviewer rounds (data/pipeline/2026-11-08-autonomic/).
# DRAFT — AI-drafted (ai_pair) on 2026-11-08 from the founder request in
# data/pipeline/2026-11-08-autonomic/brief.md (survey candidate marked `to draft`, DECISIONS 2026-11-08). Nothing here
# is published. Level, contested mark, badges, layer and links below are proposals for the founder (CLAUDE.md rule 2),
# not rulings.
# Source rule: every title, year, n, quote and finding below comes from the cached PubMed record
# data/cache/pubmed/<pmid>.xml (abstract) or, where `case_definition_source: fulltext` or a comment names a full
# text, from the cached Europe PMC open-access text data/cache/europepmc/PMC<id>.xml (31906988: PMC6943898;
# 38251045: PMC10801610; 34640544: PMC8509376; 23166694: PMC3498107; 34970156: PMC8713453; 41437251: PMC12729017;
# 34073494: PMC8198768). The other seven have no open full text in Europe PMC (`europepmc fulltext`, checked
# 2026-11-08): 22670061, 9505867, 9430800, 29246267, 31957647, 29855991, 24493300. Searches and hit counts:
# data/pipeline/2026-11-08-autonomic/report.md.
#
# SCOPE AND BOUNDARY WITH orthostatic-intolerance-cerebral-blood-flow. This card is about the balance of the
# autonomic nervous system itself: vagal (parasympathetic) and sympathetic tone, measured as heart rate variability
# (HRV), resting heart rate, baroreflex sensitivity, blood pressure variability or catecholamines, at rest, in sleep,
# during or after exertion or a mental task. The orthostatic card is about the fall in blood flow to the brain and
# the orthostatic response (POTS, orthostatic hypotension, hypocapnia) on standing, sitting or tilt. A tilt or
# standing study belongs here only when it reports autonomic tone measures (HRV, baroreflex); 9430800 (Yataco 1997)
# is here for that reason. Orthostatic-only studies stay on the other card, and no study is on both cards.
#
# LEVEL, RUNG BY RUNG (proposal: 3, contested at rung 3)
#   The finding the card grades: lower vagal (high-frequency) heart rate variability at rest in patients than in
#   healthy controls, read by the authors as less parasympathetic and relatively more sympathetic activity.
#   Rung 1: met (the rung 2 studies meet it).
#   Rung 2: met. 22670061 (Frith 2012, Fukuda from the abstract, 68 vs 68 matched controls): parasympathetic HRV
#     markers lower and low-frequency HRV higher at rest. 38251045 (Ryabkova 2024, every patient met Fukuda, CCC and
#     IOM 2015, full text, 34 vs 32): total, low- and high-frequency HRV power and baroreflex sensitivity lower at rest.
#     31906988 (Escorihuela 2020, Fukuda from the abstract, 45 vs 25): lower HRV time- and frequency-domain measures
#     and shorter RR intervals at rest, with a higher LF/HF index (full text, p = 0.014). The agreement across the
#     three studies is on lower high-frequency HRV; low-frequency HRV was higher in Frith and lower in the other two.
#   Rung 3: met. Original: 22670061 (2012; Newton JL, Newcastle, with Bydgoszcz co-authors). Repeated later, in
#     separate cohorts, by different groups: 31906988 (2020; Castro-Marrero J, Barcelona) and 38251045 (2024;
#     Churilov LP, Saint Petersburg). No author is shared between the three (checked on the cached author lists).
#   Rung 4: NOT met. No `supports` study with design `intervention_controlled`. The one controlled trial that lowered
#     sympathetic activity (24493300, clonidine in adolescents) lowered plasma norepinephrine but did not help, and its
#     case definition is not verified (companion paper pmid 26357864, not on the card, says in its full text that
#     NorCAPITAL used a "broad" three-month definition; TODO: verify for 24493300). It is `context`.
# CONTESTED (proposal: rungs [3]). FOUNDER DECISION (tier 2).
#   9505867 (Duprez 1998; Holmes 1988 from the abstract; 38 vs 38 healthy controls) found that RR-interval
#   variability "could not detect major alterations in autonomic function" (abstract). Holmes ranks equal to
#   Fukuda; it had a control group; 38 is at least half of 45 (22.5, Escorihuela) and of 68 (34, Frith). So it is of
#   comparable quality to the Fukuda studies. Rung 3 needs two studies, and every pair that can carry it includes a
#   Fukuda study (Ryabkova is the only one above Fukuda), so rung 3 is contested under spec section 3. Rung 2 is not:
#   it can rest on Ryabkova (CCC/IOM), which a Holmes study does not match.
#   Alternative reading for the founder: Duprez also found a consistently higher heart rate in patients (77 against
#   68 beats per minute in the office), which fits the sympathetic side of the hypothesis, and its abstract does not
#   say which HRV indices were compared (no open full text; TODO: verify). If the founder reads it as mixed rather
#   than contradicting, contested is null and Duprez becomes `context`.
#   Not of comparable quality: 9430800 (Yataco 1997, CDC criteria, 19 patients: below 22.5 and 34); 34970156 (Nelson
#   2021, resting HRV no different, 16 patients); 34640544 rest results are mixed but 20 patients. Unverified, so
#   `context` (V9): 31957647 (Fatt 2020, 24 vs 24, nocturnal HF lower in deep sleep but not in wakefulness before
#   sleep; "medically diagnosed CFS"). TODO: verify its definition. If Fukuda or stricter, it would also be of
#   comparable quality to Escorihuela (24 >= 22.5) for the wake measure.
# OXFORD: no study on the card is known to use Oxford. Unverified: 31957647, 29855991, 24493300.
# LONG COVID: label not shown. 38251045 had a post-COVID group, but only 14 of 29 met the CCC and 16 of 29 the IOM
#   criteria (full text), so the group is not defined by a recognised ME/CFS definition; all studies are `me_cfs`.
#
# AUTHOR AND COHORT OVERLAPS
#   - Zalewski P (Bydgoszcz) is an author on 22670061 (Frith, with Newton JL), 41437251 and 34073494 (Kujawski,
#     Bydgoszcz cohort 2013-2020). Whether Frith's 68 patients overlap the Bydgoszcz cohort is not stated in the
#     abstract (TODO: verify). The Kujawski papers are not used as replications.
#   - Lloyd AR and Vollmer-Conna U (Sydney) are on 23166694 (Beaumont 2012) and 31957647 (Fatt 2020); also on 20502886
#     (left out, below).
#   - Van Oosterwijck J, Nijs J and co-authors: 34640544 (2021) and 28339438 (2017, left out) describe 20 women with
#     ME/CFS and 20 controls doing the same exercise test; likely the same cohort (34640544 says the test "was
#     performed as described in our previous study").
#   - 34970156 (Nelson 2021) is the same 16 vs 10 cohort as 30871578 on impaired-energy-production-after-exertion.
#   - Wyller VB (Oslo) is last author of 24493300 and of the left-out adolescent studies 17564672, 18234008, 18066580,
#     20890710, 21059182.
#
# Not on the card (read, left out; reasons also in report.md):
#   - Same group or cohort as a study on the card: 28339438 (same cohort as 34640544), 20502886 (Burton 2010, Sydney,
#     20 vs 20, lower nocturnal HRV; no open full text, definition unverified), 26357864 (NorCAPITAL autonomic
#     outcomes; the case-definition sentence is used only in a comment), 32764516 and 30908516 (further Bydgoszcz /
#     Newcastle analyses, uncontrolled or 9 controls).
#   - Definition not verifiable or not ME/CFS: 17851136 (Boneva 2007, Wichita population sample, 30 vs 38, higher
#     heart rate and lower HRV in sleep; no open full text, abstract names no definition; would be useful if
#     verified), 7549414 (Sisto 1995, 12 women, "diagnosis of CFS"), 7874856 (unexplained fatigue, not CFS),
#     39755009 (fibromyalgia and/or CFS pooled, n=26), 37300057 (no n in abstract), 23499514 (fractal index only),
#     14508037 (baroreflex in severity groups; no open full text), the Wyller adolescent studies above (broad or
#     unstated definitions, no open full text), 21156045 (13 adolescents).
#   - Defined by a non-accepted definition: 39941481 and 40002769 (Milovanovic 2025, NICE 2021 criteria, patients
#     selected for recurrent syncope).
#   - Mainly orthostatic or small fibre outcomes (belong on other cards): 41576003, 37968647.
#   - Symptom questionnaires only: 40944028 (MCAM, COMPASS-31, 301 vs 141).
#   - Uncontrolled or no patient-control comparison of tone: 39374820 (inspiratory muscle training pilot), 40315935
#     (acupuncture, outcome symptoms), 28107894 (HRV biofeedback against graded exercise), 41598987 (Q fever).
#   - Reviews and meta-analyses (not counted): 31651868, 19463887, 23838093, 39319943, 24662556, 9857114, 17561705,
#     34474739, 29417255. 31651868 (64 case-control articles) reports higher resting heart rate and lower
#     high-frequency HRV at rest; 19463887 found the pooled HRV effect across functional somatic disorders
#     unreliable after correcting for publication bias.
slug: autonomic-imbalance
name: Autonomic nervous system imbalance (less vagal, more sympathetic activity)
core_claim:
  text: >-
    The hypothesis proposes that in ME/CFS the balance of the autonomic nervous system, which runs heart rate,
    blood pressure and other automatic body functions, is shifted: less parasympathetic (vagal) activity and
    relatively more sympathetic activity. It is measured as lower heart rate variability, a higher resting heart
    rate or a weaker baroreflex, at rest, in sleep or after exertion. It is about this balance itself, not about
    the fall in blood flow to the brain on standing.
  # Measures: HRV and baroreflex at rest (22670061, 38251045, 31906988); higher resting heart rate (23166694; also
  # 31906988 full-text Table 1); sleep (29246267); after exertion (34640544).
  sources: [pmid:22670061, pmid:38251045, pmid:31906988, pmid:23166694, pmid:29246267, pmid:34640544]
level: 3
level_reason:
  - text: >-
      A UK study measured heart rate and blood pressure at rest and on standing in 68 patients meeting the
      Fukuda definition and 68 matched controls. At rest, the parasympathetic measures of heart rate
      variability were lower and the low-frequency (sympathetic) measure higher in patients. The authors
      derived a combination of blood pressure variability thresholds that separated patients from controls
      with 77% sensitivity and 53% specificity in the same cohort.
    sources: [pmid:22670061]
  - text: >-
      Two later studies by other groups, in separate cohorts, found lower high-frequency heart rate
      variability at rest, as the UK study did. In Spain, 45 women meeting the Fukuda definition had shorter
      intervals between heartbeats, lower heart rate variability and a higher ratio of low- to high-frequency
      power at rest than 25 matched healthy women. In Russia, 34 patients who met the Fukuda, Canadian and
      2015 IOM criteria had lower total, low- and high-frequency heart rate variability and a weaker
      baroreflex at rest than 32 healthy controls, with no difference in that ratio. Unlike the UK study, both
      found low-frequency heart rate variability lower, not higher. This repeated high-frequency finding is
      why the card is at level 3.
    sources: [pmid:22670061, pmid:31906988, pmid:38251045]
  - text: >-
      Two smaller studies found related differences around exertion and mental effort. In 20 women with
      ME/CFS and 20 controls, high- and low-frequency heart rate variability were lower at rest, though heart
      rate and the time-domain measure were not, and after a submaximal cycle test the high-frequency measure
      did not return to its pre-exercise level in patients. In 30 patients and 40 controls, resting heart rate
      was higher, resting heart rate variability showed a trend to be lower that was not significant, it
      changed differently during cognitive tasks (a delayed response), and heart rate took longer to return
      to baseline afterwards. Neither
      finding has been repeated by an independent group.
    sources: [pmid:34640544, pmid:23166694]
  - text: >-
      Other studies did not find lower heart rate variability. A Belgian study of 38 patients meeting the 1988
      CDC (Holmes) definition and 38 healthy controls found a consistently higher heart rate but no major
      changes in RR-interval variability; a US study of 19 patients meeting CDC criteria and 11 controls found
      similar heart rate variability lying down and on tilt. In 16 patients and 10 controls who did exercise
      tests on two days, resting heart rate variability did not differ, while heart rate fell less in the
      first minute after maximal exercise in patients.
    sources: [pmid:9505867, pmid:9430800, pmid:34970156]
  - text: >-
      Sleep studies are mixed. Eight patients meeting the 2015 IOM criteria had a higher low-frequency measure
      in all sleep stages and a lower high-frequency measure in deep sleep than eight tired controls, but a
      higher high-frequency measure overall and a lower heart rate. In 24 patients and 24 controls the
      high-frequency measure was lower in deeper sleep but not during wakefulness before sleep. These two
      groups, in Finland and Australia, thus both found a lower high-frequency measure in deep sleep. In 14 women with
      chronic fatigue syndrome and 14 controls, heart rate variability did not differ. The last two studies'
      case definitions are not yet verified.
    sources: [pmid:29246267, pmid:31957647, pmid:29855991]
  - text: >-
      No controlled study on this card has shown that changing autonomic balance changes the illness. In a randomised trial in 120
      adolescents, who also had higher plasma norepinephrine than 68 healthy adolescents, low-dose clonidine
      lowered norepinephrine but did not increase daily steps (they were lower with clonidine, not
      significantly), and the authors concluded it is not clinically useful; they suggest the raised
      sympathetic activity may be compensatory. Its case definition is not yet verified.
    sources: [pmid:24493300]
contested:
  rungs: [3]
  reason:
    - text: >-
        A study of 38 patients meeting the 1988 CDC (Holmes) definition and 38 healthy controls could not
        detect major alterations in autonomic function from RR-interval variability recorded lying and
        standing. The Holmes definition is accepted on the same footing as
        Fukuda, and the study is large enough to weigh against the Fukuda studies that level 3 rests on, so the
        repeated finding is disputed. The same study found a consistently higher heart rate in patients, which
        points the other way, and its abstract does not say which heart rate variability measures were compared.
      sources: [pmid:9505867, pmid:22670061, pmid:31906988]
    - text: >-
        Level 2 is not disputed: it also rests on the study whose patients met the Canadian and 2015 IOM
        criteria as well as Fukuda, a stricter definition than the one in the contradicting study.
      sources: [pmid:38251045]
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        Four studies built a classifier or threshold from autonomic measures, but each tested it in its own
        cohort only: blood pressure variability thresholds (77% sensitivity, 53% specificity), resting
        high-frequency heart rate variability (81.3% sensitivity, 79.4% specificity), heart rate recovery
        after exercise (a threshold of 34.5 beats per minute, 63% sensitivity, 40% specificity), and a
        machine-learning model whose test set was held out from the same 112 patients and 61 controls. None
        has been tested in a second, independent patient group.
      sources: [pmid:22670061, pmid:38251045, pmid:34970156, pmid:41437251]
  explains_pem:
    value: false
    reason:
      text: >-
        One study measured post-exertional malaise directly with exercise tests on two consecutive days. Heart
        rate recovery after exercise was lower in patients, but resting heart rate variability did not differ.
        No heart rate measure changed differently in patients and controls from day one to day two. The study did not test any heart rate measure against symptoms. In 101
        patients meeting the Fukuda definition, those who reported post-exertional malaise had a higher
        sympathovagal balance at rest, but no difference was significant after correction for multiple tests.
      sources: [pmid:34970156, pmid:34073494]
