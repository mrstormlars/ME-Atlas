# data/cache/pubmed/<pmid>.xml (abstract), except where `case_definition_source: fulltext` or a comment names a
# full text, which comes from the cached Europe PMC open-access text data/cache/europepmc/PMC<id>.xml.
# Studies without an open full text and with no case definition in the abstract (23813081, 28782878) stay
