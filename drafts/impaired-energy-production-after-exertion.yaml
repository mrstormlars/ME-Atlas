slug: impaired-energy-production-after-exertion
# Name kept: it names the hypothesis, not a measurement. Text about the studies says what was measured (oxygen use,
# work), per card-reviewer fix 10.
name: Impaired energy production after exertion
core_claim:
  text: >-
    The hypothesis proposes that in people with ME/CFS the body's aerobic energy production is
    impaired after physical exertion, and that this shows as a fall in oxygen use and work on the
    second of two exercise tests 24 hours apart.
  sources: [pmid:38965566, pmid:31161646, pmid:20937116]
level: 3
level_reason:
  - text: >-
      A controlled study of 84 patients meeting the Canadian Consensus Criteria and 71 sedentary
      controls repeated a maximal exercise test after 24 hours. Unlike controls, patients did not
      reproduce their first-day results: oxygen use and work fell at peak effort and at the
      ventilatory threshold on the second day. The card is at level 2 because of this study.
    sources: [pmid:38965566]
  - text: >-
      A study from Amsterdam, using the Fukuda definition, which does not require post-exertional
      malaise, tested 15 women patients and 15 controls on two days. The change from the first to
      the second day differed between groups at the anaerobic threshold, for work rate (P = 0.002)
      and oxygen uptake (P = 0.001), and at peak, for work rate and oxygen uptake (both P < 0.001):
      it fell in patients and rose in controls.
    sources: [pmid:20937116]
  - text: >-
      Two studies from one Dutch clinic compared patients with people who have chronic fatigue but do
      not meet ME/CFS criteria (51 and 50 women; 26 and 25 men): oxygen use and workload fell on the
      second day in ME/CFS, while the comparison group's performance improved. They are retrospective
      analyses of a clinical database that excluded severe ME/CFS; in the women's study,
      fibromyalgia was more common in the ME/CFS group (49% against 14%). One author, Visser FC, is
      also on the Amsterdam study.
    sources: [pmid:34198913, pmid:34198946, pmid:20937116]
  - text: >-
      A study from Oslo, with no authors shared with the 84-patient study, tested 18 women meeting the
      Canadian Consensus Criteria and 15 healthy women. Patients' power output at the gas exchange
      threshold fell on the second test while controls' did not, a significant difference between
      groups. Oxygen use at the threshold and at peak also fell in patients, but neither fall differed
      significantly from the controls'. Blood lactate for a given power output rose in patients and
      fell in controls.
    sources: [pmid:31161646, pmid:38965566]
  - text: >-
      The card is at level 3 because independent groups found parts of the same result in separate
      cohorts. Each has a limit, and rung 3 is contested (see the contested note).
    sources: [pmid:38965566, pmid:20937116, pmid:34198913, pmid:34198946, pmid:31161646]
  - text: >-
      Against these findings, a study from New York of 58 patients and 25 sedentary controls found no
      change in peak oxygen use or oxygen use at the ventilatory threshold on the second day in either
      group; the paper reports that 5 patients and 6 controls did not meet maximal-effort criteria. Its
      patients met the 1994 (Fukuda) definition modified to require post-exertional malaise. Its
      authors suggest that falls reported elsewhere may reflect lower effort on the second day.
    sources: [pmid:42212259]
  - text: >-
      The 84-patient study kept patients who met maximal-effort criteria on the first test but not on
      the second, and its authors read such cases as emblematic of post-exertion symptom
      exacerbation. Its own results show a fall in heart-rate reserve on the second test, which its
      authors write suggests that maximum effort was not given; they report a similar fall in the
      matched controls.
    sources: [pmid:38965566]
  - text: >-
      A study of 16 patients and 10 controls from Adelaide found that work rate at the ventilatory
      threshold fell more in patients on the second day, but found no difference between groups in
      how oxygen use changed. Two other two-day studies whose case definition is not yet verified
      found lower oxygen use and workload in 51 women on the second test only, and lower workload
      but higher oxygen use on the second day in 10 patients.
    sources: [pmid:30871578, pmid:23813081, pmid:28782878]
  - text: >-
      These tests measure the whole body's oxygen use, which depends on oxygen delivery as well as on
      energy production in cells. The authors of the 84-patient study point to disturbed control of
      blood flow and oxygen delivery. The Amsterdam study found oxidative phosphorylation in blood
      cells similar to controls'. A muscle study found a lower rate of phosphocreatine recovery after
      exercise (a measure of muscle oxidative capacity) in 22 patients than in 15 sedentary controls,
      with no further fall two days after a maximal test in the 14 patients retested. The card does
      not show where in the body the limit lies.
    sources: [pmid:38965566, pmid:20937116, pmid:8618560]
# Contested at rung 3 (founder ruling 2026-11-01). Comparable quality (spec section 3): same or stricter case
# definition, control group, at least half the measured patients of the study contradicted.
# - 42212259 (Fukuda as stated, controlled, 58 enrolled, 53 measured per the derivation in its study comment) vs
#   20937116 (Fukuda, 15): same rank, 53 >= 7.5 -> comparable, contradicts.
# - vs 38965566 (CCC, 84) and 31161646 (CCC, 18): Fukuda ranks below CCC -> not comparable. Rung 2 not contested.
# - vs 34198913/34198946 (ICC as recorded, unconfirmed): not comparable as recorded; comparable if read as Fukuda.
contested:
  rungs: [3]
  reason:
    - text: >-
        Rung 3 rests on independent studies that found the same result as the 84-patient study, whose
        patients met the Canadian Consensus Criteria. The clearest, a Fukuda study of 15 women patients
        and 15 controls from Amsterdam, is contradicted by a Fukuda study of 58 patients and 25
        sedentary controls from New York that found no change on the second day. With the same case
        definition, a control group and more patients (58 against 15), the New York study is of
        comparable quality.
      sources: [pmid:20937116, pmid:42212259, pmid:38965566]
    - text: >-
        The two Dutch clinic studies of women and men point the same way, but the case definition
        recorded for them (International Consensus Criteria) is read from a reference number and not
        confirmed, and they compare patients with people who have chronic fatigue without ME/CFS
        rather than with healthy controls.
      sources: [pmid:34198913, pmid:34198946]
    - text: >-
        The Oslo study, which meets the Canadian Consensus Criteria, found the same result only in part:
        power output at the threshold fell more in patients than in controls, but the changes in
        oxygen use did not differ between groups.
      sources: [pmid:31161646]
    - text: >-
        Rung 2 rests on the 84-patient study and is not contested: the New York study uses the Fukuda
        definition, which ranks below the Canadian Consensus Criteria. The New York cohort was
        required to report post-exertional malaise, and a companion paper by the same authors, which
        appears to describe the same cohort (57 patients and 25 controls), names the 2015 IOM
        definition; the card records Fukuda, from the New York study's own sentence.
      sources: [pmid:38965566, pmid:42212259, pmid:41293716]
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        No study on this card tests a two-day exercise marker in a second, independent patient group.
        A study of 51 women (case definition not yet verified) classified patients and controls with
        95.1% accuracy within its own cohort, and a study of 16 patients proposed a cut-off for the
        fall in work rate at the ventilatory threshold, also within its own cohort. A study of 58
        patients concluded that its data do not support using the two-day protocol to define
        post-exertional malaise or disability.
      sources: [pmid:23813081, pmid:30871578, pmid:42212259]
  explains_pem:
    # Founder ruling 2026-11-01 under the clarified spec rule: the link must connect the mechanism to symptoms after
    # exertion in the same patients; a measured change that is itself the hypothesised abnormality does not on its own
    # explain PEM. 36984572 tracked symptoms after the 2-day test; its full text (PMC10059925) says "Detailed exercise
    # test results of the 2-day CPET protocol will be reported separately" and relates recovery to no CPET measure.
    # 30871578: Chalder Fatigue Scale completed before each session (full text Methods); group x time p = 0.005
    # (Table 2); no analysis relating fatigue change to work-rate change in the same patients.
    value: false
    reason:
      - text: >-
          The two-day exercise tests on this card measure the state after exertion directly, but no
          study on the card links oxygen use or work to the symptoms after exertion in the same
          patients. The fall on the second test is itself the abnormality the hypothesis proposes, so
          on its own it does not explain post-exertional malaise. One study of 16 patients and 10
          controls found that fatigue scores rose more in patients before the second test and that
          work rate at the ventilatory threshold fell more, but did not relate the two in the same
          patients.
        sources: [pmid:38965566, pmid:31161646, pmid:20937116, pmid:30871578]
      - text: >-
          The authors of the Oslo study write that the fall in peak oxygen use in their patients was,
          in their opinion, too small to indicate any major change in exercise tolerance or to explain
          post-exertional malaise.
        sources: [pmid:31161646]
      - text: >-
          In an overlapping cohort from the 84-patient study's research group, 78 patients took on
          average about 12.7 days to recover from the two-day test, against 2.1 days for 64 sedentary
          controls; the paper reports the exercise test results separately and does not relate recovery
          to oxygen use or work.
        sources: [pmid:36984572]
      - text: >-
          The New York study found no fall in oxygen use on the second day. Its authors report, as a
          preliminary result with the data to be published separately, that symptoms after the test
          separated patients from controls on most days.
        sources: [pmid:42212259]
subgroups:
  - text: >-
      In a single study, not yet repeated, 18 patients fell into two groups during muscle exercise: 10
      used less of a muscle energy store (phosphocreatine) than controls and produced low maximal
      force, while 8 used it normally but became more acidic than controls and took almost four times
      as long for muscle pH to recover.
    sources: [pmid:21749371]
working_on_it: []
early_signals:
  - text: >-
      A study of n=18 patients and 12 sedentary controls found that 8 patients who exercised to levels
      comparable with controls became more acidic in the muscle over three bouts of exercise, without
      the fall in acidity with repeat exercise that the authors write is seen in healthy people, and
      took almost four times as long for muscle pH to recover. Not yet repeated.
    sources: [pmid:21749371]
  - text: >-
      A study of n=18 patients and 15 healthy controls found that blood lactate for a given power
      output rose from the first to the second day's exercise test in patients and fell in controls.
      Not yet repeated.
    sources: [pmid:31161646]
