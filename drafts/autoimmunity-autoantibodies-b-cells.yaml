early_signals:
  - text: >-
      A study of n=10 patients and 6 healthy controls found that antibody (IgG) fractions from
      controls activated the β2 adrenergic receptor in cell-based tests, while fractions from the 5
      patients with high β2 receptor antibodies did not. Not yet repeated.
    sources: [pmid:34589837]
  - text: >-
      A study of n=10 women, without a control group, found that after the plasma-cell-targeting drug
      daratumumab 6 had marked improvement in physical function, alongside a fall in IgG levels, and
      4 had no significant change. Not yet repeated.
    sources: [pmid:40703261]
