# contradicting study of comparable quality (42082542's null M3/M4 result is Fukuda, below 34589868's CCC; the
# Stockholm cohort's null beta2 result is part of the rung-2 study, 24 patients < 29.5; 40141440 unverified, V9).
contested: null
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        Receptor antibody levels have been compared with controls in separate cohorts, with mixed
        results, but no study on this card tests a cut-off from one cohort in a second, independent
        patient group. In the Swedish study, 25% of controls and 79% and 91% of patients had at least
        one receptor antibody above the controls' 90th percentile. In the Spanish study, 27.5% of
        patients and 13.9% of controls had β2 receptor antibodies above the test maker's cut-off, and
        18.6% of patients against 58.3% of controls had M4 receptor antibodies above it. The
        Cornell study found no differences.
      sources: [pmid:34589868, pmid:42082542, pmid:40141440]
  explains_pem:
    # Checked: every abstract on the card, and the full texts of 22039471, 34589868, 42082542, 34589837, 29543914,
    # 39759581 and 40703261 as far as read for methods and results. No study uses an exertion challenge. 22039471's
    # fatigue score includes self-reported "Post-exertional exhaustion" (full text), not a direct measure. 39759581
    # reports PEM improvement on questionnaires, uncontrolled.
    value: false
    reason:
      text: >-
        No study on this card measures post-exertional malaise directly, for example with an exertion
        challenge. The Swedish study found no correlation between antibody levels and disease
        severity. A study without a control group reported less post-exertional malaise on
        questionnaires after immunoadsorption.
      sources: [pmid:34589868, pmid:39759581]
subgroups:
  - text: >-
      The antibody and immunoadsorption studies focus on patients whose illness began after an
      infection and who have raised β2 receptor antibodies. In the Swedish study, 79% and 91% of
      patients in its two cohorts, and 25% of controls, had at least one raised receptor antibody.
    sources: [pmid:29543914, pmid:39759581, pmid:34589868]
# From pmid:38454468 (trial protocol, Trials 2024): "Registration Number: NCT05710770 . Registered on 02 February
