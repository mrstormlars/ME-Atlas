links:
  - to: orthostatic-intolerance-cerebral-blood-flow
    support: proposed
    text: >-
      A review proposes that antibodies against the β2 adrenergic and M3 muscarinic receptors, which help widen blood vessels, could impair circulation and oxygen supply, and cites reports of reduced blood flow to muscle and brain in ME/CFS as fitting this idea. The review's abstract does not discuss blood flow on standing, and the idea was not tested in patients.
    sources: [pmid:32247028]
  - to: hpa-axis-cortisol
    support: associated
    text: >-
      A study of n=30 women with ME/CFS (Fukuda, Canadian and IOM criteria) and 25 healthy
      controls found antibodies against pituitary tissue in 56% and against hypothalamus tissue
      in 33% of patients, and none in controls; these are antibodies against pituitary and
      hypothalamus tissue, not against receptors. ACTH, cortisol, growth hormone peak and IGF-1 were lower in the 13 patients with high antibody titres than in the 7 with middle or low titres
      and the 10 without antibodies. The study is cross-sectional, so no order in time is shown;
      the authors describe an association, and it has not been repeated.
    sources: [pmid:34254637]
  - to: autonomic-imbalance
    support: associated
    text: >-
      A study of n=59 people with ME/CFS (Fukuda criteria, which do not require post-exertional malaise) and 36
      healthy controls measured antibodies against adrenergic and muscarinic receptors and autonomic function in
      the same people; it also included 96 people with post-COVID condition, not defined as ME/CFS, whose results
      are not used here. In the ME/CFS group, antibodies against the β2 adrenergic receptor correlated with a
      higher sympathovagal index, a heart rate variability measure of sympathetic relative to vagal activity (r =
      0.45, p = 0.001). In this study the ME/CFS group did not differ from the controls on the heart rate
      variability balance measures, and receptor antibodies also correlated with autonomic measures in the healthy
      controls. The study is cross-sectional and was described by its authors as exploratory, with no correction
      for the many comparisons made, and medication, including beta-blockers, was not accounted for, so no order
      in time is shown; it has not been repeated.
    sources: [pmid:42082542]
