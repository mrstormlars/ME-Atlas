# Level, contested mark and badges are proposals for the founder (tier 2); nothing here is approved.
slug: reduced-nk-cell-function
name: Reduced natural killer (NK) cell function
core_claim:
  text: >-
    The hypothesis proposes that natural killer (NK) cells, immune cells that help defend
    against viral infection, are less able to kill target cells in people with ME/CFS.
  sources: [pmid:27099524, pmid:20520837, pmid:33777500]
level: 2
level_reason:
  text: >-
    One controlled study with a recognised case definition (Fukuda, which does not require
    post-exertional malaise; 39 patients, 30 controls) found lower NK cell killing in ME/CFS.
    Three other studies used a CDC case definition whose version their abstracts do not name.
    One, of 8 patients from a single family, found lower NK activity than in 8 controls. One,
    of 20 patients, found no patient above 100 lytic units and lower activity in more severely
    ill patients, but its abstract gives no direct comparison with its 50 healthy controls.
    One, of 21 patients and 21 controls, found no difference. Of the controlled studies whose
    abstracts state no case definition, three (65 to 176 patients) found lower NK killing and
    two (one of 174 patients, one of unstated size) found no difference. A repeat by an
    independent group with a recognised case definition (level 3) is therefore not shown; a
    contradicting study of comparable quality is described in the contested note.
  sources: [pmid:27099524, pmid:9683556, pmid:8148445, pmid:7983659, pmid:20520837, pmid:21619669, pmid:22571715, pmid:37013608, pmid:8985207, pmid:28694809]
contested:
  rungs: [2]
  reason:
    text: >-
      A study of 48 patients meeting the Canadian Consensus Criteria (stricter than Fukuda),
      compared with matched healthy controls, found no reproducible difference in NK cell
      killing. This meets the comparable-quality rule against the Fukuda study at rung 2.
      A larger multi-site study (174 patients, 86 healthy controls) also found no difference,
      but its abstract does not state the case definition.
    sources: [pmid:28694809, pmid:27099524, pmid:37013608]
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        No abstract reports NK cell killing tested as a diagnostic marker in a second,
        independent patient group with a stated case definition. One study found NK killing
        a good predictor of CFS status within its own cohort, without a stated case definition.
        A Canadian Consensus Criteria study concluded the measures were not useful diagnostic
        markers, a multi-site study concluded the assay was not ready for clinical use, and a
        family study found low antibody-dependent NK killing also in relatives without the illness.
      sources: [pmid:20520837, pmid:28694809, pmid:37013608, pmid:33777500]
  explains_pem:
    value: false
    reason: null  # no abstract found that measures PEM directly and links it to NK cell function
subgroups:
  - text: >-
      Two small studies suggest lower NK cell activity may go with more severe illness: one of
      20 patients found the lowest activity in the most severely ill group, and one of 41 patients
      found more symptoms and poorer cognitive test results in patients with low activity.
      Neither abstract names a recognised case definition version.
    sources: [pmid:8148445, pmid:16731230]
working_on_it: []
early_signals: []
