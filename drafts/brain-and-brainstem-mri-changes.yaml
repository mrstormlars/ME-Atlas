slug: brain-and-brainstem-mri-changes
name: Brain and brainstem changes on MRI
core_claim:
  text: >-
    The hypothesis proposes that ME/CFS involves changes in the structure or function of the brain,
    especially the brainstem, that can be measured with MRI, and that these changes are part of how
    the illness works.
  sources: [pmid:34355438, pmid:31671321, pmid:29021956]
level: 2
level_reason:
  - text: >-
      A study from Griffith University, Australia, of 18 patients meeting the International
      Consensus Criteria and 26 healthy controls used diffusion MRI, which measures how water moves
      along nerve fibres. It found lower axial and mean diffusivity in a cluster running through the
      midbrain and pons, and higher diffusivity across the fibres in the medulla. The card is at
      level 2 because of this study. In the 25 patients in the Fukuda group (a definition that does
      not require post-exertional malaise), the same analysis found no difference from controls. The
      result has not been repeated by another group.
    sources: [pmid:34355438]
  - text: >-
      A later study from the same group, using a whole-brain voxel-based diffusion analysis on a
      different scanner in 37 patients meeting the Canadian or International criteria and 27 healthy
      controls, found lower mean, axial and radial diffusivity in the left supplementary motor area,
      higher fractional anisotropy in the left cingulum and lower axial kurtosis in the corpus
      callosum. It did not report the brainstem difference, and did not report a brainstem result
      either way; its authors describe their results as in line with the earlier study.
    sources: [pmid:42539798, pmid:34355438]
  - text: >-
      A study from the University of the Sunshine Coast, with no authors shared with the level 2
      study, compared 43 patients with an infection-triggered onset, diagnosed as consistent with the
      Canadian Consensus Criteria, with 43 matched healthy controls. It found higher axial
      diffusivity in patients in several tracts that pass through the brainstem, including the
      cerebellar peduncles, the corticospinal tract and the left medial lemniscus, the opposite
      direction to the level 2 study, and no difference in mean diffusivity. In 33 patients with a
      gradual onset, axial diffusivity was lower only in the corpus callosum.
    sources: [pmid:40624094, pmid:34355438]
  - text: >-
      Other controlled studies from the same group as the level 2 study, using different measures,
      also report brainstem differences: weaker connections between brainstem regions during a task
      (45 patients meeting the Fukuda definition, which does not require post-exertional malaise, and
      27 controls), a lower T1-weighted MRI signal in a brainstem region (43 patients meeting the
      Fukuda definition and 27 controls), weaker connections between the pons and the cerebellum
      during a task (31 patients meeting the Canadian or International criteria and 15 controls), and
      a larger pons and whole brainstem at 7 Tesla (10 patients and 10 controls). The papers do not
      say whether they share patients, and none of these results has been repeated by an
      independent group.
    sources: [pmid:31671321, pmid:30497131, pmid:38347875, pmid:36937672]
  - text: >-
      The card is not at level 3 because no independent group has found the same result in a separate
      cohort. A study from Newcastle, UK, with no shared authors, of 42 patients meeting the Fukuda
      definition (which does not require post-exertional malaise) and 28 healthy controls found lower
      white matter volume in the midbrain and pons. This is a different measure (volume, not
      diffusion), and two Australian studies with the same lead author (Barnden), one of them from the
      group behind level 2, did not find it: one of 25 patients meeting the Fukuda definition and the
      Canadian criteria and 25 controls found no difference in total or regional brain volumes, and
      one of 43 patients meeting the Fukuda definition and 27 controls found no difference in
      regional grey or white matter volume.
    sources: [pmid:29021956, pmid:21560176, pmid:30497131]
  - text: >-
      Two studies from the Griffith group found larger volumes in the same parts of the left
      hippocampus (subiculum head and presubiculum head): 16 of 18 patients meeting the International
      Consensus Criteria (two scans could not be analysed) against 25 controls, in the same cohort as
      the level 2 study, and 29 patients meeting the Canadian or International criteria against 15
      controls at 7 Tesla. Because both come from the same group, this is not an independent repeat.
    sources: [pmid:35355311, pmid:34355438, pmid:39804864]
  - text: >-
      Several studies cannot count towards the level because their case definition is not yet
      verified. A study from Stanford of 15 patients and 14 controls found lower total white matter
      volume, as did the Newcastle study; a study from Nijmegen of 28 patients and 28 controls in two
      cohorts found lower total grey matter volume; and a study from Melbourne of 25 adolescents with
      ME/CFS and 23 controls found no difference in white matter structure.
    sources: [pmid:25353054, pmid:29021956, pmid:15955487, pmid:37331007]
# Null for now, pending FOUNDER QUESTIONS 1 (42539798) and 2 (40624094) in the header.
contested: null
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        The diffusion study on which level 2 rests suggests its measures could become an imaging
        marker, but no brainstem MRI marker has been tested in a second, independent patient group
        with a stated case definition.
      sources: [pmid:34355438]
  explains_pem:
    # Checked: 34975370 (full text PMC8714840) measures PEM directly (two exercise tests on consecutive days with
    # symptom assessments) but reports no correlation between brain signals and symptoms. 28216087 reports a link
    # to symptoms but its case definition is unverified (no open full text), so it cannot count (V7, V9).
    # TODO: verify 28216087's case definition; if it is a recognised one, this badge must be re-assessed.
    value: false
    reason:
      - text: >-
          A study from Georgetown of 34 patients meeting the Fukuda definition (which does not
          require post-exertional malaise) and the Canadian criteria, and 24 controls, scanned the
          resting brain before and after two exercise tests on consecutive days. Activity in the
          medial prefrontal cortex rose after exercise in patients, but the full text reports no
          significant correlation between brain signals and fatigue, pain or other symptoms (data not
          shown), so the study does not link the brain change to symptoms after exertion.
        sources: [pmid:34975370]
      - text: >-
          A study of 15 women with ME/CFS and 15 healthy women found that changes in brain activity
          after exercise were related to patients' symptoms, but its case definition is not yet
          verified, so it cannot count.
        sources: [pmid:28216087]
subgroups:
  - text: >-
      In two analyses of the same Griffith cohort, patients meeting the International Consensus
      Criteria differed from controls on diffusion MRI and hippocampal volume, while the patients in
      the Fukuda group (a definition that does not require post-exertional malaise) did not. Yet two
      other studies from the same group found brainstem differences in cohorts defined by the Fukuda
      definition alone. Not repeated by another group.
    sources: [pmid:34355438, pmid:35355311, pmid:31671321, pmid:30497131]
working_on_it: []
early_signals:
  - text: >-
      A study of n=10 patients meeting the Canadian and International criteria and 10 healthy
      controls at 7 Tesla found a larger pons and whole brainstem in patients. Not yet repeated.
    sources: [pmid:36937672]
