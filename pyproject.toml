[project]
name = "me-atlas"
version = "0.1.0"
description = "Evidence-graded overview of hypotheses on ME/CFS and long COVID"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic",
    "pyyaml",
    "jinja2",
    "anthropic",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/me_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=10 --durations-min=0.5"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
