card: inherited-genetic-risk
decision: accept
parts:
  - decision_part: "The level 2: a controlled study in patients with a recognised case definition (the Oslo HLA study, CCC) supports the hypothesis."
    rubric: "A controlled study in patients with a recognised case definition supports it."
    evidence:
      - source: pmid:32210306
        quote: "We performed high resolution HLA -A, -B, -C, -DRB1, -DQB1 and -DPB1 genotyping by next generation sequencing in 426 adult, Norwegian ME/CFS patients, diagnosed according to the Canadian Consensus Criteria."
      - source: pmid:32210306
        quote: "HLA associations were assessed by comparing to 4511 healthy and ethnically matched controls."
      - source: pmid:32210306
        quote: "Interestingly, both C*07:04 and DQB1*03:03 remained significant after Bonferroni multiple test correction."
      - source: pmid:32210306
        quote: "The proportion of individuals carrying the allele C*07:04 was 7.7% in the patient group and 3.8% in the control group, while 12.7% of the patients and 8.7% of the controls carried DQB1*03:03 (Supplementary Data Sheet S4)."
      - source: pmid:32328064
        quote: "Diagnosis of ME/CFS is based on Canadian Consensus Criteria (CCC) (28) and exclusion of other medical or neurological diseases that may cause fatigue."
  - decision_part: "Not level 3: no independent group has reproduced a variant in a separate cohort; the later HLA, TRA and KIR studies come from the same Oslo group and patient samples, and the DecodeME combinations come from one company."
    rubric: "An independent group has reproduced the finding in a separate cohort."
    evidence:
      - source: pmid:32210306
        quote: "Taken together, our results need verification in independent cohorts."
      - source: pmid:40897283
        quote: "ME/CFS patient DNA samples were obtained as previously described (Lande et al., 2020; Hajdarevic et al., 2021)."
      - source: pmid:35821115
        quote: "All patients have previously been included in association studies of the HLA region and have given informed consent [13, 21], however, only patients with DNA currently available were included in this study."
      - source: pmid:34403736
        quote: "These findings should be replicated in larger cohorts, particularly to verify the putative involvement of HLA-DQB1, a gene important for antigen-presentation to T cells and known to harbor alleles providing the largest risk for well-established autoimmune diseases."
      - source: pmid:32328064
        quote: "These associations need to be confirmed in other ME/CFS patient cohorts."
      - source: pmid:42015188
        quote: "Finally, formal confirmation that the double-refined signatures are broadly associated with disease (e.g., using the signature count approach) will require an independent cohort of people with ME and controls that are genotyped as part of the same study."
  - decision_part: "Not level 4: no study on the card changes the proposed factor in a controlled experiment; the findings are associations."
    rubric: "Changing the proposed factor changes the outcome in a controlled experiment, so the link goes beyond association."
    evidence:
      - source: pmid:32210306
        quote: "although HLA associations per se cannot be used as evidence regarding disease etiology"
      - source: pmid:42015188
        quote: "This means that a series of functional experiments and interventional clinical trials will be required for establishing the causality and verifying the druggability of the genes identified."
  - decision_part: "The contested mark left empty: no study of comparable quality (CCC or stricter, controlled, at least half of 426 patients) contradicts the HLA finding; the negative HLA study is small and has no verified case definition."
    rubric: "Comparable quality means all three: the same or a stricter case definition (CCC, ICC and IOM 2015 rank above Fukuda and Holmes 1988, which rank equal and above Oxford), a control group, and at least half the sample size of the study it contradicts."
    evidence:
      - source: pmid:11422420
        quote: "No significant differences in HLA frequencies were found between patient and control groups."
      - source: pmid:11422420
        quote: "Fifty-eight patients were phenotyped for HLA A and B by microcytotoxicity and genotyped for HLA DRB, DQB and DPB by PCR oligoprobing"
      - source: pmid:32210306
        quote: "The often cited association with DQA1*01 reported by Smith et al.25 cannot be evaluated in our material since the HLA-DQA1 locus was not genotyped in the control group."
  - decision_part: "The failed replication of the Nevada TRA variants, recorded as not supported."
    rubric: "Down or held back: failed replications; a finding that rests only on a broad case definition (Oxford-only cohorts) or a very small sample"
    evidence:
      - source: pmid:26859813
        quote: "In this pilot study, we consented a total of 80 subjects, consistent with the previous study of Smith et al.:27 42 cases with a confirmed diagnosis of ME/CFS and 38 healthy controls."
      - source: pmid:35821115
        quote: "No associations were observed in the Norwegian cohort, and there was no significant association with the two previously reported SNPs in any of the cohorts."
  - decision_part: "Case definitions: the Cambridge family study is CDC, version not stated, and is kept below the level carrier; the Utah, UK Biobank and Oslo GWAS studies without a verified definition do not count towards the level."
    rubric: "Accepted like Fukuda and Holmes 1988, since neither CDC version requires PEM"
    evidence:
      - source: pmid:11702053
        quote: "Twenty-five CFS cases and 36 medical control subjects were assessed for fatigue symptoms based on the Centre for Disease Control (CDC) criteria for CFS, and for lifetime psychiatric symptoms using the Schedule for Schizophrenia and Affective Disorders-Lifetime Version."
      - source: pmid:21619629
        quote: "CFS patients were identified by the presence in the medical record of a CFS-specific ICD-9 diagnostic code (780.71) originating from medical providers involved in the patient's care."
      - source: pmid:35821115
        quote: "Both Schlauch et al. (N = 42) and our Norwegian (N = 409) ME/CFS patients met the Canadian Consensus Criteria for diagnosis, while the patients (N = 2105) from the UK cohort were self-reported."
  - decision_part: "The diagnostic marker badge set to no: the HLA carrier status has not been tested in a second, independent patient group."
    rubric: "Yes only when a measurable marker linked to the hypothesis has been tested in a second, independent patient group, with a stated case definition."
    evidence:
      - source: pmid:32210306
        quote: "The proportion of individuals carrying one or both of these alleles was 19.2% in the patient group and 12.2% in the control group (OR 1.7 [95% CI 1.3-2.2], pnc = 0.00003)."
      - source: pmid:32210306
        quote: "Taken together, our results need verification in independent cohorts."
  - decision_part: "The PEM badge set to no: no study on the card measures post-exertional malaise directly; clinical data came from questionnaires."
    rubric: "Yes only when at least one study at level 2 or above measures PEM directly"
    evidence:
      - source: pmid:32210306
        quote: "Clinical information was collected through questionnaires completed by patients or relatives."
  - decision_part: "The layer predisposition."
    rubric: "Predisposition | `predisposition` | Who is vulnerable?"
    evidence:
      - source: pmid:21619629
        quote: "These analyses provide strong support for a heritable contribution to predisposition to Chronic Fatigue Syndrome."
      - source: pmid:32328064
        quote: "This finding provides further evidence that there is a genetic predisposition for ME/CFS."
  - decision_part: "The four links, each at step 1 (proposed): each source states the link and none measured both ends with a reported relation in the same patients."
    rubric: "A peer-reviewed source (a review counts) that states the link. Not studied directly in patients."
    evidence:
      - source: pmid:11702053
        quote: "These findings suggest that familial factors are important in the aetiology of chronic fatigue syndrome."
      - source: pmid:32328064
        quote: "This finding provides evidence that autoimmunity might play a role in ME/CFS with an infection-triggered onset."
      - source: pmid:32328064
        quote: "C4 levels (p = 0.06 and 0.004, respectively) but not C3 levels were decreased, while there was no difference in B cell numbers."
      - source: pmid:40897283
        quote: "Our data support an involvement of NK cells in ME/CFS."
      - source: pmid:42196410
        quote: "In addition, the findings revealed the downstream consequences of this genetic and epigenetic priming: chronic innate immune activation, CD8+ T cell exhaustion characterized by upregulation of the exhaustion-driving transcription factors Thymocyte Selection-Associated HMG Box (TOX) and Eomesodermin (EOMES), and a cellular energy crisis centered on mitochondrial dysfunction."
  - decision_part: "The two early signals (Berlin PTPN22/CTLA4, Oslo KIR), shown as unrepeated with their statistical limits."
    rubric: "Quality factors applied at every rung: case definition, sample size, controls, preregistration, conflicting results."
    evidence:
      - source: pmid:32328064
        quote: "One-tailed t-tests were performed to test for increased frequency of the known autoimmunity risk alleles in ME/CFS patients."
      - source: pmid:32328064
        quote: "The associations were only found in ME/CFS patients, who reported an acute onset of disease with an infection (PTPN22 rs2476601: OR 1.63, CI 1.04-2.55, p = 0.016; CTLA4 rs3087243: OR 1.53, CI 1.17-2.03, p = 0.001), but not in ME/CFS patients without infection-triggered onset (PTPN22 rs2476601: OR 1.09, CI 0.56-2.14, p = 0.398; CTLA4 rs3087243: OR 0.89, CI 0.61-1.30, p = 0.268)."
      - source: pmid:40897283
        quote: "If considering the study specific Bonferroni corrected significance threshold of 0.0007, only KIR3DL2*010 remains significant (p= 0.0005)."
reasons_summary: "Level 2 is supported by one controlled CCC study (Oslo HLA, 426 patients, 4511 controls); no independent replication, no intervention, no comparable contradicting study, both badges no, links proposed."
would_change: "Level 3 would need an independent group to find HLA-C*07:04, HLA-DQB1*03:03 or another card variant in a separate cohort with a recognised case definition. A contested mark would follow if a controlled study with CCC or a stricter definition and at least 213 patients found no association with these HLA alleles. Unverifiable but not needed for the level: the place labels 'Cambridge' (pmid:11702053), 'London' (pmid:16049290, pmid:11422420) and 'Brisbane' (pmid:15554358) are not in the abstracts, and none of these studies has cached full text. pmid:16049290 says only that patients and controls came from 'the same region of England'. These labels should be checked against the full texts or removed. No drafter reasoning, review findings or earlier audit was handed to me."
