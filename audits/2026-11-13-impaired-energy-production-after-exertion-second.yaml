card: impaired-energy-production-after-exertion
decision: reject
parts:
  - decision_part: "The level 2 rung: a controlled CCC study of 84 patients and 71 sedentary controls in which patients did not reproduce their first two-day test results. Supported."
    rubric: "A controlled study in patients with a recognised case definition supports it."
    evidence:
      - source: pmid:38965566
        quote: "Participants with ME/CFS (Canadian Criteria; n = 84) and sedentary controls (CTL; n = 71) completed two CPETs on a cycle ergometer separated by 24 h."
      - source: pmid:38965566
        quote: "Intraclass correlations revealed greater stability in CPET variables across test days in CTL compared to ME/CFS owing to CPET-2 declines in ME/CFS."
  - decision_part: "The proposed level 3: independent groups (Amsterdam, Fukuda; Oslo, CCC in part) reproduced a second-day fall in separate cohorts. Supported, as a contested rung."
    rubric: "An independent group has reproduced the finding in a separate cohort."
    evidence:
      - source: pmid:20937116
        quote: "All patients fulfilled the criteria of Fukuda et al [1] for CFS/ME and reported the start of symptoms after an infectious disease."
      - source: pmid:20937116
        quote: "At the anaerobic threshold the group of patients performed worse and the controls improved."
      - source: pmid:31161646
        quote: "All included patients fulfilled the CCC for ME/CFS (Carruthers et al. 2003)."
      - source: pmid:31161646
        quote: "The difference in power output at GET was significantly different between groups (Fig. 5D)."
      - source: pmid:31161646
        quote: "VO2 at GET was further reduced in patients from CPET1 to CPET2, but the difference in VO2 at GET did not differ significantly between groups (Fig. 5B)."
  - decision_part: "The contested mark on rung 3: the New York study (Fukuda modified to require PEM, controlled, 53 patients with maximal tests) contradicts the 15-patient Fukuda Amsterdam study that rung 3 needs. Supported."
    rubric: "A rung that rests on more than one study (for example an original finding and its independent replication at level 3) is contested when a study of comparable quality contradicts any study the rung needs."
    evidence:
      - source: pmid:42212259
        quote: "They all met both the 1994 case definition of ME/CFS, modified to require endorsement of post-exertional malaise (Table 1)."
      - source: pmid:42212259
        quote: "For ME/CFS and CON subjects, there were no significant changes in Peak VO2 between Day 1 and Day 2 studies"
      - source: pmid:42212259
        quote: "Five ME/CFS and six sedentary controls did not meet the American College of Sports Medicine (ACSM) criteria."
      - source: pmid:20937116
        quote: "Female patients (n = 15) and controls (n = 15) performed a cardiopulmonary exercise test (CPET) by cycling at a continuously increased work rate till maximal exertion."
  - decision_part: "Rung 2 left uncontested because the New York study states a Fukuda-based definition, which ranks below CCC. Accepted on the New York study's own sentence, with the caveat that a companion paper by the same group names IOM 2015."
    rubric: "Comparable quality means all three: the same or a stricter case definition (CCC, ICC and IOM 2015 rank above Fukuda and Holmes 1988, which rank equal and above Oxford), a control group, and at least half the sample size of the study it contradicts."
    evidence:
      - source: pmid:42212259
        quote: "They all met both the 1994 case definition of ME/CFS, modified to require endorsement of post-exertional malaise (Table 1)."
      - source: pmid:41293716
        quote: "The patients with ME/CFS were between the ages of 25 and 60 years and met the 2015 IOM case definition (22)."
      - source: pmid:38965566
        quote: "Interestingly, a similar decline in %HRRadjusted during CPET-2 was observed in the matched-pairs CTL as well (p ≤ 0.05)."
  - decision_part: "Badge diagnostic marker = no. Supported: the cut-off and classification results come from single cohorts, and the New York study argues against the protocol."
    rubric: "Yes only when a measurable marker linked to the hypothesis has been tested in a second, independent patient group, with a stated case definition."
    evidence:
      - source: pmid:30871578
        quote: "The decrease in WR at VT of 6.3-9.8% on the 2nd day of consecutive-day CPET may represent an objective biomarker that can be used to assist with the diagnosis of ME/CFS."
      - source: pmid:23813081
        quote: "Follow-up classification analysis differentiated between groups with an overall accuracy of 95.1%."
      - source: pmid:42212259
        quote: "The data do not support using the 2-day CPET protocol to define PEM or disability."
  - decision_part: "Badge explains PEM = no. Supported: no study relates the second-day fall to symptoms after exertion in the same patients."
    rubric: "The link must connect the proposed mechanism to the symptoms after exertion in the same patients; a measured change that is itself the hypothesised abnormality (for example a fall in oxygen use on the second test) does not on its own explain PEM."
    evidence:
      - source: pmid:31161646
        quote: "Although VO2peak decreased significantly in patients, the absolute change was too small, in our opinion, to indicate any major change in exercise tolerance or explain PEM."
      - source: pmid:30871578
        quote: "ME/CFS patients reported higher scores than controls on the Chalder Fatigue Scale on Day 1 (p < 0.01), with a significant group × time interaction effect following Day 2, due to a greater increase in their scores compared with controls (p < 0.01)."
      - source: pmid:36984572
        quote: "Detailed exercise test results of the 2-day CPET protocol will be reported separately."
      - source: pmid:36984572
        quote: "There was a highly significant difference in judged recovery time (ME/CFS = 12.7 ± 1.2 d; CTL = 2.1 ± 0.2 d, mean ± s.e.m., Chi2 = 90.1, p < 0.0001)."
  - decision_part: "Layer dysfunction. Supported: the card measures whole-body oxygen use and work, which depend on oxygen delivery as well as on cellular energy production."
    rubric: "Every node sits in exactly one layer, from root to experience:"
    evidence:
      - source: pmid:38965566
        quote: "Production of energy relies on the coordinated functions of the cardiovascular, pulmonary, and musculoskeletal systems to provide oxygenated blood to central and peripheral structures for energy metabolism."
      - source: pmid:20937116
        quote: "However the oxidative phosphorylation in PBMC was similar in CFS/ME patients and controls."
  - decision_part: "Link to neuroinflammation at step proposed. Supported by the 2026 systematic review's abstract."
    rubric: "A peer-reviewed source (a review counts) that states the link. Not studied directly in patients."
    evidence:
      - source: pmid:42051540
        quote: "First, mitochondrial dysfunction and metabolic abnormalities may act as potential initiating factors in PEM, manifesting as impaired ATP synthesis, overproduction of reactive oxygen species (ROS), and the accumulation of metabolic byproducts."
      - source: pmid:42051540
        quote: "Subsequently, peripheral inflammation may be transmitted to the central nervous system through disruption of the blood-brain barrier and vagal nerve pathways, activating glial cells and initiating neuroinflammation."
  - decision_part: "Link to question:closest-to-symptoms at step proposed. Not supported: the card says review pmid:37054777 notes that few studies have directly tested how the body's exercise responses relate to post-exertional malaise. That review is given as abstract only, and its abstract has no such sentence and does not state a link from this hypothesis to the question. The link's only source cannot be matched to a sentence in the records, so this part cannot be accepted."
    rubric: "No link without a source, at every step."
    evidence:
      - source: pmid:37054777
        quote: "The mechanistic underpinnings of such symptoms are poorly understood."
      - source: pmid:37054777
        quote: "This review illustrates exercise pathophysiologic commonalities between PASC and ME/CFS that will help guide future diagnostics and treatment."
  - decision_part: "Early signals and subgroup from single studies (muscle acidosis in 18 patients; lactate in 18 patients), each labelled as not repeated. Supported as early signals."
    rubric: "One or more small or uncontrolled studies point towards it."
    evidence:
      - source: pmid:21749371
        quote: "This CFS group also exhibited significant prolongation (almost 4-fold) of the time taken for pH to recover to baseline."
      - source: pmid:31161646
        quote: "In conclusion, previous exercise deteriorates physical performance and increases [Laa] during exercise in patients with ME/CFS while it lowers [Laa] in healthy subjects."
reasons_summary: "The level 3 (rung 3 contested), both badges, the layer and the neuroinflammation link are supported, but the link to question:closest-to-symptoms rests on a statement that is not in its only source's abstract."
would_change: "This becomes accept if the link to question:closest-to-symptoms is sourced to a record whose title or abstract states that link (or the review's full text is cached and contains the sentence the card attributes to it), or if the link is dropped. Separately, the rung-2 decision would change if a record shows that the New York cohort (pmid:42212259) is the same IOM 2015 cohort as pmid:41293716. Its own sentence ('met both the 1994 case definition ...') appears to name only one of two definitions. With IOM 2015, 53 patients with maximal tests and a control group, it would be of comparable quality to the 84-patient CCC study, and rung 2 would also be contested. Unverifiable for lack of full text, and not relied on: the card's statement that the 51-woman classification (pmid:23813081) was 'within its own cohort' is not in that abstract. Minor wording point: the first level_reason paragraph says 'The card is at level 2 because of this study' on a level-3 card. No drafting reasoning, review findings or earlier audit was shown to me."
