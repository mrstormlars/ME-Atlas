      plasma samples (189) by droplet digital PCR ... including HHV-7, were always negative''), the meta-statement
      on patient numbers with the 132/76/27 serology counts, and ''The methods also differ (droplet digital
      PCR against nested PCR)''. It also adds pmid:36653846 as a source. None of these facts was on the
      card before. The content matches the cached full text of pmid:34422848 (Results: ''Serum samples
      (189) ... were screened by ddPCR to detect potential active (lytic) replication of any of the nine
      HHVs. HHV DNA was rarely detected, with HSV-2, HHV-6A and HHV-6B detected in plasma from one or
      two subjects and the remaining HHVs always negative (Table 1)''; Figure 2 ''plasma (n = 189)'').
      But under the correction limits (context sections 3 and 9; DECISIONS 2026-11-16) a correction adds
      a fact only through one add_sentence per objecting audit part. That sentence cites only the sources
      the part quotes and says no more than its quotes. Part 2 quotes neither the number 189 nor nested
      PCR, which comes from pmid:36653846, a source part 2 does not quote. This statement bears on the
      contested decision.'
    fix: 'Restore level_reason[3] to its draft text and answer audit 2026-11-13 part 2 with a single add_sentence
      (answers: {record: 2026-11-13-herpesvirus-reactivation.yaml, part: 2}, sources [pmid:34422848])
