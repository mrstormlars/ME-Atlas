      titres or seropositivity to at least five of six HHVs, ''were screened by ddPCR to detect potential
      active (lytic) replication of any of the nine HHVs. HHV DNA was rarely detected, with HSV-2, HHV-6A
      and HHV-6B detected in plasma from one or two subjects and the remaining HHVs always negative (Table
      1)''. Table 1 gives HHV-7 plasma positive 0 (negative 182), HHV-6A plasma positive 1 (HC), HHV-6B
      plasma positive 2 (HC), so no ME/CFS plasma sample had HHV-6 or HHV-7 DNA. The Riga study (pmid:36653846)
      found active (plasma) HHV-6A/B, HHV-7 or B19V infection in 45% (90/200) of patients and active double
