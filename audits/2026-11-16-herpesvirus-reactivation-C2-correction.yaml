operations:
- op: replace_paragraph
  field: level_reason
  index: 0
  text: A study from Riga, Latvia, of 200 patients meeting the Fukuda definition, which does not require
    post-exertional malaise, and 150 healthy controls looked for viral DNA in cell-free blood plasma,
    which the authors use as a marker of active infection. Active double HHV-6 and HHV-7 infection was
    found only in patients (p < 0.0001); the text of the paper gives no counts for it (a figure shows
    frequencies). Markers of active HHV-6, HHV-7 or parvovirus B19 (not a herpesvirus) infection together
    were found in 45% of patients and 8.7% of controls. The card is at level 2 because of the herpesvirus-only
    result of this study. No independent group has repeated it, so it is unreplicated.
  sources:
  - pmid:36653846
- op: replace_paragraph
  field: level_reason
  index: 3
  text: 'A study from London, with no authors shared with the Riga studies, measured herpesvirus DNA in
    saliva every month for six months in 30 patients from the UK ME/CFS Biobank (16 severely, 14 mildly
    or moderately affected), meeting the Canadian Consensus Criteria and/or the Fukuda definition, and
    16 healthy controls in the saliva measurements (the abstract says 14 controls). It found higher HHV-6B
    and HHV-7 DNA levels in saliva: HHV-6B was higher in the 16 severely affected patients than in controls
    at three of six monthly time points, and HHV-7 was higher in the mildly or moderately affected patients
    at two time points, with trends at the others. Epstein-Barr virus and herpes simplex virus 1 did not
    differ. The authors read the viral DNA as longstanding, persistent infection rather than acute or
    recent infection. The same study also screened plasma samples (189) by droplet digital PCR for active
    (lytic) replication of nine herpesviruses: herpesvirus DNA was rarely detected, HHV-6A, HHV-6B and
    herpes simplex virus 2 were found in plasma from one or two subjects, and the remaining viruses, including
    HHV-7, were always negative. The record does not say how many of the 189 samples came from patients;
    antibodies had been measured earlier in plasma from 132 people with ME/CFS, 76 healthy controls and
    27 people with multiple sclerosis, so whether this measurement reaches half of the 200 Riga patients
    cannot be read from the record. The methods also differ (droplet digital PCR against nested PCR).
    The card does not reach level 3: this study measured viral DNA load in saliva, found differences only
    in subgroups at a few time points, and does not repeat the finding of active infection in blood.'
  sources:
  - pmid:34422848
  - pmid:36653846
- op: replace_paragraph
  field: level_reason
  index: 5
  text: 'A third randomised trial, of valacyclovir in a subset of patients with Epstein-Barr virus markers,
    reported a larger rise in an activity score with valacyclovir than with placebo; its abstract gives
    no sample size or statistical test. A study of 192 patients the authors classed as having reactivated
    HHV-6 or HHV-7 infection by PCR of blood white cells, given valaciclovir, valganciclovir or artesunate,
    compared with 63 untreated patients: its abstract reports how often the viruses became undetectable
    by PCR of blood white cells, not whether symptoms changed, and does not state how patients were allocated.'
  sources:
  - pmid:18019402
  - pmid:35102619
- op: replace_paragraph
  field: level_reason
  index: 7
  text: 'Some studies whose case definitions are not yet verified found no difference. One of 26 patients
    and 50 matched controls in Atlanta (52 recruited) isolated no HHV-6 or HHV-7 from anyone''s blood
    cells and found no significant difference in HHV-6 or HHV-7 DNA in blood cells: HHV-6 DNA in 3 of
    26 patients and 14 of 50 controls, HHV-7 DNA in 2 patients and 12 controls. A multicentre search for
    viral genetic material in blood, stool and saliva found no consistent differences between patients
    and controls other than fewer anelloviruses (a family of viruses that are not herpesviruses) in patients.
    The card is placed in the mechanism layer; a cited study states that herpesvirus reactivation might
    be a cause or consequence of dysregulated immune function seen in ME/CFS.'
  sources:
  - pmid:10913395
  - pmid:37526404
  - pmid:34422848
- op: update_study
  id: pmid:34422848
  set:
    finding: 'A study of n=30 patients (16 severely, 14 mildly or moderately affected) and 16 healthy
      controls in the saliva measurements (the abstract says 14 controls), sampling saliva monthly for
