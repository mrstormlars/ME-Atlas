operations:
- op: update_study
  id: pmid:42351611
  set:
    case_definition: IOM2015
    case_definition_source: fulltext
    case_definition_quote: Patients with ME/CFS were selected according to the 2015 Institute of Medicine/National
      Academy of Medicine diagnostic criteria [42], requiring core ME/CFS symptoms for at least 6 months
      with no alternative diagnosis.
    n_patients: 76
    n_controls: 37
    finding: A study of 76 patients with ME/CFS meeting the 2015 IOM criteria, 50 patients with long COVID
      and 37 healthy controls found no significant difference in diversity within samples, small differences
      in overall make-up of gut bacteria with broad overlap, and more Sutterella and less Lachnospiraceae
      in both patient groups. Its full text reports that affective, cognitive and gastrointestinal symptom
      scores showed weaker or less stable associations with gut bacteria than fatigue scores did.
- op: update_study
  id: pmid:19338686
  set:
    case_definition: unverified
    case_definition_source: null
    case_definition_quote: null
- op: update_study
  id: pmid:23791918
  set:
    group: Frémont M, R.E.D Laboratories, Zellik, Belgium (last author De Meirleir K)
- op: update_study
  id: pmid:37396339
  set:
    finding: A study of n=131 patients and 86 healthy controls found no significant rise in LPS-binding
      protein or soluble CD14, but higher antibodies against LPS and flagellin and higher FABP2, a marker
      of gut lining damage, in patients; in a separate group of 9 patients and 7 controls, LPS-binding
      protein and soluble CD14 rose after exercise in controls (P = 0.007, P = 0.008), while in patients
      LPS-binding protein did not rise significantly and soluble CD14 rose more modestly (P = 0.021).
      LPS in blood rose after exercise in patients (P = 0.008) but not in controls, and IgM antibodies
      to LPS rose in patients (P = 0.004).
- op: update_study
  id: pmid:41516296
  set:
    finding: A review of gut microbiome research in ME/CFS; its abstract says that microbiome changes
      may lead to distinct neurocognitive impairments through the gut-brain axis, and that translocation
      of microbial components triggers an immune response and systemic inflammation. Context only, not
      evidence for the level.
- op: update_study
  id: pmid:31330791
  set:
    finding: A 2019 review of proposed disease mechanisms in ME/CFS; its abstract lists disturbances to
      immunological and inflammatory pathways, autonomic and neurological dysfunction, abnormalities in
      muscle and mitochondrial function, shifts in metabolism, and gut physiology or gut microbiota disturbances.
      Context only, not evidence for the level.
- op: replace_paragraph
  field: level_reason
  index: 4
  text: Studies disagree on gut bacterial diversity. The Cornell study and the Chinese study found lower
    diversity. A Polish study of 25 patients (Fukuda) and 16 controls found fewer bacterial types (lower
    richness) but no significant difference in diversity or evenness. In the 106-patient study, diversity
    was lower in the simple comparison, but after adjustment this was tied to irritable bowel syndrome
    rather than ME/CFS. A Bulgarian study of 76 patients meeting the 2015 IOM criteria and 37 controls
    found no difference in diversity within samples, but small differences in overall make-up.
  sources:
  - pmid:27338587
  - pmid:41387992
  - pmid:41006438
  - pmid:36758522
  - pmid:42351611
- op: replace_paragraph
  field: level_reason
  index: 6
  text: Blood markers of bacterial products crossing the gut wall give mixed results. The Cornell study
    found higher LPS (a bacterial toxin), LPS-binding protein and soluble CD14 in patients, and a Spanish
    study of 30 patients meeting the International Consensus Criteria and 26 controls found higher LPS,
    soluble CD14 and zonulin-1. A separate Columbia University study (Alaedini A) of 131 patients meeting
    both the Fukuda and Canadian criteria and 86 controls found neither LPS-binding protein nor soluble
    CD14 significantly raised, but found more antibodies against LPS and flagellin and more FABP2, a marker
    of damage to gut lining cells, which the Cornell study had found not significantly raised. The level
    does not rest on these blood markers; the rungs rest on lower stool butyrate.
  sources:
  - pmid:27338587
  - pmid:37744357
  - pmid:37396339
  - pmid:36758522
  - pmid:41387992
- op: replace_paragraph
  field: badges.diagnostic_marker.reason
  index: 0
  text: The 106-patient study tested its bacterial classifier in a second cohort of 50 patients and 50
    controls recruited and sampled years earlier, which its authors call an independent external validation
    cohort. Both cohorts came from four of the same five US sites, and several of the same clinicians
    are authors on both papers (Levine S, Bateman L, Klimas NG, Montoya JG, Peterson DL); neither paper
    says whether any patient is in both cohorts, so the cohorts cannot be shown to be independent patient
    groups.
  sources:
  - pmid:36758522
  - pmid:28441964
- op: replace_paragraph
  field: badges.explains_pem.reason
  index: 1
  text: An exercise cohort of 9 patients and 7 controls, recruited under the Fukuda criteria only and
    collected at the Marshfield Clinic and the University of Wisconsin-Madison, was analysed in the same
    paper as the 131-patient study. LPS-binding protein and soluble CD14 rose after exercise in controls
    (P = 0.007, P = 0.008); in patients LPS-binding protein did not rise significantly and soluble CD14
    rose more modestly (P = 0.021). LPS in blood rose after exercise in patients (P = 0.008) but not in
    controls, and IgM antibodies to LPS rose in patients (P = 0.004). The paper does not relate these
    changes to symptoms. Both exercise cohorts come from the Marshfield Clinic and the University of Wisconsin-Madison;
    the papers do not say whether any participant is in both.
  sources:
  - pmid:37396339
  - pmid:26683192
