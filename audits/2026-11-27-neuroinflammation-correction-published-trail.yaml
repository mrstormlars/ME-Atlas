review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'The card records pmid:30617782 with case_definition ''unverified'' and no quote, but its
      cached full text (data/cache/europepmc/PMC6612467.html, section 2.1 Participants) states the inclusion
      criterion: participants with ME/CFS had to have ''met Fukuda case definition criteria for ME/CFS
      (Fukuda et al., 1994), without the Reeves et al. (2005) modifications but with additional criteria
      proposed by Jason et al. (2010)''. The same section adds: ''A physician diagnosis of ME/CFS was
      not required''. Scan item 1 is an error on the card.'
    fix: 'Set case_definition to Fukuda, case_definition_source to fulltext, and case_definition_quote
      to the verbatim sentence above; the card then shows the Fukuda flag ''does not require PEM''. The
      study''s role (now context) and whether it counts towards the level are for the auditor: it is controlled
      (15 vs 15) with a recognised definition, but it measures MR spectroscopy metabolites and brain temperature,
      not the diffusion MRI measure the level rests on, so it does not replicate that finding for level
      3.'
    targets:
    - studies[pmid:30617782].case_definition
    - studies[pmid:30617782].case_definition_source
    - studies[pmid:30617782].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: The finding of pmid:30617782 and level_reason[1] report 'higher brain temperature in several
      regions' and the choline/creatine result without saying which survived correction. The cached full
      text states 'The only result to survive corrections for multiple comparisons was elevated CHO/CR
      in the left anterior cingulate of participants with ME/CFS' and, for brain temperature in five regions,
      'These findings did not survive corrections for multiple comparisons'; the authors also 'caution
      against over-interpretation until results can be confirmed in an independent sample'. Leaving this
      out makes the uncorrected temperature differences read as findings of the same strength. Scan item
      2 is an error on the card.
    fix: In the study finding and in level_reason[1], say that only the higher choline/creatine ratio
      in the left anterior cingulate survived correction for multiple comparisons and that the brain temperature
      differences did not, sourced to pmid:30617782.
    targets:
    - studies[pmid:30617782].finding
    - level_reason[1]
  - class: decisive
    severity: must_fix
    problem: 'level_reason[1] opens ''Smaller imaging studies whose case definition is not yet verified''
      and covers both pmid:24665088 and pmid:30617782. For pmid:30617782 this is now wrong: its cached
      full text states the Fukuda criteria (quote in the first finding). It remains true for pmid:24665088,
      which has no cached full text. Scan item 3 is an error on the card.'
    fix: Rewrite level_reason[1] so the 'not yet verified' wording applies only to the PET study of 9
      patients (pmid:24665088), and describe the MR spectroscopy study as 15 Fukuda-defined women with
      15 matched controls, with the correction limit from the second finding.
    targets:
    - level_reason[1]
  - class: decisive
    severity: must_fix
    problem: 'badge_reasons.explains_pem[1] says of pmid:24665088, pmid:30617782 and pmid:12598734 ''no
      open full text was available''. For pmid:30617782 an open full text is now cached (PMC6612467).
      That full text reports no direct measure of post-exertional malaise: malaise after exertion is mentioned
      only in the Introduction''s description of the illness, and the measures are fatigue and mood questionnaires,
      whole-brain MR spectroscopy, brain temperature and cerebral blood flow. Scan item 4 is an error
      on the card; the badge value (false) is unaffected.'
    fix: Move pmid:30617782 into explains_pem[0] and change its count from 'three' to 'four' studies with
      an open full text; leave explains_pem[1] for the other two studies, 'The other two studies', with
      the sentence unchanged otherwise. Keep the badge at false.
    targets:
    - badge_reasons.explains_pem[0]
    - badge_reasons.explains_pem[1]
  - class: decisive
    severity: advisory
    problem: The diagnostic_marker reason refers to 'the three open full texts'. With PMC6612467 cached
      for pmid:30617782 there are four. That full text reports no marker tested in a second, independent
      patient group (the authors ask for confirmation 'in an independent sample'), so the badge value
      and the claim stay correct, but the count is out of date.
    fix: Change 'the three open full texts' to 'the four open full texts' if the explains_pem count is
      changed, so the two badge reasons agree.
    targets:
    - badge_reasons.diagnostic_marker[0]
rounds:
- round: 1
  operations:
  - op: update_study
    id: pmid:30617782
    set:
      case_definition: Fukuda
      case_definition_source: fulltext
      case_definition_quote: met Fukuda case definition criteria for ME/CFS (Fukuda et al., 1994), without
        the Reeves et al. (2005) modifications but with additional criteria proposed by Jason et al. (2010)
      finding: A study of n=15 women with ME/CFS and 15 age- and gender-matched healthy controls using
        whole-brain MR spectroscopy found metabolite differences in several regions, most notably a higher
        choline/creatine ratio in the left anterior cingulate, and higher brain temperature in the right
        insula, putamen, frontal cortex, thalamus and cerebellum. Only the higher choline/creatine ratio
        in the left anterior cingulate survived correction for multiple comparisons; the brain temperature
        differences did not. The authors write that the findings may indicate neuroinflammation, and caution
        against over-interpretation until results can be confirmed in an independent sample.
  - op: replace_paragraph
    field: level_reason
    index: 1
    text: Two smaller imaging studies point the same way. A PET study of 9 patients, whose case definition
      is not yet verified, found higher binding of a marker of activated microglia or astrocytes. A whole-brain
      MR spectroscopy study of 15 Fukuda-defined women and 15 matched controls found a higher choline/creatine
      ratio in the left anterior cingulate, the only result that survived correction for multiple comparisons;
      its higher brain temperature in several regions did not survive that correction, and the authors
      caution against over-interpretation until the results are confirmed in an independent sample.
    sources:
    - pmid:24665088
    - pmid:30617782
  - op: replace_paragraph
    field: badges.explains_pem.reason
    index: 0
    text: The four studies with an open full text report no direct measure of post-exertional malaise,
      in their abstracts or in the full texts checked.
    sources:
    - pmid:34815320
    - pmid:41834684
    - pmid:34609538
    - pmid:30617782
  - op: replace_paragraph
    field: badges.explains_pem.reason
    index: 1
    text: The other two studies report no direct measure of post-exertional malaise in their abstracts;
      no open full text was available.
    sources:
    - pmid:24665088
    - pmid:12598734
  - op: replace_paragraph
    field: badges.diagnostic_marker.reason
    index: 0
    text: One study proposed diffusion imaging indices as possible markers of neuroinflammation, but none
      of the abstracts or the four open full texts reports such a marker tested in a second, independent
      patient group.
    sources:
    - pmid:41834684
    - pmid:30617782
