card: infection-trigger
decision: accept
parts:
  - decision_part: "level_reason[0]: the added sentences on the RECOVER-Adult authors' mitigation and the factors that might have led to underestimation; the level stays at 2."
    rubric: "A controlled study in patients with a recognised case definition supports it."
    evidence:
      - source: pmid:39804551
        quote: "There may be a selection bias since with PASC may be more likely to enroll in RECOVER. These issues are mitigated by the enrollment of participants within 30 days of infection."
      - source: pmid:39804551
        quote: "Conversely, there are also factors that might have contributed to an underestimation of participants with post-COVID-19 ME/CFS. Hospitalized RECOVER participants were excluded and therefore were not included in the prevalence and incidence estimate of post-COVID-19 ME/CFS. The waxing/waning nature of symptoms might have caused us to miss cases."
      - source: pmid:39804551
        quote: "The most severely affected individuals may have been unable to enroll in RECOVER or to have been differentially lost to follow-up because of study burden."
      - source: pmid:39804551
        quote: "Incidence rate and prevalence of post-COVID-19 ME/CFS based on the 2015 Institute of Medicine ME/CFS clinical diagnostic criteria."
    class: none
  - decision_part: "studies[pmid:33367564]: case definition changed from unverified to other, read from the full text (a case met one or more of the Fukuda, Canadian and IOM definitions); role stays context."
    rubric: "A study is recorded with the definition its own text states."
    evidence:
      - source: pmid:33367564
        quote: "were evaluated to determine whether they met 1 or more of the 3 case definitions of ME/CFS; participants who met more than 1 case definition were defined as having severe ME/CFS"
      - source: pmid:33367564
        quote: "providing a standardized method for assessing various case definitions of ME/CFS, including Fukuda et al [20], Canadian Clinical [21], and Institute of Medicine (IOM) [22] criteria."
    class: none
  - decision_part: "level_reason[3] and links[0]: the college cohort and the Dubbo study compared cases with people who recovered from the same infection and had no uninfected comparison group, so they still do not count towards the level; the other three case definitions stay unverified."
    rubric: "Down or held back: failed replications; a finding that rests only on a broad case definition (Oxford-only cohorts) or a very small sample; no control group"
    evidence:
      - source: pmid:33367564
        quote: "6 months later, 55 of the 238 (23%) met criteria for ME/CFS and 157 (66%) were asymptomatic. 67 of the 157 asymptomatic students served as controls."
      - source: pmid:16950834
        quote: "We invited these cases, and control participants matched by age and sex who had recovered promptly from the same infection"
      - source: pmid:16950834
        quote: "28 (11%) met the diagnostic criteria for chronic fatigue syndrome"
    class: none
reasons_summary: "The correction adds RECOVER-Adult limitation sentences that are in its full text, records the college cohort's any-of-three case definition from its full text, and keeps level 2, the badges, the layer and the links unchanged; all supported."
would_change: "A record showing that the college cohort's case definition differs from the one quoted, or that the Dubbo or college cohort had an uninfected comparison group, would change this. The glandular fever and UK Q fever carriers have no cached full text, but the correction leaves their case definitions unverified and changes no statement about them."
