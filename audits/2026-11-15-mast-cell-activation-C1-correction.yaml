review:
  verdict: reject
  findings:
  - operation: 0
    severity: must_fix
    problem: 'level_reason[0] (and the same text in the operation 5 propose reason) gives the reason for
      level 1 as "this is one small study that no independent group has repeated". Independent repetition
      is the rung 3 criterion. Rung 2 does not require it, and the rubric''s hold-back list has "failed
      replications", not missing ones. So the sentence grounds the level on a criterion outside the rubric.
      "No independent group has repeated" is also a claim about the whole literature that no cited record
      states, the same kind of claim the pre-drafting review (findings 1 and 7) asked to be limited to
      "on this card". The rubric ground the first audit used is the hold-back for a very small sample,
      and the record supports it: 12 + 6 patients against 13 controls, and the abstract calls it "This
      preliminary study".'
    fix: 'In both level_reason[0] and the propose reason, write: "The card is at level 1 because the rubric
      holds back a finding that rests on a very small sample: this is one small, preliminary study, so
      it counts as a small study pointing towards the hypothesis." If you mention replication at all,
      limit it to the card ("no independent study on this card has repeated it") and do not give it as
      the reason for the level.'
    class: decisive
  - operation: 14
    severity: must_fix
    problem: The update_study on pmid:8568124 changes only `group`, from "Peterson PK, Hennepin County
      Medical Center, Minneapolis, USA" to "Steinberg P, Peterson PK". No audit part and no pre-drafting
      review finding names this study's group or institution. The audits name only the institutions for
      27362406, 10884641 and 11570618 (and the early-signal details of 33996867). The cached PubMed record
      (data/cache/pubmed/8568124.xml) gives the affiliation "Department of Medicine, Hennepin County Medical
      Center, Minneapolis, MN 55415, USA", so the old value was supported. An operation that answers no
      finding and still changes the card is outside a correction.
    fix: Drop this operation, so the group stays as it was.
    class: decisive
  - operation: 9
    severity: advisory
    problem: 'The 33996867 finding change answers the audits (unverifiable reference range, tryptase and
      test-confirmation details). The group change answers no finding. The cached record gives the authors''
      affiliations as "Departments of Pediatrics, The Johns Hopkins University School of Medicine and
      the Kennedy Krieger Institute", so the old "Rowe PC, Johns Hopkins University School of Medicine,
      USA" was supported. The new "Chronic Fatigue Clinic, Johns Hopkins Children''s Center" is the clinic
      the patients were referred to, from the abstract, not the authors'' affiliation. Op 11 (29223146)
      does the same: the National Centre for Neuroimmunology and Emerging Diseases is in that study''s
      own cached record.'
    fix: Leave out the `group` key in ops 9 and 11, and keep only the `finding` changes that answer findings.
  - operation: 0
    severity: advisory
    problem: level_reason[0] says the increase was "among peripheral blood mononuclear cells". The abstract
      says only that the mast cell population was identified "in PBMCs". "Among" can be read as a share
      of all PBMCs, and that denominator is exactly what level_reason[1] now says the abstracts do not
      show.
    fix: Write "in mast cells identified from peripheral blood mononuclear cells", or "in blood samples".
  - operation: null
    severity: advisory
    problem: 'The correction leaves `contested: null`, while level_reason[1] now says it is "left open"
      whether 29223146 contradicts the first finding. The second audit rejected the draft precisely because
      the null contested mark could not be accepted on the records. With level 1, the 27362406 finding
      is still the one the level rests on. Leaving the question to the auditor is within the limits of
      a correction, but the auditor will have to decide the mark again.'
    fix: No text change needed; the auditor decides the contested mark.
  - operation: null
    severity: advisory
    problem: 'Several YAML comments no longer match the card: header line 1 ("FOUNDER RULING ... level
      2"), the "PROPOSED LEVEL" block ("2: reached"), `role: supports  # rung 2` on 27362406, the 29223146
