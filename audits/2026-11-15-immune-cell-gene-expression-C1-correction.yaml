operations:
- op: replace_paragraph
  field: contested.reason
  index: 0
  text: A study of whole blood from 25 patients and 25 matched controls found no genes expressed significantly
    differently. Samples were taken at enrolment, not during symptom flares. The paper says its patients
    met the Canadian case definition, which is accepted at every rung. It had a control group and at least
    half as many patients as each of the studies above that used the Canadian Consensus Criteria and as
    the first UK study, so it is of comparable quality to them.
  sources:
  - pmid:28172519
- op: replace_paragraph
  field: contested.reason
  index: 2
  text: A study of 44 pairs of identical twins, in which one twin was ill and the other well, also found
    no difference in any transcript in blood leukocytes. The ill twins had chronic fatigue syndrome in
    32 pairs or idiopathic chronic fatigue in 12 pairs, so its case definition is recorded as other, and
    it does not count towards the contested mark.
  sources:
  - pmid:19503787
