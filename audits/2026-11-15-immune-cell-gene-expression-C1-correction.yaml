  - pmid:16049284
  - pmid:18462164
- op: replace_paragraph
  field: level_reason
  index: 3
  text: 'The card is at level 2. Each group found some genes expressed differently, but the genes and
    pathways differ from study to study: T-cell activation, inflammation, lower interferon and immunoglobulin
    genes, and T-cell exhaustion. No independent group has repeated a specific finding in a separate cohort,
    so each is unreplicated. The exhaustion reading is not consistent across the card''s own studies:
    the Australian study estimated fewer exhausted CD8+ T cells in patients, and a long COVID study that
    re-analysed a public single-cell dataset found no difference in T-cell exhaustion.'
  sources:
