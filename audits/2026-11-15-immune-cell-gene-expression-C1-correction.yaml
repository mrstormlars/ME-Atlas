    case_definition_source: fulltext
    case_definition_quote: Discordance was defined as one twin meeting criteria for either idiopathic
      chronic fatigue (ICF, 12 pairs) or CFS (32 pairs) [1], [2]
- op: replace_paragraph
  field: level_reason
  index: 2
  text: 'A New Zealand study of 10 patients meeting the Canadian Consensus Criteria and 10 controls found
    27 transcripts higher and 6 lower in patients, with the top ones related to inflammation. Two UK studies
    using CDC criteria (version not named), which do not require post-exertional malaise, found genes
    expressed differently: a microarray study of 25 patients and 25 controls, with 16 genes confirmed
    by PCR in fresh samples, and a study that screened 25 patients and 50 blood donors by microarray and
    confirmed 88 genes by PCR in 55 patients and 75 controls. The first read its pattern as T-cell activation.'
  sources:
