    problem: Study pmid:28494812 has group 'Wyller VB, Oslo University Hospital'. In the cached PubMed
      record and full text (PMC5426002), Wyller VB is affiliated only with 'Department of Paediatrics
      and Adolescent Health, Akershus University Hospital, Lørenskog, Norway' and 'Division of Medicine
      and Laboratory Sciences, Medical Faculty, University of Oslo'. Oslo University Hospital is the affiliation
      of other authors (Anesthesiology and Critical Care; Microbiology), not of the named group lead.
    fix: Change the group to 'Wyller VB, Akershus University Hospital / University of Oslo', the affiliations
      the record gives for this author.
  - operation: null
    severity: must_fix
    problem: Study pmid:19503787 has case_definition 'other' with case_definition_quote null. The contested
      reason says the paper cites its criteria to the 1994 Fukuda definition and a 2003 paper on it, so
      the full text (PMC2688030) has a sentence the label is read from, and the card does not quote it.
      Checklist line 1 needs a quote in the record that supports the label.
    fix: Set case_definition_quote to the full-text sentence 'Discordance was defined as one twin meeting
      criteria for either idiopathic chronic fatigue (ICF, 12 pairs) or CFS (32 pairs) [1], [2] ...' (refs
      1 and 2 are Fukuda 1994 and Reeves 2003). Keep 'other', since 12 of 44 met only idiopathic chronic
      fatigue and the analysis pooled both groups.
  - operation: null
    severity: must_fix
    problem: 'badge_reasons.diagnostic_marker says the paper behind GSE214284 (pmid:38232699, which deposits
      GSE214284) ''does not state its case definition, so the check does not meet the badge''s test''.
      badge_reasons.explains_pem, links[0] and the study''s ''none'' label rest on the same point. That
      is true of 38232699''s own text, which names no definition. But another study on the card, pmid:39621903
      (full text PMC11648872), says ''The study populations for the scRNA-seq atlas and this project were
      collected as part of the NIH-funded Cornell Collaborative ME/CFS Center, as previously described
      (10). ... all ME subjects fulfilled the IOM and Canadian Consensus Criteria''. Its ref 10 is Vu
      et al., i.e. 38232699. The card does not say this, and the badge and link reasons depend on it.
      The two records also give that cohort differently: 38232699 says 30 patients and 28 controls; 39621903
      says 28 patients and 30 controls.'
    fix: 'Make the card say why 39621903''s statement does or does not give the case definition for the
      38232699 / GSE214284 cohort. One way: the sentence may refer only to 39621903''s own project, and
      38232699 itself names no definition, so it is not counted. Reword the diagnostic_marker and explains_pem
      reasons and links[0] to rest on that stated reason, or leave the decision to the auditor without
      claiming more than the records say. Note the 30/28 versus 28/30 difference, or avoid relying on
