review:
  verdict: reject
  findings:
  - operation: 1
    severity: must_fix
    problem: 'The correction still places pmid:11502777 in London: level_reason[1] ''A London study, with
      no authors shared with the Dinan studies'', level_reason[2] ''The London study gave a CRH test too''
      and ''lower 24-hour urinary cortisol in the London study'' (operation 2), and contested.reason[1]
      ''A later London study'' (operation 8). The record of pmid:11502777 in section 4 of the context
      gives title, authors, journal and abstract but no affiliation, and its abstract names no place.
      The second audit''s would_change lists ''King''s College London'' and ''London'' for pmid:11502777
      as unverifiable from what it was given. Dropping ''King''s College'' answers the review finding
      but not the audit finding.'
    fix: In all four places, name the study by what the record shows, for example 'A study by Cleare and
      colleagues' / 'the Cleare study', or 'a study by a different group', and leave the place out.
  - operation: 3
    severity: must_fix
    problem: 'level_reason[3] says ''The authors say the lack of differences may reflect limited statistical
      power, especially in the analysis by sex.'' The updated finding of pmid:40713801 (operation 12)
      says the same: ''especially in the sex-stratified analysis''. The cached full text says: ''No significant
      differences in absolute steroid levels were observed between the ME/CFS and control groups, either
      in the combined cohort or within gender-stratified groups. However, this may reflect limited statistical
      power rather than the absence of true biological differences.'' The authors do not say ''especially''
      for the analysis by sex. This puts words in the authors'' mouths.'
    fix: Drop 'especially in the analysis by sex' and 'especially in the sex-stratified analysis', or
      write 'in the combined cohort and in the analyses by gender', following the full text.
  - operation: 12
    severity: must_fix
    problem: This has the same unsourced 'especially in the sex-stratified analysis' as operation 3, here
      in the study's finding field.
    fix: End the finding at '...may reflect limited statistical power.'
  - operation: null
