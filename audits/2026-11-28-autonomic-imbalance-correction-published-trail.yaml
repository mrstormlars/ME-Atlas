request:
- target: studies[pmid:29855991].case_definition
  problem: 'The full-text scan found that the full text states something the card lacks: The full text
    states the patients met the CDC (Fukuda 1994) criteria; the card has the case definition as unverified.
    Quote from the full text: CFS participants met Centers for Disease Control criteria for chronic fatigue
    syndrome (Fukuda et al. 1994)'
- target: studies[pmid:29855991].finding
  problem: 'The full-text scan found that the full text states something the card lacks: The within-patient
    association is with total HRV power only and holds after removal of one outlier; the card does not
    name the measure or the outlier removal. Quote from the full text: Among CFS participants, a significant
    negative association between fatigue ratings and total HRV power (TP) (r = −.70, p = .02) was detected
    (after removal of one outlier)'
- target: level_reason[4]
  problem: 'The full-text scan found that the full text states something the card lacks: The level reason
    says this study''s case definition is not yet verified; the full text names the CDC (Fukuda 1994)
    criteria. Quote from the full text: CFS participants met Centers for Disease Control criteria for
    chronic fatigue syndrome (Fukuda et al. 1994)'
- target: studies[pmid:31957647].case_definition
  problem: 'The full-text scan found that the full text states something the card lacks: The full text
    says patients met unnamed international diagnostic criteria for CFS after clinician assessment at
    a tertiary clinic; the card records none of this and no named definition appears. Quote from the full
    text: Twenty-four participants fulfilling international diagnostic criteria for CFS1 were recruited
    after clinician assessment at an academic tertiary referral clinic'
- target: studies[pmid:31957647].case_definition
  problem: 'studies[pmid:31957647].case_definition set to Fukuda, and the sentence in level_reason[4]
    and the clause in links[0] that say its patients met the Fukuda definition according to the full text:
    the full text names only ''international diagnostic criteria for CFS'' with a reference whose entry
    is not in the record, so Fukuda is an inference, not a definition the study''s text states.'
- target: level_reason[4]
  problem: 'studies[pmid:31957647].case_definition set to Fukuda, and the sentence in level_reason[4]
    and the clause in links[0] that say its patients met the Fukuda definition according to the full text:
    the full text names only ''international diagnostic criteria for CFS'' with a reference whose entry
    is not in the record, so Fukuda is an inference, not a definition the study''s text states.'
- target: links[0]
  problem: 'studies[pmid:31957647].case_definition set to Fukuda, and the sentence in level_reason[4]
    and the clause in links[0] that say its patients met the Fukuda definition according to the full text:
    the full text names only ''international diagnostic criteria for CFS'' with a reference whose entry
    is not in the record, so Fukuda is an inference, not a definition the study''s text states.'
- target: studies[pmid:31957647].case_definition
  problem: The case definition of pmid:31957647 cannot be read as a named definition from the record,
    so it stays not yet checked (unverified) on the card.
- target: studies[pmid:29855991].case_definition
  problem: 'Request item 1 is an error. pmid:29855991 is recorded with case_definition unverified, but
    its cached full text (data/cache/europepmc/PMC6274602.html, Methods, Participants) states: ''CFS participants
    met Centers for Disease Control criteria for chronic fatigue syndrome ( Fukuda et al. 1994 )''. The
    study''s own text names the 1994 CDC (Fukuda) definition.'
- target: level_reason[4]
  problem: Request item 3 is an error. level_reason[4] ends 'The last two studies' case definitions are
    not yet verified.' The last study, pmid:29855991, names the Fukuda 1994 criteria in its cached full
    text (see the finding above), and pmid:31957647 names its criteria by reference 1, which resolves
    to Fukuda 1994 (see the finding below). The sentence is wrong for both.
- target: studies[pmid:29855991].finding
  problem: Request item 2 is an error of a missing limit. The finding says 'within patients, more heart
    rate variability power was associated with less fatigue'. The cached full text says the association
    was with total HRV power only ('a significant negative association between fatigue ratings and total
    HRV power (TP) (r = -.70, p = .02) was detected (after removal of one outlier)'), that LF, HF and
    VHF did not correlate with fatigue, and (Fig. 2 legend) that with the outlier included r = -.32, p
    = .32. A reader would read the card's sentence as a robust association; it holds only after removing
    one of 14 patients.
- target: studies[pmid:31957647].case_definition
  problem: 'Request item 4 is an error; items 5 to 8 rest on a premise the cached record does not bear
    out. The cached full text (data/cache/europepmc/PMC7053003.html, Methods, Participants) states ''Twenty-four
    participants fulfilling international diagnostic criteria for CFS[1] were recruited after clinician
    assessment at an academic tertiary referral clinic'', and its reference list in the same file has
    entry 1 as ''Fukuda K, Straus SE, Hickie I, Sharpe MC, Dobbins JG, Komaroff A. The chronic fatigue
    syndrome: a comprehensive approach to its definition and study. International Chronic Fatigue Syndrome
    Study Group. Ann Intern Med. 1994''. Items 5 to 7 say the reference entry is not in the record; it
    is in the cached full text. DECISIONS (founder ruling) says ''A case definition named only by reference
    number counts when the reference list resolves it'', and the card already labels pmid:23166694 (same
    research group, same wording ''international diagnostic criteria for CFS [1]'', reference 1 Fukuda
    1994) as Fukuda. Keeping pmid:31957647 as unverified is inconsistent with that ruling and with the
    card''s own treatment of pmid:23166694. links[0] also says ''its case definition is not yet verified''
    for this study.'
- target: level_reason[4]
  problem: level_reason[4] opens 'Sleep studies are mixed' and then includes 'In 14 women with chronic
    fatigue syndrome and 14 controls, heart rate variability did not differ.' pmid:29855991 is an arterial
    spin labelling MRI study with heart rate variability from three 5-minute ECG segments (cached abstract
    and full text); it did not measure heart rate variability during sleep. Placed in this paragraph the
    sentence reads as a sleep result.
- target: studies[pmid:29855991].role
  problem: Once pmid:29855991 carries the Fukuda label, it is a controlled study in a recognised case
    definition that found no group difference in heart rate variability ('no group differences in CBFV
    or HRV were detected', cached abstract), like pmid:9505867, pmid:9430800 and pmid:34970156, which
    the card records as contradicts. Its role context was forced by the unverified label. With 14 patients
    it is below half of the 34 patients in pmid:38251045, so it does not by itself bear on the contested
    mark.
review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'Request items 1 and 9 are errors on the card. pmid:29855991 is recorded with case_definition
      unverified and no quote, but its cached full text (data/cache/europepmc/PMC6274602.html, Methods,
      Participants) states: ''CFS participants met Centers for Disease Control criteria for chronic fatigue
      syndrome ( Fukuda et al. 1994 )''. The study''s own text names the 1994 CDC (Fukuda) definition.'
    fix: Set case_definition to Fukuda, case_definition_source to fulltext, and case_definition_quote
      to that sentence from the cached full text.
    targets:
    - studies[pmid:29855991].case_definition
    - studies[pmid:29855991].case_definition_source
    - studies[pmid:29855991].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'Request items 4 and 12 are errors; items 5 to 8 are not. The cached full text of pmid:31957647
      (data/cache/europepmc/PMC7053003.html, Methods, Participants) states ''Twenty-four participants
      fulfilling international diagnostic criteria for CFS 1 were recruited after clinician assessment
      at an academic tertiary referral clinic'', and reference 1 in the same cached file is ''Fukuda K,
      Straus SE, Hickie I, Sharpe MC, Dobbins JG, Komaroff A. The chronic fatigue syndrome: a comprehensive
      approach to its definition and study. ... Ann Intern Med. 1994''. The reference entry is in the
      record, so the claim in items 5 to 7 that it is not is wrong. The card already labels pmid:23166694
      (same wording ''international diagnostic criteria for CFS [1]'', reference 1 Fukuda, cached PMC3498107)
      as Fukuda from its full text; leaving pmid:31957647 as unverified is inconsistent with that. links[0]
      also says of this study ''its case definition is not yet verified''.'
    fix: Set case_definition to Fukuda, case_definition_source to fulltext, case_definition_quote to the
      Participants sentence (the label resting on reference 1, Fukuda 1994, as for pmid:23166694); in
      links[0] replace 'its case definition is not yet verified' with a statement that its patients met
      the Fukuda definition, cited by reference.
    targets:
    - studies[pmid:31957647].case_definition
    - studies[pmid:31957647].case_definition_source
    - studies[pmid:31957647].case_definition_quote
    - links[0]
  - class: decisive
    severity: must_fix
    problem: 'Request items 3 and 10 are errors. level_reason[4] ends ''The last two studies'' case definitions
      are not yet verified.'' Both studies name their definition in their cached full texts: pmid:29855991
      names the CDC (Fukuda 1994) criteria, and pmid:31957647 names ''international diagnostic criteria
      for CFS'' with reference 1 resolving to Fukuda 1994. The sentence is wrong for both.'
    fix: Replace the sentence with one saying both studies' patients met the Fukuda definition (for pmid:31957647
      named by reference), or remove it and let the study entries carry the labels.
    targets:
    - level_reason[4]
  - class: decisive
    severity: must_fix
    problem: Request items 2 and 11 are errors of a missing limit. The finding says 'within patients,
      more heart rate variability power was associated with less fatigue'. The cached full text says the
      association was with total HRV power only ('a significant negative association between fatigue ratings
      and total HRV power (TP) ( r = -.70, p = .02) was detected (after removal of one outlier)'), that
      low, high and very high frequency power did not correlate with fatigue, and the Fig. 2 legend gives
      'with outlier, r = -.32, p = .32'. Read as written, the card's sentence suggests a robust association;
      it holds only after removing one of 14 patients.
    fix: Say the association was with total heart rate variability power only, was significant only after
      removal of one outlier, and was not significant with the outlier included (r = -.32, p = .32).
    targets:
    - studies[pmid:29855991].finding
  - class: decisive
    severity: must_fix
    problem: Request items 13 and 14 are errors. pmid:29855991 is an arterial spin labelling MRI study
      whose heart rate variability came from three 5-minute ECG segments recorded awake around the imaging
      session (cached full text, Methods); it did not measure heart rate variability in sleep, yet level_reason[4],
      which opens 'Sleep studies are mixed', carries 'In 14 women with chronic fatigue syndrome and 14
      controls, heart rate variability did not differ', which reads as a sleep result. Once it carries
      the Fukuda label it is a controlled study in a recognised case definition that found 'no group differences
      in CBFV or HRV' (cached abstract), like pmid:9505867, pmid:9430800 and pmid:34970156, which the
      card records as contradicts in level_reason[3]; its role context followed only from the unverified
      label. With 14 patients (17 recruited, 3 excluded for technical reasons, full text) it is below
      half of the 34 patients of pmid:38251045, so it does not change the contested mark.
    fix: Set the role of pmid:29855991 to contradicts and move its sentence out of the sleep paragraph
      into level_reason[3] (other studies that did not find lower heart rate variability), saying it was
      measured at rest while awake; leave the contested mark unchanged.
    targets:
    - studies[pmid:29855991].role
    - level_reason[4]
    - level_reason[3]
rounds:
- round: 1
  operations:
  - op: update_study
    id: pmid:29855991
    set:
      case_definition: Fukuda
      case_definition_source: fulltext
      case_definition_quote: CFS participants met Centers for Disease Control criteria for chronic fatigue
        syndrome (Fukuda et al. 1994)
      role: contradicts
      finding: A study of n=14 women with chronic fatigue syndrome and 14 healthy controls found no group
        difference in heart rate variability recorded awake while resting supine; within patients, total
        heart rate variability power was associated with less fatigue only after removal of one outlier
        (r = -.70, p = .02), and not with the outlier included (r = -.32, p = .32), while low-, high-
        and very-high-frequency power were not significantly associated with fatigue.
  - op: update_study
    id: pmid:31957647
    set:
      case_definition: Fukuda
      case_definition_source: fulltext
      case_definition_quote: Twenty-four participants fulfilling international diagnostic criteria for
        CFS1 were recruited after clinician assessment at an academic tertiary referral clinic
  - op: replace_paragraph
    field: level_reason
    index: 3
    text: Other studies did not find lower heart rate variability. A Belgian study of 38 patients meeting
      the 1988 CDC (Holmes) definition and 38 healthy controls found a consistently higher heart rate
      but no major changes in RR-interval variability; a US study of 19 patients meeting CDC criteria
      and 11 controls found similar heart rate variability lying down and on tilt. In 14 women meeting
      the CDC (Fukuda 1994) criteria and 14 healthy controls, heart rate variability recorded awake while
      resting supine did not differ. In 16 patients and 10 controls who did exercise tests on two days,
      resting heart rate variability did not differ, while heart rate fell less in the first minute after
      maximal exercise in patients.
    sources:
    - pmid:9505867
    - pmid:9430800
    - pmid:29855991
    - pmid:34970156
  - op: replace_paragraph
    field: level_reason
    index: 4
    text: Sleep studies are mixed. Eight patients meeting the 2015 IOM criteria had a higher low-frequency
      measure in all sleep stages and a lower high-frequency measure in deep sleep than eight tired controls,
      but a higher high-frequency measure overall and a lower heart rate. In 24 patients and 24 controls
      the high-frequency measure was lower in deeper sleep but not during wakefulness before sleep; the
      patients fulfilled international diagnostic criteria for CFS, cited to the 1994 Fukuda definition.
      These two groups, in Finland and Australia, thus both found a lower high-frequency measure in deep
      sleep.
    sources:
    - pmid:29246267
    - pmid:31957647
  - op: set_link_text
    to: symptom:sleep-disturbance
    text: One study of 24 patients and 24 controls found that lower parasympathetic heart rate variability
      during deeper sleep was associated with poorer self-reported sleep quality in the same people; its
      patients fulfilled international diagnostic criteria for CFS, cited to the 1994 Fukuda definition.
      A second study, of 45 patients meeting the Fukuda definition and 25 controls, found that lower daytime
      resting heart rate variability correlated with poorer self-reported sleep, in an analysis of patients
      and controls together.
  checks:
    passed: true
    errors: []
  review:
    verdict: reject
    findings:
    - class: wording
      target: level_reason[3]
      operation: 2
      severity: must_fix
      problem: 'Operation 2 (answers findings 2 and 4) adds ''heart rate variability recorded awake while
        resting supine did not differ'' for pmid:29855991. The cached full text (PMC6274602, Methods,
        HRV analysis) says only that subjects ''were connected to an electrocardiogram (ECG) measuring
        system while resting supine'' and ''Throughout the quiet resting period, ECG signals were collected'';
        it never says the participants were awake. ''Awake'' is a fact the record does not state, which
        a correction may not add. The rest of the operation is supported: 14 CFS and 14 healthy control
        women after 3 per group were excluded, CDC (Fukuda 1994) criteria, no group difference in HRV
        (abstract and Discussion), the Belgian, US and exercise sentences unchanged.'
      fix: 'Remove the word ''awake'': ''heart rate variability recorded while resting supine did not
        differ''.'
      targets:
      - level_reason[3]
    - class: wording
      target: studies[pmid:29855991].finding
      operation: 0
      severity: must_fix
      problem: 'Operation 0 (answers findings 0, 3 and 4) sets the finding to ''no group difference in
        heart rate variability recorded awake while resting supine''. As above, the cached full text states
        ''while resting supine'' and ''quiet resting period'' but not that participants were awake. The
        other parts of the operation are confirmed against the cached full text: the Fukuda quote is verbatim
        from Methods, Participants; ''r = -.70, p = .02'' after removal of one outlier, ''with outlier,
        r = -.32, p = .32'' (Fig. 2 legend), and LF, HF and VHF not significantly correlated with fatigue;
        role contradicts follows from a controlled, Fukuda, no-difference result like pmid:9430800 and
        pmid:34970156, and at 14 patients it is below half of 34 (pmid:38251045), so the contested mark
        is rightly unchanged.'
      fix: 'Remove the word ''awake'': ''no group difference in heart rate variability recorded while
        resting supine''.'
      targets:
      - studies[pmid:29855991].finding
    - class: decisive
      operation: 1
      severity: advisory
      problem: 'Operation 1 (answers finding 1) correctly labels pmid:31957647 Fukuda: the quote is in
        the cached full text and reference 1 in data/cache/europepmc/PMC7053003.html is Fukuda K et al.
        1994, as for pmid:23166694. With the label verified, its role stays context although it found
        the high-frequency measure not lower ''during wakefulness before sleep'' in 24 vs 24 (above half
        of 45), and the card header said a Fukuda label would make it of comparable quality for the wake
        measure. The contested mark is already on rung 3, so the mark itself does not change, but the
        role was not re-examined. This target is not named by any step 1 finding, so the correction cannot
        change it; noted for the auditors and the founder.'
      fix: 'In a later round, decide whether pmid:31957647 stays context (mixed: lower in deep sleep,
        not in pre-sleep wake) or is recorded as contradicting the resting-wake finding.'
      targets:
      - studies[pmid:31957647].role
    - class: decisive
      operation: 4
      severity: advisory
      problem: Operation 4 (answers finding 1) replaces 'its case definition is not yet verified' with
        'its patients fulfilled international diagnostic criteria for CFS, cited to the 1994 Fukuda definition',
        which the cached full text and its reference 1 support. The link stays at proposed; the card's
        own comment gives the unverified definition as the reason pmid:31957647 allowed step 1 only. Leaving
        the step lower is safe and a correction cannot raise it.
      fix: In a later link round, check whether pmid:31957647 (both ends measured in the same Fukuda patients)
        now supports step associated.
      targets:
      - links[0]
    - class: decisive
      severity: advisory
      problem: 'The study-block comments now contradict the corrected fields: pmid:31957647 ''"medically
        diagnosed CFS" (abstract); PMC7053003 exists but Europe PMC returned no open full text. TODO:
        verify.'' and pmid:29855991 ''The abstract names no case definition; PMC6274602 exists but Europe
        PMC returned no open full text. TODO: verify.'' Comments are not content, but they mislead the
        next reader of the file; the header lines on unverified definitions are stale as well.'
      fix: Remove the two study-block comments with remove_comment.
      targets:
      - studies[pmid:29855991]
      - studies[pmid:31957647]
