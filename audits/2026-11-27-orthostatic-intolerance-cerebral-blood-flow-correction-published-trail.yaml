        which included some subjects from a prior investigation (40).
      direction: mixed
      finding: A study of n=25 patients meeting the Fukuda definition, all of whom had POTS, and 20 controls
        found that absolute mean blood flow velocity in the brain was slightly lower in patients at each
        tilt angle, but that the changes in blood flow velocity with tilt did not differ between the groups;
        patients had no rise in blood flow velocity with mental tasks, and memory-task performance worsened
        as the tilt angle increased.
  - op: update_study
