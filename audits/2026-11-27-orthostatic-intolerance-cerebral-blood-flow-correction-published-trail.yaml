review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'The card records pmid:22180650 as case_definition unverified with no source and no quote.
      The cached full text (data/cache/europepmc/PMC3311460.html, Methods, Subjects) states: "We enrolled
      25 subjects diagnosed with CFS using the Fukuda criteria (22), which included some subjects from
      a prior investigation (40)." Reference 22 is Fukuda et al., Ann Intern Med 1994. The same paragraph
      states: "All CFS subjects were found to have POTS during a 70° head-up tilt table test performed
      on another day."'
    fix: Set case_definition to Fukuda, case_definition_source to fulltext and case_definition_quote to
      the sentence above. The card must then flag the cohort as Fukuda (does not require post-exertional
      malaise) and say that every patient had POTS.
    targets:
    - studies[pmid:22180650].case_definition
    - studies[pmid:22180650].case_definition_source
    - studies[pmid:22180650].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'The card records pmid:25277740 as case_definition unverified with no quote. The cached full
      text (data/cache/europepmc/PMC4233252.html, Study design and methodology) states: "CFS subjects
      were between 15 and 29 yr old and fulfilled CDC criteria for CFS (16)." Reference 16 is Fukuda et
      al., Ann Intern Med 1994, and the next sentence lists the Fukuda criteria (fatigue of new or definite
      onset with four or more of the listed symptoms for 6 consecutive months). The same paragraph says
      patients were recruited for "reported neurocognitive impairment and hyperventilation/hypocapnea
      (n = 15) likely due to their POTS".'
    fix: Set case_definition to Fukuda, since the sentence cites the 1994 Fukuda paper and lists its criteria;
      CDC_unspecified is the minimum the quote supports, and both rank equal. Set case_definition_source
      to fulltext and case_definition_quote to the sentence above. Record that patients were selected
      for hyperventilation/hypocapnia and were 15 to 29 years old.
    targets:
    - studies[pmid:25277740].case_definition
    - studies[pmid:25277740].case_definition_source
    - studies[pmid:25277740].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'level_reason[5] says "Two studies from New York Medical College found lower blood flow velocity
      in the brain on tilt". That reads as a larger fall on tilt in both studies. For pmid:22180650 the
      cached full text says the opposite of a larger fall: "CFS/POTS patients had significantly decreased
      CBFV by repeated-measures ANOVA. There were, however, no differences in changes of CBFV at any angle."
      The abstract says absolute mean CBFV was "slightly less than in control subjects in CFS subject
      at each angle", and the angles include 0° (supine). The study''s finding text and its direction
      `lower` leave out that the change with tilt did not differ. For a card whose claim is a larger fall
      on standing, that changes how a reader reads the study.'
    fix: In the finding of pmid:22180650 and in level_reason[5], state that absolute blood flow velocity
      was slightly lower in patients at every angle, supine included, and that the change in blood flow
      velocity with tilt did not differ between groups (quote above). Reconsider the direction field.
      Only pmid:25277740 reports a larger fall on tilt.
    targets:
    - level_reason[5]
    - studies[pmid:22180650].finding
    - studies[pmid:22180650].direction
  - class: decisive
    severity: must_fix
    problem: 'level_reason[0] ("No independent group has yet repeated this finding") and level_reason[5]
      ("no independent group with a verified case definition has repeated the fall in blood flow to the
      brain ... The case definitions of all four are not yet verified, so none of them can support or
      contradict the card") rest on the two New York Medical College studies having unverified case definitions.
      Both now have Fukuda in their full texts (findings above). pmid:25277740 is a controlled study:
      15 Fukuda patients and 11 controls. It shares no author with pmid:32140630 (section 5 lists no such
      pair). Its abstract states "HUT caused CBFv to decrease 8.7% in control subjects but fell 22.5%
      in CFS." So as written, the reason for not reaching level 3 no longer follows from the records.
      Against counting it as a repeat: it is small (n=15), its patients were selected for hyperventilation/hypocapnia
      and POTS, and it measured blood flow velocity by transcranial Doppler, not blood flow by neck-artery
      ultrasound. pmid:22180650 comes from the same laboratory: Fukuda, 25 patients (all with POTS), 20
      controls. It found no difference in the change of blood flow velocity with tilt. It has a control
      group, the same case definition and more than half the patients of pmid:25277740. So if pmid:25277740
      were counted towards level 3, pmid:22180650 would meet the rubric''s test for a contradiction of
      comparable quality. Neither study reaches half of pmid:32140630''s 429 patients, so neither contests
      level 2.'
    fix: Rewrite level_reason[0] and level_reason[5] from the records. Name pmid:25277740 (Fukuda, 15
      patients selected for hypocapnia and POTS, 11 controls, a fall of 22.5% against 8.7% in blood flow
      velocity) as a possible independent repeat, with its limits. Name pmid:22180650 (Fukuda, 25 patients
      with POTS, 20 controls, no difference in the change with tilt) as the same laboratory's contrary
      result. Keep the statement that the other two studies (pmid:12006954, pmid:12593133) have unverified
      case definitions. On this evidence level 2 is supported. A rise to level 3 would rest on one 15-patient
      selected cohort that a comparable study from the same laboratory does not repeat, and would then
      need a contested mark. The auditor decides the level and the mark.
    targets:
    - level_reason[0]
    - level_reason[5]
    - level
    - contested
  - class: decisive
    severity: must_fix
    problem: level_reason[7] says of the phenylephrine study pmid:25277740 "its case definition is not
      yet verified. Neither can count towards level 4." The case definition is now verified (Fukuda, finding
      above), so for this study the sentence gives a reason the record does not support. The cached full
      text describes phenylephrine against an untreated tilt in the same 15 patients. In the cached text
      I found no randomisation, placebo or blinding of the treatment; the only use of 'random' is for
      the letter sequence of the n-back task. The outcome is n-back response time, not symptoms.
    fix: 'Remove ''its case definition is not yet verified'' for pmid:25277740. State from the record
      why it does not count towards level 4, or let the auditor judge it: an uncontrolled, unrandomised
      within-patient comparison in 15 patients selected for hypocapnia, with a working-memory task as
      the outcome. The level decision stays with the auditor.'
    targets:
    - level_reason[7]
    - level
rounds:
