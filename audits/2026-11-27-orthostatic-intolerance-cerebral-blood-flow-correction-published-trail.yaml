      case_definition: CDC_unspecified
      case_definition_source: fulltext
      case_definition_quote: CFS subjects were between 15 and 29 yr old and fulfilled CDC criteria for
        CFS (16).
  - op: replace_paragraph
    field: level_reason
    index: 0
    text: A controlled study from a Dutch clinic (Stichting CardioZorg) measured blood flow to the brain
      with ultrasound of the neck arteries during a 30-minute head-up tilt in 429 patients and 44 healthy
      controls. All patients met the Fukuda definition, which does not require post-exertional malaise,
      and 70% also met the International Consensus Criteria. At the end of the tilt, blood flow to the
      brain had fallen by 26% in patients and 7% in controls; the fall was larger than in controls in
      patients with POTS, with delayed orthostatic hypotension and with a normal heart rate and blood
      pressure response. At mid-tilt, patients who reported more orthostatic symptoms had a larger fall.
      The card is at level 2 because of this study. One small study from New York Medical College (15
      patients, 11 controls) found a larger fall in blood flow velocity on tilt, measured by transcranial
      Doppler, but it is a selected cohort and a study from the same laboratory did not find the same
      difference; the card does not count it as a repeat (see below). The finding with the neck-artery
      method is unreplicated.
    sources:
    - pmid:32140630
    - pmid:25277740
    - pmid:22180650
  - op: replace_paragraph
    field: level_reason
    index: 5
    text: 'The card does not reach level 3. A study from New York Medical College of 15 patients meeting
      the CDC criteria and 11 controls found that blood flow velocity in the brain fell 22.5% on tilt
      in patients and 8.7% in controls. Its patients were aged 15 to 29 and were recruited for reported
      neurocognitive impairment and hyperventilation or hypocapnia likely due to POTS, and it measured
      blood flow velocity by transcranial Doppler, not blood flow by neck-artery ultrasound. A study from
      the same laboratory, of 25 patients meeting the Fukuda definition, all with POTS, and 20 controls,
      found absolute mean blood flow velocity slightly lower in patients at each tilt angle but no difference
      between the groups in the changes of blood flow velocity at any angle. The card therefore does not
      count the first study as a replication, and it is unreplicated. Two further studies have case definitions
      that are not yet verified, so neither can support or contradict the card: a study from Osaka Medical
      College of 28 young patients and 20 controls found slower recovery of brain oxygen on standing,
      and a study from Johns Hopkins Medical Institutions of 26 patients and 23 controls found no difference
      in blood flow velocity at any of the measured time points (supine, 1 and 5 minutes after tilt, 5
      and 1 minutes before the end, and at termination).'
    sources:
    - pmid:25277740
    - pmid:22180650
    - pmid:12006954
    - pmid:12593133
  - op: replace_paragraph
    field: level_reason
    index: 7
    text: Two small studies changed blood flow to the brain directly. In a randomised crossover study
      of 16 patients from the Dutch clinic, compression stockings reduced the fall in blood flow to the
      brain during tilt (14% with stockings, 25% without); symptoms were not an outcome and the paper
      does not name the case definition. In the New York Medical College study of 15 patients meeting
      the CDC criteria, who were recruited for neurocognitive impairment and hyperventilation or hypocapnia,
      phenylephrine, which raises blood pressure, reduced the fall in blood flow velocity on tilt (8.1%
      against 22.5% untreated) and the slowing on a working-memory task. The comparison was with an untreated
      tilt in the same patients, the paper describes no placebo group, and the outcome was a working-memory
      task rather than symptoms. Neither can count towards level 4.
    sources:
    - pmid:35056360
    - pmid:25277740
