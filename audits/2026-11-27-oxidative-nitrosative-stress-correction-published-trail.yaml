      - pmid:43027675
      - pmid:19422646
      - pmid:16085177
    - text: 'Malondialdehyde results conflict. An earlier study from the same Novi Sad clinic, of 40 women
        meeting the Fukuda definition and 40 healthy women, found no overall difference between the groups;
        the authors report a difference only after dividing patients by malondialdehyde level, and title
        the paper as showing elevated lipid peroxidation. It is larger than the 24-patient study that
        found higher levels and uses the same definition, so it contradicts that study at comparable quality,
        and the level 3 rung that rests on it is marked contested. Set against the 125-patient study,
        which used the IOM 2015 criteria, the 40-patient study used a different definition and had fewer
        patients. The two Novi Sad studies share authors, and the overlap between their patients is not
        stated. They may also have used different methods: the 24-patient study used an ELISA test for
        malondialdehyde bound to proteins (OxiSelect MDA Adduct ELISA), and the abstract of the earlier
        study does not give its method.'
      sources:
      - pmid:21119582
      - pmid:23185200
      - pmid:43027675
    - text: Measures of antioxidant defences are mixed. In studies with a recognised definition, antioxidant
        potential in serum was lower in the Osaka study; glutathione in lymphocytes was higher in both
        sexes in the Stanford study (in men, in two of the three cell types tested); glutathione in the
        brain cortex was lower in 15 patients than in 13 healthy volunteers in the Shungu study, whose
        patients were diagnosed using modified US CDC guidelines (the CDC criteria do not require post-exertional
        malaise; what was modified is not stated); and serum glutathione peroxidase 1 (GPX1) was higher
        in the 125-patient IOM 2015 study than in long COVID and in healthy controls. GPX1 is a different
