  review:
    verdict: reject
    findings:
    - class: decisive
      operation: 3
      severity: must_fix
      problem: 'Answers findings 6 and 8. The new level_reason[2] opens ''The card does not reach level
        3'' and then shows that the rubric''s level-3 test is met for malondialdehyde. The Sofia study
        (pmid:43027675, IOM 2015, 125 v 80, serum MDA higher after age/BMI/sex adjustment) shares no author
        with pmid:23185200 (Fukuda, 24 v 19, MDA higher), so the finding was reproduced by an independent
        group in a separate cohort (''An independent group has reproduced the finding in a separate cohort'').
        The two reasons the paragraph gives for holding the level do not come from the rubric. (a) ''Whether
        the two measured MDA the same way is not shown'' is a same-assay requirement the ladder does not
        contain (''editors do not add criteria''). The two studies did use different assays: the OxiSelect
        MDA adduct ELISA versus a serum ELISA whose kit is not named in the Sofia full text. That is a
        fact the card should state, but on its own it is not a reason for the level. (b) ''The MDA results
        also conflict'' points, under the rubric, to a contested mark (''A rung that rests on more than
        one study ... is contested when a study of comparable quality contradicts any study the rung needs''),
        not to an unreached rung. The correction''s own level_reason[3] says pmid:21119582 ''contradicts
        that study at comparable quality''. Yet the card keeps contested null and says ''The card''s level
        does not rest on the malondialdehyde finding'', which is circular once the MDA finding would carry
        rung 3. On the records, the evidence supports level 3 on MDA (pmid:23185200 plus pmid:43027675),
        contested by pmid:21119582 (Fukuda, 40 v 40, controlled, 40 is at least half of 24, no overall
        difference). The auditor decides; this correction may propose a raise (section 3).'
      fix: Either add a propose on level (3) and on contested, with reason paragraphs that cite pmid:23185200,
        pmid:43027675 and pmid:21119582 and keep the assay difference as a stated limit, or give a reason
        for staying at level 2 that comes from the published ladder. Drop the assay sentence as a reason
        for the level (it may stay as a limit), and drop 'The card's level does not rest on the malondialdehyde
        finding' unless it is true under the chosen level.
      targets:
      - level_reason[2]
      - level_reason[3]
      - level
      - contested
    - class: decisive
      operation: 6
      severity: must_fix
      problem: 'Answers finding 5. The new level_reason[5] gives two reasons for ''The card does not reach
        level 4'': ''It is a single trial and has not been repeated'', and ''The card has not reached
        level 3, which level 4 builds on''. Level 4 in the ladder (''Changing the proposed factor changes
        the outcome in a controlled experiment'') does not require repetition, so the first is not a rubric
        reason. The second depends on level 3, which the records now appear to support (previous finding).
        On the records, pmid:25386668 (Fukuda, 39 v 34, placebo-controlled) lowered lipid peroxidation
        (TBARS in blood mononuclear cells) and the FIS total score against placebo. pmid:34444817 (Fukuda,
        placebo-controlled, 72 per group analysed, at least half of 39) reports ''FIS-40 domain scores
        evolved in parallel between groups'' for the same combination. That is a contradiction of comparable
        quality on the outcome, which bears on a contested mark. The spec also says a treatment result
        does not on its own confirm the cause. The paragraph does not state these rubric points, so the
        level-4 reason a reader sees does not follow from the rubric.'
      fix: State the level-4 reason from the ladder. If level 3 is proposed, say whether pmid:25386668
        meets the level-4 description and that pmid:34444817 contradicts its fatigue result at comparable
        quality (same definition, placebo arm, at least half the sample). Then propose the level and contested
        mark that follows, for the auditor. Keep 'not repeated' as a description, not as the level reason.
      targets:
