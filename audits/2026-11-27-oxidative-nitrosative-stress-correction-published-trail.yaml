      sources:
      - pmid:27224647
      - pmid:40627396
      - pmid:22281935
      - pmid:43027675
      - pmid:20010505
      - pmid:21552194
      - pmid:19906518
    - text: Level 4 is not proposed. A placebo-controlled trial of coenzyme Q10 plus NADH in 73 women
        meeting the Fukuda 1994 criteria (39 treated, 34 given placebo) reported lower lipid peroxidation
        in blood mononuclear cells than with placebo after eight weeks, and a lower fatigue impact scale
        total score than with placebo (both p<0.05). It is the only such trial and has not been repeated.
        A larger placebo-controlled trial of the same combination from the same Vall d'Hebron research
        institute, in 207 women meeting the Fukuda definition (144 completed), did not measure oxidative
        stress and reported that fatigue scores changed in parallel in the two groups. It has the same
        definition, a placebo arm and more than half the sample, so on the fatigue outcome it contradicts
        the first trial at comparable quality. The supplement combines two compounds, so a treatment result
