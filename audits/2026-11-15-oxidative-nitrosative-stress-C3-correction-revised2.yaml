- op: replace_paragraph
  field: level_reason
  index: 0
  text: A study from Dundee, Scotland, with 47 patients meeting the CDC criteria (version not named) and
    34 healthy volunteers enrolled (the number measured is not stated) found higher blood levels of isoprostanes,
    a marker of oxidative damage to fats, in patients, both in those with and in those without cardiovascular
    risk factors. A study of 56 patients meeting the CDC criteria (version not named) and 37 healthy controls,
    outpatients of the Maes Clinics in Antwerp, Belgium, found higher plasma peroxides in patients. Neither
    version of the CDC criteria requires post-exertional malaise. The card is at level 2 because of these
    two controlled studies, which used different measures.
  sources:
  - pmid:16085177
  - pmid:21455120
- op: replace_paragraph
  field: level_reason
  index: 1
  text: 'Other controlled studies found higher oxidative-stress markers, each on a different measure:
    malondialdehyde and protein carbonyls in 24 women meeting the 1994 CDC definition against 19 healthy
    women in Novi Sad, Serbia; reactive oxygen metabolites in a study from Osaka of patients diagnosed
    by the Fukuda 1994 criteria, whose abstract does not give the numbers; and reactive oxygen species
    inside lymphocytes in 15 patients against 16 controls at Stanford, where the difference was found
    in women but not in men. The Stanford patients were diagnosed using the National Academy of Medicine,
    Fukuda and Canadian Consensus criteria; which definition each patient met is not stated. Because the
    measures differ, none of these is a repeat of another, and each is unreplicated.'
  sources:
  - pmid:23185200
  - pmid:27224647
  - pmid:40627396
- op: replace_paragraph
  field: level_reason
  index: 5
  text: 'The card does not reach level 4: no controlled trial in patients with a confirmed recognised
    case definition has lowered an oxidative-stress measure and improved the illness. A placebo-controlled
    trial of coenzyme Q10 plus NADH in 73 patients reported less fatigue than with placebo and lower lipid
    peroxides in blood cells of the treated group (the abstract does not say whether against placebo or
    against baseline), but its case definition is not yet verified. A larger placebo-controlled trial
    of the same combination from the same unit, in 207 women meeting the Fukuda definition, did not measure
    oxidative stress and reported that fatigue scores changed in parallel in the two groups. A crossover
    trial of NADH alone in 26 patients meeting the CDC criteria reports no oxidative-stress measure in
    its abstract.'
  sources:
  - pmid:25386668
  - pmid:34444817
  - pmid:10071523
