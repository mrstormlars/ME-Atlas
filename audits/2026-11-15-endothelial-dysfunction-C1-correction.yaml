    problem: 'links[0] (to orthostatic-intolerance-cerebral-blood-flow, source pmid:41516145) says "endothelial
      dysfunction, driven by oxidative and nitrosative stress and by autoantibody-mediated receptor interference,
      may explain orthostatic intolerance". The cached abstract says: "Endothelial dysfunction driven
      by oxidative and nitrosative stress, along with autoantibody-mediated receptor interference, may
