  - op: replace_paragraph
    field: level_reason
    index: 5
    text: 'Several studies cannot count towards the level because their case definition is not yet verified.
      They point in different directions: higher kynurenine with lower downstream products; a lower ratio
      of kynurenic acid to quinolinic acid in 49 patients compared with 54 controls; higher free tryptophan
      in 23 patients compared with 42 controls; and lower free tryptophan in patients in a study at the
      University of Oxford (case definition not stated in the abstract). A study from New Jersey of 33
      patients meeting the 1994 (Fukuda) definition, which does not require post-exertional malaise, and
      16 healthy controls found no difference in plasma tryptophan or kynurenine. Its definition ranks
      below the Canadian criteria of the studies the level rests on, and it did not report the ratio of
      kynurenic acid to kynurenine, so it does not contest rung 3.'
