operations:
- op: replace_paragraph
  field: level_reason
  index: 0
  text: A study from Riga, Latvia, of 200 patients meeting the Fukuda definition, which does not require
    post-exertional malaise, and 150 healthy controls looked for viral DNA in cell-free blood plasma,
    which the authors use as a marker of active infection. Active double HHV-6 and HHV-7 infection was
    found only in patients (p < 0.0001); the text of the paper gives no counts for it (a figure shows
    frequencies). Markers of active HHV-6, HHV-7 or parvovirus B19 (not a herpesvirus) infection together
    were found in 45% of patients and 8.7% of controls. The card is at level 2 because of the herpesvirus-only
    result of this study. No independent group has repeated it, so it is unreplicated.
  sources:
  - pmid:36653846
- op: add_sentence
  target: level_reason[3]
  text: 'The same study screened plasma by droplet digital PCR for potential active (lytic) replication
    of nine herpesviruses: herpesvirus DNA was rarely detected, with HSV-2, HHV-6A and HHV-6B in plasma
    from one or two subjects and the remaining herpesviruses always negative, and antibodies had earlier
    been measured in plasma from 132 people with ME/CFS, 76 healthy controls and 27 people with multiple
    sclerosis.'
  sources:
  - pmid:34422848
  answers:
    record: 2026-11-13-herpesvirus-reactivation.yaml
    part: 2
- op: replace_paragraph
  field: level_reason
  index: 5
  text: 'A third randomised trial, of valacyclovir in a subset of patients with Epstein-Barr virus markers,
    reported a larger rise in an activity score with valacyclovir than with placebo; its abstract gives
    no sample size or statistical test. A study of 192 patients the authors classed as having reactivated
    HHV-6 or HHV-7 infection by PCR of blood white cells, given valaciclovir, valganciclovir or artesunate,
    compared with 63 untreated patients: its abstract reports how often the viruses became undetectable
    by PCR of blood white cells, not whether symptoms changed, and does not state how patients were allocated.'
  sources:
  - pmid:18019402
  - pmid:35102619
- op: replace_paragraph
  field: level_reason
  index: 7
  text: Some studies whose case definitions are not yet verified found no difference. One of 26 patients
    and 50 matched controls in Atlanta (52 recruited) isolated no HHV-6 or HHV-7 from anyone's blood cells
    and found no difference in HHV-6 or HHV-7 DNA in blood cells. A multicentre search for viral genetic
    material in blood, stool and saliva found no consistent differences between patients and controls
    other than fewer anelloviruses (a family of viruses that are not herpesviruses) in patients.
  sources:
  - pmid:10913395
  - pmid:37526404
