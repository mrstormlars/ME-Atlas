  findings:
  - operation: null
    severity: must_fix
    problem: 'level_reason[3] says only that the London study ''does not repeat the finding of active
      infection in blood'', and studies[pmid:34422848].finding describes only the saliva results. The
      cached full text (PMC8378328) reports a plasma screen that points the other way on the marker level
      2 rests on. Serum/plasma samples (189) from UK ME/CFS Biobank participants, chosen for high IgG
      titres or seropositivity to at least five of six HHVs, ''were screened by ddPCR to detect potential
      active (lytic) replication of any of the nine HHVs. HHV DNA was rarely detected, with HSV-2, HHV-6A
      and HHV-6B detected in plasma from one or two subjects and the remaining HHVs always negative (Table
      1)''. Table 1 gives HHV-7 plasma positive 0 (negative 182), HHV-6A plasma positive 1 (HC), HHV-6B
      plasma positive 2 (HC), so no ME/CFS plasma sample had HHV-6 or HHV-7 DNA. The Riga study (pmid:36653846)
      found active (plasma) HHV-6A/B, HHV-7 or B19V infection in 45% (90/200) of patients and active double
      HHV-6A/B + HHV-7 infection only in patients. The London study meets two of the three comparable-quality
      conditions (Canadian Consensus and/or CDC-1994, which is the same as or stricter than Fukuda, and
      healthy controls). The third condition, at least half of the 200 patients, cannot be settled from
      the record. The screen drew on serology from 132 people with ME/CFS, 76 HC and 27 people with MS,
      and the record does not say how many of the 189 screened samples were from ME/CFS patients. By subtraction
      the number is between 86 (if every HC and MS sample was screened) and 132, which spans the threshold
      of 100. The card neither states the plasma result nor weighs it, and contested: null is given without
      its reason.'
    fix: 'In level_reason[3] (and the study''s finding), state the plasma result from the record: 189
      samples, selected by antibody titre, were screened by ddPCR for active replication; HHV-7 DNA was
      found in no plasma sample, and HHV-6A or HHV-6B DNA only in plasma from one or two healthy controls
      (Table 1). Add that the record does not give the number of ME/CFS patients among the 189 samples
      (at most 132), so whether this measurement reaches half of the 200 Riga patients cannot be read
      from the record. Note that the methods differ (ddPCR vs nested PCR; samples selected by serology).
      Leave the contested mark to the auditor, but give the card the facts it needs for that decision.
      Quote numbers only from the record.'
    class: decisive
    targets:
    - contested
    - level_reason[3]
    - studies[pmid:34422848].finding
