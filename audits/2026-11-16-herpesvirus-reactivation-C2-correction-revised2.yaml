review:
  verdict: accept
  findings:
  - operation: 7
    severity: advisory
    problem: 'Op 7 (remove_link to symptom:post-exertional-neuroimmune-exhaustion) answers finding 2 of
      the whole-card review (links[1]): the link attributed to the 30-patient London study a null PEM
      correlation that the cached full text of pmid:34422848 does not state. A correction cannot rewrite
      a link, so removing it is the only allowed answer, and it weakens the card. No sentence elsewhere
      on the card relies on the link. badge_reasons.explains_pem rests on pmid:22927850 directly, and
      the badge stays false. The removal also drops the Riga part of the link. That part was supported
      (pmid:22927850: ''Definite relationship was observed between active betaherpesvirus infection and
      subfebrility, lymphadenopathy and malaise after exertion''), and audits 2026-11-13 part 9 and -second
      part 8 accepted it at step associated.'
    fix: No change needed within the correction limits. A later map round may propose the link again with
      only the Riga data, or with the London subgroup results worded as the full text gives them.
  - operation: 6
    severity: advisory
    problem: 'Op 6 answers finding 1 of the whole-card review (studies[pmid:22927850].group). ''Krumina
      A and Murovska M are authors of both'' matches the author facts in context section 8: pmid:36653846
      and pmid:22927850 share 2 exact authors, Krumina A and Murovska M. Op 8 answers finding 3 of that
      review (subgroups[0]). The acyclovir abstract (pmid:2849717) describes patients with ''persisting
      antibodies to Epstein-Barr virus early antigens ... or undetectable levels of antibodies to Epstein-Barr
      virus nuclear antigens'', and the valganciclovir abstract (pmid:23959519) enrolled patients ''with
      elevated IgG antibody titers against HHV-6 and EBV''. The narrowed sentence only restricts an existing
      claim to these two trials. Neither op adds a fact.'
    fix: No change needed.
  - operation: 1
    severity: advisory
    problem: Op 1 (add_sentence answering audit 2026-11-13 part 2) is unchanged from the accepted revised
      attempt. It stays within part 2's quotes and cites only pmid:34422848. As in the earlier review,
      it puts the plasma screen next to the serology counts (132 ME/CFS, 76 HC, 27 MS) without saying
      that the record does not give how many ME/CFS samples were screened, so a reader might take 132
      as the screened patient count. The quotes do not allow adding that limit.
    fix: No change within the correction limits. The auditor should weigh this sentence together with
      audit part 2's statement that the number of ME/CFS samples in the screen is not in the record.
  - operation: 4
    severity: advisory
    problem: Op 4 is unchanged from the accepted revised attempt. It writes out the other layer reading
      in level_reason[7] by restating the quote of pmid:34422848 ('might be a cause or consequence of
      dysregulated immune function seen in ME/CFS'). It sits at the end of a paragraph about studies that
      found no difference, and the card still has no link that expresses the other reading (a correction
      cannot add one). Ops 0, 2, 3 and 5 are also unchanged. They answer whole-card pre-review findings
      5, 4 and 3 and match the abstracts of pmid:35102619 and pmid:10913395 and the cached full text of
      pmid:36653846.
    fix: No change within the correction limits. Whether the layer rule is met is the auditor's decision.
