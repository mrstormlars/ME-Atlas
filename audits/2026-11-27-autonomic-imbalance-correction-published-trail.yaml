card: autonomic-imbalance
card_sha256: 03f3cf0099359b32e69e8b0c4cd0e70fd865a2bf003c70cdf19dd2796b6b20d7
origin: the full-text scan 2026-11-27 of 2026-11-27 (docs/plan-fulltext-recheck.md)
request:
- target: studies[pmid:29855991].case_definition
  problem: 'The full-text scan found that the full text states something the card lacks: The full text
    states the patients met the CDC (Fukuda 1994) criteria; the card has the case definition as unverified.
    Quote from the full text: CFS participants met Centers for Disease Control criteria for chronic fatigue
    syndrome (Fukuda et al. 1994)'
- target: studies[pmid:29855991].finding
  problem: 'The full-text scan found that the full text states something the card lacks: The within-patient
    association is with total HRV power only and holds after removal of one outlier; the card does not
    name the measure or the outlier removal. Quote from the full text: Among CFS participants, a significant
    negative association between fatigue ratings and total HRV power (TP) (r = −.70, p = .02) was detected
    (after removal of one outlier)'
- target: level_reason[4]
  problem: 'The full-text scan found that the full text states something the card lacks: The level reason
    says this study''s case definition is not yet verified; the full text names the CDC (Fukuda 1994)
    criteria. Quote from the full text: CFS participants met Centers for Disease Control criteria for
    chronic fatigue syndrome (Fukuda et al. 1994)'
- target: studies[pmid:31957647].case_definition
  problem: 'The full-text scan found that the full text states something the card lacks: The full text
    says patients met unnamed international diagnostic criteria for CFS after clinician assessment at
    a tertiary clinic; the card records none of this and no named definition appears. Quote from the full
    text: Twenty-four participants fulfilling international diagnostic criteria for CFS1 were recruited
    after clinician assessment at an academic tertiary referral clinic'
review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'Request item 1 is an error. The card records pmid:29855991 (Boissoneault et al. 2019) as
      case_definition ''unverified'' with no quote. Its cached full text (data/cache/europepmc/PMC6274602.html,
      Methods, Participants) states: ''CFS participants met Centers for Disease Control criteria for chronic
      fatigue syndrome ( Fukuda et al. 1994 )''. The study''s own text names the Fukuda 1994 definition.'
    fix: 'Set case_definition to Fukuda, case_definition_source to fulltext, and case_definition_quote
      to ''CFS participants met Centers for Disease Control criteria for chronic fatigue syndrome (Fukuda
      et al. 1994)''. Note that the full text recruited 17 patients and 17 controls, of whom 3 in each
      group were excluded for technical reasons, so the final sample of 14 and 14 on the card (abstract:
      ''28 women: 14 with CFS and 14 healthy controls'') stays correct.'
    targets:
    - studies[pmid:29855991].case_definition
    - studies[pmid:29855991].case_definition_source
    - studies[pmid:29855991].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'Request item 4 is an error, but not as the item puts it: the item says no named definition
      appears. The cached full text of pmid:31957647 (data/cache/europepmc/PMC7053003.html, Methods, Participants)
      says ''Twenty-four participants fulfilling international diagnostic criteria for CFS 1 were recruited
      after clinician assessment at an academic tertiary referral clinic'', and its reference 1 is ''Fukuda
      K, Straus SE, Hickie I, Sharpe MC, Dobbins JG, Komaroff A. The chronic fatigue syndrome: a comprehensive
      approach to its definition and study. ... Ann Intern Med. 1994''. So the study''s own text names
      Fukuda 1994 by citation. The card already records pmid:23166694 (same UNSW group) as Fukuda from
      the same form of sentence (''All patients had been diagnosed according to the international diagnostic
      criteria for CFS [1].''), so leaving 31957647 as ''unverified'' is inconsistent with the record.'
    fix: Set case_definition to Fukuda, case_definition_source to fulltext, and case_definition_quote
      to the sentence 'Twenty-four participants fulfilling international diagnostic criteria for CFS1
      were recruited after clinician assessment at an academic tertiary referral clinic', with reference
      1 being Fukuda et al. 1994 (as for pmid:23166694).
    targets:
    - studies[pmid:31957647].case_definition
    - studies[pmid:31957647].case_definition_source
    - studies[pmid:31957647].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: Request item 3 is an error. level_reason[4] ends 'The last two studies' case definitions
      are not yet verified.' The last two studies are pmid:31957647 and pmid:29855991; both full texts
      name Fukuda 1994 (see the two findings above), so the sentence is wrong once the labels are corrected
      and is wrong against the cached records now.
    fix: Remove the sentence, or replace it with one stating that both studies used the Fukuda definition,
      sourced to their full texts.
    targets:
    - level_reason[4]
  - class: decisive
    severity: must_fix
    problem: links[0] (to symptom:sleep-disturbance) says of the 24-patient study pmid:31957647 'its case
      definition is not yet verified'. Its full text names Fukuda 1994 by reference 1 (see the finding
      on that study). The link text states a case-definition status the cached record contradicts.
    fix: Replace 'its case definition is not yet verified' with a statement that its patients met the
      Fukuda definition, once the study's label is corrected.
    targets:
    - links[0]
  - class: decisive
    severity: must_fix
    problem: 'Request item 2 is an error (a missing limit). The finding says ''within patients, more heart
      rate variability power was associated with less fatigue''. The cached full text (PMC6274602.html,
      Results) shows the association holds for total HRV power only: ''a significant negative association
      between fatigue ratings and total HRV power (TP) (r = -.70, p = .02) was detected (after removal
      of one outlier)'', with no significant correlation for LF (r = -.34, p = .28), HF (r = -.16, p =
      .62) or VHF (r = -.35, p = .26); the Fig. 2 legend gives ''with outlier, r = -.32, p = .32''. A
      reader would read the card''s wording as a general HRV-fatigue association in 14 patients, when
      it is one measure that is significant only after one outlier is removed.'
    fix: 'Reword to: within patients, more total heart rate variability power was associated with less
      fatigue (r = -0.70) only after one outlier was removed (with it, r = -0.32, not significant); low-,
      high- and very-high-frequency power were not associated with fatigue. Source the numbers to the
      full text.'
    targets:
    - studies[pmid:29855991].finding
  - class: decisive
    severity: advisory
    problem: Once pmid:31957647 is recorded as Fukuda, it is a controlled Fukuda study of 24 patients
      whose full text reports 'No significant differences in autonomic or HRV parameters between groups
      were found for assessment during wakeful rest' (laboratory-based resting wakefulness, Table 1).
      Under the rubric's comparable-quality test (same or stricter definition, control group, at least
      half the patients) it may be comparable to the Spanish study level 3 needs (pmid:31906988, 45 Fukuda
      patients; half is 22.5), though not to the Russian CCC/IOM study. Rung 3 is already contested, so
      the mark itself needs no change, but the contested reason names only the Holmes study, and the card
      states only the 'wakefulness before sleep' result, not the laboratory resting-wake null.
    fix: Have the auditor weigh whether this resting-wake null belongs in the contested reason as a second
      contradicting study, quoted from the full text.
    targets:
    - contested_reason[0]
    - level_reason[4]
rounds:
- round: 1
  operations:
  - op: update_study
    id: pmid:29855991
    set:
      case_definition: Fukuda
      case_definition_source: fulltext
      case_definition_quote: CFS participants met Centers for Disease Control criteria for chronic fatigue
        syndrome (Fukuda et al. 1994)
      finding: A study of n=14 women with chronic fatigue syndrome and 14 healthy controls found no group
        difference in heart rate variability; within patients, more total heart rate variability power
        was associated with less fatigue (r = -.70) only after one outlier was removed (with it, r = -.32,
        not significant), and low-, high- and very-high-frequency power were not associated with fatigue.
  - op: update_study
    id: pmid:31957647
    set:
      case_definition: Fukuda
      case_definition_source: fulltext
      case_definition_quote: Twenty-four participants fulfilling international diagnostic criteria for
        CFS1 were recruited after clinician assessment at an academic tertiary referral clinic
  - op: replace_paragraph
    field: level_reason
    index: 4
    text: Sleep studies are mixed. Eight patients meeting the 2015 IOM criteria had a higher low-frequency
      measure in all sleep stages and a lower high-frequency measure in deep sleep than eight tired controls,
      but a higher high-frequency measure overall and a lower heart rate. In 24 patients and 24 controls
      the high-frequency measure was lower in deeper sleep but not during wakefulness before sleep, and
      the full text reports no significant differences in autonomic or heart rate variability measures
      between groups during laboratory-based resting wakefulness. These two groups, in Finland and Australia,
      thus both found a lower high-frequency measure in deep sleep. In 14 women with chronic fatigue syndrome
      and 14 controls, heart rate variability did not differ. The patients in the last two studies met
      the Fukuda definition, according to their full texts.
    sources:
    - pmid:29246267
    - pmid:31957647
    - pmid:29855991
  - op: set_link_text
    to: symptom:sleep-disturbance
    text: One study of 24 patients and 24 controls, whose patients met the Fukuda definition, found that
      lower parasympathetic heart rate variability during deeper sleep was associated with poorer self-reported
      sleep quality in the same people. A second study, of 45 patients meeting the Fukuda definition and
      25 controls, found that lower daytime resting heart rate variability correlated with poorer self-reported
      sleep, in an analysis of patients and controls together.
  checks:
    passed: true
    errors: []
  review:
    verdict: accept
    findings:
    - class: decisive
      operation: 2
      severity: advisory
      problem: Operation 2 (answering findings 2 and, in part, advisory finding 5) adds to level_reason[4],
        citing the flagged study pmid:31957647, that 'the full text reports no significant differences
        in autonomic or heart rate variability measures between groups during laboratory-based resting
        wakefulness'. The full text supports it word for word ('No significant differences in autonomic
        or HRV parameters between groups were found for assessment during wakeful rest'; Table 1 'autonomic
        parameters obtained during laboratory-based resting wakefulness'), and the full-text-scan rule
        allows a fact from a flagged study's full text. The card now states a resting-wake null in a controlled
        Fukuda study of 24 patients, but contested_reason[0] still names only the Holmes study (pmid:9505867)
        as contradicting. Rung 3 is already contested, so no mark is missing.
      fix: Leave for the auditors to weigh whether pmid:31957647 belongs in the contested reason as a
        second contradicting study; no change to the mark is needed.
      targets:
      - contested_reason[0]
    - class: decisive
      severity: advisory
      problem: 'The study blocks of pmid:31957647 and pmid:29855991 keep the comments ''PMC7053003 exists
        but Europe PMC returned no open full text. TODO: verify.'' and ''PMC6274602 exists but Europe
        PMC returned no open full text. TODO: verify.'', and the card header comment still lists both
        among studies with no open full text. These now contradict case_definition_source: fulltext. Comments
        are not reader-facing, so this does not block.'
      fix: Remove the two stale comments with remove_comment in a later correction.
      targets:
      - studies[pmid:31957647]
      - studies[pmid:29855991]
