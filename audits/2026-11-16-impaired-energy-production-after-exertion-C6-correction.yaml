operations:
- op: replace_paragraph
  field: level_reason
  index: 0
  text: 'A controlled study of 84 patients meeting the Canadian Consensus Criteria and 71 sedentary controls
    repeated a maximal exercise test after 24 hours. Unlike controls, patients did not reproduce their
    first-day results: oxygen use and work fell at peak effort and at the ventilatory threshold on the
    second day. Rung 2 rests on this study.'
  sources:
  - pmid:38965566
- op: replace_paragraph
  field: level_reason
  index: 5
  text: Against these findings, a study from New York of 58 patients and 25 sedentary controls found no
    change in peak oxygen use or oxygen use at the ventilatory threshold on the second day in either group;
    the paper reports that 5 patients and 6 controls did not meet maximal-effort criteria. Its patients
    met the 1994 (Fukuda) definition modified to require post-exertional malaise. Its authors suggest
    that the fall reported in the 84-patient study may reflect lower effort on the second day.
  sources:
  - pmid:42212259
  - pmid:38965566
- op: replace_paragraph
  field: level_reason
  index: 6
  text: The 84-patient study kept patients who met maximal-effort criteria on the first test but not on
    the second, and its authors read those who still reached perceived maximal effort on the second test
    as emblematic of post-exertion symptom exacerbation. Its own results show a fall in heart-rate reserve
    on the second test, which its authors write suggests that maximum effort was not given; they report
    a similar fall in the matched controls.
  sources:
  - pmid:38965566
- op: replace_paragraph
  field: badges.explains_pem.reason
  index: 2
  text: In a study from the 84-patient study's research group, 78 patients took on average about 12.7
    days to recover from the two-day test, against 2.1 days for 64 sedentary controls; the paper reports
    the exercise test results separately and does not relate recovery to oxygen use or work.
  sources:
  - pmid:36984572
  - pmid:38965566
