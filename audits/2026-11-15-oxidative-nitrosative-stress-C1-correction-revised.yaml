  - operation: null
    severity: must_fix
    problem: 'level_reason (level 4 paragraph) says of pmid:10071523: ''A crossover trial of NADH alone
      in 26 patients meeting the CDC criteria did not measure oxidative stress either.'' The cached record
      (abstract only, no full text cached) does not say this: it says ''laboratory studies'' were obtained
      at baseline, 4, 8 and 12 weeks without naming them, and reports only responder counts. That the
      trial measured no oxidative-stress marker cannot be checked from the record. (For pmid:34444817
      the same claim is supported by the cached full text, which reports no oxidative-stress outcome.)'
    fix: 'Say only what the record supports, for example: ''A crossover trial of NADH alone in 26 patients
      meeting the CDC criteria reports no oxidative-stress measure in its abstract.'''
  - operation: null
    severity: advisory
    problem: core_claim says reactive species are 'damaging fats, proteins and other molecules', but neither
      cited source (pmid:16085177, pmid:21455120) mentions proteins; 16085177 speaks of 'a FR attack on
      lipids'. Protein damage (protein carbonyls) is in pmid:23185200, which is already on the card.
    fix: Add pmid:23185200 to core_claim.sources, or drop 'proteins'.
  - operation: null
    severity: advisory
    problem: 'Group fields name a place or institution from a sibling record rather than the study''s
      own record: pmid:21552194 is listed under ''Maes Clinics'', but its record gives Piyavate Hospital,
      Bangkok (Maes Clinics, Antwerp appears in the 20010505 and 21455120 records); pmid:27125909 lists
      Watanabe Y with University of Kansai Welfare Sciences, but Watanabe Y''s affiliations in the record
      are RIKEN, Kobe and Osaka City University (Kansai is the affiliation of Fukuda S and Kuratsune H).
      Both names are in the cached records, so they are not invented, but they are attached to the wrong
      author or study.'
    fix: Use the study's own affiliation, for example 'Maes M / Bosmans E (same group as 21455120, 20010505)'
      and 'Kuratsune H / Watanabe Y, University of Kansai Welfare Sciences and Osaka City University,
      Osaka, Japan'.
