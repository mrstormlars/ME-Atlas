  - pmid:23813081
  - pmid:28782878
- op: propose
  target: contested
  value:
  - 2
  - 3
  reason:
  - text: Rung 3 rests on independent studies that found the same result as the 84-patient study, whose
      patients met the Canadian Consensus Criteria. The clearest, a Fukuda study of 15 women patients
      and 15 controls from Amsterdam, is contradicted by the New York study, recorded as Fukuda, which
      enrolled 58 patients and 25 sedentary controls and found no change on the second day; 53 (= 58 -
      5) patients were in its main analysis of those with maximal tests on both days. With the same recorded
      case definition, a control group and more patients (53 against 15), the New York study is of comparable
      quality.
    sources:
    - pmid:20937116
    - pmid:42212259
    - pmid:38965566
  - text: The two Dutch clinic studies point the same way, but they compare patients with people who have
      chronic fatigue without ME/CFS rather than with healthy controls. The women's study states that
      diagnosis followed the ME criteria and the Fukuda criteria, and is recorded as Fukuda; the men's
      study cites two criteria references together without saying which the patients met, so its case
      definition is not verified.
    sources:
    - pmid:34198913
    - pmid:34198946
  - text: 'The Oslo study, whose patients met the Canadian Consensus Criteria, found the same result only
      in part: power output at the threshold fell more in patients than in controls, but the changes in
      oxygen use did not differ between groups.'
    sources:
    - pmid:31161646
  - text: Rung 2 rests on the 84-patient study. The New York study's sentence says its patients met both
      the 1994 case definition, modified to require post-exertional malaise, and names no second definition.
      A companion paper by the same authors describes 57 patients and 25 controls with the same mean age
      (38.6 ± 9.6 years) as the New York study and names the 2015 IOM definition, so it may describe the
      same cohort. The records do not settle which definition applies. If it is IOM 2015, the New York
      study has a control group and a case definition ranked with the Canadian Consensus Criteria, and
      53 (= 58 - 5) patients in its main analysis, so it would be of comparable quality to the 84-patient
      study; rung 2 is therefore marked contested as well. The card records Fukuda, from the New York
      study's own sentence.
    sources:
    - pmid:38965566
    - pmid:42212259
    - pmid:41293716
