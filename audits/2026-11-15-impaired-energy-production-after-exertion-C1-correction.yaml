  text: A study of 16 patients and 10 controls from Adelaide found that work rate at the ventilatory threshold
    fell more in patients on the second day, but found no difference between groups in how oxygen use
    changed; its patients had been diagnosed by one of the Fukuda, Canadian Consensus or International
    Consensus criteria, so the cohort was mixed. Two other two-day studies whose case definition is not
