operations:
- op: replace_paragraph
  field: level_reason
  index: 0
  text: 'A controlled study of 84 patients meeting the Canadian Consensus Criteria and 71 sedentary controls
    repeated a maximal exercise test after 24 hours. Unlike controls, patients did not reproduce their
    first-day results: oxygen use and work fell at peak effort and at the ventilatory threshold on the
    second day. Rung 2 rests on this study.'
  sources:
  - pmid:38965566
- op: replace_paragraph
  field: level_reason
  index: 2
  text: 'Two studies from one Dutch clinic compared patients with people who have chronic fatigue but
    do not meet ME/CFS criteria (51 and 50 women; 26 and 25 men): oxygen use and workload fell on the
    second day in ME/CFS, while the comparison group''s performance improved. They were not prospective:
    the data were drawn from a clinical database. The women''s study states that diagnosis followed the
    ME criteria and the Fukuda criteria, and its analysis excluded severe ME/CFS; fibromyalgia was more
    common in its ME/CFS group (49% against 14%). Its group sizes and fibromyalgia counts are those of
    the full text, which differ from the abstract. The men''s study cites two criteria references together
    without saying which the patients met, so its case definition is not verified and it is kept as context.
    One author, Visser FC, is also on the Amsterdam study.'
