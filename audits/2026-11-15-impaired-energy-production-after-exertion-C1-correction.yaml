      sample size is 'the number of patients in the measurement that bears on the finding', which is 53
      for the main analysis.
    fix: Make the text match the record and the n fields. Say 58 patients and 25 controls enrolled, with
      53 patients and 19 controls in the main both-days-maximal analysis (or 57 patients under the RER
      >= 1.05 criterion). In contested.reason[0], write '53 against 15'. The comparable-quality conclusion
      is unchanged (53 is more than half of 15).
