card: impaired-energy-production-after-exertion
decision: reject
parts:
  - decision_part: "contested.rungs includes rung 2 and contested_reason[3] marks it contested, but the card records the New York study (pmid:42212259) as Fukuda, which ranks below the Canadian Consensus Criteria of the 84-patient study; under the recorded case definition the New York study is not of comparable quality to the study rung 2 rests on, and the card itself says the records do not settle the case definition. The rung 2 mark and the recorded case definition of pmid:42212259 must agree: either the case definition is recorded as IOM 2015 from a sentence that applies to this cohort, or rung 2 is not contested."
    rubric: "Comparable quality means all three: the same or a stricter case definition (CCC, ICC and IOM 2015 rank above Fukuda and Holmes 1988, which rank equal and above Oxford), a control group, and at least half the sample size of the study it contradicts."
    evidence:
      - source: pmid:38965566
        quote: "Participants with ME/CFS (Canadian Criteria; n = 84) and sedentary controls (CTL; n = 71) completed two CPETs on a cycle ergometer separated by 24 h."
      - source: pmid:42212259
        quote: "They all met both the 1994 case definition of ME/CFS, modified to require endorsement of post-exertional malaise (Table 1)."
      - source: pmid:41293716
        quote: "The patients with ME/CFS were between the ages of 25 and 60 years and met the 2015 IOM case definition (22)."
    class: decisive
  - decision_part: "Level 3: a controlled CCC study found a fall on the second test, and an independent group in Amsterdam found the same pattern in a separate Fukuda cohort with controls."
    rubric: "An independent group has reproduced the finding in a separate cohort."
    evidence:
      - source: pmid:38965566
        quote: "Participants with ME/CFS (Canadian Criteria; n = 84) and sedentary controls (CTL; n = 71) completed two CPETs on a cycle ergometer separated by 24 h."
      - source: pmid:20937116
        quote: "At the anaerobic threshold the group of patients performed worse and the controls improved."
      - source: pmid:20937116
        quote: "All patients fulfilled the criteria of Fukuda et al [1] for CFS/ME and reported the start of symptoms after an infectious disease."
    class: none
  - decision_part: "Rung 3 contested: the New York study (same Fukuda definition as recorded, a control group, 53 patients with maximal tests against 15) found no change on the second day, contradicting the Amsterdam replication."
    rubric: "A rung that rests on more than one study (for example an original finding and its independent replication at level 3) is contested when a study of comparable quality contradicts any study the rung needs."
    evidence:
      - source: pmid:42212259
        quote: "For ME/CFS and CON subjects, there were no significant changes in Peak VO2 between Day 1 and Day 2 studies"
      - source: pmid:42212259
        quote: "Five ME/CFS and six sedentary controls did not meet the American College of Sports Medicine (ACSM) criteria."
    class: none
  - decision_part: "Diagnostic marker badge false: the classification and cut-off results stay within their own cohorts."
    rubric: "Yes only when a measurable marker linked to the hypothesis has been tested in a second, independent patient group, with a stated case definition."
    evidence:
      - source: pmid:23813081
        quote: "Follow-up classification analysis differentiated between groups with an overall accuracy of 95.1%."
      - source: pmid:42212259
        quote: "The data do not support using the 2-day CPET protocol to define PEM or disability."
    class: none
  - decision_part: "Explains-PEM badge false: the fall on the second test is the hypothesised abnormality itself, and the Oslo authors judged the fall too small to explain PEM."
    rubric: "a measured change that is itself the hypothesised abnormality (for example a fall in oxygen use on the second test) does not on its own explain PEM."
    evidence:
      - source: pmid:31161646
        quote: "Although VO2peak decreased significantly in patients, the absolute change was too small, in our opinion, to indicate any major change in exercise tolerance or explain PEM."
    class: none
reasons_summary: "Level 3, rung 3 contested and both badges are supported, but rung 2 is marked contested by a study the card records as Fukuda, which is not of comparable quality to the CCC study under the recorded definition."
would_change: "Either record the New York study's case definition as IOM 2015 from a sentence that applies to its cohort (the companion pmid:41293716 describes an apparently identical cohort of 57 patients and 25 controls as meeting the 2015 IOM definition), which would make it comparable and support the rung 2 mark, or drop rung 2 from the contested mark while the card records Fukuda. Separately, this audit could not check against the 84-patient study's full text two statements in level_reason[6] (that its authors read such cases as emblematic of post-exertion symptom exacerbation, and that a similar heart-rate-reserve fall is reported in the matched controls); they should be confirmed in the next audit."
