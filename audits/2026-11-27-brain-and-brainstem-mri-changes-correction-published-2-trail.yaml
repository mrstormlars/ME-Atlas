review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'The card records n_patients 45 and n_controls 27, and the finding says ''A study of n=45
      patients and 27 healthy controls found weaker connectivity during a task''. The cached full text
      (PMC6835065) states: ''Visual inspection found unacceptable signal dropout or inadequate spatial
      normalization in the resting fMRI in 3 ME/CFS and 2 HC, and in the task fMRI in one ME/CFS and one
      HC. These subjects were excluded from the analysis.'' and ''although the ME/CFS count fell to 18
      after repeating its analysis with the same N = 26 as HC''. The task comparison the finding describes
      therefore used 44 patients and 26 controls; 45 and 27 are the numbers scanned (abstract).'
    fix: 'Set n_patients to 44 and n_controls to 26 and state in the finding that the task analysis used
      44 of 45 patients and 26 of 27 controls after exclusions. Do not give ''signal dropout'' alone as
      the reason: the full text names ''unacceptable signal dropout or inadequate spatial normalization''
      and does not say which applied to the two task exclusions; either quote both or give no reason.
      Keep the case_definition_quote (it is the abstract''s sentence about the 45 scanned, which is correct
      as a quote).'
    targets:
    - studies[pmid:31671321].n_patients
    - studies[pmid:31671321].n_controls
    - studies[pmid:31671321].finding
  - class: decisive
    severity: must_fix
    problem: 'level_reason[3] says ''weaker connections between brainstem regions during a task (45 patients
      meeting the Fukuda definition, which does not require post-exertional malaise, and 27 controls)''.
      The task result in pmid:31671321 rests on 44 patients and 26 controls (full text PMC6835065: ''in
      the task fMRI in one ME/CFS and one HC. These subjects were excluded from the analysis.''; ''the
      same N = 26 as HC'').'
    fix: Give 44 patients and 26 controls for the task result (or '44 of 45 patients and 26 of 27 controls').
      If a reason for the exclusions is given, it must be the source's own 'unacceptable signal dropout
      or inadequate spatial normalization', not 'signal dropout' alone.
    targets:
    - level_reason[3]
rounds:
- round: 1
  operations:
  - op: update_study
    id: pmid:31671321
    set:
      n_patients: 44
      n_controls: 26
      finding: 'A study of 45 patients and 27 healthy controls scanned found weaker connectivity during
        a task between the medulla and the midbrain cuneiform nucleus, and between the brainstem and the
        hippocampus and thalamus, in patients; no such difference was found at rest. The task analysis
        used 44 (= 45 - 1) patients and 26 (= 27 - 1) controls: one patient and one control were excluded
        for unacceptable signal dropout or inadequate spatial normalization.'
  - op: replace_paragraph
    field: level_reason
    index: 3
    text: 'Other controlled studies from the same group as the level 2 study, using different measures,
      also report brainstem differences: weaker connections between brainstem regions during a task (44
      of 45 scanned patients meeting the Fukuda definition, which does not require post-exertional malaise,
      and 26 of 27 scanned controls, after one patient and one control were excluded), a lower T1-weighted
      MRI signal in a brainstem region (43 patients meeting the Fukuda definition and 27 controls), weaker
      connections between the pons and the cerebellum during a task (31 patients meeting the Canadian
      or International criteria and 15 controls), and a larger pons and whole brainstem at 7 Tesla (10
      patients and 10 controls). None of these results has been repeated by an independent group.'
    sources:
    - pmid:31671321
    - pmid:30497131
    - pmid:38347875
    - pmid:36937672
  checks:
    passed: true
    errors: []
  review:
    verdict: accept
    findings:
    - class: wording
      target: studies[pmid:31671321].finding
      operation: 0
      severity: advisory
      problem: 'Operation 0 answers finding 0 and is correct against the full text PMC6835065 (''in the
        task fMRI in one ME/CFS and one HC. These subjects were excluded from the analysis.''; ''the same
        N = 26 as HC''), and the reason it gives is the source''s own ''unacceptable signal dropout or
        inadequate spatial normalization''. Only the wording is awkward for a reader: ''45 patients and
        27 healthy controls scanned'' and the arithmetic ''44 (= 45 - 1)'' and ''26 (= 27 - 1)''.'
      fix: 'For example: ''A study that scanned 45 patients and 27 healthy controls found ... The task
        analysis used 44 patients and 26 controls: one patient and one control were excluded for unacceptable
        signal dropout or inadequate spatial normalization.'''
      targets:
      - studies[pmid:31671321].finding
