  - operation: null
    severity: advisory
    problem: 'Level check: level 2 is supported. pmid:16085177 (CDC criteria, version not stated, accepted
      like Fukuda) and pmid:21455120 (Fukuda via ref. 29 = Fukuda 1994 in the full text) are controlled
      studies with a recognised definition. Level 3 hinges on how ''the finding'' is read. level_reason[2]
