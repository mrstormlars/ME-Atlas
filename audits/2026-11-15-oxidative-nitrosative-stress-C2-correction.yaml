- op: replace_paragraph
  field: level_reason
  index: 0
  text: A study of 47 patients meeting the CDC criteria (version not named) and 34 healthy volunteers
    enrolled (the number measured is not stated) found higher blood levels of isoprostanes, a marker of
    oxidative damage to fats, in patients, both in those with and in those without cardiovascular risk
    factors. A study from Antwerp of 56 patients diagnosed using the CDC criteria (version not named)
    and 37 healthy controls found higher plasma peroxides in patients. The card is at level 2 because
    of these two controlled studies, which used different measures. Both used CDC criteria with the version
    not named, which does not require PEM.
  sources:
  - pmid:16085177
  - pmid:21455120
- op: replace_paragraph
  field: level_reason
  index: 1
  text: 'Other controlled studies found higher oxidative-stress markers, each on a different measure:
    malondialdehyde and protein carbonyls in 24 women meeting the 1994 CDC definition (recorded as Fukuda)
    against 19 in Novi Sad, Serbia; reactive oxygen metabolites (d-ROMs) in a study of patients diagnosed
    by the Fukuda 1994 criteria, whose abstract does not give the numbers; and reactive oxygen species
    inside lymphocytes in 15 patients against 16 controls in a study at Stanford, where patients were
    diagnosed using the National Academy of Medicine, Fukuda and Canadian Consensus criteria (Fukuda recorded
    as the least strict named) and the difference was found in women but not in men. Because the measures
    differ, none of these is a repeat of another, and each is unreplicated.'
  sources:
  - pmid:23185200
  - pmid:27224647
  - pmid:40627396
- op: replace_paragraph
  field: level_reason
  index: 2
  text: 'The card does not reach level 3. It reads "the finding" as the same marker: no independent group
    has found the same result on the same measure in a separate cohort with a confirmed recognised case
    definition. The only other isoprostane study, of 6 patients and 6 controls, also found higher levels
    at rest, but its case definition is not yet verified. It shares three authors with the first isoprostane
    study, so it would not count as an independent repeat even with a verified definition.'
  sources:
  - pmid:19422646
  - pmid:16085177
- op: replace_paragraph
  field: level_reason
  index: 3
  text: 'Malondialdehyde results conflict. An earlier study of 40 women meeting the 1994 CDC diagnostic
    criteria (recorded as Fukuda) and 40 healthy women found no overall difference between the groups;
    the authors report a difference only after dividing patients by malondialdehyde level, and title the
    paper as showing elevated lipid peroxidation. It is larger than the 24-patient study that found higher
    levels and uses the same recorded definition, so under the rubric the malondialdehyde finding cannot
    carry a level. Whether the patients of the two studies overlap is not stated. They may also have used
    different methods: the 24-patient study used an ELISA test for malondialdehyde bound to proteins (OxiSelect
    MDA Adduct ELISA), and the abstract of the earlier study does not give its method. The card''s level
    does not rest on this finding.'
  sources:
  - pmid:21119582
  - pmid:23185200
- op: replace_paragraph
  field: level_reason
  index: 4
  text: Measures of antioxidant defences are mixed. In studies with a recognised definition, biological
    antioxidant potential (BAP) was lower at rest in the d-ROMs study, while glutathione in lymphocytes
    was higher in both sexes in the Stanford study (in men, in two of the three cell types tested). In
    studies whose case definition is not yet verified, plasma coenzyme Q10 was lower in 58 patients than
    in 22 controls; whole-blood glutathione peroxidase activity did not differ between 40 patients and
    24 controls; glutathione in the brain was lower in 15 patients than in 13 healthy volunteers in one
    study and did not differ in another of 26 people in all.
  sources:
  - pmid:27224647
  - pmid:40627396
  - pmid:20010505
  - pmid:21552194
  - pmid:22281935
  - pmid:19906518
- op: replace_paragraph
  field: level_reason
  index: 5
  text: 'The card does not reach level 4: no controlled trial in patients with a confirmed recognised
    case definition has lowered an oxidative-stress measure and improved the illness. A placebo-controlled
    trial of coenzyme Q10 plus NADH in 73 patients reported less fatigue than with placebo and lower lipid
    peroxides in blood cells of the treated group (the abstract does not say whether against placebo or
    against baseline), but its case definition is not yet verified. A larger placebo-controlled trial
    of the same combination from the same unit, in 207 women meeting the Fukuda definition, did not measure
    oxidative stress and reported that fatigue scores changed in parallel in the two groups. A crossover
    trial of NADH alone in 26 patients who completed it, meeting the CDC criteria, reports no oxidative-stress
    measure in its abstract.'
  sources:
  - pmid:25386668
  - pmid:34444817
  - pmid:10071523
- op: replace_paragraph
  field: level_reason
  index: 6
  text: A placebo-controlled trial of ubiquinol, the reduced form of coenzyme Q10, in 43 patients (31
    completed) reported improvement in several symptoms. This is a single result that has not been repeated.
    Its case definition is not yet verified, and its abstract reports no oxidative-stress measure, so
    it does not bear on level 4.
  sources:
  - pmid:27125909
- op: replace_paragraph
  field: badges.diagnostic_marker.reason
  index: 0
  text: No study on this card tests a cut-off from one patient group in a second, independent group. In
    the Antwerp study the two markers together discriminated patients from controls within the same cohort,
    but this was not tested in a second group, and plasma peroxides alone did not separate patients from
    controls well (area under the curve 62.6%, not significant). The Stanford group's further test was
    a small case study of three people from a family cohort, studied by the same group.
  sources:
  - pmid:21455120
  - pmid:40627396
- op: replace_paragraph
  field: badges.explains_pem.reason
  index: 0
  text: No study on this card tracks symptoms after an exertion challenge and links them to oxidative
    stress in the same patients. The first isoprostane study correlated isoprostane levels with a post-exertional
    malaise symptom score, in the low-risk subgroup only; a symptom score is not a direct measure of post-exertional
    malaise. The study of 6 patients and 6 controls measured isoprostanes after an exercise bout, but
    its abstract reports no symptom tracking.
  sources:
  - pmid:16085177
  - pmid:19422646
