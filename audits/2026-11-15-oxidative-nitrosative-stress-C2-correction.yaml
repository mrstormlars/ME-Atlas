  - operation: null
    severity: must_fix
    problem: 'core_claim says reactive species are ''damaging fats, proteins and other molecules'', citing
      pmid:16085177 and pmid:21455120. Neither cached record mentions proteins or ''other molecules'':
      16085177 reports isoprostanes and oxidised LDL ''indicative of a FR attack on lipids'', and 21455120
      reports plasma peroxides and oxLDL antibodies. Protein damage (protein carbonyls) appears only in
      pmid:23185200, which core_claim does not cite.'
    fix: Limit the claim to what the cited records state, e.g. 'damaging fats and contributing to the
      illness'. Or, if proteins stay, cite pmid:23185200 (already on the card) for them and drop 'other
      molecules'.
  - operation: null
    severity: must_fix
    problem: The Osaka study (pmid:27224647) is described as measuring markers 'in serum' in level_reason[1]
      ('reactive oxygen metabolites in serum'), in level_reason[4] ('antioxidant potential in serum was
      lower') and in studies[pmid:27224647].finding ('in serum in patients'). The cached record (no full
      text cached) never says serum, plasma or blood. It names only d-ROMs, BAP and OSI.
    fix: Remove 'in serum' in all three places (e.g. 'reactive oxygen metabolites (d-ROMs)', 'biological
      antioxidant potential (BAP)').
  - operation: null
    severity: must_fix
    problem: level_reason[5] says the NADH crossover trial (pmid:10071523) 'did not measure oxidative
