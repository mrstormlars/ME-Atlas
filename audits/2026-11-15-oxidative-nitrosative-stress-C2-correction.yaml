      laboratory studies, and questionnaire were obtained at baseline, 4, 8, and 12 weeks' without naming
      the laboratory studies. Whether oxidative stress was measured cannot be confirmed from the record.
    fix: Say instead 'its abstract reports no oxidative-stress measure'.
  - operation: null
    severity: must_fix
    problem: level_reason[6] reports that ubiquinol 'reported improvement in several symptoms' (pmid:27125909)
      but does not label the result as unreplicated (credibility rule 3). It also does not say why it
      is on an oxidative-stress card or that the abstract reports no oxidative-stress measure. As written
      it reads as an efficacy statement for a supplement. By contrast, the CoQ10 plus NADH result next
      to it is balanced by the larger trial.
    fix: Add that the result is not yet repeated and that the abstract reports no oxidative-stress measure,
