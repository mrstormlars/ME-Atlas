    fix: Add a group from the cached author facts, for example 'Systrom DM, Brigham and Women's Hospital,
      Harvard Medical School, Boston, USA (first author Joseph P, Yale University, New Haven, USA)'. Optionally
      add that Cook DB is also on 42212259, as the author facts list.
