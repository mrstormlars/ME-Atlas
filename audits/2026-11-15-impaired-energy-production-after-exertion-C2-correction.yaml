      malaise'', which is close but not the source''s framing.'
    fix: 'Optionally stay closer to the source: ''notes that few studies have directly tested how the
      physiological and behavioural manifestations of post-exertional malaise are associated''.'
operations:
- op: replace_paragraph
  field: level_reason
  index: 0
  text: 'A controlled study of 84 patients meeting the Canadian Consensus Criteria and 71 sedentary controls
    repeated a maximal exercise test after 24 hours. Unlike controls, patients did not reproduce their
    first-day results: oxygen use and work fell at peak effort and at the ventilatory threshold on the
    second day. Rung 2 rests on this study.'
  sources:
  - pmid:38965566
- op: replace_paragraph
  field: contested.reason
  index: 1
  text: The two Dutch clinic studies of women and men point the same way. Both papers cite the International
    Consensus Criteria as their ME criteria, and the case definition recorded for them is ICC. They compare
    patients with people who have chronic fatigue without ME/CFS rather than with healthy controls. The
    New York study uses a Fukuda-based definition, which ranks below ICC, so it is not of comparable quality
    to these two studies. Rung 3 is contested through the Amsterdam Fukuda study, which the New York study
    matches on case definition, with a control group and more patients (58 against 15).
  sources:
  - pmid:34198913
  - pmid:34198946
  - pmid:42212259
  - pmid:20937116
- op: replace_paragraph
  field: contested.reason
  index: 3
  text: 'Rung 2 rests on the 84-patient study and is not contested: the New York study''s own sentence
    names the 1994 (Fukuda) definition, modified to require post-exertional malaise, which ranks below
    the Canadian Consensus Criteria. A companion paper by the same authors, which appears to describe
    the same cohort (57 patients and 25 controls), names the 2015 IOM definition; the records do not settle
    which reading is right, and if the cohort met the IOM definition, rung 2 would also be contested.
    The card records Fukuda, from the New York study''s own sentence.'
  sources:
  - pmid:38965566
  - pmid:42212259
  - pmid:41293716
- op: replace_paragraph
  field: badges.explains_pem.reason
  index: 2
  text: From the 84-patient study's research group (shared authors), 78 patients took on average about
    12.7 days to recover from the two-day test, against 2.1 days for 64 sedentary controls; the paper
    reports the exercise test results separately and does not relate recovery to oxygen use or work.
  sources:
  - pmid:36984572
  - pmid:38965566
