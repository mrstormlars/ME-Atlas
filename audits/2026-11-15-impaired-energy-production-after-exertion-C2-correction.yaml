      The card''s own comment says that if the studies are read as Fukuda, the New York study would be
      of comparable quality to them. A correction may not make a claim stronger than before. The rung
      3 contested mark does not depend on this sentence, because the Amsterdam study alone carries it.'
    fix: 'Say what the papers say, and make the comparison depend on the recorded label. For example:
