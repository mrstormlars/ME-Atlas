    - studies[pmid:35358096].group
  - operation: null
    severity: advisory
    problem: Study pmid:42212259 has n_patients 53 and n_controls 19, but its finding and the card's text
      use 58 and 25. 53 and 19 are not stated in the record. They are worked out from 'Five ME/CFS and
      six sedentary controls did not meet the American College of Sports Medicine (ACSM) criteria' (58
