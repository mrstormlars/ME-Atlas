      cohort'' is an inference, not a statement in the records.'
    fix: Write 'From the 84-patient study's research group (shared authors), 78 patients ...' in badge_reasons.explains_pem[2].
      In both group fields, replace 'same group and cohort as 38965566' with 'same group as 38965566 (shared
      authors)'. Name the overlap only if a cached record states it.
    targets:
    - badge_reasons.explains_pem[2]
