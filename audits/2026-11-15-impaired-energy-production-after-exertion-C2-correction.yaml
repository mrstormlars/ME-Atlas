      6 adds a group to this now-orphaned entry, but does not fix its finding.
    fix: 'Add an update_study on pmid:37054777 that sets its finding to say only what the abstract states
      and drops the map sentence, for example: ''A review of exercise pathophysiology in ME/CFS and long
      COVID; it describes overlap between the two in blood-flow and gas-exchange findings on exercise
      testing. Not evidence for the level.'' (abstract: ''Hemodynamic and gas exchange derangements in
      PASC have substantial overlap with those observed with ME/CFS'').'
