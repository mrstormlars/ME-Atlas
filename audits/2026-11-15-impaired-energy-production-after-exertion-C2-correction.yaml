  findings:
  - operation: null
    severity: must_fix
    problem: level_reason[0] ends 'The card is at level 2 because of this study.' The draft's level is
      3, so a reader is told two different levels. Pmid:38965566 supports rung 2 ('Participants with ME/CFS
      (Canadian Criteria; n = 84) and sedentary controls (CTL; n = 71) completed two CPETs ... separated
      by 24 h'; 'Unlike CTL, ME/CFS failed to reproduce CPET-1 measures during CPET-2'). It does not set
      the card's level on its own.
    fix: Replace the last sentence with 'Rung 2 rests on this study.' (or remove it). Leave the level
      statement to level_reason[4].
    targets:
    - level_reason[0]
  - operation: null
    severity: must_fix
    problem: 'contested_reason[1] says the ICC label for the two Dutch clinic studies ''is read from a
      reference number and not confirmed''. The cached full texts confirm it. In pmid:34198913 (PMC8229058)
      and pmid:34198946 (PMC8230194), reference 1 is ''Carruthers B.M. ... Myalgic encephalomyelitis:
      International Consensus Criteria J. Intern. Med. 2011''. The women''s paper also excludes patients
      ''graded as having severe ME/CFS according to ICC ... [1]'', and the men''s paper excludes those
      ''graded as having severe ME/CFS according to the international consensus criteria (ICC)''. This
      matters for the contested mark. Under the rubric, ICC ranks above Fukuda, so the New York Fukuda-based
      study (pmid:42212259) is not of comparable quality to these two studies. Rung 3 is contested only
      if it needs a study that the New York study can contradict (the Amsterdam Fukuda study, pmid:20937116).
      The draft does not ask whether rung 3 also stands on the ICC Dutch studies, which use an idiopathic
      chronic fatigue comparison group rather than healthy controls, and the Oslo CCC study, which reproduced
      the result only in part.'
    fix: Remove 'is read from a reference number and not confirmed'. State that both papers cite the 2011
      International Consensus Criteria as their ME criteria (reference 1). Keep the caveat that the comparison
      group has idiopathic chronic fatigue rather than being healthy controls. Then restate, from the
      rubric, which studies rung 3 needs and whether the New York study is of comparable quality to each
      of them, so the auditor can decide whether the contested mark on rung 3 still holds.
    targets:
    - contested_reason[1]
    - contested
  - operation: null
    severity: must_fix
    problem: Study pmid:37054777 has no 'group' field. Every other study on the card has one, including
