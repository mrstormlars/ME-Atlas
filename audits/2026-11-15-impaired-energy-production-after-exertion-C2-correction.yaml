  - operation: 1
    severity: must_fix
    problem: 'contested_reason[1] now says ''Both papers cite the International Consensus Criteria as
      their ME criteria, and the case definition recorded for them is ICC'', and then concludes categorically
      that the New York study ''is not of comparable quality to these two studies''. This removes the
      earlier ''not confirmed'' caveat and states the reading more strongly than the records do. The cached
      full texts cite the ICC together with Fukuda in the same place: the women''s paper (PMC8229058)
      says ''according to the ME criteria [1] and CFS criteria of Fukuda [3]'', and the men''s paper (PMC8230194)
