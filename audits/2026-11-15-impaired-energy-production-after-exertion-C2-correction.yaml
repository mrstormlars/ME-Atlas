    fix: Either record the record's 58 and 25, or keep 53/19 and note in the finding that these are the
      patients and controls with maximal tests on both days (58 and 25 enrolled).
  - operation: null
    severity: advisory
    problem: Study pmid:30871578 is labelled Fukuda. Its quote says patients had been diagnosed 'based
      on one of three widely accepted diagnostic criteria' (Fukuda, CCC or ICC). The quote supports a
      mixed cohort whose loosest admissible definition is Fukuda. It does not show that every patient
      met Fukuda.
    fix: Keep the Fukuda label as the conservative reading, but say in the finding that patients were
      diagnosed by any of Fukuda, CCC or ICC.
  - operation: null
    severity: advisory
    problem: 'level_reason[2] calls the Dutch clinic studies ''retrospective analyses of a clinical database''.
