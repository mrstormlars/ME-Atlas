  - operation: null
    severity: must_fix
    problem: 'badge_reasons.explains_pem[2] calls pmid:36984572 ''an overlapping cohort from the 84-patient
      study''s research group''. The group fields of pmid:36984572 and pmid:35358096 say ''same group
