review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'Request item 1 is an error. The card records pmid:33577778 as case_definition ''unverified''
      with no source or quote. The cached full text (data/cache/europepmc/PMC8727854.html, a PMC page)
      states: ''All then underwent additional medical record review to confirm presence of ME/CFS, using
      the National Academy of Medicine requirement of documentation of three major criteria (ie, chronic
      fatigue for ≥6 months, post-exertional malaise, unrefreshing sleep) plus one minor criteria (ie,
      either cognitive impairment, orthostatic intolerance).'' It goes on: ''For those with uncertain
      documentation on medical record review, a short telephone questionnaire was used to finalize inclusion
      or exclusion.'' The National Academy of Medicine criteria are the IOM 2015 criteria (the paper''s
      reference 1 is the 2015 Institute of Medicine report).'
    fix: Set case_definition to IOM2015, case_definition_source to fulltext, and case_definition_quote
      to the sentence quoted above, copied verbatim from the cached page.
    targets:
    - studies[pmid:33577778].case_definition
    - studies[pmid:33577778].case_definition_source
    - studies[pmid:33577778].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'Request item 2 is an error. level_reason[2] says the 160-patient Boston study ''cannot count
      either because its case definition is not yet verified''. Its full text names the IOM 2015 (National
      Academy of Medicine) criteria, so that reason no longer holds, and the paragraph gives the level
      a reason the source contradicts. The study''s role (''context'') and the level need to be reassessed
      on what the full text does say. Points the auditor needs: (a) the skin-biopsy result is not a comparison
      against the study''s own controls. The full text says ''We viewed it as unnecessary for our iCPET
      control subjects to have skin biopsies because our laboratory has far more comprehensive age-, sex-,
      and race-adjusted same-laboratory norms from more than 450 healthy control subjects'', and the 31%
      (49/160) is defined against those norms (''epidermal innervation ≤5.0% of predicted''). (b) The
      authors write that ''referral bias of ME/CFS patients referred for skin biopsy might skew our sample
      to inflate prevalence of SFN''. (c) Section 5 shows it shares two authors (Systrom DM, Felsenstein
      D) with pmid:41576003, so it cannot count as an independent replication for level 3. On my reading,
      the evidence still supports level 1, because neither the Boston 2026 study nor this one reports
      a test of ME/CFS skin biopsies against concurrently measured controls. Whether a comparison against
      laboratory norms in an IOM 2015 cohort meets ''a controlled study ... supports it'' (level 2) is
      for the auditor to decide. Whatever the decision, the finding is unreplicated by an independent
      group and must be labelled so.'
    fix: 'Replace the last sentence of level_reason[2] with a sourced statement: the 160-patient study
      met the National Academy of Medicine (IOM 2015) criteria; its skin biopsies were judged against
      laboratory norms, not against its 36 controls, who had no biopsies; the authors name possible referral
      bias; it shares authors with the 2026 Boston study. Then let the auditor decide the role of pmid:33577778
      and whether the level stays at 1.'
    targets:
    - level_reason[2]
    - level
    - studies[pmid:33577778].role
  - class: decisive
    severity: must_fix
    problem: 'Request item 3 is an error. badge_reasons.explains_pem[0] says pmid:33577778 is a study
      ''whose case definition is not yet verified''. Its cached full text names the National Academy of
      Medicine (IOM 2015) criteria. The rest of the sentence is supported: the full text says ''Denervation
      severity did not correlate with exertional measures'' and reports ''no correlations between epidermal
      neurite density and peak VO 2 and Qc''. The badge value false still follows from the rubric: the
      study is a single invasive exercise test (measures_pem false) with no repeated exercise test or
      symptom tracking after exertion.'
    fix: Replace 'whose case definition is not yet verified' with a statement that the patients met the
      National Academy of Medicine (IOM 2015) criteria on medical record review. Keep the badge false.
    targets:
    - badge_reasons.explains_pem[0]
  - class: decisive
    severity: must_fix
    problem: 'Request items 4 and 5 are errors in part. Both studies are labelled ''unverified'' (not
      yet checked) with no quote, but their cached full texts state the inclusion rule. PMC10648633.xml
      (pmid:37968647) says: ''Patients diagnosed of ME/CFS should be previously diagnosed or meet the
      Fukuda et al. [3] criteria at the evaluation time.'' PMC11783232.xml (pmid:39888240) says: ''Specifically,
      patients diagnosed with ME/CFS were required to either have a prior diagnosis or meet the Fukuda
      et al. criteria [3] at the time of evaluation.'' The rubric requires the card to record which case
      applies and, for any named definition, the sentence it was read from. The rule does not require
      every patient to meet Fukuda, so a plain ''Fukuda'' label would overstate what the patients met.
      The card''s own text (study findings, level_reason[2]) already describes the rule correctly, and
      neither study counts towards the level under either reading. I could not find the scan''s further
      claim that ''all reported post-exertional malaise'' by searching the cached full text of pmid:39888240,
      so it should not be added unless a quote is found.'
    fix: Record case_definition_source fulltext and the verbatim quotes above. Use a label that keeps
      the mixed rule out of the Fukuda rank (for example 'other'), so the studies still do not count towards
      the level. The auditor decides the label.
    targets:
    - studies[pmid:37968647].case_definition
    - studies[pmid:37968647].case_definition_source
    - studies[pmid:37968647].case_definition_quote
    - studies[pmid:39888240].case_definition
    - studies[pmid:39888240].case_definition_source
    - studies[pmid:39888240].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'Request item 7 is an error in part. badge_reasons.diagnostic_marker[0] calls pmid:39888240
      ''one study whose case definition is not verified''. Its full text states the inclusion rule: ''patients
      diagnosed with ME/CFS were required to either have a prior diagnosis or meet the Fukuda et al. criteria
      [3] at the time of evaluation.'' The numbers are confirmed: ''In ME/CFS patients, the variable that
      best discriminated between them and HC was also fiber tortuosity (AUC = 0.690; p = 0.032)'', with
      30 patients and 30 controls. The badge value false still follows: no second, independent patient
      group tested the marker.'
    fix: Replace 'whose case definition is not verified' with 'in which patients had a prior ME/CFS diagnosis
      or met the Fukuda definition'. Keep the badge false.
    targets:
    - badge_reasons.diagnostic_marker[0]
