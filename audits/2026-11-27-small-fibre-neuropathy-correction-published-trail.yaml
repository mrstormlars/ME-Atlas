  - op: replace_paragraph
    field: level_reason
    index: 2
    text: The card is not at level 2 because the Boston study, the one controlled study with a recognised
      case definition that points towards damage, reports its tests across four groups with no test of
      ME/CFS against controls, and uses historical controls and a referral sample. Two controlled studies
      from the Cruces University Hospital group included patients with a prior ME/CFS diagnosis or meeting
      the Fukuda definition; because a prior diagnosis does not name a definition, these cannot count
      towards the level. A study of 160 patients by a Boston-based group, whose patients met the National
      Academy of Medicine (IOM 2015) criteria on medical record review, found that 31% of skin biopsies
      were consistent with small fibre neuropathy. Its biopsies were judged against laboratory norms,
      not against its 36 controls, who did not have skin biopsies, so it is not a comparison with concurrently
      measured controls. The authors name possible referral bias that might inflate the prevalence. It
      shares authors with the 2026 Boston study, so it is not an independent replication, and the finding
      is unreplicated by an independent group.
    sources:
    - pmid:41576003
    - pmid:37968647
    - pmid:39888240
    - pmid:33577778
  - op: replace_paragraph
    field: badges.diagnostic_marker.reason
    index: 0
    text: No marker of small fibre damage has been tested in a second, independent patient group with
      a verified case definition. In one study in which patients had a prior ME/CFS diagnosis or met the
      Fukuda definition, corneal nerve tortuosity had an area under the curve of 0.690 (p = 0.032), modest
      accuracy, for telling 30 patients from 30 healthy controls.
    sources:
    - pmid:39888240
  - op: replace_paragraph
    field: badges.explains_pem.reason
    index: 0
    text: No study on this card measures post-exertional malaise directly and links it to small fibre
      damage. In one study, whose patients met the National Academy of Medicine (IOM 2015) criteria on
      medical record review, the severity of nerve fibre loss in skin biopsies did not correlate with
      measures from an exercise test.
    sources:
    - pmid:33577778
  checks:
    passed: true
    errors: []
  review:
    verdict: accept
    findings:
    - operation: 1
      severity: advisory
      problem: 'Operations 1 and 2 answer finding 3. The quotes for pmid:37968647 and pmid:39888240 are
        verbatim in their cached full texts. Changing the label from ''unverified'' to ''other'' departs
        from the founder ruling of 2026-11-02 (DECISIONS: ''such studies are recorded `unverified`''),
        which the card header comment still states. ''Other'' keeps both studies out of every rung and
        lets the card carry the sentence the rubric asks for, which ''unverified'' cannot under V13. The
        label is still a departure from a written ruling, so the auditors and the founder should see it
        as one.'
      fix: The auditor confirms 'other' for both studies, or the founder amends the 2026-11-02 ruling.
        The header comment can then be updated in a later change.
    - operation: 3
      severity: advisory
      problem: 'Operation 3 answers finding 1. Every new sentence is in the cached full text of pmid:33577778:
        the 31% (49/160) figure, the controls who had no skin biopsies, the laboratory norms (''more than
        450 healthy control subjects''), the referral bias and the shared authors Systrom DM and Felsenstein
        D with pmid:41576003. The opening sentence still calls the 2026 Boston study ''the one controlled
        study with a recognised case definition that points towards damage''. pmid:33577778 is now IOM2015
        with design ''controlled''. The paragraph explains that its biopsy result has no concurrent controls,
        so the sentence is defensible but could be misread.'
      fix: Optionally say 'the one study with a recognised case definition that compares patients' skin
        biopsies with measured controls'.
    - operation: 0
      severity: advisory
      problem: 'Operations 0, 3 and 5 say the patients met the National Academy of Medicine criteria ''on
        medical record review''. The full text adds: ''For those with uncertain documentation on medical
        record review, a short telephone questionnaire was used to finalize inclusion or exclusion.''
        The wording is incomplete but not wrong. The comments in the study block (''No open full text.
        TODO: verify.''; ''the abstract does not say whether controls had biopsies'') are now out of date.
        They are not shown to readers.'
      fix: Optionally add 'or a short telephone questionnaire'. A later remove_comment could clear the
        out-of-date comments.
    - severity: advisory
      problem: 'Level, role and badges are not proposed for change. The cited evidence still supports
        level 1. The 31% figure in an IOM 2015 cohort is set against laboratory norms, not against concurrently
        measured controls, and the 2026 Boston study reports no test of ME/CFS against controls, so level
        2 is not met. A shared-author study is not an independent replication, so level 3 is not met.
        Whether pmid:33577778 becomes a rung 1 ''supports'' study (an uncontrolled signal with a recognised
        definition) instead of ''context'' is for the auditor. Both badges stay false: the AUC 0.690 (p
        = 0.032) result is in one group of 30 against 30, and the null correlation with exercise measures
        does not measure PEM directly. Operation 4 answers finding 4 and operation 5 answers finding 2.
        Their numbers and quotes match the records.'
