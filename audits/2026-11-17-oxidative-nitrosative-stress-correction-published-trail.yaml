  - class: wording
    target: level_reason[5]
    severity: advisory
    problem: '''A larger placebo-controlled trial of the same combination from the same unit'' says ''same
      unit'', but the cached affiliations differ. pmid:25386668 gives ''CFS Clinical Unit, Vall d''Hebron
      Research Institute, Vall d''Hebron University Hospital'', and pmid:34444817 gives ''ME/CFS Research
      Unit, Division of Rheumatology, Vall d''Hebron Hospital Research Institute''. The records show that
      the two trials share two authors (Castro-Marrero J, Segundo MJ) and the Vall d''Hebron institute.
      They do not say the unit is the same.'
