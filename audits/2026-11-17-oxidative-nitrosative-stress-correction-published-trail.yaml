rounds:
- round: 1
  operations:
  - op: set_link_text
    to: symptom:sleep-disturbance
    text: A 2018 review proposes that interacting immune, oxidative and nitrosative stress, and mitochondrial
      pathways may drive sleep abnormalities in chronic fatigue syndrome and other neuro-immune disorders.
      It is a hypothesis paper and reports no patient data linking the two. Its first author also wrote
      the review cited on this card's link to hpa-axis-cortisol, so the two review sources are not independent.
  - op: replace_paragraph
    field: level_reason
    index: 5
    text: 'The card does not reach level 4: no controlled trial in patients with a confirmed recognised
      case definition has lowered an oxidative-stress measure and improved the illness. A placebo-controlled
      trial of coenzyme Q10 plus NADH in 73 patients reported less fatigue than with placebo and lower
      lipid peroxides in blood cells of the treated group (the abstract does not say whether against placebo
      or against baseline), but its case definition is not yet verified. A larger placebo-controlled trial
      of the same combination from the same Vall d''Hebron research institute, in 207 women meeting the
      Fukuda definition, did not measure oxidative stress and reported that fatigue scores changed in
      parallel in the two groups. A crossover trial of NADH alone in 26 patients meeting the CDC criteria
      reports no oxidative-stress measure in its abstract.'
    sources:
    - pmid:25386668
    - pmid:34444817
    - pmid:10071523
  - op: replace_paragraph
    field: badges.diagnostic_marker.reason
    index: 0
    text: No study on this card tests a cut-off from one patient group in a second, independent group.
      In the Antwerp study the residualized plasma peroxide values did not separate patients from controls
      well (area under the curve 62.6%, not significant), and the Stanford group's further test was a
      small case study of three people from a family cohort, studied by the same group.
    sources:
    - pmid:21455120
    - pmid:40627396
