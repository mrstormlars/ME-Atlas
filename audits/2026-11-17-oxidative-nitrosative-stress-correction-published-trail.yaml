  - class: wording
    target: badge_reasons.diagnostic_marker[0]
    severity: advisory
    problem: '''In the Antwerp study plasma peroxides did not separate patients from controls well (area
      under the curve 62.6%, not significant)''. The full text (PMC3539515) gives this figure for the
      residualized plasma peroxide values (''The residualized plasma peroxide values showed no significant
      diagnostic performance for ME/CFS, where the area under the ROC curve was only 62.6%''). The abstract
      also says ''Both biomarkers contributed significantly in discriminating between patients with ME/CFS
      and normal controls''. The badge value of false still holds, because no marker was tested in a second,
      independent cohort.'
    fix: Write 'residualized plasma peroxide values', and if wanted add that the abstract reports both
      markers together contributing to discrimination, in the same single cohort.
