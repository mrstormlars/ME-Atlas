      problem: 'A study on the card that measured both ends in the same patients is missing from the sources.
        pmid:29021956 (Newcastle, no authors shared with the Griffith group, 42 patients meeting the Fukuda
        definition; full text PMC5633338) reports, in ''Exploratory analyses in the patient group'', Table
