        Questionnaire total (TIV -0.483, p=0.001; GM -0.689, p=0.002) and to the FIS cognitive subscale
        (TIV -0.336, p=0.032; GM -0.663, p=0.004), with no relation for white matter volume (CFQ 0.340,
        p=0.114). The link text instead opens ''Studies from Griffith University related MRI measures
        to self-rated cognitive symptoms'' and closes ''none of this has been replicated by another group'',
        which presents the evidence as coming from one group only.'
      fix: 'Add pmid:29021956 to sources and one sentence: a study from a different group (Newcastle)
        of 42 patients meeting the Fukuda definition (which does not require post-exertional malaise)
        found, in exploratory regressions, smaller total intracranial and grey matter volumes going with
        higher self-rated cognitive failure and cognitive fatigue impact scores, and no such relation
        for white matter volume; the paper does not state a correction for multiple comparisons for these
        regressions. Reword the opening sentence so it no longer says all the studies are from Griffith
        University, and keep the closing limit accurate (for example: no result has been repeated with
        the same measure).'
    - item: links[0]
      severity: advisory
      problem: '''In 16 to 18 patients meeting the International Consensus Criteria'': for the information
