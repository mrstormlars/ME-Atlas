rounds:
- round: 1
  proposal:
  - to: symptom:cognitive-impairment
    support: associated
    text: Studies from Griffith University related MRI measures to self-rated cognitive symptoms in patients,
      with mixed results and no overall direction. In 16 to 18 patients meeting the International Consensus
      Criteria, diffusion MRI measures related to a self-rated information processing score (1 to 10)
      differently than in controls, in regions that include the hippocampus and corpus callosum, after
      a correction across all regressions run. A second paper on the same cohort found larger volumes
      of several hippocampal subfields going with a worse score in 16 of these patients, and no such association
      in the 24 patients meeting only the Fukuda criteria; the paper does not state that these correlations
      were corrected for multiple comparisons. A 7 Tesla study of n=29 patients (described by its authors
      as a different cohort) found a larger left CA4 body volume going with worse self-rated concentration
      (r=0.41, p=0.034), also without a stated correction for multiple correlations. In n=31 patients
      at 7 Tesla, a self-rated memory score correlated positively with connectivity between two cerebellar
      vermis regions and negatively with another pair. A study of n=37 patients meeting the Canadian or
      International criteria, which correlated diffusion MRI measures with clinical measures including
      WHODAS domains, found no correlation that survived correction for multiple comparisons. The scores
      are self-reported, the groups are small, and none of this has been replicated by another group.
    sources:
    - pmid:34355438
    - pmid:35355311
    - pmid:39804864
    - pmid:38347875
    - pmid:42539798
