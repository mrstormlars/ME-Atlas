review:
  verdict: reject
  findings:
  - operation: 3
    severity: must_fix
    problem: 'This answers audit finding 2 (the 95-patient comparability sentence), but it does more than
      remove or weaken the wrong claim. It reverses it into a new, stronger claim and adds a fact that
      was not on the card: ''and to its 95-patient study, whose NK cytotoxicity result is reported for
      n = 71 (39 is more than half of 71)''. A correction may not add a fact or strengthen a claim. The
      record also does not say that n = 71 counts patients. The full text of pmid:21619669 reads ''NK
      and CD8+T (n = 71) cytotoxic activity ... was significantly decreased ... among the CFS/ME patients
      compared to the control subjects'', which could also mean all participants measured. So ''39 is
      more than half of 71'' reads 71 as a patient count that the record does not state.'
    fix: 'Remove the wrong claim without adding a new one, for example: ''With 39 patients in that measurement,
      the Canadian Consensus Criteria study is of comparable quality to the Australian group''s Fukuda
      studies of 39 and 65 patients. It is not of comparable quality to the Miami study of 176 patients.''
      Drop pmid:21619669 from the sources if the sentence no longer mentions that study.'
  - operation: 5
    severity: must_fix
    problem: 'This answers audit finding 1 (the ''four Fukuda studies'' label), but the new opening, ''The
      four supporting studies with a recognised case definition (three using Fukuda, one the CDC clinical
      diagnostic criteria with no version named)'', is wrong against the card. The card has six supporting
      studies with an accepted case definition. pmid:8148445 and pmid:9683556 are also CDC_unspecified,
      which the rubric accepts like Fukuda. The card itself counts CDC_unspecified as recognised: its
      third explains_pem paragraph calls the 21-patient CDC_unspecified study (pmid:7983659) one of ''the
      two studies with a recognised case definition''. The next paragraph also covers the two small CDC
      studies separately.'
    fix: 'Identify the four studies without the ''recognised case definition'' qualifier, for example:
      ''Four of the supporting studies (three using Fukuda, one the CDC clinical diagnostic criteria with
      no version named) report no direct measure ...'', or ''The four larger supporting studies (...)''.'
  - operation: 0
    severity: advisory
    problem: The update_study is correct. The value is CDC_unspecified, the source is fulltext, and the
      quote is verbatim from the full text of PMC2876037. However, the YAML comment above the study still
      reads 'ref 1 is Fukuda et al. 1994 ... so this reads as Fukuda'. That contradicts the new value,
      and both audits note that the cached record leaves out the reference list. The comment is not shown
      to readers, but it rests on content that is not in the cached record.
    fix: Change the comment so it says the record names the CDC clinical diagnostic criteria without a
      version and that the reference list is not in the cached record.
  - operation: 2
    severity: advisory
    problem: This answers audit finding 1 for level_reason, and it is correct against the record and the
      rubric ('ranks equal to Fukuda'). Before, the Miami study took the 'does not require post-exertional
      malaise' flag from paragraph 0 by being called a Fukuda study. The new paragraph does not say that
      the CDC criteria do not require PEM, a flag the rubric asks for with CDC criteria where the version
      is not stated. This matters less if the site shows the flag from the study's case_definition.
    fix: Optionally add 'which, like Fukuda, does not require post-exertional malaise' to the sentence.
