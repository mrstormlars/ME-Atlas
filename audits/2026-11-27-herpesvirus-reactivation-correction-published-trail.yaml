  - op: replace_paragraph
    field: badges.diagnostic_marker.reason
    index: 0
    text: No marker on this card has been tested in a second patient group by an independent research
      group. Antibodies against the Epstein-Barr virus dUTPase were higher in patients than in controls
      in two studies from the same Ohio group (Williams MV and Ariza ME are authors of both). The earlier
      study compared 55 patients with a single serum sample each, who met the Canadian Clinical Case Definition
      and the Fukuda criteria, with 151 controls, and reported higher anti-Epstein-Barr virus dUTPase
      antibodies in patients (P < 0.0001 in its abstract). The later study compared 40 patients, pre-screened
      for ME/CFS with the Fukuda definition without the Reeves modification and with serum and demographic
      information obtained from a University of Alabama at Birmingham source, with 16 controls, and reported
      higher Epstein-Barr virus, HHV-6 and varicella zoster virus dUTPase IgG in patients (p < 0.001).
      These are two separate patient groups with stated case definitions, but the research group is the
      same and the second study is small. Both measure antibodies against a viral enzyme, not viral DNA,
      and the records report group differences rather than how well the antibodies separate individual
      patients from controls. The badge stays no.
    sources:
    - pmid:28303641
    - pmid:41451845
  - op: replace_paragraph
    field: level_reason
    index: 7
    text: 'One study whose case definition is not yet verified found no difference. A study of 26 patients
      and 50 matched controls in Atlanta (52 recruited) isolated no HHV-6 or HHV-7 from anyone''s blood
      cells and found no difference in HHV-6 or HHV-7 DNA in blood cells, which this card treats as a
      marker of latent rather than active infection. A multicentre virome study from the USA, whose plasma
      cohort met the 1994 CDC (Fukuda) definition and whose second cohort met both the 1994 CDC and the
      2003 Canadian Consensus criteria, searched two separate cohorts for viral nucleic acid. In cohort
      1, plasma from 285 patients and 201 healthy controls was screened by MassTag PCR, with a stated
      detection threshold of 100-1000 copies; its panel lists HHV-6 but not HHV-7. It found HHV-6 in six
      samples (4 patients and 2 controls). In cohort 2 (106 patients and 91 healthy controls), saliva,
      feces and blood mononuclear cells were analysed by sequencing: HHV-6 sequences were found in saliva
      in 41.5% of patients and 52.7% of controls (p = 0.12) and HHV-7 sequences in 62.3% and 62.6% (p
      = 1), and HHV-6B was found in blood mononuclear cells of one patient. The authors report no significant
      differences in the prevalence of viral sequences between patients and controls, other than a lower
      prevalence of anelloviruses (a family of viruses that are not herpesviruses) in plasma, in 30.5%
      of 200 patients and 54.1% of 194 controls. Because HHV-7 was not in its plasma panel, this study
      did not test the double HHV-6 and HHV-7 plasma result on which level 2 rests, and its saliva measure
      is the prevalence of viral sequences, not the DNA load measured in the London saliva study; the
      card therefore does not record it as contradicting that result and stays not contested. On the direction
      of cause, the London study says herpesvirus reactivation might be a cause or consequence of the
      dysregulated immune function seen in ME/CFS, and the Bulgarian study raises the possibility that
      patients with ME/CFS are susceptible to acute viral infections as a consequence of immune dysfunction.'
