  review:
    verdict: reject
    findings:
    - class: decisive
      operation: 3
      severity: must_fix
      problem: 'The new badge reason (answers pre-review finding 5) opens: ''No marker on this card has
        been tested in a second patient group by an independent research group.'' Now that the correction
        verifies pmid:37526404 (operation 1: Fukuda, 285 patients, 201 controls), that sentence is false
        for the card. The cached full text of 37526404 (Lipkin group, no author shared with the Riga studies)
        tested HHV-6 DNA in plasma, the Riga marker: ''MassTag PCR identified six samples positive for
        HHV-6 (4 cases and 2 controls)''. The London saliva study (pmid:34422848, independent of Riga,
        CCC and/or Fukuda) also tested herpesvirus DNA. So markers on the card were tested by independent
        groups. They were not found again, and the reason must say that, not that they were never tested.
        The badge is false whatever the wording, but the reason given for it is wrong.'
      fix: 'Reword the first sentence to say what the records support, for example: ''No marker on this
        card has been found again in a second patient group by an independent research group.'' Or name
        the independent tests and say they did not find the marker higher (37526404: HHV-6 in plasma in
        4 patients and 2 controls), citing pmid:37526404 in the sources.'
      targets:
      - badge_reasons.diagnostic_marker[0]
    - class: decisive
      operation: 4
      severity: must_fix
      problem: 'The new level_reason[7] (answers pre-review finding 6) gives its reason for staying not
        contested as: ''Because HHV-7 was not in its plasma panel, this study did not test the double
        HHV-6 and HHV-7 plasma result on which level 2 rests''. The cached full text of pmid:37526404
        shows a second plasma measurement that the paragraph leaves out: ''We next used unbiased high-throughput
        sequencing on the Ion Torrent Proton platform to screen the ME/CFS case plasma samples of cohort
        1 for additional agents than those targeted by the MassTag PCR. Unbiased sequencing detected pegiviruses,
        HHV-6, and at high prevalence anelloviruses.'' The stated threshold is ''unbiased high-throughput
        sequencing, 1000-10,000 copies''. So patients'' plasma was screened by a method that could pick
        up HHV-7, and none is reported, but only case plasma was sequenced, with no controls. The contested
        mark rests on this sentence. Saying that the only plasma test was a panel without HHV-7 overstates
        the gap, and the auditor would decide the contested mark on an incomplete account.'
      fix: 'Add that the patients'' cohort 1 plasma was also screened by unbiased sequencing (stated threshold
        1000-10,000 copies; control plasma not sequenced), which the paper reports detected pegiviruses,
        HHV-6 and anelloviruses. Then rephrase the reason: the study did not compare HHV-7 in plasma between
        patients and controls (the MassTag panel lists HHV-6 but not HHV-7, and only patients'' plasma
        was sequenced). The auditor decides the contested mark from that.'
      targets:
      - level_reason[7]
      - contested
