    - studies[pmid:28303641].case_definition_source
    - studies[pmid:28303641].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'The card has n_patients and n_controls null for pmid:28303641. The cached full text gives
      the numbers: ''A single baseline serum sample from 55 ME/CFS subjects in our biobank was selected
      for testing. There was no overlap between these single sample ME/CFS patients and those in the ME/CFS
      Good Day Bad Day group''; ''In 74 subjects with ME/CFS, baseline and 18 month blood samples ...
      were collected''; and the comparison is with ''healthy controls (n = 151)''. The abstract''s range
      of 30.91-52.7% of ME/CFS patients covers the two patient groups.'
    fix: Record n_controls 151. For n_patients, record the number for the measurement compared with controls
      (55 single-sample patients; the separate longitudinal group had 74), and say in the finding which
