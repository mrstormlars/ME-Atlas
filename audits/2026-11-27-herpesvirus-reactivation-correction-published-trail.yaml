  - class: decisive
    severity: must_fix
    problem: 'The badge reason says ''No marker on this card has been tested in a second, independent
      patient group with a verified case definition'' and ''Both studies have case definitions not yet
      verified.'' The cached full texts now give both case definitions: pmid:28303641 used CCC and Fukuda
      (55 patients from the NOVA Southeastern biobank against 151 controls, higher anti-EBV dUTPase antibodies
      than controls, P < 0.0001 in the abstract), and pmid:41451845 used Fukuda (40 patients against 16
      controls, serum and demographics ''obtained from Dr. Jarred Younger, University of Alabama at Birmingham'',
      higher EBV, HHV-6 and VZV dUTPase IgG, p < 0.001). These are two separate patient groups with stated
      case definitions in which the same marker (EBV dUTPase IgG) was higher. The research group is the
      same (the authors Williams MV and Ariza ME are on both, section 5), which also means the pair cannot
      count as an independent replication for level 3. Read literally, the rubric''s badge rule (''tested
      in a second, independent patient group, with a stated case definition'') does not say the research
      group must differ. The second study is small (16 controls) and neither cached record reports diagnostic
      accuracy. The reason as written is false, and the badge value has to be judged again. The auditor
      decides it.'
    fix: Rewrite the badge reason from the two full texts (case definitions, patient sources, sample sizes,
      same research group) and have the auditor decide whether the badge stays false or becomes true under
      the rubric's wording, stating the reason.
    targets:
    - badge_reasons.diagnostic_marker[0]
    - badges.diagnostic_marker
  - class: decisive
    severity: must_fix
    problem: 'level_reason[7] groups pmid:37526404 under ''Some studies whose case definitions are not
      yet verified found no difference.'' Its case definition is now verified (Fukuda for cohort 1, Fukuda
      and CCC for cohort 2), so this sentence is wrong for it, and the contested test has to be applied.
      The level rests on cell-free plasma DNA in 200 Fukuda patients (pmid:36653846). pmid:37526404 meets
      the comparable-quality test against that study: the same case definition, a control group, and 285
      patients, more than half of 200. In cohort 1 it tested plasma by MassTag PCR: ''MassTag PCR identified
      six samples positive for HHV-6 (4 cases and 2 controls)''. Its Table 2 panel lists HHV-6 but not
      HHV-7, and the stated MassTag detection threshold is 100–1000 copies. In cohort 2 (106 patients
      meeting CCC and Fukuda, 91 controls) saliva HHV-6 was 41.5% vs 52.7% (p=0.12) and HHV-7 62.3% vs
      62.6% (p=1), and PBMC HHV-6B was in 1 case. The text concludes: ''No significant differences in
      the prevalence of viral sequences were found between cases and controls.'' It contradicts the HHV-6
      plasma part of the Riga finding. It does not test the double HHV-6 and HHV-7 result the card says
      the level rests on, because HHV-7 was not in the plasma panel. Its saliva result also bears on the
      London saliva study (pmid:34422848, 30 patients). The card does not write out any of this.'
    fix: Move pmid:37526404 out of the 'case definitions not yet verified' sentence. Write out what it
      measured in plasma and saliva, with its numbers, cohorts and the HHV-7 gap in the plasma panel.
      Have the auditor decide whether this contradicts the finding that level 2 rests on (contested mark),
      and give the reason either way.
    targets:
    - level_reason[7]
    - contested
