operations:
- op: propose
  target: level
  value: 2
  reason:
  - text: A study from Sweden measured antibodies against adrenergic and muscarinic receptors in the blood
      of two cohorts of 24 patients, all meeting the Canadian Consensus Criteria, the International Consensus
      Criteria and the 2015 IOM criteria, and of 24 matched healthy controls. Antibodies against the M3
      and M4 muscarinic receptors were higher than controls' in both cohorts; antibodies against the β1
      and β2 adrenergic receptors were higher in the Göteborg (Gottfries Clinic) cohort only, whose samples
      the paper reports were collected earlier and analysed separately. Levels did not correlate with
      disease severity. This controlled study in a defined group is the basis for level 2.
    sources:
    - pmid:34589868
  - text: An earlier study from Berlin of 268 patients and 108 healthy controls, whose case definition
      is not yet verified, found higher antibodies against the β2, M3 and M4 receptors in patients. It
      shares two authors with the Swedish study. A study of 60 patients and 30 healthy controls, also
      with the case definition not yet verified, found higher antibodies against the M1 muscarinic receptor,
      using a different test.
    sources:
    - pmid:26399744
    - pmid:12851722
  - text: 'A study from Spain, with no authors shared with the Swedish study, measured the same kinds
      of antibodies with a test from the same supplier in 59 patients meeting the Fukuda definition, which
      does not require post-exertional malaise, and 36 healthy controls. Antibodies against the β2 adrenergic
      receptor were higher in patients than in controls. Average antibody levels against the M1 to M4
      muscarinic receptors and the α1 and β1 adrenergic receptors did not differ; the share of people
      above the test maker''s cut-off differed for M3 and M4, and for M4 more controls than patients were
      above it. The paper''s table gives the same values for the M3 and M4 rows, in patients and in controls.
      The sample was not matched for age and sex (analyses were adjusted for age and sex), the authors
      describe the study as exploratory, and they made no correction for multiple comparisons. The card
      is held at level 2 and not level 3: this independent group reproduced only the β2 result, which
      the Swedish study found in one of its two cohorts, and did not reproduce the higher M3 and M4 antibodies.
      Both studies used a test from the same supplier. The finding is unreplicated beyond this single
      partial repeat.'
    sources:
    - pmid:42082542
    - pmid:34589868
  - text: In a randomised, double-blind trial from Bergen, Norway, 30 patients meeting the Fukuda definition
      received rituximab, a drug that removes B cells, or saline placebo, 15 in each group. At the trial's
      predefined primary end point, fatigue three months after treatment, there was no difference between
      groups. Lasting improvement in self-reported fatigue was seen in 10 of 15 patients given rituximab
      and 2 of 15 given placebo (p = 0.003), and fatigue scores differed between groups 6 to 10 months
      after treatment.
    sources:
    - pmid:22039471
  - text: A larger randomised, double-blind trial by the same Bergen group, of 151 patients meeting the
      Canadian Consensus Criteria (77 given rituximab, 74 placebo; infusions over 12 months, follow-up
      24 months), found no difference between groups in response rate (26.0% with rituximab, 35.1% with
      placebo), in fatigue over 24 months or in any secondary end point. It did not confirm the benefit
      seen in the 30-patient trial. The two trials differ in case definition (Canadian Consensus Criteria
      against Fukuda), in size (151 against 30) and in regimen (two infusions two weeks apart in the smaller
      trial, several infusions over 12 months in the larger one). In the larger controlled trial, B-cell
      depletion was not associated with clinical improvement, so the card does not reach level 4.
    sources:
    - pmid:30934066
    - pmid:22039471
  - text: Rituximab removes B cells rather than the antibodies themselves. The authors of the 30-patient
      trial suggest that improvement starting months after B cells were removed may fit a gradual clearing
      of autoantibodies.
    sources:
    - pmid:22039471
    - pmid:30934066
  - text: In 25 patients treated within the KTS-2 rituximab trial, receiving rituximab maintenance treatment,
      analysed in the Berlin study, raised β2 and M4 receptor antibodies fell, among patients who achieved
      prolonged B-cell depletion, in those who responded but not in those who did not.
    sources:
    - pmid:26399744
  - text: Treatments that lower antibody levels have otherwise been studied without a placebo group, so
      they cannot count towards level 4. In 10 patients with raised β2 receptor antibodies, immunoadsorption
      (filtering antibodies out of the blood) lowered these antibodies in 9, and 7 reported improvement
      during treatment. In 20 patients whose ME/CFS followed COVID-19, the same Berlin group reported
      a mean rise of 17.75 points in a physical function score after immunoadsorption. In 10 women given
      daratumumab, a drug that targets antibody-producing plasma cells, 6 improved markedly and 4 had
      no significant change.
    sources:
    - pmid:29543914
    - pmid:39759581
    - pmid:40703261
  - text: Against the antibody findings, a study of 172 participants, whose case definition is not yet
      verified, measured antibodies against a large panel of human proteins and found no significant differences
      between patients and controls, including against β-adrenergic receptors.
    sources:
    - pmid:40141440
  - text: Studies of B cells themselves are mixed. One study of 33 patients and 24 healthy controls found
      more naive and transitional B cells and fewer plasmablasts in patients; a second, sharing an author,
      found no difference in the classical B-cell groups in 38 patients and 32 controls, but differences
      in a B-cell surface marker (CD24) and in one memory B-cell group.
    sources:
    - pmid:23480187
    - pmid:26646713
