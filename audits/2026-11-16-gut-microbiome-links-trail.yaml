    findings:
    - item: links[0]
      severity: advisory
      problem: 'All round-1 findings are resolved. Checked against PMC10183837, PMC5405467 and PMC13296197:
        35/106 and 3/91; 21 of 50 and none of 50; the direct with-versus-without comparisons (beta diversity,
        Model 4 after FDR); ten shared authors, recomputed from both PubMed author lists (Bateman, Che,
        Hornig, Klimas, Komaroff, Levine, Lipkin, Montoya, Peterson, Williams); 76/50/37. One small point
        remains: ''gut bacteria explained little or none of the variation in gastrointestinal symptom
        scores'' is directly supported only for mixOmics (near-zero or negative R2). For glmnet the paper
        says only that the strongest outcomes were fatigue and physiosomatic composites ''rather than
        affective or gastrointestinal domains'', with microbiome-added value of about 0.00-0.02 over covariates
        for any outcome. The parenthetical scopes the claim, so the meaning holds.'
