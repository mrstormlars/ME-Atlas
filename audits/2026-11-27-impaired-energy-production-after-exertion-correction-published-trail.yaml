review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'level_reason[6] says the 84-patient study (pmid:38965566) kept patients who met maximal-effort
      criteria on the first test but not on the second, and it treats that as the study''s handling of
      effort. It leaves out that the same study handled controls differently. The cached full text (PMC11229500,
      Results, Participants) excludes participants who ''did not satisfy the maximum effort criteria explained
      previously for CPET-1 or CPET-2 (4 CTL)''. It then states: ''ME/CFS participants who met maximum
      effort criteria during test 1 but did not meet criteria during test 2 due to failure to achieve
      heart rate and/or RER criteria were not excluded from analysis.'' So controls who failed effort
      criteria on either test were removed, while patients who failed them on test 2 were kept. This paragraph
      is about whether the day-2 fall reflects lower effort, the point the New York study raises (level_reason[5]).
      Rung 2 rests on this study alone. Without the uneven handling, a reader cannot judge that limit.'
    fix: Add to level_reason[6], sourced to pmid:38965566, that the study excluded 4 controls who did
      not meet maximum-effort criteria on either test, while patients who met the criteria on the first
      test but not the second were kept. Use the full text's own numbers and wording. Change nothing else
      in the paragraph.
    targets:
    - level_reason[6]
rounds:
