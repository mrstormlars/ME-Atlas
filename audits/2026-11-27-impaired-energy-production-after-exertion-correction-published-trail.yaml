    field: level_reason
    index: 6
    text: 'The 84-patient study kept patients who met maximal-effort criteria on the first test but not
      on the second, and its authors read those who still reached perceived maximal effort on the second
      test as emblematic of post-exertion symptom exacerbation. It handled controls differently: it excluded
      participants who did not satisfy the maximum effort criteria for CPET-1 or CPET-2 (4 controls),
      while ME/CFS participants who met the criteria on test 1 but not on test 2 because of failure to
      reach the heart rate and/or RER criteria were not excluded from analysis. Its own results show a
      fall in heart-rate reserve on the second test, which its authors write suggests that maximum effort
      was not given; they report a similar fall in the matched controls.'
    sources:
    - pmid:38965566
