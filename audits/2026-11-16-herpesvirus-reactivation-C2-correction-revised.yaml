    problem: The group field of pmid:22927850 says 'Rasa S is an author of both' (22927850 and 36653846).
      The cached records list 'Rasa S' (Santa) on 22927850 and 'Rasa-Dzelzkaleja S' on 36653846; the author
      facts computed from the records give the shared authors of this pair as Krumina A and Murovska M
      only, and the context says to state shared authors only as given there. That the two names are the
      same person is an inference the records do not state.
