  - operation: null
    severity: must_fix
    problem: The link to symptom:post-exertional-neuroimmune-exhaustion says 'A London study of 30 patients
      ... found no positive correlation between HHV-6B or HHV-7 DNA levels and a questionnaire score for
      post-exertional malaise'. The cached full text of pmid:34422848 does not state this. It reports
      symptom-score correlations only within the severely affected subgroups (pattern 1 and pattern 2
      of the 16 severely affected) and during acute illness episodes in seven patients; it lists the domains
      that correlated (PEM is not among them) but never states a null result for PEM, and no correlation
      analysis is reported across all 30 patients. The negative correlation (PEM with HHV-6B, r = -0.647)
      is from the acute-illness episodes of seven patients, which the link does not say. The link therefore
      attributes to the 30-patient study a finding, and a sample size, the source does not give.
    fix: 'Say only what the paper reports, with the right subgroup: for example ''A London study (Canadian
      Consensus Criteria and/or Fukuda) that measured herpesvirus DNA in saliva monthly reported correlations
      between HHV-6B or HHV-7 DNA and several symptom scores in severely affected patients, but did not
      report one for a post-exertional malaise score; during acute illness episodes in seven patients,
      the post-exertional malaise score was negatively correlated with HHV-6B.'''
