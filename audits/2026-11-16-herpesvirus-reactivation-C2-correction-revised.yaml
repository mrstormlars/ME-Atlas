review:
  verdict: accept
  findings:
  - operation: 1
    severity: advisory
    problem: 'Op 1 answers audit 2026-11-13 part 2 (and pre-review finding 1) and resolves findings 1
      and 2 of the first review. It is a single add_sentence on an allowed target (level_reason[3]), cites
      only pmid:34422848, and says no more than the part''s quotes. The cached full text PMC8378328 matches
      it: ''were screened by ddPCR to detect potential active (lytic) replication of any of the nine HHVs.
      HHV DNA was rarely detected, with HSV-2, HHV-6A and HHV-6B detected in plasma from one or two subjects
      and the remaining HHVs always negative''. The study finding is left unchanged. Three points for
      the auditor. The record calls the screened material ''Serum samples (189)'', although positives
      are reported ''in plasma''. The samples were selected by high IgG titre. The sentence places the
      screen next to the serology counts (132 ME/CFS, 76 HC, 27 MS) without saying that the record does
      not give the number of ME/CFS samples in the screen, so a quick reader might take 132 as the screened
      patient count. The quotes do not allow adding that limit, and the contested decision stays with
      the auditor.'
    fix: No change needed within the correction limits. The auditor should weigh the sentence together
      with audit part 2's statement that the number of ME/CFS samples in the screen is not in the record.
  - operation: 0
    severity: advisory
    problem: Op 0 answers pre-review finding 5 (advisory). 'the text of the paper gives no counts for
      it (a figure shows frequencies)' matches the cached full text (PMC9847171, Fig. 4 'Frequency of
      persistent HHV-6A/B, HHV-7 and B19V infection/co-infection (%)'). It narrows the earlier claim rather
      than strengthening it, and the rest of the paragraph is unchanged. studies[pmid:36653846].finding
      still says 'counts not given'. That item is not among the correction's targets, so the two now differ
      slightly in wording.
    fix: No change in this correction; align the study finding in a later round if wanted.
  - operation: 4
    severity: advisory
    problem: Op 4 answers audit 2026-11-13 part 4 (and C1 part 6) as an add_sentence with an 'answers'
      reference on an allowed target (level_reason[7]). It restates the quote of pmid:34422848 ('Herpesvirus
      reactivation might be a cause or consequence of dysregulated immune function seen in ME/CFS'), so
      the first review's finding 3 is resolved. The sentence is appended to a paragraph about studies
      that found no difference, does not name the layer, and adds no link that expresses the other reading
      (a correction cannot add one). Whether this is enough for the layer rule is the auditor's decision.
    fix: No change needed within the correction limits.
