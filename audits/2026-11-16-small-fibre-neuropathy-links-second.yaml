card: small-fibre-neuropathy
decision: accept
parts:
  - decision_part: "The proposed link from small-fibre-neuropathy to symptom:orthostatic-intolerance at step 1 (proposed), sourced to the 2023 review pmid:37054777."
    rubric: "A peer-reviewed source (a review counts) that states the link. Not studied directly in patients."
    evidence:
      - source: pmid:37054777
        quote: "This review illustrates exercise pathophysiologic commonalities between PASC and ME/CFS that will help guide future diagnostics and treatment."
      - source: pmid:37054777
        quote: "SFN and distal axonopathy can reduce venoconstriction, as seen with abnormal lower extremity venous pooling upon standing and low norepinephrine release following sympathetic nervous system stimulation in POTS."
      - source: pmid:37054777
        quote: "The prevalence of small fiber neuropathy (SFN) seems to be high in PASC and ME/CFS."
      - source: pmid:37054777
        quote: "Using iCPETs, systemic vascular dysregulation seems to be similar in ME/CFS and PASC."
  - decision_part: "The link text: it reports what the review states, says the cited observation is in POTS and that the review is not a study of ME/CFS patients, and claims no step above proposed."
    rubric: "A review alone never reaches this step."
    evidence:
      - source: pmid:37054777
        quote: "SFN and distal axonopathy can reduce venoconstriction, as seen with abnormal lower extremity venous pooling upon standing and low norepinephrine release following sympathetic nervous system stimulation in POTS."
  - decision_part: "The target node: orthostatic intolerance is a symptom named in an accepted case definition, as the source itself states, and the card's dysfunction layer is unchanged."
    rubric: "The symptom layer is not hypotheses: it is a fixed list taken from the accepted case definitions, each symptom sourced to the document that lists it."
    evidence:
      - source: pmid:37054777
        quote: "The National Academy of Medicine requires three major criteria for diagnosis of ME/CFS (ie, substantial impairment from fatigue for > 6 months, PEM, and unrefreshing sleep), plus either cognitive impairment or orthostatic intolerance."
  - decision_part: "The change touches no level, badge or contested mark; the link does not move the card's level 1."
    rubric: "A link never raises a card's level."
    evidence:
      - source: pmid:37054777
        quote: "Exercise Pathophysiology in Myalgic Encephalomyelitis/Chronic Fatigue Syndrome and Postacute Sequelae of SARS-CoV-2: More in Common Than Not?"
reasons_summary: "Accept: a peer-reviewed 2023 review states that small fibre neuropathy can reduce venoconstriction with venous pooling on standing (in POTS), enough for a proposed link to orthostatic intolerance, and the link text states its limits."
would_change: "A study in an ME/CFS cohort with a recognised case definition that measured small fibre damage and orthostatic intolerance in the same patients and found no relation would have to be recorded on the link; evidence that the review's POTS statement is misreported, or that symptom:orthostatic-intolerance is not on the fixed symptom list, would change this decision. No drafting reasoning, review findings or earlier audit verdict were seen."
