    severity: must_fix
    problem: 'level_reason[1] gives a reason outside the rubric for why the card is not contested: "This
      null result does not make the card contested, because level 1 rests on the Boston study''s means,
      which were not tested against controls." The rubric (Contested evidence) decides this by comparable
      quality: same or stricter case definition, a control group, and at least half the sample size. The
      rubric has no rule that an untested finding cannot be contradicted. The sentence also misstates
      what the level rests on: level_reason[0] says level 1 rests on the Boston study as a whole, including
      the 52.6% against 0.0% biopsy result, not only its means. The conclusion (not contested) does hold
      under the rubric, because pmid:42082542 uses Fukuda, which ranks below ICC/IOM 2015 (the case definition
      of pmid:41576003), and its 59 patients are fewer than half of 170.'
    fix: 'Replace the reason with the rubric''s: the Bilbao study is not of comparable quality, because
      its Fukuda definition ranks below the ICC/IOM 2015 definition of the Boston study (and 59 patients
      is fewer than half of 170). So under the rubric it does not make the level contested.'
  - operation: null
    severity: must_fix
    problem: core_claim says the small fibres "control sweating and blood vessels". None of the three
      cited sources (pmid:37968647, pmid:39888240, pmid:41576003), as cached, says that small fibres control
      blood vessels. They describe sensory fibres for pain and temperature, and autonomic or sudomotor
