    problem: 'The card has contested: null, but pmid:40624094 meets the rubric''s comparable-quality test
      against the study level 2 rests on (pmid:34355438). Case definition: ''ME/CFS patients were independently
      interviewed by two clinicians to confirm a CCC-consistent diagnosis of ME/CFS'' (CCC ranks with
      ICC). It has a control group: 43 post-infectious patients against 43 matched healthy controls. Its
      43 patients are more than half of the 18 ICC patients in pmid:34355438. It contradicts the finding.
      pmid:34355438 found ''decreased axial diffusivity (p = .001) and mean diffusivity (p = .01) in the
      descending cortico-cerebellar tract in the midbrain and pons'', a tract that runs ''to the ventral
      pons middle cerebellar peduncle''. pmid:40624094 found ''significantly higher axial diffusivity
      (AD)'' in projection fibres including the ''left inferior cerebellar peduncle, middle cerebellar
      peduncle, left superior cerebellar peduncle ... corticospinal tract, and left medial lemniscus'',
      and ''No significant group differences were found for fractional anisotropy, mean diffusivity, or
      radial diffusivity'', which it calls ''in contrast to previous studies that reported changes in
      these diffusion metrics in ME/CFS''. level_reason[2] itself calls this ''the opposite direction
      to the level 2 study'', yet the study''s role is ''context'' and rung 2 is not marked contested.'
    fix: Propose a contested mark on rung 2, with a contested reason sourced to pmid:40624094 and pmid:34355438
      that quotes the higher axial diffusivity and the absence of a mean diffusivity difference. Change
      the role of pmid:40624094 to 'contradicts'. The auditor decides the mark. The evidence supports
      level 2 with rung 2 contested, not level 3.
    targets:
    - contested
    - studies[pmid:40624094].role
