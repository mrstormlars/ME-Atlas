  - 2
  reason:
  - text: The level 2 finding rests on one study of 18 patients meeting the International Consensus Criteria
      and 26 healthy controls, which found lower axial and mean diffusivity in a midbrain and pons cluster.
      A later controlled study from a different group (University of the Sunshine Coast), of 43 patients
      with an infection-triggered onset, diagnosed as consistent with the Canadian Consensus Criteria,
      and 43 matched healthy controls, found higher axial diffusivity in patients in several tracts that
      pass through the brainstem, including the cerebellar peduncles, the corticospinal tract and the
      left medial lemniscus, and no significant difference in mean diffusivity. The two studies used different
      methods (a voxel-based analysis and a tract-based analysis), and the tracts overlap only partly,
      so the conflict is partial. The rung is therefore marked contested.
    sources:
    - pmid:40624094
    - pmid:34355438
- op: remove_link
  to: symptom:cognitive-impairment
