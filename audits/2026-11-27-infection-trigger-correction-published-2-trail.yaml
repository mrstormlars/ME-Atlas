card: infection-trigger
card_sha256: 704d30203cf6dd8b9c561536735b66cb2ef85d1f329fe5a2a54c59feba5178ea
origin: the full-text scan 2026-11-27 of 2026-11-27 (docs/plan-fulltext-recheck.md); second attempt, items
  added verbatim from audits/2026-11-27-infection-trigger-correction-published.yaml (objecting decision
  parts 1-3)
request:
- target: level_reason[3]
  problem: 'The full-text scan found that the full text differs from the card: The full text describes
    matched control participants who recovered promptly from the same infection, assessed at six months,
    while the level reason says the study had no comparison group. Quote from the full text: We invited
    these cases, and control participants matched by age and sex who had recovered promptly from the same
    infection, at six months for a medical interview, examination by a physician (AL), and laboratory
    investigation'
- target: studies[pmid:33367564].case_definition
  problem: 'The full-text scan found that the full text states something the card lacks: The full text
    names Fukuda, Canadian and IOM criteria, with a medical and psychiatric exam; the card lists the case
    definition as unverified with no quote. Quote from the full text: were evaluated to determine whether
    they met 1 or more of the 3 case definitions of ME/CFS'
- target: studies[pmid:33367564].n_controls
  problem: 'The full-text scan found that the full text states something the card lacks: The full text
    reports 67 matched recovered controls; the card has n_controls null. Quote from the full text: Sixty-seven
    of the 157 asymptomatic students were recruited as matched, recovered controls.'
- target: level_reason[3]
  problem: 'The full-text scan found that the full text states something the card lacks: level_reason[3]
    says the case definitions are not verified and that there was no comparison group; the full text names
    the three definitions used and also describes 67 matched recovered controls for the group comparisons.
    Quote from the full text: were evaluated to determine whether they met 1 or more of the 3 case definitions
    of ME/CFS'
- target: level_reason[0]
  problem: 'The full-text scan found that the full text states something the card lacks: The authors also
    list factors that could lead to underestimation (hospitalized participants excluded, waxing/waning
    symptoms, severely affected people lost to follow-up) and say the overestimation issues are mitigated
    by enrolling within 30 days of infection; the level reason names only the overestimation limits. Quote
    from the full text: Conversely, there are also factors that might have contributed to an underestimation
    of participants with post-COVID-19 ME/CFS.'
- target: studies[pmid:41598987].finding
  problem: 'The full-text scan found that the full text states something the card lacks: The full text
    gives the share of the infected group with ME/CFS (35 of 100) and prior syncope (59%); the card gives
    no such proportion. Quote from the full text: This female predominance may reflect the high prevalence
    of ME/CFS (35%) and a history of syncope (59%) in the Coxiella group'
- target: studies[pmid:16950834].case_definition
  problem: 'studies[pmid:16950834] case_definition set to Fukuda: the study''s own text, as given, says
    only ''the international diagnostic criteria'' with a reference number; it does not name Fukuda, and
    the reference list is not in the record, so Fukuda cannot be read from the record. The entry should
    stay unverified unless a source naming the definition is given.'
- target: level_reason[3]
  problem: 'level_reason[3], the clause ''the full text says the diagnosis followed "the international
    diagnostic criteria" and cites Fukuda et al. 1994 for them'': the record shows a reference number
    only; that it is Fukuda et al. 1994 cannot be matched to any sentence in the record. It carries the
    case definition of a study, so it is not wording only.'
- target: links[0]
  problem: 'links[0] (question:who-is-vulnerable), the clause ''The full text of the first says its cases
    met "the international diagnostic criteria" and cites Fukuda et al. 1994 for them'': same unverifiable
    attribution of Fukuda to the Dubbo study; it replaces the earlier statement that the case definition
    is not verified, so it changes how the link''s source is characterised.'
review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'pmid:33367564 is labelled case_definition ''unverified'' with no quote, and level_reason[3]
      and links[0] say its case definition is not verified. Its cached full text (PMC8664491) states the
      definitions: participants ''were evaluated to determine whether they met 1 or more of the 3 case
      definitions of ME/CFS'', the three being ''Fukuda et al [20], Canadian Clinical [21], and Institute
      of Medicine (IOM) [22] criteria'', and the discussion says ''in most cases the ME/CFS group only
      met the Fukuda criteria [20], while the S-ME/CFS group always met the Fukuda criteria [20] and either
      the Canadian [21] or IOM [22] criteria''. The 55 counted as ME/CFS therefore rest on at least Fukuda,
      which the record states.'
    fix: 'Set the label from the full text (Fukuda as the definition every case met, flagged ''does not
      require PEM''; the severe subgroup also met CCC or IOM 2015), case_definition_source fulltext, with
      a verbatim quote such as ''were evaluated to determine whether they met 1 or more of the 3 case
      definitions of ME/CFS'' together with the sentence naming Fukuda, Canadian and IOM. Update level_reason[3]
      and links[0] so they no longer say this study''s case definition is unverified. The level is unaffected:
      the study has no uninfected comparison group.'
    targets:
    - studies[pmid:33367564].case_definition
    - studies[pmid:33367564].case_definition_quote
    - studies[pmid:33367564].case_definition_source
    - level_reason[3]
    - links[0]
  - class: decisive
    severity: must_fix
    problem: pmid:33367564 has n_controls null, but its PubMed abstract states '67 of the 157 asymptomatic
      students served as controls' and the full text says 'Sixty-seven of the 157 asymptomatic students
      were recruited as matched, recovered controls.' The card's own finding for this study compares the
      severe group with these asymptomatic students.
    fix: Set n_controls to 67 (matched, recovered controls who had the same infection, not uninfected
      people), as the record states.
    targets:
    - studies[pmid:33367564].n_controls
  - class: decisive
    severity: must_fix
    problem: 'level_reason[3] says ''Two studies had no comparison group'' about pmid:16950834 and pmid:33367564.
      Both had controls: the Dubbo full text (PMC1569956) says ''We invited these cases, and control participants
      matched by age and sex who had recovered promptly from the same infection, at six months'', and
      the Jason abstract says 67 asymptomatic students ''served as controls''. What neither has is a group
      without the infection, which is what the sentence''s conclusion (''a frequency after infection rather
      than a higher risk'') needs. As written the sentence misstates both studies'' designs.'
    fix: Say that neither study had a comparison group without the infection (their controls had recovered
      from the same infection), so they give a frequency after infection rather than a higher risk.
    targets:
    - level_reason[3]
  - class: decisive
    severity: must_fix
    problem: 'level_reason[0] lists only the limits the RECOVER-Adult authors say could have led to overestimation.
      The cached full text (PMC11968624) goes on: ''These issues are mitigated by the enrollment of participants
      within 30 days of infection. Conversely, there are also factors that might have contributed to an
      underestimation of participants with post-COVID-19 ME/CFS'', naming the exclusion of hospitalized
      participants, waxing/waning symptoms, IOM 2015 criteria possibly not suited to short-duration illness,
      participants unfamiliar with PEM, and the most severely affected possibly unable to enrol or lost
      to follow-up. Giving only one direction of the authors'' limits changes how a reader weighs the
      study the level rests on.'
    fix: Either add, from the full text, that the authors say the overestimation issues are mitigated
      by enrolment within 30 days and that other factors (for example excluded hospitalized participants
      and severely affected people lost to follow-up) could have led to underestimation, or remove the
      sentence on the authors' limits altogether.
    targets:
    - level_reason[0]
  - class: wording
    target: links[0]
    severity: advisory
    problem: links[0] says the Jason study 'found more physical symptoms and immune differences, but not
      more psychological symptoms, before the infection in those who later had severe ME/CFS'. The abstract
      states the physical/immune/psychological contrast for 'those who developed ME/CFS' against those
      who recovered; for the severe group it says they were 'not different ... in stress, coping, anxiety,
      or depression but were different in several behavioral measures and had significantly lower levels
      of IL-6 and IL-13'.
    fix: Say 'in those who later developed ME/CFS', or use the abstract's wording for the severe group.
    targets:
    - links[0]
rounds:
- round: 1
  operations:
  - op: update_study
    id: pmid:33367564
    set:
      case_definition: Fukuda
      case_definition_source: fulltext
      case_definition_quote: Note that in most cases the ME/CFS group only met the Fukuda criteria [20],
        while the S-ME/CFS group always met the Fukuda criteria [20] and either the Canadian [21] or IOM
        [22] criteria.
      n_controls: 67
  - op: replace_paragraph
    field: level_reason
    index: 0
    text: 'A US study (RECOVER-Adult) followed 4515 adults enrolled within 30 days of SARS-CoV-2 infection,
      or who became infected during the study, and compared them with adults who had no infection. ME/CFS
      was classified with the 2015 IOM criteria applied to self-reported symptoms, and people with an
      earlier ME/CFS diagnosis were excluded. The rate of new ME/CFS was 2.66 per 100 person-years after
      infection and 0.93 in matched uninfected participants (hazard ratio 4.93, 95% CI 3.62-6.71); 847
      of the 1439 uninfected participants had no match, so the comparison used the other 592 (calculated
      from the reported counts). Across all infected participants, 531 of 11,785 (4.5%) met the criteria,
      against 9 of 1439 (0.6%) uninfected participants. The authors list possible recall bias and selection
      bias, earlier symptoms missed in people never diagnosed, and the severity of post-exertional malaise
      not being assessed as limits that could have led to overestimation, and say these issues are mitigated
      by enrolling participants within 30 days of infection. They also name factors that might have led
      to underestimation: hospitalized participants were excluded, symptoms wax and wane, the 2015 IOM
      criteria may not suit short-duration illness, participants unfamiliar with post-exertional malaise
      may not have reported it, and the most severely affected may have been unable to enrol or lost to
      follow-up. The card is at level 2 because of this study. No independent group has repeated it with
      a verified case definition, so it is unreplicated.'
    sources:
    - pmid:39804551
  - op: replace_paragraph
    field: level_reason
    index: 3
    text: 'Earlier studies that followed people from a documented infection point the same way but cannot
      count towards the level: three of the four studies below have case definitions that are not yet
      verified, and two have no comparison group without the infection. In a study of primary care patients,
      chronic fatigue syndrome was found in 9-22% six months after glandular fever and 0-6% after an ordinary
      upper respiratory tract infection. Ten years after a Q fever outbreak, it was found in 14 (19.4%)
      exposed people and 3 (4.2%) matched unexposed people among those examined in hospital. Two studies
      had no comparison group without the infection (their controls had recovered from the same infection),
      so they give a frequency after infection rather than a higher risk: in Australia, 28 of 253 people
      (11%) met the criteria six months after Epstein-Barr virus, Q fever or Ross River virus infection,
      at a similar rate after each. In a US college cohort, in which ME/CFS was assessed against the Fukuda,
      Canadian and IOM criteria (the cases met one or more of them, most only the Fukuda criteria), 55
      of 238 students (23%) met the criteria six months after infectious mononucleosis.'
    sources:
    - pmid:9926075
    - pmid:12145392
    - pmid:16950834
    - pmid:33367564
  - op: set_link_text
    to: question:who-is-vulnerable
    text: Two prospective studies compared people who did and did not develop ME/CFS after the same infection.
      One found that the severity of the acute illness predicted it more than demographic, psychological
      or microbiological factors; the other found more physical symptoms and immune differences, but not
      more psychological symptoms, before the infection in those who later developed ME/CFS. Each finding
      comes from a single study. The case definition of the first study is not verified yet; the second
      assessed ME/CFS against the Fukuda, Canadian and IOM criteria.
  checks:
    passed: true
    errors: []
  review:
    verdict: accept
    findings:
    - class: decisive
      operation: 0
      severity: advisory
      problem: 'Answers findings 0 and 1: the quote is verbatim in the cached full text (PMC8664491) and
        n_controls 67 matches ''Sixty-seven of the 157 asymptomatic students were recruited as matched,
        recovered controls.'' But the quote says only that ''in most cases'' the ME/CFS group (cases meeting
        exactly one definition) met the Fukuda criteria, so a few of the 55 may have met only the Canadian
        or only the IOM criteria. The label Fukuda is the broadest accepted definition of the three and
        does not overstate the cohort, but it reads as if every case met Fukuda. level_reason[3] already
        words this correctly (''most only the Fukuda criteria'').'
      fix: Optionally add a comment in the study block that the cases met one or more of Fukuda, CCC and
        IOM 2015, most only Fukuda, and that Fukuda is recorded as the broadest of them.
      targets:
      - studies[pmid:33367564].case_definition
    - class: decisive
      severity: advisory
      problem: 'Comments on the applied card still say the opposite of the change: the study block keeps
        ''PMC8664491 exists but Europe PMC returned no open full text ... without naming them. TODO: verify.'',
        the header still lists 33367564 among studies with no open full text and as ''unverified'', and
        the comment above links lists that both sources of question:who-is-vulnerable have unverified
        case definitions. Comments are not reader-facing, so this changes nothing a reader sees, but they
        will mislead the next drafter or auditor.'
      fix: In a later round, remove or update the stale comments (remove_comment for the study-block line).
      targets:
      - studies[pmid:33367564]
      - links[0]
    - class: wording
      target: level_reason[0]
      operation: 1
      severity: advisory
      problem: Answers finding 3. Every limit stated matches the cached full text (PMC11968624), including
        'These issues are mitigated by the enrollment of participants within 30 days of infection' and
        the five underestimation factors. The full text then adds that participants were mostly enrolled
        in the Omicron era and mostly vaccinated, 'so incidence and severity may be lower'; the list reads
        as complete without them.
      fix: Optionally write 'They also name factors, among others, that might have led to underestimation'.
      targets:
      - level_reason[0]
