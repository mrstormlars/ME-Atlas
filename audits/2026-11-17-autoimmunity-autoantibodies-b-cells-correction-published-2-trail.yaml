  - class: wording
    target: studies[pmid:40901516].finding
    severity: advisory
    problem: Request item 1, partly an error. The cached erratum (PMC12401010) says only that the last
      sentence of paragraph 7 of the Introduction said 'individuals with or without LC' and should say
      'individuals with or without ME/CFS', and that 'The original version of this article has been updated.'
      The erratum does not write out 'LC'. The corrected article (pmid:40703261, cached full text PMC12283730)
      does define it ('a post COVID-19 condition, or Long COVID (LC)'), so 'long COVID' is supported by
      a cached record on the card, though not by the erratum alone. The final sentence, 'It does not change
      the study's patient numbers, results or findings', is not in the erratum. It is an inference from
      the fact that only one Introduction sentence is corrected.
    fix: Remove the sentence 'It does not change the study's patient numbers, results or findings.' Optionally
      write 'individuals with or without LC (Long COVID, as the article defines it)' so that the expansion
      is visibly the article's own. Add nothing else.
    targets:
    - studies[pmid:40901516].finding
  - class: wording
    target: studies[pmid:32247028].finding
    severity: advisory
    problem: The finding says the review is 'by authors of antibody studies on this card'. The review
      has two authors (Wirth K, Scheibenbogen C). By the author facts, only Scheibenbogen C is an author
      of other studies on the card. Wirth K is not.
    fix: Write 'A review whose last author is also an author of antibody studies on this card' or 'A review
      co-written by an author of antibody studies on this card'.
    targets:
    - studies[pmid:32247028].finding
