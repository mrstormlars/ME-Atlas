pre_card_review:
  verdict: reject
  findings:
  - operation: null
    severity: must_fix
    problem: 'Study pmid:33050553 is labelled case_definition: none with case_definition_source: fulltext
      and no quote. Two places on the card say the paper does not name its case definition: level_reason
      paragraph 2 ("A later study from the same clinic, which does not name its case definition") and
      the diagnostic_marker reason ("The later sitting study came from the same clinic and does not name
      its case definition"). The cached full text (PMC7712289, Methods 2.1) contradicts this: "During
      the first visit, it was determined whether patients satisfied the criteria for CFS and ME, taking
      the exclusion criteria into account [ 4 , 5 ]." In its reference list, reference 4 is Carruthers
      et al. 2011, "Myalgic encephalomyelitis: International Consensus Criteria", and reference 5 is Fukuda
      et al. 1994. The card labels pmid:33585505 ICC from a sentence of the same kind ("met both the criteria
      for CFS (1) and ME (3)"), so the two labels are also inconsistent with each other.'
    fix: Set the label from the quoted Methods sentence, with case_definition_quote set to that sentence.
      Because the sentence says "whether patients satisfied" rather than "met both", Fukuda is the safe
      reading; ICC only if the drafter can show that every patient met both. Then reword level_reason
      paragraph 2 and the diagnostic_marker reason so they no longer say the paper names no case definition.
      Both can still say the study is from the same clinic and so is not an independent repeat. The level
      does not change.
  - operation: null
    severity: must_fix
    problem: The group field of pmid:25277740 ends "(same laboratory as 22180650; same numbers as 38682242)".
      pmid:38682242 is not among the card's studies and is not one of the cached records named in the
      context. The claim that another paper reports the same numbers cannot be checked from the sources
      given, and it points readers to a study the card does not cite.
    fix: Remove "; same numbers as 38682242" from the group field. The correction may not add a new study,
      so do not add 38682242 to the card.
  - operation: null
    severity: advisory
    problem: The early signal says hypocapnia (pmid:17263876) is "Not yet repeated by an independent group
      with a verified case definition." pmid:32140630 (Fukuda, no author shared with 17263876) measured
      end-tidal CO2 during tilt. Its Table 2 gives an end-tilt PetCO2 of 36 mmHg in controls against 32,
      32 and 26 mmHg in the patient groups, and its text says patients with an end-tilt PetCO2 of 30 mmHg
      or less had a greater fall in blood flow to the brain. It does not use 17263876's definition of
      orthostatic hypocapnia, and the table does not make clear which group comparisons its P values refer
      to, so the statement is not plainly wrong.
    fix: Optionally say the claim means repetition of orthostatic hypocapnia as 17263876 defined it, or
      note that 32140630 reports lower end-tilt end-tidal CO2 without testing that definition.
  - operation: null
    severity: advisory
    problem: Level_reason paragraph 6 says the two New York studies "found lower blood flow velocity in
      the brain on tilt". For pmid:22180650 the abstract says "Absolute mean CBFV was slightly less than
      in control subjects in CFS subject at each angle", and the angles include 0 degrees (supine).
    fix: Write "slightly lower blood flow velocity at each tilt angle" for 22180650, or describe each
      study separately.
  - operation: null
    severity: advisory
    problem: Level_reason paragraph 8 opens "Two small studies changed blood flow to the brain directly."
      Compression stockings (pmid:35056360) and phenylephrine (pmid:25277740) act on venous pooling and
      blood pressure, which then changed blood flow to the brain. "Directly" is stronger than either abstract
      states.
    fix: Write "Two small studies used an intervention that changed blood flow to the brain."
  - operation: null
    severity: advisory
    problem: 'Level_reason paragraph 4 says of pmid:17263876: "The difference lay in low carbon dioxide
      in the breath on standing". The abstract reports the rates separately: hypocapnia differed significantly,
      while tachycardia, hypotension and hypertension did not. "The difference lay in" reads as the paper''s
      own attribution, which it does not make in those words.'
    fix: Write "Of the separate abnormalities, only low carbon dioxide in the breath on standing differed
      significantly (20.6% against 2.9%)".
  - operation: null
    severity: advisory
    problem: 'pmid:42746015 and pmid:22850676 are listed in studies but no core_claim, level_reason, badge,
      subgroup, early signal or link text cites them. Their labels and findings match the cached records
      (42746015: quote present in PMC13574936, POTS in 7/18 patients against 0/18 controls; 22850676:
      9/36 against 9/43, not significant).'
    fix: No change needed for accuracy. Optionally cite them where they bear on the text, for example
      22850676 next to the other studies that found no difference.
