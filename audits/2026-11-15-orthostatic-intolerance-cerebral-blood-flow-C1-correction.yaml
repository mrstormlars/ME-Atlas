- op: replace_paragraph
  field: level_reason
  index: 1
  text: A later study from the same clinic found a similar fall while sitting in 100 severely ill patients
    (24.5%, against 0.4% in 15 healthy controls). Its methods sentence on the case definition refers to
    criteria for CFS and ME only by reference numbers and names no definition in the text, so the card
    does not record a recognised definition for it. Being from the same group, it does not count as a
    repeat by others.
  sources:
  - pmid:33050553
  - pmid:32140630
- op: replace_paragraph
  field: level_reason
  index: 3
  text: An independent study from New Jersey, of 62 patients meeting the Fukuda definition and 35 controls,
    found an abnormal standing test in 53% of patients and 20% of controls. Of the separate abnormalities,
    only low carbon dioxide in the breath on standing (hypocapnia) differed significantly (20.6% against
    2.9%); rates of orthostatic tachycardia and of a fall or rise in blood pressure did not differ significantly.
    It did not measure blood flow to the brain, so the card does not count it as a repeat of the Dutch
    finding.
  sources:
  - pmid:17263876
  - pmid:32140630
- op: replace_paragraph
  field: level_reason
  index: 5
  text: 'The card does not reach level 3: no independent group with a verified case definition has repeated
    the fall in blood flow to the brain. Two studies from a New York laboratory reported lower blood flow
    velocity in the brain in patients (in one, slightly lower velocity at each tilt angle; in the other,
    a fall of 22.5% in 15 patients against 8.7% in 11 controls on tilt), and a study from Osaka of 28
    young patients and 20 controls found slower recovery of brain oxygen on standing. A Johns Hopkins
    study of 26 patients and 23 controls found no difference in blood flow velocity at any of the measured
    time points (supine, 1 and 5 minutes after tilt, 5 and 1 minutes before the end, and at termination).
    The case definitions of all four are not yet verified, so none of them can support or contradict the
    card.'
  sources:
  - pmid:22180650
  - pmid:25277740
  - pmid:12006954
  - pmid:12593133
- op: replace_paragraph
  field: level_reason
  index: 7
  text: Two small studies used an intervention that changed blood flow to the brain. In a randomised crossover
    study of 16 patients from the Dutch clinic, compression stockings reduced the fall in blood flow to
    the brain during tilt (14% with stockings, 25% without); symptoms were not an outcome and the paper
    does not name the case definition. In the New York study of 15 patients, phenylephrine, which raises
    blood pressure, reduced the fall in blood flow velocity on tilt (8.1% against 22.5% untreated) and
    the slowing on a working-memory task; its case definition is not yet verified. Neither can count towards
    level 4.
  sources:
  - pmid:35056360
  - pmid:25277740
- op: replace_paragraph
  field: badges.diagnostic_marker.reason
  index: 0
  text: The Dutch study set a lower limit of normal at a 13% fall in blood flow to the brain, from its
    44 healthy controls, and found a larger fall in 82% to 100% of patients depending on their heart rate
    and blood pressure response. The later sitting study came from the same clinic, so it is not an independent
    patient group. No independent patient group has tested this cut-off.
  sources:
  - pmid:32140630
  - pmid:33050553
- op: replace_paragraph
  field: badges.explains_pem.reason
  index: 0
  text: 'No study at level 2 or above measures post-exertional malaise and links it to blood flow to the
    brain in the same patients. A study from the Dutch clinic, of patients with ME/CFS (its case-definition
    sentence cites numbered references and names no definition in the text), tracked pain, fatigue and
    concentration scores after a tilt test in 278 patients and 30 healthy controls: scores rose in patients
    and were still higher after 7 days, while controls'' did not change. The size of the fall in blood
    flow to the brain was not related to the change in symptoms. A passive tilt is orthostatic stress
    rather than physical or mental effort, so the card does not count it as a direct measure of post-exertional
    malaise.'
  sources:
  - pmid:33585505
- op: replace_paragraph
  field: early_signals
  index: 0
  text: A study of n=62 patients and 35 controls found low carbon dioxide in the breath on standing (orthostatic
