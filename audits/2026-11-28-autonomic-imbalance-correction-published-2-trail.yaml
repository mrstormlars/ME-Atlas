  (findings 1-6, first target each); attempt 2 was refused at step 3 (audits/2026-11-27-autonomic-imbalance-correction-published-2-trail.yaml);
  fourth attempt (DECISIONS 2026-11-28, 'A fourth attempt for autonomic-imbalance'), two items added verbatim
