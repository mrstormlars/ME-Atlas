      target: level_reason[7]
      operation: 2
      severity: advisory
      problem: Operation 2 (answers findings 0 and 1 of the review) writes 'diagnosed according to the
        CDC criteria (version not stated in the text read, ...)'. 'The text read' is an internal phrase
        a reader cannot place, and the paper's methods sentence cites reference 4, which the cached file
        PMC1770867.html resolves as Fukuda et al. 1994 (the reference list was left out of the context
        text). The CDC_unspecified label is the fallback the review allowed and is ranked and flagged
        the same as Fukuda, so level, role and contested mark are unaffected.
      fix: Write 'diagnosed according to the CDC criteria (version not named in the methods, so the definition
        does not require post-exertional malaise)', or drop the parenthetical's first clause.
      targets:
      - level_reason[7]
    - class: wording
      target: level_reason[7]
      operation: 2
      severity: advisory
      problem: 'Carried over from the earlier text: ''A London study of 49 patients''. The record says
        the patients were referrals to the King''s College Hospital CFS Service from the South East of
        England; it does not say London.'
      fix: Write 'A study of 49 patients from the South East of England' or keep as is.
      targets:
      - level_reason[7]
