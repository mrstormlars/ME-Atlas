operations:
- op: replace_paragraph
  field: level_reason
  index: 0
  text: 'A controlled study of 84 patients meeting the Canadian Consensus Criteria and 71 sedentary controls
    repeated a maximal exercise test after 24 hours. Unlike controls, patients did not reproduce their
    first-day results: oxygen use and work fell at peak effort and at the ventilatory threshold on the
    second day. Rung 2 rests on this study.'
  sources:
  - pmid:38965566
- op: replace_paragraph
  field: level_reason
  index: 4
  text: The card is at level 3 because independent groups found parts of the same result in separate cohorts.
    Each has a limit, and rungs 2 and 3 are contested (see the contested note).
  sources:
  - pmid:38965566
  - pmid:20937116
  - pmid:34198913
  - pmid:34198946
  - pmid:31161646
- op: propose
  target: contested
  value:
  - 2
  - 3
  reason:
  - text: Rung 3 rests on independent studies that found the same result as the 84-patient study, whose
      patients met the Canadian Consensus Criteria. The clearest, a Fukuda study of 15 women patients
      and 15 controls from Amsterdam, is contradicted by a study from New York of 58 patients and 25 sedentary
      controls that found no significant change in peak oxygen use between the first and second day. Its
      patients met the 1994 case definition modified to require post-exertional malaise. With the same
      case definition, a control group and 53 (= 58 - 5) patients with maximal tests, against 15, it is
      of comparable quality.
    sources:
    - pmid:20937116
    - pmid:42212259
    - pmid:38965566
  - text: The two Dutch clinic studies of women and men point the same way, but the case definition recorded
      for them (International Consensus Criteria) is read from a citation to the International Consensus
      Criteria next to the Fukuda criteria, and they compare patients with people who have chronic fatigue
      without ME/CFS rather than with healthy controls.
    sources:
    - pmid:34198913
    - pmid:34198946
  - text: 'The Oslo study, which meets the Canadian Consensus Criteria, found the same result only in
      part: power output at the threshold fell more in patients than in controls, but the changes in oxygen
      use did not differ between groups.'
    sources:
    - pmid:31161646
  - text: 'Rung 2 rests on the 84-patient study. The New York study found no significant change in peak
      oxygen use from the first to the second day. Whether it is of comparable quality to the 84-patient
      study depends on its case definition, which the records do not settle: its own sentence says its
      patients met both the 1994 case definition, modified to require post-exertional malaise, but names
      no second definition, while a companion paper by the same authors, on 57 patients with the same
      age (38.6 ± 9.6 years) and the same weekly leisure activity score in patients (27.7 ± 35.5), says
      its patients met the 2015 IOM definition. If the 2015 IOM definition applies, it ranks with the
      Canadian Consensus Criteria and, with a control group and 53 (= 58 - 5) patients with maximal tests
      against 84, the New York study would be of comparable quality to the 84-patient study. Rung 2 is
      therefore marked as contested too; the card records Fukuda for the New York study from its own sentence.'
    sources:
    - pmid:38965566
    - pmid:42212259
    - pmid:41293716
- op: replace_paragraph
  field: badges.explains_pem.reason
  index: 2
  text: In a cohort from the same research group and test sites as the 84-patient study, 78 patients took
    on average about 12.7 days to recover from the two-day test, against 2.1 days for 64 sedentary controls;
    the paper reports the exercise test results separately and does not relate recovery to oxygen use
    or work.
  sources:
  - pmid:36984572
- op: update_study
  id: pmid:35358096
