    severity: must_fix
    problem: 'level_reason[0] ends ''The card is at level 2 because of this study.'' The card''s level
      is 3 (level: 3, and level_reason[4] says ''The card is at level 3 because independent groups found
      parts of the same result''). A reader is told two different levels. What pmid:38965566 supports
      is rung 2 (a controlled CCC study, 84 patients and 71 sedentary controls), not the card''s level.'
    fix: Replace the last sentence with 'Rung 2 rests on this study.' (or equivalent), so that it names
      the rung, not the card's level.
    targets:
    - level_reason[0]
  - operation: null
    severity: must_fix
    problem: 'contested_reason[3] states as settled that ''Rung 2 rests on the 84-patient study and is
      not contested: the New York study uses the Fukuda definition, which ranks below the Canadian Consensus
      Criteria'', and contested.rungs is [3] only. The cached New York full text (PMC13213420) says ''They
      all met both the 1994 case definition of ME/CFS, modified to require endorsement of post-exertional
      malaise (Table 1).'' The word ''both'' announces two definitions but names one. The companion paper
      pmid:41293716 (PMC12640868), by 8 of the same authors, reports 57 patients ''F:M = 46:11'' with
      ''an average age of 38.6 +/- 9.6 years'', 25 sedentary controls ''F:M = 20:5'', and a Godin score
      of ''27.7 +/- 35.5'' in patients; the New York paper reports 58 patients aged 38.6 +/- 9.6, 47 women
      and 11 men, 25 controls (20 women, 5 men) and the same Godin score 27.7 +/- 35.5. The companion
      paper says these patients ''met the 2015 IOM case definition''. The records therefore do not establish
      that the New York cohort is Fukuda only. If IOM 2015 applies, the New York study is of comparable
      quality to the rung 2 study under the rubric: IOM 2015 ranks with CCC, it has a control group, and
      its 53 patients with maximal tests on both days (the measurement that bears on the finding) are
      more than half of 84. It found ''no significant changes in Peak VO2 between Day 1 and Day 2'' and
      no change in VO2 at VT, which contradicts the second-day fall that rung 2 rests on. This is the
      objection of the C2 audit (part 0) and of the first audit (part 2), and the draft still asserts
      the uncontested reading. The card label ''Fukuda'' on pmid:42212259 is the only named definition
      in its own sentence, but the card must not use it to close the question.'
    fix: 'Do not state that rung 2 is not contested on the ground that the New York study is Fukuda only.
      On these records, the reading the evidence supports is that the uncontested status of rung 2 cannot
      be established: either set contested.rungs to [2, 3] and write in contested_reason[3] that the New
      York study (53 patients with maximal tests on both days, 19 controls) found no second-day change
      and that a companion paper by the same authors, on a cohort with the same age, sex split, controls
      and activity score, names the 2015 IOM definition, so it may be of comparable quality to the 84-patient
      CCC study; or, if the drafter keeps rung 2 uncontested, the reason must say only what the records
      say (the New York sentence names the 1994 definition modified to require PEM and says ''both'' without
      naming the second; the companion paper names IOM 2015) and leave the decision to the auditor. The
      auditor decides the mark.'
    targets:
    - contested
    - contested_reason[3]
    - studies[pmid:42212259].case_definition
