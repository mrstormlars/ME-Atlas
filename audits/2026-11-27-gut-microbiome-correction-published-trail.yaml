        based on who met the 1994 CDC Fukuda (Fukuda et al., 1994) and/or Canadian consensus criteria
        for ME/CFS (Carruthers, 2007).
      n_patients: 149
      finding: A study of 149 patients (74 ill for under 4 years and 75 ill for over 10 years; the abstract
        gives 75 and 79 for the two patient groups) and 79 healthy controls found clear differences in
        gut bacteria mainly in the shorter-ill patients, and reported less bacterial butyrate production
        and lower plasma isobutyrate in the shorter-ill group. The paper's recruitment sentence says patients
        met the Fukuda and/or Canadian criteria, while its Participants section says they were required
        to fulfil the International Chronic Fatigue Syndrome Study Group research criteria, the Canadian
        Consensus Criteria and the IOM clinical diagnostic criteria; the card records the lower-ranked
        Fukuda.
  - op: replace_paragraph
    field: level_reason
    index: 5
    text: Other studies report different bacteria. A study of Norwegian and Belgian patients (case definition
      not yet verified) found more Alistipes in Norwegian patients, while the Chinese study found Alistipes
      lower; its text says the fall did not survive correction for multiple testing, while its Fig. 4
      lists Alistipes among taxa that differed after correction. A study of 149 patients, 74 ill for under
      4 years and 75 ill for over 10 years (the abstract gives 75 and 79), and 79 healthy controls found
      clear differences in gut bacteria mainly in the shorter-ill group, and reported less bacterial butyrate
      production and lower plasma isobutyrate in the shorter-ill group. Its recruitment sentence names
      the Fukuda and/or Canadian criteria, while its Participants section says patients had to meet the
      International Chronic Fatigue Syndrome Study Group research criteria, the Canadian Consensus Criteria
      and the IOM clinical diagnostic criteria; the card records Fukuda, the lower-ranked definition.
