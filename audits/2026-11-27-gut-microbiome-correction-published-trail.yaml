review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'Request item 2 is an error. pmid:36758521 is recorded with case_definition ''unverified''
      (no source, no quote), and level_reason[5] says ''(case definition not yet verified)'' for it. Its
      cached full text (data/cache/europepmc/PMC10353054.html) states the case definition: ''All subjects
      were recruited at Bateman Horne Center, Salt Lake City, UT, based on who met the 1994 CDC Fukuda
      (Fukuda et al., 1994) and/or Canadian consensus criteria for ME/CFS (Carruthers, 2007).'' The same
      full text also says, in its Participants section, ''Enrolled ME/CFS participants were required to
      fulfill the International Chronic Fatigue Syndrome Study Group research criteria, the Canadian Consensus
      Criteria, and the IOM clinical diagnostic criteria'', which conflicts with ''and/or''.'
    fix: Set case_definition to Fukuda (the 'and/or' sentence guarantees only Fukuda), case_definition_source
      to fulltext, and case_definition_quote to the 'and/or' sentence verbatim; write out that the paper
      elsewhere says patients had to meet Fukuda, the Canadian criteria and the IOM criteria. In level_reason[5],
      replace '(case definition not yet verified)' for this study with the stated definition and the conflict.
      Leave the Norwegian and Belgian study (pmid:23791918) as not yet verified; no full text of it is
      cached.
    targets:
    - studies[pmid:36758521].case_definition
    - studies[pmid:36758521].case_definition_source
    - studies[pmid:36758521].case_definition_quote
    - level_reason[5]
  - class: decisive
    severity: must_fix
    problem: 'Request items 3 and 5 (and the number part of item 4) are errors. The card gives pmid:36758521
      n_patients 154, and level_reason[5] and the study''s finding say ''75 patients ill for under 4 years
      and 79 ill for over 10 years''. These numbers come from the abstract (''short-term (<4 years, n
      = 75) or long-term disease (>10 years, n = 79)''), but the cached full text gives 149 patients three
      times: Methods ''We enrolled a total of 149 ME/CFS patients (of which 74 had been diagnosed with
      ME/CFS <4 years before recruitment and 75 had been diagnosed with ME/CFS >10 years before recruitment)
      and 79 healthy controls'', Results ''We enrolled 228 participants; 149 with ME/CFS (74 short-term
      and 75 long-term)'', and its statistics use ''ME/CFS N=149''. The card states the abstract''s numbers
      as fact without the discrepancy.'
    fix: Set n_patients to 149 and say 74 ill for under 4 years and 75 ill for over 10 years (79 controls)
      in level_reason[5] and the finding, adding that the abstract gives 75 and 79.
    targets:
    - studies[pmid:36758521].n_patients
    - studies[pmid:36758521].finding
    - level_reason[5]
  - class: decisive
    severity: must_fix
    problem: 'Request item 4 (the blood result) is an error. level_reason[5] says the study ''reported
      ... lower butyrate in blood'' and the finding says ''lower blood butyrate''. The abstract says ''a
      reduction in plasma butyrate'', but the full text shows the measured plasma metabolite was isobutyrate,
      and only in the short-term group: ''Strikingly, we found a depletion in plasma isobutyrate in the
      short-term group (Figure 6A, p = 0.03, Wilcoxon rank-sum test with Bonferroni correction ...)''.
      Stating lower blood butyrate across patients says more than the measurement. The fix states a fact
      from the full text of a flagged study, so it is decisive.'
    fix: Replace 'lower butyrate in blood' / 'lower blood butyrate' with 'lower plasma isobutyrate in
      the shorter-ill group', citing pmid:36758521, or remove the blood result.
    targets:
    - studies[pmid:36758521].finding
    - level_reason[5]
