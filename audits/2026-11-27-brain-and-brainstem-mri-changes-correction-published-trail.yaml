request:
- target: studies[pmid:30497131].finding
  problem: 'The full-text scan found that the full text states something the card lacks: The full text
    reports a third main result, a negative correlation between brainstem and sensorimotor T1wSE signal
    in both patients and controls, which the card''s finding does not mention. Quote from the full text:
    A strong negative correlation was detected between signal levels from the brainstem and sensorimotor
    WM for both CFS and healthy controls (Fig. 4, Table 2).'
- target: studies[pmid:31671321].n_patients
  problem: 'The full-text scan found that the full text differs from the card: The task analysis, which
    the finding is about, used 44 patients (one excluded); the card gives 45 scanned. Quote from the full
    text: Visual inspection found unacceptable signal dropout or inadequate spatial normalization in the
    resting fMRI in 3 ME/CFS and 2 HC, and in the task fMRI in one ME/CFS and one HC. These subjects were
    excluded from the analysis.'
- target: studies[pmid:31671321].n_controls
  problem: 'The full-text scan found that the full text differs from the card: The task analysis used
    26 controls (one excluded); the card gives 27 scanned. Quote from the full text: Visual inspection
    found unacceptable signal dropout or inadequate spatial normalization in the resting fMRI in 3 ME/CFS
    and 2 HC, and in the task fMRI in one ME/CFS and one HC. These subjects were excluded from the analysis.'
- target: studies[pmid:31671321].finding
  problem: 'The full-text scan found that the full text states something the card lacks: The full text
    also reports associations of connectivity with symptom severity scores during task, which the card
    finding lacks. Quote from the full text: Regressions of individual subject brainstem connectivity
    with ME/CFS severity yielded 3 significant associations for the ME/CFS group during task fMRI but
    none for rest.'
- target: level_reason[3]
  problem: 'The full-text scan found that the full text differs from the card: level_reason[3] gives 45
    patients and 27 controls for the task result; the full text analysed 44 and 26 for task. Quote from
    the full text: Visual inspection found unacceptable signal dropout or inadequate spatial normalization
    in the resting fMRI in 3 ME/CFS and 2 HC, and in the task fMRI in one ME/CFS and one HC. These subjects
    were excluded from the analysis.'
review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'The card gives 45 patients and 27 controls for the task connectivity result of pmid:31671321
      (study n_patients 45, n_controls 27; level_reason[3]: ''weaker connections between brainstem regions
      during a task (45 patients meeting the Fukuda definition ... and 27 controls)''). The cached full
      text (PMC6835065) says 45 patients and 27 controls were scanned, but ''in the task fMRI in one ME/CFS
      and one HC'' had unacceptable signal dropout and ''These subjects were excluded from the analysis'',
      and it refers to ''the same N = 26 as HC'' for the task analysis. So the task result, the only result
      the card''s finding and level_reason[3] report, comes from 44 patients and 26 controls. Elsewhere
      the card gives the number analysed (16 of 18 for pmid:35355311).'
    fix: 'Give the task analysis numbers from the full text: 44 patients and 26 controls (45 and 27 were
      scanned; one of each was excluded from the task analysis for signal dropout), in level_reason[3]
      and in the study''s n_patients and n_controls, or state both numbers in the same way the card does
      for pmid:35355311.'
    targets:
    - studies[pmid:31671321].n_patients
    - studies[pmid:31671321].n_controls
    - level_reason[3]
rounds:
- round: 1
  operations:
  - op: update_study
    id: pmid:31671321
    set:
      n_patients: 44
      n_controls: 26
  - op: replace_paragraph
    field: level_reason
    index: 3
    text: 'Other controlled studies from the same group as the level 2 study, using different measures,
      also report brainstem differences: weaker connections between brainstem regions during a task (45
      patients meeting the Fukuda definition, which does not require post-exertional malaise, and 27 controls
      were scanned; one patient and one control were excluded from the task analysis for signal dropout,
      leaving 44 (= 45 - 1) patients and 26 (= 27 - 1) controls), a lower T1-weighted MRI signal in a
      brainstem region (43 patients meeting the Fukuda definition and 27 controls), weaker connections
      between the pons and the cerebellum during a task (31 patients meeting the Canadian or International
      criteria and 15 controls), and a larger pons and whole brainstem at 7 Tesla (10 patients and 10
      controls). None of these results has been repeated by an independent group.'
