operations:
- op: propose
  target: level
  value: 1
  reason:
  - text: 'A study from Griffith University, Australia, of 12 patients with moderately severe and 6 with
      severe ME/CFS meeting the International Consensus Criteria, and 13 healthy controls, found more
      of a type of immature mast cell (CD117+CD34+FcεRI-chymase-) among blood immune cells in moderately
      severe and severe patients compared with healthy controls. Its authors call it a preliminary study
      and write that further investigation is required. It meets the wording of level 2 in form (a controlled
      study with a recognised case definition), but it is a single study with a very small sample, one
      of the grounds on which the rubric holds a level back, and it has not been repeated by an independent
      group. The card is therefore at level 1: small studies point towards the hypothesis.'
    sources:
    - pmid:27362406
  - text: The same group later studied mast cell precursors in 11 patients meeting the International Consensus
      Criteria, 9 people with systemic mastocytosis and 12 healthy controls, using a different method
      that first separates these cells from the blood. It found no significant differences between groups
      in the maturity markers CD34 and FcεRI, the markers that defined the population the first study
      found increased. Because the group is the same, this study cannot be a repeat. The records do not
      say whether this measures the same thing as the share of blood immune cells reported in the first
      study, so the card does not decide whether it contradicts that finding.
    sources:
    - pmid:29223146
    - pmid:27362406
  - text: No other study on this card has measured mast cells, or substances released mainly by mast cells
      such as tryptase or histamine, in patients with a recognised case definition against a control group.
      Higher blood MMP-9, an enzyme that mast cells and other cells can release, in 18 patients than in
      18 controls does not show that the patients' mast cells were the source.
    sources:
    - pmid:42327760
  - text: Two older studies, whose case definitions are not yet verified, cannot count. A study from Harvard
      of lip salivary gland tissue from 11 patients and controls found that the presence of mast cells
      was the only one of seven features that differed significantly between the groups. A study from
      Washington, DC, of 95 patients and 109 controls found no difference in IgE, the antibody that arms
      mast cells in allergy.
    sources:
    - pmid:10884641
    - pmid:11570618
  - text: An Austrian study of patients meeting the 2015 Institute of Medicine criteria reports how often
      patients' records met symptom and treatment-response criteria for mast cell activation, not a measurement
      against controls (see below). The only controlled treatment trial on this card, of the antihistamine
      terfenadine in 28 patients, has a case definition that is not yet verified and found no benefit,
      so it cannot count towards level 4.
    sources:
    - pmid:41300853
    - pmid:8568124
