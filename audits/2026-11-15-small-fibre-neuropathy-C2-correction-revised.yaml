- op: update_study
  id: pmid:42082542
  set:
    group: Gómez-Esteban JC, Biobizkaia Health Research Institute, Cruces University Hospital, Barakaldo,
      Spain (same group as 37968647, 39888240, 42286686)
- op: update_study
