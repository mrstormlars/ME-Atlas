  - operation: null
    severity: advisory
    problem: 'level_reason[0] and level_reason[2] keep the card at level 1 even though pmid:41576003 is
      a controlled study (73 historical controls) in 170 patients meeting ICC or National Academy of Medicine
      criteria. The stated reason is supported by the cached full text: the tables give an overall Kruskal-Wallis
      or chi-squared test across four groups plus pairwise tests only for ME/CFS-Long COVID, ME/CFS-hEDS
      and Long COVID-hEDS, with no ME/CFS-control comparison; the controls are historical and the sample
      comes from a referral centre. Level 1 is a conservative reading that the rubric allows. A reader
      could argue for level 2 from the overall test (SFN on biopsy 52.6% against 0.0%, overall p < 0.001).
      The auditor decides the level.'
    fix: No change needed. The auditor should note that the level rests on reading 'supports' as needing
      a direct ME/CFS-control test.
