  findings:
  - operation: null
    severity: advisory
    problem: badge_reasons.diagnostic_marker[0] calls an area under the curve of 0.690 (p = 0.032) 'modest
      accuracy'. The number and p value match the cached full text of pmid:39888240 ('In ME/CFS patients,
      the variable that best discriminated between them and HC was also fiber tortuosity (AUC = 0.690;
      p = 0.032)'), but the paper does not use the word 'modest'. The gloss weakens rather than strengthens
