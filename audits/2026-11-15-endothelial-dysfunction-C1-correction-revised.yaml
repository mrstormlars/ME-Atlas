    severity: must_fix
    problem: level_reason paragraph 2 (sources pmid:33829023, pmid:32154656) says post-occlusive reactive
      hyperaemia is "the measure closest to the Berlin index". Neither cached source says this. pmid:33829023
      describes PORH as a skin blood-flow measure of small vessels ("endothelial function affecting both
      large and small vessels"). pmid:32154656 measured the reactive hyperaemia index by finger tonometry
      (EndoPAT2000). Neither paper compares the two methods. The phrase is the drafter's own reasoning,
      and it makes the level-3 repeat read as closer than the sources show.
    fix: 'Delete "the measure closest to the Berlin index", or say only what the records state, for example:
      "The rise in skin blood flow after blood flow to the arm was briefly stopped (post-occlusive reactive
      hyperaemia), a measure of small-vessel function, was lower in 39 patients than in 30 healthy people."
      Keep the sentence that says the two groups used different methods.'
