operations:
- op: replace_paragraph
  field: level_reason
  index: 1
  text: 'A later study from Bergen, Norway, with no authors shared with the Berlin study, tested patients
    meeting the Canadian Consensus Criteria with two other methods. The rise in skin blood flow after
    blood flow to the arm was briefly stopped (post-occlusive reactive hyperaemia) was lower in 39 patients
    than in 30 healthy people. Widening of the arm artery (flow-mediated dilation) was lower in 35 patients
    than in 66 healthy women (median 5.9% against 7.7%); this control group was all women, while 78% of
    the patients were women. The card is at level 3 because this independent group found reduced endothelial
    function in a separate cohort. The repeat is partial: the two groups used different methods, and the
    paper says it had no designated control group of its own, but used healthy people from two other studies
    by the same authors.'
  sources:
  - pmid:33829023
  - pmid:32154656
- op: replace_paragraph
  field: level_reason
  index: 5
  text: Against these findings, a study from California of 24 patients and 24 sedentary controls found
    no statistically significant difference in the reactive hyperaemia index at rest (p = 0.07), during
    recovery or 18 hours after an exercise test. The authors applied the Fukuda definition with post-exertional
    malaise required and say this corresponds to the International Consensus Criteria; the card records
    Fukuda. Fukuda ranks below the Canadian Consensus Criteria on the published ladder, so this study
    does not contest the level. A study from New Zealand using the International Consensus Criteria found
    no difference in arterial stiffness between patients and controls at rest; arterial stiffness is a
    different measure from the widening tested above.
  sources:
  - pmid:29426834
  - pmid:33671082
- op: replace_paragraph
  field: badges.explains_pem.reason
  index: 0
  text: 'No study on this card tracks symptoms after an exertion challenge and links them to endothelial
    function or clotting in the same patients. Two studies measured vessel function after an exercise
    test, without tracking symptoms: one found no difference in the reactive hyperaemia index 18 hours
    later, and one found that arterial stiffness 48 hours later fell within the control group but not
    within the patient group (7 each at 48 hours); its table gives a between-group p value of 0.21 for
    the augmentation index at 48 hours.'
  sources:
  - pmid:29426834
  - pmid:33671082
- op: remove_link
  to: orthostatic-intolerance-cerebral-blood-flow
