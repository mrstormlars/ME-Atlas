    and the card has no links.
- finding: first.parts[10]
  class: wording
  target: studies[pmid:31330791].finding
  problem: The finding for pmid:31330791 says the review states that causal links 'cannot be discerned
    from clinical correlation alone' and that it is cited on the map for links. The abstract does not
    say this, and the card has no links.
- finding: second.parts[6]
  class: wording
  target: level_reason[4]
  problem: level_reason[4] calls the 22-patient study 'a study from Oxford'. Its record names no place
    or institution, so the statement cannot be matched to the record, and with an unverified case definition
    a reader may take it for an Oxford-criteria cohort.
- finding: second.parts[7]
  class: wording
  target: contested_reason[3]
  problem: contested_reason[3] calls the 1 microgram Synacthen study 'a London study'. Its record names
    no place or institution, so the statement cannot be matched to the record.
operations:
- op: replace_paragraph
  field: level_reason
  index: 4
  text: 'Several studies cannot count towards the level because their case definition is not yet verified.
    They point in both directions: lower evening plasma cortisol and lower urinary cortisol in 30 patients
    compared with 72 volunteers; lower urinary cortisol in 121 clinic patients compared with 64 people
    without the illness; a flatter rise in morning saliva cortisol in women, but not men, in a population-based
    study of 75 people with the illness and 110 well controls; and no difference in saliva or urinary
    cortisol in 22 patients.'
  sources:
  - pmid:1659582
  - pmid:11282703
  - pmid:18160468
  - pmid:9494707
- op: replace_paragraph
  field: contested.reason
  index: 3
  text: The Dinan group's low-dose ACTH study is not needed for level 2, which rests on its CRH study.
    With the same 1 microgram ACTH test, that study found a smaller cortisol rise in 20 patients than
    in 20 volunteers, and another study found no difference between 20 patients and 20 controls; both
    used CDC criteria and a control group.
  sources:
  - pmid:9713562
  - pmid:10594524
