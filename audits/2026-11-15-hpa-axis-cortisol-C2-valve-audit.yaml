    where it was done, and the word reads like the Oxford case definition, which the card has not verified.
- finding: first.parts[8]
  class: wording
  target: contested_reason[3]
  problem: contested_reason[3] calls pmid:10594524 'a London study'. Its record does not say where it
    was done, so the place cannot be matched to a sentence.
- finding: first.parts[9]
  class: wording
  target: studies[pmid:41516296].finding
  problem: The finding for pmid:41516296 says the review covers 'abnormal HPA-axis hormone levels' and
