card_review:
  verdict: reject
  findings:
  - operation: null
    severity: must_fix
    problem: 'level_reason[6] opens ''Several studies cannot count towards the level because their case
      definition is not yet verified'' and then lists ''the Newcastle study found lower white matter volume
      overall'' (pmid:29021956) among them. That study''s case definition is verified on the card (Fukuda,
      from the full text: ''Participants were not selected according to any criteria other than fulfilling
      the Fukuda diagnostic criteria of CFS''), it has role supports, and level_reason[4] uses it as evidence.
      The paragraph therefore misstates the case-definition status of a study that the card''s level reasoning
      relies on, and a reader would take the Newcastle result as excluded. Classed decisive because the
      error is about a study''s case definition and how it counts on the ladder.'
    fix: 'Remove ''and the Newcastle study found lower white matter volume overall'' (and pmid:29021956
      from that paragraph''s sources), so the paragraph lists only the studies with an unverified case
      definition (pmid:25353054, pmid:15955487, pmid:37331007). If the overall white matter result is
      wanted, state it in level_reason[4], where the Newcastle study is described: its abstract says ''Accounting
      for total intracranial volume, patients had larger GM volume and lower WM volume.'''
    class: decisive
  - operation: null
    severity: advisory
    problem: level_reason[2] says pmid:40624094 has 'no authors shared with the level 2 study'. That is
      correct against pmid:34355438, but its author list includes Shan Z and Del Fante P, who are co-authors
      of other Griffith/Adelaide papers on the card (pmid:31671321, pmid:30497131 for Shan; pmid:21560176
      for Del Fante). The sentence does not claim independence, so this does not change the meaning, but
      a researcher checking independence may want it stated.
    fix: Optionally add that two of its authors appear on other Griffith/Adelaide studies on the card.
