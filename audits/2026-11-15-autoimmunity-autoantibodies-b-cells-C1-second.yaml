card: autoimmunity-autoantibodies-b-cells
decision: accept
parts:
  - decision_part: "The level 2: a controlled study in a CCC/ICC/IOM-defined group (the Swedish two-cohort study) found higher receptor antibodies than in matched controls."
    rubric: "A controlled study in patients with a recognised case definition supports it."
    evidence:
      - source: pmid:34589868
        quote: "All patients at both Stora Skondal and Gottfries clinics fulfilled the Canadian Concensus Criteria, the International Concensus Criteria and the IOM criteria"
      - source: pmid:34589868
        quote: "Significant increases in autoantibody levels in ME patients compared to controls were found for M3 and M4 -receptors in both cohorts and β1, β2, M3 and M4-receptors in one cohort."
    class: none
  - decision_part: "Not level 3: the only independent group (Spain, Fukuda) reproduced the β2 difference only, did not reproduce the M3/M4 difference, and made no correction for multiple comparisons; a larger antigen-profiling study found no differences."
    rubric: "An independent group has reproduced the finding in a separate cohort."
    evidence:
      - source: pmid:42082542
        quote: "No significant differences were found in the titers of AAbs against muscarinic AChR or AdR α1 and β1 between groups."
      - source: pmid:42082542
        quote: "Given the exploratory nature of the study, no correction for multiple comparisons was applied, and results should therefore be interpreted with caution."
      - source: pmid:40141440
        quote: "our analysis of 172 participants revealed no significant differences in autoantibody reactivities between ME/CFS patients and controls, including against GPCRs such as β-adrenergic receptors."
    class: none
  - decision_part: "Not level 4: the larger placebo-controlled rituximab trial (CCC) found no benefit, and the smaller trial's primary end point was negative; antibody-lowering treatments were uncontrolled."
    rubric: "Changing the proposed factor changes the outcome in a controlled experiment, so the link goes beyond association."
    evidence:
      - source: pmid:30934066
        quote: "B-cell depletion using several infusions of rituximab over 12 months was not associated with clinical improvement in patients with ME/CFS."
      - source: pmid:22039471
        quote: "The primary end-point, defined as effect on self-reported Fatigue score 3 months after intervention, was negative."
      - source: pmid:29543914
        quote: "10 patients with post-infectious CFS/ME and elevated ß2 autoantibodies were treated with IA with an IgG-binding column for 5 days."
    class: none
  - decision_part: "No contested mark: the contradicting antibody study with a control group and a stated definition (Spain) uses Fukuda, a broader definition than the CCC/ICC/IOM of the study that carries level 2, so it is not of comparable quality."
    rubric: "Comparable quality means all three: the same or a stricter case definition (CCC, ICC and IOM 2015 rank above Fukuda and Holmes 1988, which rank equal and above Oxford), a control group, and at least half the sample size of the study it contradicts."
    evidence:
      - source: pmid:42082542
        quote: "For the ME/CFS group, patients had to meet the diagnostic criteria proposed by Fukuda28"
    class: none
  - decision_part: "Diagnostic marker badge false: the only cut-off applied in a second group was the test maker's, not derived from the study population, and the antibody profiles did not separate the groups."
    rubric: "Yes only when a measurable marker linked to the hypothesis has been tested in a second, independent patient group, with a stated case definition."
    evidence:
      - source: pmid:42082542
        quote: "These thresholds are assay-specific and were not derived from the present study population."
      - source: pmid:42082542
        quote: "Thus, PCA did not reveal a distinct clustering pattern, suggesting limited discriminatory power in this dataset."
      - source: pmid:34589868
        quote: "In total 25% of controls, 79% of SK-patients and 91% of GC patients had at least one increased receptor autoantibody."
    class: none
  - decision_part: "Explains PEM badge false: no study measures PEM directly with an exertion challenge; the Swedish study found no correlation with severity and the post-COVID immunoadsorption study reported questionnaire changes without a control group."
    rubric: "Yes only when at least one study at level 2 or above measures PEM directly"
    evidence:
      - source: pmid:34589868
        quote: "No significant correlations were found between autoantibody levels and disease severity."
      - source: pmid:39759581
        quote: "Further lasting improvements were reported in fatigue, post-exertional malaise, pain, cognitive, autonomic, and immunological symptoms."
    class: none
  - decision_part: "Layer mechanism: the hypothesis is an ongoing autoimmune process that keeps the illness going."
    rubric: "Every node sits in exactly one layer, from root to experience"
    evidence:
      - source: pmid:22039471
        quote: "suggests that CFS is an autoimmune disease and may be consistent with the gradual elimination of autoantibodies preceding clinical responses."
    class: none
  - decision_part: "Link to orthostatic-intolerance-cerebral-blood-flow at step proposed, sourced to a review that states the link; the card says it was not tested in patients."
    rubric: "A peer-reviewed source (a review counts) that states the link. Not studied directly in patients."
    evidence:
      - source: pmid:32247028
        quote: "As both ß2AdR and M3 acetylcholine receptor are important vasodilators, we would expect their functional disturbance to result in vasoconstriction and hypoxemia."
      - source: pmid:32247028
        quote: "Muscular and cerebral hypoperfusion has been shown in ME/CFS in various studies and correlated with fatigue."
    class: none
  - decision_part: "Link to hpa-axis-cortisol at step associated: one cohort with recognised definitions measured hypothalamic/pituitary antibodies and hormone levels in the same patients and reports a relation."
    rubric: "A study in an ME/CFS cohort with a recognised case definition that measured both ends in the same patients and reports a relation between them."
    evidence:
      - source: pmid:34254637
        quote: "Thirty women with ME/CSF (group 1) diagnosed according to Fukuda, Canadian, and Institute of Medicine criteria, at Stanford University, were enrolled and compared with 25 age-matched healthy controls."
      - source: pmid:34254637
        quote: "Both AHA and/or APA at high titers were associated with hypothalamic/pituitary dysfunction"
    class: none
  - decision_part: "Link to autonomic-imbalance at step associated: a Fukuda cohort measured receptor antibodies and autonomic function in the same patients and reports a correlation; the card states the caveats."
    rubric: "A study in an ME/CFS cohort with a recognised case definition that measured both ends in the same patients and reports a relation between them."
    evidence:
      - source: pmid:42082542
        quote: "Additionally, AAbs against the β2 AdR correlated with a higher sympathovagal index (r = 0.45, p = 0.001)."
      - source: pmid:42082542
        quote: "Another important limitation is that medication use was not systematically controlled for in the analyses."
    class: none
  - decision_part: "Early signals: the IgG function study and the daratumumab pilot are small and, for the pilot, uncontrolled; they are labelled as not yet repeated and do not move the level."
    rubric: "One or more small or uncontrolled studies point towards it."
    evidence:
      - source: pmid:34589837
        quote: "16 IgG fractions were isolated from serum of 5 ME/CFS patients with elevated (CFS AABhigh) and 5 with normal levels (CFS AABnorm) of β2 AdR autoantibodies, and from 6 healthy controls (HC)."
      - source: pmid:40703261
        quote: "No definite conclusions should be drawn before a randomized study has been performed."
    class: none
reasons_summary: "Level 2 holds on the CCC/ICC/IOM Swedish controlled study; an independent Fukuda study reproduced only the β2 result, so not level 3; the controlled rituximab trial was negative, so not level 4; badges no, layer and three links supported."
would_change: "An independent controlled study in a CCC, ICC or IOM 2015 cohort reproducing the M3/M4 or β2 antibody rise would support level 3; a controlled antibody-removal trial (for example the sham-controlled immunoadsorption trial NCT05710770) showing benefit could support level 4; a comparably defined controlled study finding no difference could make the level contested. The full texts of carriers pmid:30934066, pmid:26399744, pmid:12851722, pmid:40141440, pmid:23480187 and pmid:26646713 were not cached; every statement the card makes from them was matched to their abstracts, so none rests on an unverifiable sentence."
