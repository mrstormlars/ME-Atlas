operations:
- op: replace_paragraph
  field: level_reason
  index: 3
  text: 'A study from London, with no authors shared with the Riga studies, measured herpesvirus DNA in
    saliva every month for six months in 30 patients from the UK ME/CFS Biobank (16 severely, 14 mildly
    or moderately affected), meeting the Canadian Consensus Criteria and/or the Fukuda definition, and
    16 healthy controls in the saliva measurements (the abstract says 14 controls). It found higher HHV-6B
    and HHV-7 DNA levels in saliva: HHV-6B was higher in the 16 severely affected patients than in controls
    at three of six monthly time points, and HHV-7 was higher in the mildly or moderately affected patients
    at two time points, with trends at the others. Epstein-Barr virus and herpes simplex virus 1 did not
    differ. The authors read the viral DNA as longstanding, persistent infection rather than acute or
    recent infection. The card does not reach level 3: this saliva measurement found differences only
    in subgroups at a few time points. The same study also screened 189 stored samples by ddPCR for active
    replication of any of nine herpesviruses. HHV-7 DNA was found in none, and HHV-6A and HHV-6B DNA only
    in one and two healthy controls. The paper does not give how many of the 189 samples came from patients
    (an earlier antibody measurement in the same biobank covered 132 people with ME/CFS, 76 healthy controls
    and 27 people with multiple sclerosis), so it cannot be told whether this measurement had at least
    half the 200 patients of the Riga study; for this reason the card is not marked contested.'
  sources:
  - pmid:34422848
  - pmid:36653846
- op: add_sentence
  target: level_reason[7]
  text: On the direction of cause, the London study says herpesvirus reactivation might be a cause or
    consequence of the dysregulated immune function seen in ME/CFS, and the Bulgarian study raises the
    possibility that patients with ME/CFS are susceptible to acute viral infections as a consequence of
    immune dysfunction.
  sources:
  - pmid:34422848
  - pmid:32129496
  answers:
