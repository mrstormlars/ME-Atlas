card_review:
  verdict: reject
  findings:
  - operation: null
    severity: must_fix
    problem: 'level_reason[5] calls pmid:35102619 ''A non-randomised study'' and says it ''reported how
      often the viruses became undetectable in blood, not whether symptoms changed''. The cached record
      (abstract only, no full text cached) says nothing about how patients were allocated: it describes
      a study group of 192 cases given valaciclovir, valganciclovir or artesunate and a control group
      of 63 ''similar patients with ME/CFS ... not taking any antiviral drugs'', with no statement that
      allocation was or was not random. It also only shows that the abstract does not report symptoms;
      the paper as a whole cannot be checked. Both statements say more than the record.'
    fix: Drop 'non-randomised' (for example 'A study of 192 patients ... compared with 63 untreated patients')
      and write 'its abstract reports how often the viruses became undetectable in blood and does not
      report symptoms', as the study's own finding field already does.
    class: wording
    target: level_reason[5]
    targets:
    - level_reason[5]
  - operation: null
    severity: must_fix
    problem: 'subgroups[0] says ''The antiviral trials selected patients by their antibodies to Epstein-Barr
      virus or HHV-6.'' This holds for the two cited trials (pmid:2849717: antibodies to EBV early antigen
      or nuclear antigen; pmid:23959519: elevated IgG titres against HHV-6 and EBV), but the card also
      describes pmid:18019402 as a randomised trial in an ''EBV subset'' whose abstract does not say the
      subset was chosen by antibodies, and pmid:35102619 selected patients by blood leukocyte PCR, not
      antibodies. ''The antiviral trials'' reads as all of them.'
    fix: Write 'Two placebo-controlled antiviral trials selected patients by their antibodies to Epstein-Barr
      virus or HHV-6.'
    class: wording
    target: subgroups[0]
    targets:
    - subgroups[0]
  - operation: null
    severity: advisory
    problem: level_reason[7] says the Atlanta PCR of blood cells (pmid:10913395) is something 'this card
      treats as a marker of latent rather than active infection', and the study's finding says the same.
      That reading is the card's own; the cited record concludes 'no evidence that active or latent infection
      ... is associated'. The Riga full texts (pmid:22927850, pmid:36653846) state that leukocyte DNA
      is their marker of persistent/latent infection, but neither is cited in this paragraph.
    fix: Either cite the Riga paper that defines leukocyte DNA as a marker of latent/persistent infection
      for that clause, or add that the Atlanta authors found no evidence for active or latent infection.
  - operation: null
    severity: advisory
    problem: links[1] says the London study 'found no positive correlation between HHV-6B or HHV-7 DNA
      levels and a questionnaire score for post-exertional malaise'. The cached full text lists the significant
      correlations (none positive with PEM) and a negative PEM correlation with HHV-6B on sick days (r
      = -0.647); it does not state the absence in so many words, and the per-domain values are in Supplementary
