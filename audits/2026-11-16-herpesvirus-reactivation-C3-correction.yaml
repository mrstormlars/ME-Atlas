  - operation: null
    severity: must_fix
    problem: 'level_reason[3] says only that the London study (pmid:34422848) ''does not repeat the finding
      of active infection in blood''. The cached full text (PMC8378328) shows that the study did test
      blood plasma for active infection and found almost nothing. ''Serum samples (189) ... were screened
      by ddPCR to detect potential active (lytic) replication of any of the nine HHVs. HHV DNA was rarely
      detected, with HSV-2, HHV-6A and HHV-6B detected in plasma from one or two subjects and the remaining
      HHVs always negative (Table 1).'' Table 1 gives HHV-6A in plasma in 1 sample (''HC (1)''), HHV-6B
      in 2 (''HC (2)''), and HHV-7 positive in 0 of 182. So every plasma HHV-6 detection was in a healthy
      control, and HHV-7 was found in no one. This is the same marker level 2 rests on: HHV DNA in cell-free
      plasma, which pmid:36653846 uses as a marker of active infection. The case definition is the same
      or stricter (Canadian Consensus and/or CDC-1994), and the study had controls. The record does not
      say how many of the 189 screened samples came from ME/CFS patients. The serology pool was 132 ME/CFS,
      76 HC and 27 MS. So it cannot be told whether the measurement reaches 100 patients, half of the
      200 in pmid:36653846. Under the founder ruling of 2026-11-16 (''Unknown patient count''), contested:
      null is correct. But the contradicting finding and the missing number must then be written out on
      the card, and they are not. As written, level_reason[3] reads as if blood was not tested.'
    fix: 'Keep contested: null. In level_reason[3] (source pmid:34422848), state that the London group
      also screened 189 stored plasma samples by ddPCR for active herpesvirus replication. Say that HHV-7
      DNA was found in none, and HHV-6A and HHV-6B only in one and two healthy controls. Say that the
      paper does not give how many of the 189 samples came from ME/CFS patients (the serology pool was
      132 ME/CFS, 76 controls, 27 MS), so it cannot be told whether this measurement had at least half
      the 200 patients of the Riga study. Say that for this reason the card is not marked contested. Replace
      ''does not repeat the finding of active infection in blood'' with this.'
    class: decisive
    targets:
    - contested
