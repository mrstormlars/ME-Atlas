      put the last author at an affiliation the cached record attaches only to the first author (Woo SB,
      Repka-Ramirez MS, Steinberg P); the last authors have no affiliation in the records. The institution
      is the paper's only listed affiliation, so this is a convention, not a wrong fact.
    fix: Optionally name the first author with the affiliation, or write that the affiliation is the paper's
