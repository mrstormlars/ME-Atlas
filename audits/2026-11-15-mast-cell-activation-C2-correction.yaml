  - operation: null
    severity: must_fix
    problem: The group field for pmid:42327760 reads 'Theoharides TC, Tufts University School of Medicine,
      USA; patients from Klimas NG, University of Miami'. In the cached records the last author Theoharides
      TC has Nova Southeastern University (Institute for Neuro-Immune Medicine, Ft. Lauderdale) as his
      first affiliation, and Tufts only as his fourth; the first author Chinnappan B is also at Nova Southeastern.
      Klimas NG's affiliations in the full text are Nova Southeastern University and the Miami Veterans
      Affairs GRECC, not the University of Miami. The full text says only that the patients 'were recruited
      (2007-2012) at the Department of Medicine, University of Miami Miller School of Medicine'; no record
      says the patients came from Klimas. The group field is what independence between studies is judged
      from, so the wrong institution and the unsourced attribution matter.
    fix: Write the group as the records give it, for example 'Theoharides TC, Institute for Neuro-Immune
      Medicine, Nova Southeastern University, USA; patients recruited at the University of Miami Miller
      School of Medicine', and drop the attribution of the patients to Klimas NG.
