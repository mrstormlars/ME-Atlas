      unit (pmid:34444817, 144 completed, 72 per arm), which reported that fatigue scores changed in parallel
      in the two groups and did not measure oxidative stress. That contradicts the fatigue result: it
      has the same definition, a control group, and more than half the sample. Separately, level 3 is
      not reached (level_reason[2]).'
    fix: 'Rewrite the paragraph to say what the records show: pmid:25386668 (73 women, Fukuda, 39 treated
      and 34 placebo) reported lower fatigue and lower lipid peroxidation versus placebo, and the larger
      Fukuda trial pmid:34444817 found that fatigue changed in parallel with placebo. Remove ''its case
      definition is not yet verified''. In my reading the records do not support an uncontested level
      4. The one trial that meets the level-4 wording has a fatigue result contradicted by a trial of
      comparable quality, the factor changed is a supplement combination, and level 3 is not reached.
      The level and the contested mark are the auditor''s decision.'
    targets:
    - level_reason[5]
    - level
    - contested
  - class: decisive
    severity: must_fix
    problem: 'The card records pmid:43027675 as case_definition ''unverified''. The cached full text (data/cache/europepmc/PMC13763008.xml,
