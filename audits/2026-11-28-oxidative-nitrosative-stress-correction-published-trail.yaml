    targets:
    - studies[pmid:43027675].case_definition
    - studies[pmid:43027675].case_definition_source
    - studies[pmid:43027675].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'The finding says ''The abstract does not state the case definition, so it is unverified,
      and it does not give the direction of the marker differences.'' The full text states IOM 2015 and
      gives the direction: ''MDA (median [Q1-Q3]: 233.60 [96.23-419.08]) and GPX1 (38.15 [24.38-59.71])
      were significantly increased in ME/CFS compared to both LC (15.62 ..., 8.97 ...) and HC (15.62 ...,
      8.97 ...)'' (cited to Supplementary Table S1, unadjusted). In the pairwise age/BMI-adjusted ANCOVA
      (Table 3), ME/CFS vs HC stays significant (MDA adj. p 0.02 age / 0.01 BMI; GPX1 0.04 / 0.02), but
      LC vs ME/CFS does not (MDA 0.52 / 0.40; GPX1 1.00 / 1.00). In the logistic regression, MDA was the
      only significant independent predictor of ME/CFS versus LC. In the Random Forest, ''GPX1 became
      the leading discriminator of ME/CFS versus LC''. The direction field ''not_applicable'' and role
      ''context'' were set on the premise that the direction is unknown. The MDA assay is named in the
      full text as an Elabscience ELISA (cat# E-EL-0060).'
    fix: 'Replace the ''unverified / no direction'' sentence with the IOM 2015 definition and the direction:
      MDA and GPX1 higher in ME/CFS than in healthy controls, significant after age/BMI adjustment. Say
      that the difference from long COVID was significant unadjusted but not in the adjusted pairwise
      comparison. Give the regression and Random Forest results separately, as above. Set direction to
      ''higher''. Whether the role becomes ''supports'' is part of the level decision (next finding).
      Keep ''Not yet repeated''.'
    targets:
    - studies[pmid:43027675].finding
    - studies[pmid:43027675].direction
    - studies[pmid:43027675].role
  - class: decisive
    severity: must_fix
    problem: 'level_reason[2] says no independent group has found the same result on the same measure
      in a separate cohort with a confirmed recognised case definition, and level_reason[3] says the malondialdehyde
      finding ''cannot carry a level''. With pmid:43027675 now recorded as IOM 2015, the records hold
      a second controlled MDA study: 125 ME/CFS patients vs 80 healthy controls, MDA higher in ME/CFS,
      significant after age/BMI adjustment. Its authors share no name with the Novi Sad study pmid:23185200
      (24 women, Fukuda, higher MDA), according to the author facts in the context. Neither paragraph
      mentions it. The records also show two limits a reader needs. First, the assays differ: pmid:23185200
      used the OxiSelect MDA Adduct ELISA (protein-bound MDA), pmid:43027675 an Elabscience ELISA (E-EL-0060).
      Second, the Fukuda study pmid:21119582 (40 vs 40 women) found no overall MDA difference: it meets
      the comparable-quality test against pmid:23185200 (same definition, control group, 40 is at least
      half of 24), but not against pmid:43027675 (a less strict definition, and 40 is less than half of
      125). Also, ''under the rubric the malondialdehyde finding cannot carry a level'' is not a rubric
      rule. The rubric handles a conflict with a contested mark.'
    fix: 'Rewrite level_reason[2] and level_reason[3] to set out the MDA evidence as the records state
      it: pmid:23185200 (Fukuda, 24 vs 19) and pmid:43027675 (IOM 2015, 125 vs 80, adjusted vs HC), two
      groups with no shared authors and different MDA assays, and pmid:21119582 (Fukuda, 40 vs 40, no
      overall difference) contradicting pmid:23185200. Remove ''cannot carry a level''. As I read the
      rubric, the records could support level 3 on MDA, contested because pmid:21119582 contradicts a
      study the rung needs, subject to whether two different MDA assays count as the same finding. The
      level and the contested mark are the auditor''s decision.'
    targets:
    - level_reason[2]
    - level_reason[3]
    - level
    - contested
rounds:
- round: 1
  operations:
  - op: update_study
    id: pmid:22281935
    set:
      case_definition: CDC_unspecified
      case_definition_source: fulltext
      case_definition_quote: Patients with CFS were recruited via clinician referrals and media advertisements
        and were diagnosed by a board-certified neurologist with extensive CFS research experience (BHN),
        using modified US Centers for Disease Control and Prevention (CDC) guidelines (1).
  - op: update_study
    id: pmid:25386668
    set:
      case_definition: Fukuda
      case_definition_source: fulltext
      case_definition_quote: Seventy-three women with CFS who fulfilled the 1994 CDC Fukuda's criteria
        were evaluated and enrolled in the study from the outpatient CFS Clinical Unit (Vall d'Hebron
        University Hospital, Barcelona, Spain).
      n_patients: 39
      n_controls: 34
      finding: A placebo-controlled trial of n=73 women (39 given coenzyme Q10 plus NADH, 34 given placebo)
        found less fatigue after eight weeks of coenzyme Q10 plus NADH than with placebo (fatigue impact
        scale total score, p<0.05). The full text reports lower lipid peroxidation (TBARS assay) in blood
        mononuclear cells than with placebo after eight weeks (7.9 vs 14.9 nmol per million cells, p<0.05).
  - op: update_study
    id: pmid:43027675
    set:
      case_definition: IOM2015
      case_definition_source: fulltext
      case_definition_quote: 'ME/CFS patients were included in the study according to the diagnostic criteria
        proposed by the Institute of Medicine (IOM) in 2015, based on the following three symptoms: 1.
        Significant reduction or limitation in the ability to perform pre-illness levels of daily activities
        that persists for more than 6 months, accompanied by fatigue that is often profound, of recent
        or definite (not lifelong) onset, and not substantially relieved by rest. 2. Post-exertional malaise.'
      direction: higher
      role: supports
      finding: A study of n=125 patients with ME/CFS (Institute of Medicine 2015 criteria), 89 with long
        COVID and 80 healthy controls measured T-cell subsets and serum markers of oxidative and nitrosative
        stress by ELISA. Serum malondialdehyde (MDA) and GPX1 were higher in ME/CFS than in healthy controls,
        and the difference stayed significant in the age- and BMI-adjusted pairwise comparison (MDA adjusted
        p 0.02 for age and 0.01 for BMI; GPX1 0.04 and 0.02). The healthy controls were significantly
        younger than the patients. Against long COVID, MDA and GPX1 were higher in ME/CFS unadjusted,
        but the age- and BMI-adjusted pairwise comparison was not significant (MDA 0.52 and 0.40; GPX1
        1.00 and 1.00). In logistic regression MDA was the only significant independent predictor of ME/CFS
        versus long COVID, and in the Random Forest GPX1 was the leading discriminator of ME/CFS versus
        long COVID. The authors call the prediction models exploratory. Not yet repeated.
  - op: replace_paragraph
    field: level_reason
    index: 2
    text: 'The card does not reach level 3: no independent group has found the same result on the same
      measure in a separate cohort with a confirmed recognised case definition. The only other isoprostane
      study, of 6 patients and 6 controls in Glasgow, also found higher levels at rest, but its case definition
      is not yet verified. It shares three authors with the Dundee study, so it would not count as an
      independent repeat even with a verified definition. Malondialdehyde (MDA) is the closest case: a
      study in Novi Sad of 24 women meeting the 1994 CDC definition and 19 healthy women, and a later
      study in Bulgaria of 125 patients meeting the Institute of Medicine 2015 criteria and 80 healthy
      controls, both found higher MDA in patients, and the author lists of the two studies share no names.
      The Bulgarian result stayed significant against healthy controls after age and BMI adjustment, but
      its healthy controls were significantly younger than the patients and its authors call their prediction
      models exploratory. The assays also differ: the Novi Sad study used the OxiSelect MDA Adduct ELISA
      for malondialdehyde bound to proteins, and the Bulgarian study measured MDA in serum by ELISA. The
      card does not treat the two assays as the same measure, so it does not count this as a repeat.'
    sources:
    - pmid:19422646
    - pmid:16085177
    - pmid:23185200
    - pmid:43027675
  - op: replace_paragraph
    field: level_reason
    index: 3
    text: 'Malondialdehyde results conflict. An earlier study from the same Novi Sad clinic, of 40 women
      meeting the Fukuda definition and 40 healthy women, found no overall difference between the groups;
      the authors report a difference only after dividing patients by malondialdehyde level, and title
      the paper as showing elevated lipid peroxidation. It is larger than the 24-patient study that found
      higher levels and uses the same 1994 CDC definition. The two Novi Sad studies share authors, and
      the overlap between their patients is not stated. They may also have used different methods: the
      24-patient study used an ELISA test for malondialdehyde bound to proteins (OxiSelect MDA Adduct
      ELISA), and the abstract of the earlier study does not give its method. The later Bulgarian study
      of 125 patients found higher MDA in patients than in healthy controls, but it is larger than the
      earlier Novi Sad study and uses a different definition (Institute of Medicine 2015). The card''s
      level does not rest on the malondialdehyde finding, and no contested mark is set on it.'
    sources:
    - pmid:21119582
    - pmid:23185200
    - pmid:43027675
  - op: replace_paragraph
    field: level_reason
    index: 4
    text: Measures of antioxidant defences are mixed. In studies with a recognised definition, antioxidant
      potential in serum was lower in the Osaka study, glutathione in lymphocytes was higher in both sexes
      in the Stanford study (in men, in two of the three cell types tested), and glutathione in the brain
      was lower in 15 patients than in 13 healthy volunteers in a Weill Cornell Medical College study
      whose patients were diagnosed using modified US CDC guidelines (the authors do not say how the guidelines
      were modified); patients with major depression showed the same. In studies whose case definition
      is not yet verified, plasma coenzyme Q10 was lower in 58 patients than in 22 controls; whole-blood
      glutathione peroxidase activity did not differ between 40 patients and 24 controls; and glutathione
      in the brain did not differ in another study of 26 people in all.
    sources:
    - pmid:27224647
    - pmid:40627396
    - pmid:22281935
    - pmid:20010505
    - pmid:21552194
    - pmid:19906518
  - op: replace_paragraph
    field: level_reason
    index: 5
    text: The card does not reach level 4. A placebo-controlled trial of coenzyme Q10 plus NADH in 73
      women meeting the 1994 CDC Fukuda criteria (39 treated, 34 given placebo) reported less fatigue
      (fatigue impact scale total score, p<0.05) and lower lipid peroxidation in blood mononuclear cells
      (TBARS assay) than with placebo after eight weeks. A larger placebo-controlled trial of the same
      combination from the same Vall d'Hebron research institute, in 207 women meeting the 1994 CDC/Fukuda
      definition (144 completed, 72 per group), did not measure oxidative stress and reported that fatigue
      scores changed in parallel in the two groups, with no differences between the groups. The two trials
      disagree on fatigue, and level 3 is not reached. A crossover trial of NADH alone in 26 patients
      meeting the CDC criteria reports no oxidative-stress measure in its abstract.
    sources:
    - pmid:25386668
    - pmid:34444817
    - pmid:10071523
  checks:
    passed: true
    errors: []
  review:
    verdict: reject
    findings:
    - class: decisive
      operation: 2
      severity: must_fix
      problem: 'This operation answers step-1 findings 6 and 7. The new finding says: ''Against long COVID,
        MDA and GPX1 were higher in ME/CFS unadjusted, but the age- and BMI-adjusted pairwise comparison
        was not significant (MDA 0.52 and 0.40; GPX1 1.00 and 1.00).'' Those numbers are in Table 3 of
        the cached full text (PMC13763008). But the same full text also reanalysed these markers in overlap-restricted
        samples: ''Only participants aged 30 to 65 years ... with a BMI of 18 to 30 ... MDA, GPX1, Th17,
        CD161+Treg and CD15s+CD161-eTreg remained significantly different between the age- and BMI-restricted
        groups.'' In Table 4, ME/CFS vs LC for MDA and GPX1 has an adjusted p of 0.000 in both the age-restricted
        and the BMI-restricted comparison. The authors also write that ''the elevated expression of MDA
        and GPX1 in ME/CFS ... proved independent of age, BMI and sex in ANCOVA analysis''. Because the
        card gives only the Table 3 result, a reader would think the difference from long COVID disappears
        after adjustment. The record does not support that reading on its own.'
      fix: 'Either state both analyses: in Table 3 the age/BMI-adjusted pairwise comparison against long
        COVID was not significant, while in the age-restricted (30 to 65 years) and BMI-restricted (18
        to 30) comparisons MDA and GPX1 stayed higher in ME/CFS than in long COVID (Table 4). Or remove
        the adjusted long-COVID clause and its numbers, and keep the unadjusted direction and the regression
        and Random Forest results.'
      targets:
      - studies[pmid:43027675].finding
    - operation: 4
      severity: advisory
      problem: 'This operation answers step-1 finding 8. level_reason[3] says: ''The later Bulgarian study
        of 125 patients found higher MDA in patients than in healthy controls, but it is larger than the
        earlier Novi Sad study and uses a different definition (Institute of Medicine 2015).'' The ''but''
        does not tell the reader what follows from this, which is that the 40-patient study does not meet
        the comparable-quality test against the Bulgarian study. The numbers and definitions are correct.'
      fix: Say plainly that the 40-patient Novi Sad study has fewer than half the Bulgarian study's patients
        and uses a less strict definition, so it is not of comparable quality to that study.
    - operation: 3
      severity: advisory
      problem: 'This operation answers step-1 finding 8. level_reason[2] keeps level 2 and does not count
        the two MDA studies as a repeat, because their assays differ. The cached records confirm the assays:
        pmid:23185200 used the OxiSelect MDA Adduct ELISA (MDA bound to proteins, in serum), and pmid:43027675
