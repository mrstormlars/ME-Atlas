  findings:
  - class: decisive
    severity: must_fix
    problem: 'The card records pmid:22281935 as case_definition ''unverified'' with no quote. The cached
      full text (data/cache/europepmc/PMC3896084.html, Methods) states: ''Patients with CFS were recruited
      via clinician referrals and media advertisements and were diagnosed by a board-certified neurologist
      with extensive CFS research experience (BHN), using modified US Centers for Disease Control and
      Prevention (CDC) guidelines (1).'' Reference 1 in the same full text is Fukuda K et al. 1994, Ann
      Intern Med 121:953-959. So the record names a definition.'
    fix: 'Record the definition the full text states, with case_definition_source ''fulltext'' and the
      quoted sentence as case_definition_quote: Fukuda (the cited reference 1) or CDC_unspecified, and
      say on the card that the authors call it ''modified'' CDC guidelines without saying how they changed
      them. Flag it as not requiring PEM, as the rubric requires for CDC/Fukuda.'
    targets:
    - studies[pmid:22281935].case_definition
    - studies[pmid:22281935].case_definition_source
    - studies[pmid:22281935].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: level_reason[4] puts 'glutathione in the brain was lower in 15 patients than in 13 healthy
      volunteers' (pmid:22281935) under 'studies whose case definition is not yet verified'. The cached
      full text names modified US CDC guidelines citing Fukuda 1994 (see the finding on studies[pmid:22281935].case_definition),
      so this study belongs with the studies that have a recognised definition. The abstract also says
      lower glutathione was found in both CFS and MDD relative to healthy volunteers, with no difference
      between the two patient groups; the paragraph does not say so, although the study's finding does.
    fix: Move the pmid:22281935 result into the sentence on studies with a recognised definition, with
      the 'modified CDC guidelines' wording. Optionally add that patients with major depression showed
      the same, as the study finding already says. Leave the other three studies (pmid:20010505, pmid:21552194,
      pmid:19906518) under 'not yet verified'.
    targets:
    - level_reason[4]
  - class: decisive
    severity: must_fix
    problem: 'The card records pmid:25386668 as case_definition ''unverified''. The cached full text (data/cache/europepmc/PMC4346380.html)
      states: ''We conducted an 8-week, randomized, double-blind placebo-controlled trial ... in 73 eligible
      CFS patients who fulfilled the 1994 CDC Fukuda''s criteria'', and ''Seventy-three women with CFS
      who fulfilled the 1994 CDC Fukuda''s criteria were evaluated and enrolled in the study''.'
    fix: Set case_definition to Fukuda, case_definition_source to 'fulltext', and quote one of these sentences
