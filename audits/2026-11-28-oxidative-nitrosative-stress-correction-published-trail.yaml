    targets:
    - studies[pmid:25386668].n_patients
    - studies[pmid:25386668].n_controls
  - class: decisive
    severity: must_fix
    problem: 'The finding says lower lipid peroxides were reported ''in blood cells of the treated group
      (the abstract does not say whether against placebo or against baseline)''. That is true of the abstract,
      but the cached full text settles it: ''CFS patients treated with CoQ10 plus NADH showed significantly
      lower levels of lipid peroxidation versus placebo (7.9±2.7 vs. 14.9±3.9 nmol/10^6 cells, p<0.05,
      respectively)'', measured by TBARS assay. The full text also says the participants were 73 women.
      As written, the card leaves a doubt that the record does not have.'
    fix: Say that the full text reports lower lipid peroxidation (TBARS) in blood mononuclear cells versus
      placebo after 8 weeks (7.9 vs 14.9 nmol/10^6 cells, p<0.05) and that the 73 patients were women,
      and remove the parenthesis about the abstract.
    targets:
    - studies[pmid:25386668].finding
  - class: decisive
    severity: must_fix
    problem: 'level_reason[5] says that ''no controlled trial in patients with a confirmed recognised
      case definition has lowered an oxidative-stress measure and improved the illness'', and that the
      CoQ10 plus NADH trial (pmid:25386668) has a case definition ''not yet verified'' and a lipid peroxide
      comparison of unclear type. The cached full text states Fukuda criteria, fatigue (FIS total score)
      lower versus placebo at 8 weeks (Table 2, ''p<0.05, significant differences versus placebo'') and
