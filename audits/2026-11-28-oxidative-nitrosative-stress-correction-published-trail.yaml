    targets:
    - studies[pmid:25386668].case_definition
    - studies[pmid:25386668].case_definition_source
    - studies[pmid:25386668].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'pmid:25386668 has n_patients 73 and n_controls null. The cached full text gives the arms:
