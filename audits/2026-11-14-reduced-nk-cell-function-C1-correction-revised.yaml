- op: replace_paragraph
  field: level_reason
  index: 1
  text: A fourth study, of 176 patients and 230 controls, used the CDC clinical diagnostic criteria without
    naming a version, which the rubric ranks equal to Fukuda. It comes from a group in Miami with no authors
