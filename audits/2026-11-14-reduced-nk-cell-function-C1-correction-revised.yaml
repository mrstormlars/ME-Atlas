- op: replace_paragraph
  field: contested.reason
  index: 1
  text: With 39 patients in that measurement, the Canadian Consensus Criteria study is of comparable quality
    to the Australian group's Fukuda studies of 39 and 65 patients. It is not of comparable quality to
    the Miami study of 176 patients.
  sources:
  - pmid:28694809
  - pmid:27099524
  - pmid:22571715
  - pmid:20520837
- op: replace_paragraph
  field: badges.diagnostic_marker.reason
  index: 0
  text: No study on this card reports NK cell killing validated as a diagnostic marker in a second, independent
    patient group. A study of 176 patients and 230 controls using the CDC clinical diagnostic criteria
    (version not named) found NK killing a good predictor of CFS status within its own cohort. A Canadian
    Consensus Criteria study concluded the measures were not useful diagnostic markers, a multi-site study
    concluded the assay was not ready for clinical use, and a family study found low antibody-dependent
    NK killing also in relatives without the illness.
  sources:
  - pmid:20520837
  - pmid:28694809
  - pmid:37013608
  - pmid:33777500
- op: replace_paragraph
  field: badges.explains_pem.reason
  index: 0
  text: Four of the supporting studies (three using Fukuda, one the CDC clinical diagnostic criteria with
    no version named) report no direct measure of post-exertional malaise, such as an exercise test repeated
    on two consecutive days, in their abstracts or open full texts. The 65-patient study lists, among
    its participants' symptoms, the share reporting weakness more than 24 hours after exercise; this is
    a self-reported symptom, not a test.
  sources:
  - pmid:27099524
  - pmid:20520837
  - pmid:21619669
  - pmid:22571715
