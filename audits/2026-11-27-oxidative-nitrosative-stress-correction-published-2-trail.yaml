        The rubric counts ''the number of patients in the measurement that bears on the finding'', and
        the card already separates measured from enrolled numbers elsewhere (Stanford: 15 against 16 ''from
        a study of 27 patients and 25 controls''). Here the number is set beside the 24-patient and 40-patient
        Novi Sad studies, so it bears on how a reader weighs the replication and the conflict.'
      fix: 'Where these paragraphs give the malondialdehyde comparison, give it as the full text''s Figure
