    - studies[pmid:25386668].n_controls
  - class: decisive
    severity: must_fix
    problem: 'The finding says the trial ''reported lower lipid peroxides in blood cells of the treated
      group (the abstract does not say whether against placebo or against baseline)''. The full text reports
      the comparison against placebo: ''CFS patients treated with CoQ10 plus NADH showed significantly
      lower levels of lipid peroxidation versus placebo (7.9±2.7 vs. 14.9±3.9 nmol/10^6 cells, p<0.05,
      respectively)'', measured by TBARS assay in blood mononuclear cells; fatigue impact scale total
      score was also lower versus placebo after 8 weeks (Table 2 note: ''significant differences versus
      placebo after 8 weeks of treatment''). The parenthetical uncertainty is now wrong, and the participants
      were all women.'
    fix: State that the 73 women met the Fukuda criteria, that fatigue (FIS total) and lipid peroxidation
      in blood mononuclear cells were lower than with placebo after 8 weeks, and that this is a single
      trial not yet repeated; remove the parenthetical.
    targets:
    - studies[pmid:25386668].finding
  - class: decisive
    severity: must_fix
    problem: 'level_reason[5] says ''no controlled trial in patients with a confirmed recognised case
      definition has lowered an oxidative-stress measure and improved the illness'' and that pmid:25386668''s
      ''case definition is not yet verified'' and comparison is unclear. On the cached full text this
      is wrong: pmid:25386668 is a placebo-controlled trial in 73 women meeting the 1994 Fukuda criteria
      that reports lower lipid peroxidation and lower fatigue impact scores versus placebo at 8 weeks.
      The statement on which the card''s level-4 reasoning rests is therefore contradicted by its own
      cited source. For the auditor: the record supports describing this as one unreplicated placebo-controlled
      trial of a combination (the authors describe CoQ10 and NADH as both bioenergetic cofactors and free
      radical scavengers, so the trial does not change oxidative stress alone); the larger trial from
      the same Vall d''Hebron unit (pmid:34444817, 207 women, Fukuda) did not measure oxidative stress
      and reports that ''FIS-40 domain scores evolved in parallel between groups''. Whether this meets
      rung 4 (''changing the proposed factor changes the outcome in a controlled experiment''), and whether
      pmid:34444817 contradicts it on the fatigue outcome, is for the auditor; the card must state what
      the records say.'
    fix: Rewrite level_reason[5] so it reports pmid:25386668 as a Fukuda-defined placebo-controlled trial
      with lower lipid peroxidation and lower fatigue scores versus placebo, single and not repeated,
      set beside pmid:34444817's parallel fatigue change; state where the card stands on level 4 on that
      basis, without the false general sentence. Leave the level decision to the auditor.
    targets:
    - level_reason[5]
    - level
  - class: decisive
    severity: must_fix
    problem: 'The card records pmid:43027675 as case_definition unverified. The cached full text (data/cache/europepmc/PMC13763008.xml,
