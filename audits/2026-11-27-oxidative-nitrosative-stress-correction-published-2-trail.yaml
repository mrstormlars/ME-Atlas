      neurologist with extensive CFS research experience (BHN), using modified US Centers for Disease
      Control and Prevention (CDC) guidelines ( 1 )', and its reference 1 is Fukuda K et al., Ann Intern
      Med 1994;121:953-959. The case definition is stated in the study's own text.
    fix: Record case_definition_source fulltext with that sentence as case_definition_quote, and set the
      label the rubric gives for a CDC definition whose cited version is Fukuda 1994 (Fukuda, or CDC_unspecified
      if the word 'modified' is held to leave the version open), flagged as not requiring PEM. Write out
      on the card that the authors call the guidelines 'modified'.
