      - level_reason[2]
      - level_reason[3]
    - class: decisive
      operation: 4
      severity: must_fix
      problem: 'level_reason[2] opens ''The card is currently at level 2; whether any measure reaches
        level 3 is set out here for the audit and is not decided by this paragraph.'' That is a note to
        the pipeline, published as card text. It also leaves level 2 with no stated reason for not being
        level 3. The paragraph sets out two malondialdehyde studies from groups that share no author (pmid:23185200,
        Fukuda; pmid:43027675, IOM 2015), which reads as rung 3, and then defers. Once the audit has run,
        the sentence no longer says anything true. On the records: they could support a rung-3 claim on
        malondialdehyde (separate cohorts in Serbia and Bulgaria, no shared author, recognised definitions).
        The limit is the assay: protein-bound MDA by the OxiSelect MDA Adduct ELISA against serum MDA
