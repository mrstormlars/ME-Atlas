    targets:
    - studies[pmid:43027675].case_definition
    - studies[pmid:43027675].case_definition_source
    - studies[pmid:43027675].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'The finding says the study ''does not give the direction of the marker differences'', and
