    - studies[pmid:22281935].case_definition
    - studies[pmid:22281935].case_definition_source
    - studies[pmid:22281935].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: level_reason[4] places the brain glutathione result of pmid:22281935 ('glutathione in the
      brain was lower in 15 patients than in 13 healthy volunteers') among 'studies whose case definition
      is not yet verified'. The full text names modified US CDC guidelines citing Fukuda 1994 (see the
      finding above), so this study belongs with the studies that have a recognised definition. The numbers
      (15 CFS, 13 healthy volunteers, lower cortical GSH) match the record.
    fix: Move the pmid:22281935 result into the sentence on studies with a recognised definition, with
      its definition (and the word 'modified') stated; keep the other three studies (pmid:20010505, pmid:21552194,
      pmid:19906518) in the not-yet-verified sentence.
