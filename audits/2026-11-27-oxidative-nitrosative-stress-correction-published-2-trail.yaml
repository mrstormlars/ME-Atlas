    targets:
    - studies[pmid:43027675].finding
    - studies[pmid:43027675].role
    - studies[pmid:43027675].direction
  - class: decisive
    severity: must_fix
    problem: 'With pmid:43027675 read from its full text, three level paragraphs no longer state what
      the records show. level_reason[1] says of the Novi Sad malondialdehyde result (pmid:23185200, 24
      women, Fukuda) that ''each is unreplicated''; level_reason[2] says ''no independent group has found
      the same result on the same measure in a separate cohort with a confirmed recognised case definition'';
      level_reason[3] says ''under the rubric the malondialdehyde finding cannot carry a level'' and does
      not mention pmid:43027675. pmid:43027675 (IOM 2015, 125 patients vs 80 controls) found higher serum
      MDA in ME/CFS, and the author facts show it shares no author with pmid:23185200 or pmid:21119582
      (it shares Maes M with the Antwerp studies, not with Novi Sad). The level-3 question is therefore
      open on the records and must be laid out: for the auditor, the evidence could support an MDA rung-3
      claim (two groups with no shared authors, separate cohorts, Fukuda and IOM 2015), with two limits
      the records show: the assays differ (OxiSelect MDA Adduct ELISA, protein-bound MDA, vs Elabscience
      E-EL-0060 serum MDA), and pmid:21119582 (Fukuda, 40 vs 40, same definition as pmid:23185200, controlled,
      more than half its sample) found no overall difference, which under the contested rule contradicts
      a study the rung would need. pmid:21119582 is not of comparable quality to pmid:43027675 (less strict
      definition, under half its sample).'
    fix: Rewrite level_reason[1]-[3] to include pmid:43027675's MDA result with its definition and numbers,
      state the assay difference and the pmid:21119582 conflict as the records give them, and leave the
      level and contested mark to the auditor. Do not keep the sentences that say no independent group
      has found the same result and that the MDA finding cannot carry a level unless the auditor's ruling
      supports them.
    targets:
    - level_reason[1]
    - level_reason[2]
    - level_reason[3]
    - level
    - contested
rounds:
- round: 1
  operations:
  - op: update_study
    id: pmid:22281935
    set:
      case_definition: CDC_unspecified
      case_definition_source: fulltext
      case_definition_quote: Patients with CFS were recruited via clinician referrals and media advertisements
        and were diagnosed by a board-certified neurologist with extensive CFS research experience (BHN),
        using modified US Centers for Disease Control and Prevention (CDC) guidelines (1).
  - op: update_study
    id: pmid:25386668
    set:
      case_definition: Fukuda
      case_definition_source: fulltext
      case_definition_quote: Seventy-three women with CFS who fulfilled the 1994 CDC Fukuda's criteria
        were evaluated and enrolled in the study
      n_patients: 39
      n_controls: 34
      finding: A placebo-controlled trial of n=73 women meeting the 1994 CDC Fukuda criteria (39 given
        coenzyme Q10 plus NADH, 34 given placebo) found that, after 8 weeks, the fatigue impact scale
        total score and lipid peroxidation in blood mononuclear cells (measured by TBARS assay) were lower
        than with placebo. The authors describe coenzyme Q10 and NADH as both bioenergetic cofactors and
        free radical scavengers, so the trial does not change oxidative stress alone. A single trial,
        not yet repeated.
  - op: update_study
    id: pmid:43027675
    set:
      case_definition: IOM2015
      case_definition_source: fulltext
      case_definition_quote: ME/CFS patients were included in the study according to the diagnostic criteria
        proposed by the Institute of Medicine (IOM) in 2015
      role: supports
      direction: higher
      finding: A study of n=125 patients with ME/CFS meeting the Institute of Medicine 2015 criteria,
        89 with long COVID and 80 healthy controls measured T-cell subsets and serum markers of oxidative
        and nitrosative stress (including catalase, SOD1, GPX1, MDA, NOS1 and NOS3). The full text reports
        serum malondialdehyde (MDA) and GPX1 significantly increased in ME/CFS compared with both long
        COVID and healthy controls in the unadjusted comparison; after adjustment for age and BMI the
        difference between ME/CFS and healthy controls stays significant for MDA and GPX1, while the difference
        between long COVID and ME/CFS does not. MDA was an independent predictor in the ME/CFS versus
        healthy control comparison; for ME/CFS versus long COVID the full text reports MDA as the only
        significant independent predictor in the logistic regression but GPX1 as the leading discriminator
        in the Random Forest. Its MDA assay (an Elabscience serum kit) differs from the OxiSelect MDA
        Adduct ELISA used in pmid:23185200.
  - op: replace_paragraph
    field: level_reason
    index: 1
    text: 'Other controlled studies found higher oxidative-stress markers: malondialdehyde and protein
      carbonyls in 24 women meeting the 1994 CDC definition against 19 healthy women in Novi Sad, Serbia;
      reactive oxygen metabolites in a study from Osaka of patients diagnosed by the Fukuda 1994 criteria,
      whose abstract does not give the numbers; reactive oxygen species inside lymphocytes in 15 patients
      against 16 controls at Stanford, where the difference was found in women but not in men; and serum
      malondialdehyde in a 2026 study of 125 patients meeting the Institute of Medicine 2015 criteria
      against 80 healthy controls. The Stanford patients were diagnosed using the National Academy of
      Medicine, Fukuda and Canadian Consensus criteria; which definition each patient met is not stated.
      The protein carbonyl, reactive oxygen metabolite and lymphocyte reactive oxygen species results
      are each from a single study and unreplicated. The malondialdehyde result appears in two of these
      studies and is discussed below.'
    sources:
    - pmid:23185200
    - pmid:27224647
    - pmid:40627396
    - pmid:43027675
  - op: replace_paragraph
    field: level_reason
    index: 2
    text: 'The card is currently at level 2; whether any measure reaches level 3 is set out here for the
      audit and is not decided by this paragraph. The only other isoprostane study, of 6 patients and
      6 controls in Glasgow, also found higher levels at rest, but its case definition is not yet verified.
      It shares three authors with the Dundee study, so it would not count as an independent repeat even
      with a verified definition. For malondialdehyde, two studies found higher levels in patients: the
      Novi Sad study (1994 CDC definition, 24 patients against 19 controls) and the 2026 study (Institute
      of Medicine 2015 criteria, 125 patients against 80 controls). The author lists of the two records
      share no author name, and the two studies used different assays. A third study of malondialdehyde,
      from the Novi Sad clinic, found no overall difference (see below).'
    sources:
    - pmid:19422646
    - pmid:16085177
    - pmid:23185200
    - pmid:43027675
    - pmid:21119582
  - op: replace_paragraph
    field: level_reason
    index: 3
    text: 'Malondialdehyde results conflict. An earlier study from the same Novi Sad clinic, of 40 women
      meeting the Fukuda definition and 40 healthy women, found no overall difference between the groups;
      the authors report a difference only after dividing patients by malondialdehyde level, and title
      the paper as showing elevated lipid peroxidation. It is larger than the 24-patient study that found
      higher levels and uses the same definition. The two Novi Sad studies share authors, and the overlap
      between their patients is not stated. The 2026 study of 125 patients meeting the Institute of Medicine
      2015 criteria and 80 healthy controls reported higher serum malondialdehyde in patients, which in
      its full text stays significant after adjustment for age and BMI. The assays differ: the 24-patient
      study used an ELISA test for malondialdehyde bound to proteins (OxiSelect MDA Adduct ELISA), the
      2026 study used an Elabscience kit for serum malondialdehyde, and the abstract of the earlier Novi
      Sad study does not give its method. How this conflict bears on the card''s level is left to the
      audit; the card''s level does not rest on the malondialdehyde finding.'
    sources:
    - pmid:21119582
    - pmid:23185200
    - pmid:43027675
  - op: replace_paragraph
    field: level_reason
    index: 4
    text: Measures of antioxidant defences are mixed. In studies with a recognised definition, antioxidant
      potential in serum was lower in the Osaka study, glutathione in lymphocytes was higher in both sexes
      in the Stanford study (in men, in two of the three cell types tested), and glutathione in the brain
      cortex was lower in 15 patients than in 13 healthy volunteers in a third study, whose patients were
      diagnosed using what its authors call modified US Centers for Disease Control and Prevention guidelines
      (the version is not named in the text). In studies whose case definition is not yet verified, plasma
      coenzyme Q10 was lower in 58 patients than in 22 controls; whole-blood glutathione peroxidase activity
      did not differ between 40 patients and 24 controls; and glutathione in the brain did not differ
      in another study of 26 people in all.
    sources:
    - pmid:27224647
    - pmid:40627396
    - pmid:22281935
    - pmid:20010505
    - pmid:21552194
    - pmid:19906518
  - op: replace_paragraph
    field: level_reason
    index: 5
    text: A placebo-controlled trial of coenzyme Q10 plus NADH in 73 women meeting the 1994 CDC Fukuda
      criteria (39 treated, 34 given placebo) reported a lower fatigue impact scale total score and lower
      lipid peroxidation in blood mononuclear cells than with placebo after 8 weeks. It is a single trial,
      not yet repeated, and its authors describe the two compounds as both bioenergetic cofactors and
      free radical scavengers, so the trial does not change oxidative stress alone. A larger placebo-controlled
      trial of the same combination from the same Vall d'Hebron research institute, in 207 women meeting
      the Fukuda definition, did not measure oxidative stress and reported that fatigue scores changed
      in parallel in the two groups. Whether the first trial meets level 4 is left to the audit; this
      paragraph does not state that the card reaches it. A crossover trial of NADH alone in 26 patients
      meeting the CDC criteria reports no oxidative-stress measure in its abstract.
    sources:
    - pmid:25386668
    - pmid:34444817
    - pmid:10071523
