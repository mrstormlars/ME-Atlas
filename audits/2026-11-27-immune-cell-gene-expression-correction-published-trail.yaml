        Control criteria of Fukuda et al.
  - op: update_study
    id: pmid:16049284
    set:
      finding: A study of n=25 patients and 25 matched blood donors found 35 PBMC genes expressed differently
        by microarray, 16 confirmed by real-time PCR in a second sample from 17 of the patients and a
        different group of 21 controls (15 up, 1 down), which the authors read as suggesting T cell activation.
  - op: replace_paragraph
    field: level_reason
    index: 2
    text: A New Zealand study of 10 patients meeting the Canadian Consensus Criteria and 10 controls found
      27 transcripts higher and 6 lower in patients, with the top ones related to inflammation. Two UK
      studies found genes expressed differently. The first used the Fukuda criteria and the second used
      CDC criteria with the version not named; neither requires post-exertional malaise. The first was
      a microarray study of 25 patients and 25 controls, with 16 genes confirmed by PCR in a second sample
      from 17 of the patients and a different group of 21 controls. The second screened 25 patients and
      50 blood donors by microarray and confirmed 88 genes by PCR in 55 patients and 75 controls. The
      first read its pattern as T-cell activation.
    sources:
    - pmid:30791746
    - pmid:16049284
    - pmid:18462164
