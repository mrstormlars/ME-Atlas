review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'The card records pmid:16049284 as CDC_unspecified from the abstract ("diagnosed according
      to the Centers for Disease Control criteria"), but the cached full text (data/cache/europepmc/PMC1770875.html)
      names the version twice: Methods, "These cases were diagnosed according to the criteria of Fukuda
      and colleagues.2", and Results, "All 25 patients with CFS were diagnosed according to the Centers
      for Disease Control criteria of Fukuda et al.2" (reference 2 is Fukuda K et al., Ann Intern Med
      1994). The label is wrong against the study''s own text.'
    fix: Set case_definition to Fukuda, case_definition_source to fulltext, and case_definition_quote
      to "All 25 patients with CFS were diagnosed according to the Centers for Disease Control criteria
      of Fukuda et al." The Fukuda flag (does not require PEM) still applies; its rank is equal to CDC_unspecified,
      so no comparability judgement on the card changes.
    targets:
    - studies[pmid:16049284].case_definition
    - studies[pmid:16049284].case_definition_source
    - studies[pmid:16049284].case_definition_quote
  - class: decisive
    severity: must_fix
    problem: 'level_reason[2] says "Two UK studies using CDC criteria (version not named)". For pmid:16049284
      the cached full text names the version ("the Centers for Disease Control criteria of Fukuda et al.");
      only pmid:18462164 (abstract only cached: "diagnosed according to the Centers for Disease Control
      and Prevention diagnostic criteria") leaves the version unnamed. The sentence misstates one study''s
      case definition.'
    fix: Say that the first UK study used the Fukuda criteria and the second used CDC criteria with the
      version not named, both of which do not require post-exertional malaise.
    targets:
    - level_reason[2]
  - class: decisive
    severity: must_fix
    problem: 'The finding says the 16 genes were "confirmed by real-time PCR in fresh samples whose number
      the abstract does not give". The cached full text gives the numbers: real-time PCR was run "in the
      same group of CFS cases (n = 17) and a different group of normal controls (n = 21)", and "21 normal
      blood donors (age and sex matched as a group) were used as a comparison group for the real time
      PCR part of the study". A reader is told the size is unknown when the study states it, and is not
      told the confirmation used a subset of 17 patients and a different control group.'
    fix: 'Replace "whose number the abstract does not give" with the full text''s numbers: confirmed by
      real-time PCR in a second sample from 17 of the patients and a different group of 21 controls.'
    targets:
    - studies[pmid:16049284].finding
