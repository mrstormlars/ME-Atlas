    fix: Make the evidence and the mark agree. Either add rung 2 to contested.rungs, with contested_reason[3]
      saying that the New York cohort, by its companion paper, met the 2015 IOM definition and so is of
      comparable quality to the 84-patient study (the bar would then fill to rung 1), or give a record-based
