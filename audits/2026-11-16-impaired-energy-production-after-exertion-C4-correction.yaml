      criteria appear anywhere in the text. The companion paper 41293716 (PMC12640868) describes 57 patients
      and 25 sedentary controls with the same mean age (38.6 +/- 9.6), the same Godin leisure-time score
      (27.7 +/- 35.5, also in 42212259) and the same day-1 peak VO2 (22.3 mL/kg/min, also in the 42212259
      abstract), so it is almost certainly the same cohort. Its sentence says those patients ''met the
      2015 IOM case definition (22)''. If the cohort met IOM 2015, the New York study is of comparable
      quality to the 84-patient CCC study under the rubric: IOM 2015 ranks with CCC, it has a control
      group, and its 53 patients with maximal tests on both days are more than half of 84. It also contradicts
      that study, finding no day-2 change in peak VO2 or VO2 at VT. The audits rejected this point twice
