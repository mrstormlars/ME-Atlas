operations:
- op: propose
  target: contested
  value:
  - 2
  - 3
  reason:
  - text: Rung 3 rests on independent studies that found the same result as the 84-patient study, whose
      patients met the Canadian Consensus Criteria. The clearest, a Fukuda study of 15 women patients
      and 15 controls from Amsterdam, is contradicted by a New York study (58 patients and 25 sedentary
      controls enrolled; 53 patients with maximal tests on both days) that found no change on the second
      day. With the same case definition as recorded, a control group and more patients (53 against 15),
      the New York study is of comparable quality.
    sources:
    - pmid:20937116
    - pmid:42212259
    - pmid:38965566
  - text: The two Dutch clinic studies of women and men point the same way, but they compare patients
      with people who have chronic fatigue without ME/CFS rather than with healthy controls.
    sources:
    - pmid:34198913
    - pmid:34198946
  - text: 'The Oslo study, which meets the Canadian Consensus Criteria, found the same result only in
      part: power output at the threshold fell more in patients than in controls, but the changes in oxygen
      use did not differ between groups.'
    sources:
    - pmid:31161646
  - text: Rung 2 rests on the 84-patient study and is also marked contested. The New York study found
      no significant change in peak oxygen use between the two days. Its own sentence says its patients
      met the 1994 case definition modified to require post-exertional malaise and names no second definition,
      but a companion paper by the same authors, which appears to describe the same cohort (57 patients
      and 25 sedentary controls), says its patients met the 2015 IOM case definition. If the cohort met
      the 2015 IOM definition, which ranks with the Canadian Consensus Criteria, the New York study has
      a control group and 53 patients with maximal tests on both days, against 84 in the 84-patient study,
      and is of comparable quality. The records do not settle which reading is right; the card records
      Fukuda, from the New York study's own sentence.
    sources:
    - pmid:38965566
    - pmid:42212259
    - pmid:41293716
