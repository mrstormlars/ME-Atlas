    problem: 'contested_reason[3] keeps rung 2 uncontested on the reading that the New York cohort is
      Fukuda only. The cached records point the other way. The New York full text (PMC13213420) says the
      patients ''all met both the 1994 case definition of ME/CFS, modified to require endorsement of post-exertional
