card_review:
  verdict: reject
  findings:
  - operation: null
    severity: must_fix
    problem: 'level_reason[5] says of the New York study (pmid:42212259): ''Its authors suggest that falls
      reported elsewhere may reflect lower effort on the second day.'' The cached full text (PMC13213420)
      makes the effort argument only about the 84-patient study (Keller et al., 2024): after quoting its
      heart-rate-reserve sentence it says ''This lack of effort on Day 2 testing could explain the apparent
      decrement in VO2 max noted'', and contrasts ''In contrast to Keller ... we were able to obtain maximal
      effort ... on Day 2 in all but five patients''. It does not put forward lower effort as the explanation
      for the falls reported by the other studies it lists (VanNess, Vermeulen, Hodges, Nelson, Van Campen).
      ''Falls reported elsewhere'' extends the authors'' suggestion to all the supporting studies on this
      card, including the Amsterdam study, which the source does not do.'
    fix: 'Narrow the sentence to what the source says, for example: ''Its authors suggest that the falls
      reported in the 84-patient study may reflect lower effort on the second day.'''
    class: wording
    target: level_reason[5]
    targets:
    - level_reason[5]
  - operation: null
    severity: advisory
    problem: contested.reason[3] marks rung 2 contested on the reading that the New York cohort met the
      2015 IOM definition (from the companion paper pmid:41293716), while the card records the New York
      study as Fukuda. Under the label as recorded, the New York study ranks below the CCC of the 84-patient
      study and is not of comparable quality under the rubric, so on the recorded label the evidence supports
      rung 3 contested and does not on its own support a contested mark on rung 2. On the IOM reading
      (supported by the companion paper's identical author group, mean age 38.6 +/- 9.6 and peak VO2 22.3,
      and the word 'both' in the New York study's own sentence), rung 2 would also be contested (53 against
      84 patients, at least half). The card states this openly. Which reading applies is for the auditor
      to decide.
    fix: No text change needed if the auditor accepts the IOM reading; otherwise remove rung 2 from contested.rungs
      and the paragraph contested.reason[3].
  - operation: null
    severity: advisory
    problem: level_reason[2] calls the two Dutch clinic studies (pmid:34198913, pmid:34198946) 'retrospective
      analyses of a clinical database'. The cached full texts say the data were taken from a clinical
      database of patients seen from June 2010 to October 2019 ('subtracted from the clinical database';
      'From a database of patients evaluated for ME/CFS ... we selected'), but neither uses the word 'retrospective'.
      The description is a fair reading of the design but is the card's characterisation, not the papers'
      wording.
    fix: Optionally write 'analyses of data taken from a clinical database' to stay with the papers' wording.
  - operation: null
    severity: advisory
    problem: 'For pmid:34198913 the PubMed abstract contradicts the full text: the abstract says 51 women
      with idiopathic chronic fatigue and 50 with ME/CFS, and fibromyalgia in seven ME/CFS patients against
      none (figures that match the men''s paper), while the full text gives 51 ME/CFS and 50 ICF women
      and fibromyalgia in 25/51 (49%) against 7/50 (14%). The card follows the full text, which is correct,
      but a researcher checking the abstract will find different numbers.'
    fix: Optionally note in the study's finding that the numbers are from the full text and that the abstract
      gives different figures.
