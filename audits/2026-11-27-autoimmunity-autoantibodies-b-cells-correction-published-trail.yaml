    text: 'Against the antibody findings, a study of 172 unique participants in two cohorts, whose patients
      met the Canadian Consensus Criteria, measured antibodies against a large panel of human proteins
      and found no significant differences between patients and controls, including against β-adrenergic
      receptors. The REAP cohort had 95 patients and 69 controls, and the Oncimmune/Augmenta Luminex panel
      cohort had 59 patients and 44 controls. Its REAP library included adrenergic and muscarinic receptors;
      the authors report that they did not detect antibody reactivity against these proteins, apart from
      one female ME/CFS subject with reactivity against the fourth extracellular domain of ADRA2B. The
      authors also state a limit of the method: the REAP library displays the extracellular domains of
      these receptors separately, so they were not able to detect certain GPCR autoantibodies, for example
      those that require contact with multiple epitopes on separate extracellular domains for binding.'
