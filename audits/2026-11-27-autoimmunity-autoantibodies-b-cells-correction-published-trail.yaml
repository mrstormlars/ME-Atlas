      sources:
      - pmid:40141440
      - pmid:34589868
    - text: 'The methods differ: the Swedish study used the CellTrend ELISA, while this study used a Luminex
        bead panel and REAP yeast display. Its REAP library included adrenergic and muscarinic receptors,
        and the authors report no antibody reactivity against these proteins apart from one female ME/CFS
        subject with reactivity against the fourth extracellular domain of ADRA2B. The authors state that
        the REAP library displays the extracellular domains separately, so they were not able to detect
        certain GPCR autoantibodies, for example those that require contact with multiple epitopes on
