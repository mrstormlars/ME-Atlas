review:
  verdict: reject
  findings:
  - class: decisive
    severity: must_fix
    problem: 'Request item 1 is an error. The card records pmid:40141440 with case_definition ''unverified''
      (source and quote null), and level_reason[8] says ''a study of 172 participants, whose case definition
      is not yet verified''. The cached full text (data/cache/europepmc/PMC11943395.html, section 2.1)
      states: ''The ME/CFS subjects fulfilled the Canadian consensus criteria for ME/CFS diagnosis [31].''
      The quote is in the record and supports the label CCC.'
    fix: Set case_definition to CCC, case_definition_source to fulltext and case_definition_quote to 'The
      ME/CFS subjects fulfilled the Canadian consensus criteria for ME/CFS diagnosis [31].'; in level_reason[8]
      replace 'whose case definition is not yet verified' with a statement that the patients met the Canadian
      Consensus Criteria.
    targets:
    - studies[pmid:40141440].case_definition
    - studies[pmid:40141440].case_definition_source
    - studies[pmid:40141440].case_definition_quote
    - level_reason[8]
  - class: decisive
    severity: must_fix
    problem: 'Request items 2 and 3 are errors. n_patients and n_controls are null, but the cached full
      text gives them. Table 1 (''Study demographics''): Oncimmune/Augmenta cohort 59 ME/CFS and 44 controls;
      REAP cohort 95 ME/CFS and 69 controls. Section 2.1: ''Our study included a total of 172 unique participants,
      divided into two cohorts with approximately 92% overlap.'' Section 2.5 also says ''our cohort of
      95 ME/CFS patients and 69 controls''. The full text does not give a patient/control split of the
      172 unique participants. The REAP cohort is the larger one and the one whose library covered ADRB1,
      ADRB2, CHRM3 and CHRM4 (section 2.6), so it is the measurement that bears on the card''s finding.
      The sample size also matters for the contested-mark test (next finding).'
    fix: 'Set n_patients 95 and n_controls 69 (the REAP cohort). In the study finding and in level_reason[8],
      state both cohorts as the record gives them (REAP: 95 patients and 69 controls; Oncimmune/Augmenta
      Luminex panel: 59 patients and 44 controls; 172 unique participants in all).'
    targets:
    - studies[pmid:40141440].n_patients
    - studies[pmid:40141440].n_controls
    - studies[pmid:40141440].finding
    - level_reason[8]
  - class: decisive
    severity: must_fix
    problem: 'With the case definition corrected to CCC, pmid:40141440 now meets all three parts of the
      rubric''s ''comparable quality'' test against the study level 2 rests on (pmid:34589868: CCC/ICC/IOM,
      48 patients in two cohorts of 24, controlled). It has the same case definition (CCC), a control
      group, and 95 patients (REAP) or 59 (Luminex), both at least half of 48. It contradicts the level-2
      finding. Section 2.6 says that for ADRB2, ADRA1A and ADRBK1 the ''p-values and q-values indicate
      no significant difference between patients and controls, contrasting with previous studies that
      reported elevated levels of ADRB2 in ME/CFS [18, 19]'' (ref 19 is the Swedish study). The REAP library
      ''included a broad range of adrenergic and muscarinic receptor AAb (... ADRB1, ADRB2, ADRB3, CHRM1,
      CHRM2, CHRM3, and CHRM4). Despite being part of our analysis, we did not detect AAb reactivity against
      these proteins, apart from one female ME/CFS subject with REAP reactivity against the fourth ECD
      of ADRA2B.'' Under the rubric this supports a contested mark at level 2. The card has contested:
      null, and the study has role ''context'', not ''contradicts''. One caveat must be written out with
      any mark, because the record states it: the methods differ (Luminex bead panel and REAP yeast display
      here, CellTrend ELISA in the Swedish and Spanish studies), and REAP detected reactivity against
      these receptors in no participant at all, patients or controls. The rubric has no assay criterion.
      The auditor decides the mark.'
    fix: 'Propose to the auditor a contested mark on level 2 citing pmid:40141440 against pmid:34589868,
      with the reason in plain sentences: same case definition, a control group, at least half the sample
      size, and no difference for β-adrenergic and muscarinic receptor antibodies. Set the study''s role
      to contradicts. In level_reason[8], state the two assay methods and that REAP detected no reactivity
      against the adrenergic and muscarinic receptors in any participant, quoting only what the full text
      says.'
    targets:
    - contested
    - studies[pmid:40141440].role
    - level_reason[8]
rounds:
- round: 1
  operations:
  - op: update_study
    id: pmid:40141440
    set:
      case_definition: CCC
      case_definition_source: fulltext
      case_definition_quote: The ME/CFS subjects fulfilled the Canadian consensus criteria for ME/CFS
        diagnosis [31].
      n_patients: 95
      n_controls: 69
      role: contradicts
      finding: 'A study of 172 unique participants in two cohorts (REAP cohort: 95 patients and 69 controls;
        Oncimmune/Augmenta Luminex panel: 59 patients and 44 controls) measuring antibodies against 6,183
        extracellular human proteins and a 1,134-antibody panel found no significant differences between
        patients and controls, including against β-adrenergic receptors. The patients met the Canadian
        Consensus Criteria. The n given for the study is the REAP cohort, whose library covered the adrenergic
        and muscarinic receptors.'
  - op: replace_paragraph
    field: level_reason
    index: 8
    text: Against the antibody findings, a study of 172 unique participants in two cohorts, whose patients
      met the Canadian Consensus Criteria, measured antibodies against a large panel of human proteins
      and found no significant differences between patients and controls, including against β-adrenergic
      receptors. The REAP cohort had 95 patients and 69 controls, and the Oncimmune/Augmenta Luminex panel
      cohort had 59 patients and 44 controls. The study used a Luminex bead panel and REAP yeast display,
      not the ELISA used in the Swedish and Spanish studies. Its REAP library included adrenergic and
      muscarinic receptors; the authors report that they did not detect antibody reactivity against these
      proteins, apart from one female ME/CFS subject with reactivity against the fourth extracellular
      domain of ADRA2B.
    sources:
    - pmid:40141440
  - op: propose
    target: contested
    value:
    - 2
    reason:
    - text: A study of 172 unique participants, whose patients met the Canadian Consensus Criteria, the
        same case definition as the Swedish study that level 2 rests on, included a control group and
        a REAP cohort of 95 patients and 69 controls, and a Luminex panel cohort of 59 patients and 44
        controls. Both cohorts have more patients than the 48 patients of the Swedish study. It found
        no significant difference between patients and controls for antibodies against β-adrenergic receptors;
        the authors write that this contrasts with previous studies that reported elevated levels of ADRB2
        in ME/CFS.
      sources:
      - pmid:40141440
      - pmid:34589868
    - text: 'The methods differ: the Swedish study used the CellTrend ELISA, while this study used a Luminex
        bead panel and REAP yeast display. Its REAP library included adrenergic and muscarinic receptors,
        and the authors report no antibody reactivity against these proteins apart from one female ME/CFS
        subject with reactivity against the fourth extracellular domain of ADRA2B. The contest of level
        2 rests on a single null study and has not been repeated.'
      sources:
      - pmid:40141440
      - pmid:34589868
  checks:
