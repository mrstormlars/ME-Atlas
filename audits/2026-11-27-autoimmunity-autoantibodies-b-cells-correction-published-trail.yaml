  review:
    verdict: reject
    findings:
    - class: decisive
      operation: 2
      severity: must_fix
      problem: 'The contested reason (and level_reason[8], operation 1) presents the REAP null for the
        adrenergic and muscarinic receptors as a contradiction of the Swedish M3/M4 and beta2 results,
        but leaves out the limit the authors themselves state for exactly this measurement. The cached
        full text of pmid:40141440 (Discussion) says: ''Indeed, the REAP library displays GPCR extracellular
        domains (ECDs) separately, and therefore, we are not able to detect certain GPCR autoantibodies;
        for example, we were not able to detect those that require contact with multiple epitopes on separate
        ECDs for binding.'' With REAP detecting reactivity against these receptors in only one participant,
        this is a missing limit that changes how a reader (and the auditor) reads the contest: the null
        may reflect what the method can detect. Saying only ''The methods differ'' does not convey it.
        (This answers finding 2 of the review, but its caveat is not fully written out.)'
      fix: 'In contested reason[1] and in level_reason[8], add the authors'' statement, citing pmid:40141440
        and quoting or closely paraphrasing only the full text: the REAP library displays the receptors''
        extracellular domains separately, so the authors were not able to detect certain GPCR autoantibodies,
        for example those that need contact with several extracellular domains to bind. Optionally also
        note that the beta2 no-difference result comes from the Oncimmune/Augmenta Luminex panel (59 patients,
        44 controls), which is the measurement that bears on the beta2 finding.'
      targets:
      - contested
      - level_reason[8]
    - class: wording
      target: level_reason[8]
      operation: 1
      severity: must_fix
      problem: 'level_reason[8] now says the study used ''a Luminex bead panel and REAP yeast display,
        not the ELISA used in the Swedish and Spanish studies'', but the paragraph cites only pmid:40141440,
        whose full text does not state that the Swedish and Spanish studies used ELISA (it mentions ELISA
        only in general: ''assessing autoantibody binding in a standard assay, such as ELISA, is challenging'').
        The claim is true of pmid:34589868 and pmid:42082542 (both records state a CellTrend ELISA), but
        those are not cited in this paragraph, so the sentence is unsourced where it stands.'
      fix: Either remove the clause 'not the ELISA used in the Swedish and Spanish studies', or add pmid:34589868
        and pmid:42082542 (both on the card) to the paragraph's sources.
      targets:
      - level_reason[8]
    - severity: advisory
      problem: 'Comments on the applied card are now stale: the comment above `contested` still says ''Contested:
        null (founder ruling 2026-11-01) ... 40141440 unverified, V9'', and the comment in the pmid:40141440
        study block still says the patient/control split is not available ''so n is null'' and that the
        CCC sentence is ''not used until cached''. Comments are not reader-facing, but they now contradict
        the card''s fields.'
      fix: Remove the stale comment line in the pmid:40141440 block with remove_comment; the header and
        contested comments can be updated when the auditor has decided.
    - operation: 0
      severity: advisory
      problem: The study finding's last sentence 'The n given for the study is the REAP cohort, whose
        library covered the adrenergic and muscarinic receptors.' reads as an editorial note. It is supported
        (Table 1 and section 2.6), but the beta2 no-difference result in section 2.6 comes from the Oncimmune/Augmenta
        panel, not REAP, which the sentence could lead a reader to misplace.
      fix: 'Consider: ''The n given is the REAP cohort, whose library included the adrenergic and muscarinic
        receptors; the β2 result comes from the Luminex panel.'''
