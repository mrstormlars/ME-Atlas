- op: replace_paragraph
  field: level_reason
  index: 0
  text: A study of 47 patients who fulfilled the Centers for Disease Control classification for CFS (version
    not named) and 34 healthy volunteers enrolled (the number measured is not stated) found higher blood
    levels of isoprostanes, a marker of oxidative damage to fats, in patients, both in those with and
    in those without cardiovascular risk factors. A study from Antwerp of 56 patients diagnosed using
    the CDC criteria (version not named) and 37 healthy controls found higher plasma peroxides in patients.
    Both studies used a CDC definition without a stated version, which does not require post-exertional
    malaise. The card is at level 2 because of these two controlled studies, which used different measures.
  sources:
  - pmid:16085177
  - pmid:21455120
- op: replace_paragraph
  field: level_reason
  index: 1
  text: 'Other controlled studies found higher oxidative-stress markers, each on a different measure:
    malondialdehyde and protein carbonyls in 24 women meeting the Fukuda definition against 19 controls
    in Novi Sad, Serbia; reactive oxygen metabolites in a study of patients diagnosed by the Fukuda 1994
    criteria, whose abstract does not give the numbers; and reactive oxygen species inside lymphocytes
    in 15 patients against 16 controls at Stanford, where the difference was found in women but not in
    men. The Stanford patients were diagnosed by a physician using the National Academy of Medicine, Fukuda
    and Canadian Consensus criteria; which definition each patient met is not stated, and Fukuda is recorded
    as the least strict one named. Because the measures differ, none of these is a repeat of another,
    and each is unreplicated.'
  sources:
  - pmid:23185200
  - pmid:27224647
  - pmid:40627396
- op: replace_paragraph
  field: level_reason
  index: 2
  text: 'The card does not reach level 3: no independent group has found the same result on the same measure
    in a separate cohort with a confirmed recognised case definition. The only other isoprostane study,
    of 6 patients and 6 controls, also found higher levels at rest, but its case definition is not yet
    verified. It shares three authors with the first isoprostane study, so it would not count as an independent
    repeat even with a verified definition.'
  sources:
  - pmid:19422646
  - pmid:16085177
- op: replace_paragraph
  field: level_reason
  index: 4
  text: Measures of antioxidant defences are mixed. In studies with a recognised definition, biological
    antioxidant potential was lower in the Osaka study, while glutathione in lymphocytes was higher in
    both sexes in the Stanford study (in men, in two of the three cell types tested). In studies whose
    case definition is not yet verified, plasma coenzyme Q10 was lower in 58 patients than in 22 controls;
    whole-blood glutathione peroxidase activity did not differ between 40 patients and 24 controls; glutathione
    in the brain was lower in 15 patients than in 13 healthy volunteers in one study and did not differ
    in another of 26 people in all.
  sources:
