    problem: 'Answers audit point (1), that the Dundee city cannot be checked, by setting group to null
      for pmid:16085177. That leaves this level-carrier study without a group when every other study on
      the card has one, and it also deletes the part the record does support: the PubMed author list names
      Belch JJ as last author (Kennedy G first author). It removes more than the finding needs. In fact
      the cached PubMed record data/cache/pubmed/16085177.xml gives the first author''s affiliation as
      Ninewells Hospital and Medical School, Dundee.'
    fix: Keep an author-only group taken from the existing text and the record's author list, with no
      TODO, for example "Belch JJ (last author; first author Kennedy G)", instead of null.
  - operation: 2
    severity: must_fix
    problem: Setting group to null for pmid:19422646 leaves the study without a group, unlike the rest
      of the card. It also drops the sourced note that the study shares authors Kennedy G, Hill A and
      Belch JJ with pmid:16085177, which is the reason level_reason[2] gives for not counting it as an
      independent repeat. The author list in the record supports both the last author (Nimmo MA) and the
      shared authors. The audit asked only about the city, and the cached record data/cache/pubmed/19422646.xml
      does give University of Strathclyde, Glasgow.
    fix: Set group to an author-only value from the existing text, for example "Nimmo MA (last author);
      shares authors Kennedy G, Hill A, Belch JJ with 16085177", instead of null.
