card: oxidative-nitrosative-stress
decision: accept
parts:
  - decision_part: "The level 2: two controlled studies with a CDC case definition, Dundee (isoprostanes) and Antwerp (plasma peroxides), each found a higher oxidative-stress marker in patients."
    rubric: "A controlled study in patients with a recognised case definition supports it."
    evidence:
      - source: pmid:16085177
        quote: "who fulfilled the Centres for Disease Control classification for CFS and 34 healthy volunteers"
      - source: pmid:16085177
        quote: "Patients had significantly increased levels of isoprostanes (group 1, P=0.007; group 2, P=0.03, unpaired t test compared to controls)"
      - source: pmid:21455120
        quote: "made using the Centres for Disease Control and Prevention (CDC) criteria"
      - source: pmid:21455120
        quote: "Plasma peroxide concentrations were significantly higher in patients with ME/CFS than in normal controls."
    class: none
  - decision_part: "The CDC case definitions (version not named) are accepted and flagged as not requiring PEM, as the card does."
    rubric: "Accepted like Fukuda and Holmes 1988, since neither CDC version requires PEM"
    evidence:
      - source: pmid:21455120
        quote: "made using the Centres for Disease Control and Prevention (CDC) criteria"
    class: none
  - decision_part: "Not level 3: the only other isoprostane study is 6 against 6 with no case definition in its abstract and shares authors with the Dundee study; the other controlled studies used different measures (MDA and carbonyls, reactive oxygen metabolites, lymphocyte ROS)."
    rubric: "An independent group has reproduced the finding in a separate cohort."
    evidence:
      - source: pmid:19422646
        quote: "Six male CFS patients and six healthy controls performed an incremental exercise test to exhaustion and a submaximal exercise bout to exhaustion."
      - source: pmid:19422646
        quote: "F(2)-isoprostanes were higher (P<0.05) in CFS patients at rest and this difference persisted immediately and 24 h post-exercise."
      - source: pmid:23185200
        quote: "The CFS group had higher levels of triglycerides (p = 0.03), MDA (p = 0.03) and CO (p = 0.002)"
      - source: pmid:27224647
        quote: "Resting condition yielded higher d-ROMs, higher OSI, and lower BAP in patients with CFS than in healthy volunteers"
      - source: pmid:40627396
        quote: "were diagnosed by a physician using the National Academy of Medicine (8), Fukuda (36), and Canadian Consensus criteria (37)."
    class: none
  - decision_part: "No contested mark: the one comparable-quality contradicting study (40 women, 1994 CDC, no overall MDA difference) contradicts the 24-patient MDA finding, which the card does not use to carry the level; no study of comparable quality contradicts the isoprostane or plasma peroxide findings."
    rubric: "a control group, and at least half the sample size of the study it contradicts."
    evidence:
      - source: pmid:21119582
        quote: "Although initial statistical analyses showed no differences between groups (P=.345), when subdivided according to the level of MDA, a difference was found in the subgroup of high-level MDA (P=.034)."
      - source: pmid:21119582
        quote: "Forty women aged 15-45 years who fulfilled the 1994 Centers for Disease Control's diagnostic criteria for chronic fatigue syndrome (CFS) with no comorbidities were recruited and were age matched to a control group of 40 healthy women."
    class: none
  - decision_part: "Not level 4: the trial that reported lower lipid peroxides has no verified case definition, and the larger Fukuda trial of the same combination measured no oxidative-stress marker and found the groups changed in parallel."
    rubric: "Changing the proposed factor changes the outcome in a controlled experiment, so the link goes beyond association."
    evidence:
      - source: pmid:25386668
        quote: "lipoperoxides (p<0.05) were significantly lower in blood mononuclear cells of the treated group."
      - source: pmid:34444817
        quote: "FIS-40 domain scores evolved in parallel between groups over the course of the study."
    class: none
  - decision_part: "Badge diagnostic_marker false: no marker was tested in a second, independent patient group; the Antwerp peroxide test did not discriminate and the Stanford follow-up was a small case study by the same group."
    rubric: "Yes only when a measurable marker linked to the hypothesis has been tested in a second, independent patient group, with a stated case definition."
    evidence:
      - source: pmid:21455120
        quote: "The residualized plasma peroxide values showed no significant diagnostic performance for ME/CFS, where the area under the ROC curve was only 62.6%."
      - source: pmid:40627396
        quote: "Although the comparisons from the fPOP cohort are a small case study"
    class: none
  - decision_part: "Badge explains_pem false: the Dundee study correlated isoprostanes with a symptom score item in one subgroup and did not measure PEM directly."
    rubric: "Yes only when at least one study at level 2 or above measures PEM directly"
    evidence:
      - source: pmid:16085177
        quote: "CFS symptoms correlated with isoprostane levels, but only in group 2 low CV risk CFS patients"
    class: none
  - decision_part: "Layer dysfunction: the card's evidence is blood and cell measures of oxidative stress, a measurable dysfunction."
    rubric: "What goes wrong in the body?"
    evidence:
      - source: pmid:16085177
        quote: "This study investigated for the first time levels of 8-iso-prostaglandin-F(2 alpha)-isoprostanes alongside other plasma markers of oxidative stress in CFS patients and control subjects."
    class: none
  - decision_part: "Link to symptom:post-exertional-neuroimmune-exhaustion at step associated: the Dundee study (CDC definition) measured isoprostanes and a post-exertional malaise symptom item in the same patients and reports a correlation."
    rubric: "A study in an ME/CFS cohort with a recognised case definition that measured both ends in the same patients and reports a relation between them."
    evidence:
      - source: pmid:16085177
        quote: "isoprostanes correlated with; total symptom score P=0.005; joint pain P=0.002; postexertional malaise P=0.027, Pearson"
    class: none
  - decision_part: "Links to endothelial-dysfunction, hpa-axis-cortisol, autonomic-imbalance and symptom:sleep-disturbance at step proposed: each source states the link."
    rubric: "A peer-reviewed source (a review counts) that states the link."
    evidence:
      - source: pmid:41516145
        quote: "Endothelial dysfunction driven by oxidative and nitrosative stress, along with autoantibody-mediated receptor interference, may explain orthostatic intolerance and impaired perfusion."
      - source: pmid:27766535
        quote: "HPA axis hypoactivity in ME/CFS is most likely a consequence and not a cause of a wide variety of activated immune-inflammatory and O&NS pathways in that illness."
      - source: pmid:16610951
        quote: "results suggest a common link between oxidative stress, immune system dysfunction and potassium imbalance in CFS patients leading to impaired sympatho-vagal balance strongly reflected in abnormal HRV."
      - source: pmid:29759891
        quote: "we propose a heuristic framework in which reciprocal interactions of immune, oxidative and nitrosative stress, and mitochondrial pathways may drive sleep abnormalities across potentially neuroprogressive disorders."
    class: none
  - decision_part: "Subgroup and early signal (Stanford sex difference) are presented as unreplicated and match the record."
    rubric: "A controlled study in patients with a recognised case definition supports it."
    evidence:
      - source: pmid:40627396
        quote: "While ME/CFS females exhibit higher total ROS and mitochondrial calcium levels, males have normal ROS levels, with pronounced mitochondrial lipid oxidative damage."
    class: none
reasons_summary: "Level 2 rests on two controlled CDC-defined studies (Dundee isoprostanes, Antwerp plasma peroxides); no same-measure independent repeat, no comparable contradiction of those findings, both badges correctly no, layer and links match their sources."
would_change: "An independent controlled study with a recognised case definition repeating isoprostanes or plasma peroxides would raise the question of level 3; a comparable-quality study finding no difference in either would make level 2 contested. Not checkable from the context file and not needed for any level, badge, mark or link: the place labels Dundee, Glasgow and Osaka and the claim that the 2010 Novi Sad study came from the same clinic (the records shown carry no affiliations, and the Dundee, Glasgow, Osaka and 2010 Novi Sad records are abstract only), and that the Dundee number measured is not stated (full text not cached)."
