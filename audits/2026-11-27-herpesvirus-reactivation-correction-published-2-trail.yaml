    id: pmid:37526404
    set:
      case_definition: Fukuda
      case_definition_source: fulltext
      case_definition_quote: ME/CFS cases were enrolled, if they met the 1994 CDC CFS case definition
        (5)
      n_patients: 285
      n_controls: 201
      finding: A multicentre study of two case-control cohorts searched blood, stool and saliva for viral
        genetic material and found no consistent differences between patients and healthy controls other
        than a lower prevalence of anelloviruses in patients. In cohort 1 (plasma, 285 patients meeting
        the 1994 CDC definition and 201 healthy controls), MassTag PCR identified six samples positive
        for HHV-6 (4 patients and 2 controls). In cohort 2 (106 patients meeting both the 1994 CDC and
        the 2003 Canadian Consensus criteria and 91 healthy controls), HHV-6 was found in saliva in 41.5%
        of patients and 52.7% of controls (p=0.12), HHV-7 in 62.3% and 62.6% (p=1) and HHV-4 (Epstein-Barr
        virus) in 28.3% and 33.0% (p=0.54), and HHV-6 in blood cells in 1 patient and no control.
  - op: replace_paragraph
    field: level_reason
    index: 7
    text: One study whose case definition is not yet verified found no difference. One of 26 patients
      and 50 matched controls in Atlanta (52 recruited) isolated no HHV-6 or HHV-7 from anyone's blood
      cells and found no difference in HHV-6 or HHV-7 DNA in blood cells, which this card treats as a
      marker of latent rather than active infection. A multicentre study with two case-control cohorts,
      the first of 285 patients meeting the 1994 CDC definition and 201 healthy controls (plasma) and
      the second of 106 patients meeting both the 1994 CDC and the 2003 Canadian Consensus criteria and
      91 healthy controls, found no consistent differences between patients and controls other than fewer
      anelloviruses (a family of viruses that are not herpesviruses) in patients. In the plasma of the
      first cohort, MassTag PCR identified six samples positive for HHV-6 (4 patients and 2 controls);
      its MassTag panel did not include HHV-7. In the saliva of the second cohort, HHV-6 was found in
      41.5% of patients and 52.7% of controls (p=0.12), HHV-7 in 62.3% and 62.6% (p=1) and Epstein-Barr
      virus in 28.3% and 33.0% (p=0.54). The first cohort has a recognised definition, controls and more
      than half the 200 patients of the Riga study, but it did not test HHV-7, so it does not directly
      test the double HHV-6 and HHV-7 result on which level 2 rests; the second cohort measured saliva,
      not cell-free plasma. For this reason the card is not marked contested. On the direction of cause,
      the London study says herpesvirus reactivation might be a cause or consequence of the dysregulated
      immune function seen in ME/CFS, and the Bulgarian study raises the possibility that patients with
      ME/CFS are susceptible to acute viral infections as a consequence of immune dysfunction.
    sources:
