  review:
    verdict: reject
    findings:
    - class: decisive
      operation: 3
      severity: must_fix
      problem: Answers finding 6. The new sentence 'The first cohort has a recognised definition, controls
        and more than half the 200 patients of the Riga study, but it did not test HHV-7' is not what
        the cached full text of pmid:37526404 (PMC11912808) says. HHV-7 is missing only from the MassTag
        panel (Table 2). The text also says 'We next used unbiased high-throughput sequencing ... to screen
        the ME/CFS case plasma samples of cohort 1 for additional agents than those targeted by the MassTag
        PCR. Unbiased sequencing detected pegiviruses, HHV-6, and at high prevalence anelloviruses.' So
        the case plasma was screened by a method that could detect HHV-7 (patients only, no controls,
        threshold 1000-10,000 copies), and no HHV-7 was reported. 'Did not test HHV-7' is the premise
        the paragraph uses to say the cohort does not bear on the level and is not contesting.
      fix: 'Say what the record says: HHV-7 was not on the MassTag panel, and the unbiased sequencing
        of the patients'' plasma (no controls sequenced) reported HHV-6, pegiviruses and anelloviruses
        and no HHV-7. Then restate whether and why cohort 1 does or does not test the double HHV-6 and
        HHV-7 result, citing pmid:37526404.'
      targets:
      - level_reason[7]
      - contested
    - class: decisive
      operation: 3
      severity: must_fix
      problem: 'Answers finding 6. The paragraph says of cohort 2 that ''the second cohort measured saliva,
        not cell-free plasma. For this reason the card is not marked contested.'' That reason conflicts
        with the card''s own scope and its own reasoning. The scope comment counts viral DNA in saliva
        as a marker of active infection (''viral DNA outside cells (cell-free plasma, saliva, sputum,
        throat washings)''). level_reason[6] keeps the contested mark off the London saliva/ddPCR screen
        only because it ''cannot be told whether this measurement had at least half the 200 patients of
        the Riga study''. That implies a saliva measurement with at least 100 patients would bear on the
        mark. Cohort 2 of pmid:37526404 meets that: 106 patients meeting both the 1994 CDC and the 2003
        Canadian Consensus criteria, 91 healthy controls, HHV-6 in saliva 41.5% vs 52.7% (p=0.12), HHV-7
        62.3% vs 62.6% (p=1). The full text also reports co-detection: ''HHV-6 and HHV-7 were encountered
        together most frequently in cases and controls (65% and 74%, respectively)''. In my reading for
        the auditor, cohort 2 is a study of comparable quality (recognised definition, controls, 106 >=
        100 patients) that measured an in-scope active-infection marker for both viruses and found no
        difference. The evidence therefore supports considering a contested mark at level 2. The decision
        is the auditor''s, but the paragraph must not give a reason the card''s own rules contradict.'
      fix: Remove 'the second cohort measured saliva, not cell-free plasma. For this reason the card is
        not marked contested', or replace it with reasoning consistent with the card's scope. Either state
        cohort 2's saliva HHV-6 and HHV-7 results as bearing on level 2, or add a propose on contested
        citing pmid:37526404 and pmid:36653846, for the auditor to decide.
      targets:
      - level_reason[7]
      - contested
    - class: decisive
      operation: 4
      severity: must_fix
      problem: 'Answers finding 5. The new opening sentence ''No marker on this card has been tested by
        an independent research group'' is contradicted by the card''s own studies. The plasma HHV-6 DNA
        marker of the Riga group (pmid:36653846) was tested by the Lipkin group (pmid:37526404: cohort
        1 plasma, 285 patients, 201 controls, HHV-6 in 4 patients and 2 controls). The saliva HHV-6/HHV-7
        markers were tested by the London group (pmid:34422848). Those tests did not confirm the markers,
        so the badge stays false, but ''not tested'' is wrong. The sentence also covers every marker on
        the card while citing only the two dUTPase studies.'
      fix: 'Limit the sentence to what its sources show, for example: ''Neither dUTPase antibody result
        has been tested by an independent research group.'' Or say that no marker on the card has been
        found again by an independent group in a separate patient group, citing the studies that tested
        them.'
      targets:
      - badge_reasons.diagnostic_marker[0]
    - operation: 4
      severity: advisory
      problem: '''the later study, of 40 patients and 16 healthy controls meeting the Fukuda definition''
        can be read as saying the controls met the Fukuda definition.'
      fix: '''the later study, of 40 patients meeting the Fukuda definition and 16 healthy controls''.'
    - operation: 1
      severity: advisory
      problem: The case_definition_quote for pmid:41451845 writes 'ages 19-65' with a hyphen; the cached
        full text (PMC13051489) has an en dash ('19–65'). The mechanical check passed, but the quote should
        be copied word for word.
      fix: Use the en dash as in the full text.
