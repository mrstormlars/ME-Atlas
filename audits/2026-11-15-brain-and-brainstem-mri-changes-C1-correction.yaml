review:
  verdict: reject
  findings:
  - operation: 3
    severity: must_fix
    problem: 'This answers review finding 2, but the new text is false against the record. The new level_reason[5]
      says of pmid:35355311 ''16 of the 18 patients meeting the International Consensus Criteria were
      analysed (the paper does not say why two were left out)''. The cached full text of 35355311 (PMC9321967,
      in the context) does give the reason: ''All hippocampal subfields were visually checked for distortion-free
      segmentation. Two ME/CFSICC patients and one ME/CFSFukuda patients were excluded from analysis due
      to inadequate segmentation.'' Review finding 2 was mistaken, and the earlier wording (''two scans
      could not be analysed'') was supported by the record. The number 16 of 18 is right; only the stated
      reason is wrong.'
    fix: Replace the parenthesis with what the record says, for example '16 of the 18 patients meeting
      the International Consensus Criteria were analysed (two were excluded because their hippocampal
      segmentation was inadequate)', or put back the earlier wording.
    class: wording
    target: level_reason[5]
  - operation: 7
    severity: must_fix
    problem: This has the same error as level_reason[5]. The new finding says 'n=16 of the 18 patients
      meeting the International Consensus Criteria (the paper does not say why two were left out)'. The
      cached full text of 35355311 says 'Two ME/CFSICC patients and one ME/CFSFukuda patients were excluded
      from analysis due to inadequate segmentation.' The card's own comment above n_patients quotes this
      sentence.
    fix: Write '(two were excluded because their hippocampal segmentation was inadequate)', or put back
      the earlier '(two scans could not be analysed)'.
    class: wording
    target: studies[pmid:35355311].finding
  - operation: 1
    severity: must_fix
    problem: 'contested.reason[0] ends ''so whether it contradicts the first is for the auditor to decide''.
      This sentence is reader-facing, and it is an internal process note, not a sourced statement. It
      also leaves the card disagreeing with itself. This correction sets pmid:40624094 to role ''contradicts''
      (operation 0), and level_reason[2] now says ''This is why the card is marked as contested at level
      2'', yet the paragraph that gives the reason for the mark says the contradiction is undecided. The
      sourced limits in the same sentence are supported: the opposite direction was found in the post-infectious
      subgroup, and 40624094 used TBSS (''The DTI data were analysed using the established tool, tract-based
      spatial statistics (TBSS)'') while 34355438 used voxel-based analysis.'
    fix: 'Drop ''so whether it contradicts the first is for the auditor to decide'' and keep the limits
      as plain facts. For example: ''The opposite direction was found only in the infection-triggered
      subgroup, and the two studies used different analyses (tract-based against voxel-based).'''
    class: wording
    target: contested_reason[0]
  - operation: 1
    severity: must_fix
