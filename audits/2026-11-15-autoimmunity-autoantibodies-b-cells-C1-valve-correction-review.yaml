card: autoimmunity-autoantibodies-b-cells
round: 1
stage: correction-review
attempt: C1
classification:
- finding: findings[0]
  class: wording
  target: subgroups[0]
  problem: This operation answers review finding 6. Its new second sentence says 'The Swedish study included
    all patients meeting its criteria at two clinics, without selecting on antibody level'. The cached
    full text of pmid:34589868 does not say this. It says 'All patients at both Stora Skondal and Gottfries
    clinics fulfilled the Canadian Concensus Criteria, the International Concensus Criteria and the IOM
    criteria' and 'In total, 48 patients were included, 24 from each clinic respectively'. That means
    every included patient met the criteria. It does not mean every patient who met the criteria was included.
    The paper also says nothing about selecting or not selecting on antibody level. The sentence misreads
    the record and adds a fact, which a correction may not do.
- finding: findings[1]
  class: wording
  target: badge_reasons.diagnostic_marker[0]
  problem: This operation answers review finding 5. The rewritten reason still ends 'The Cornell study
    found no differences.' The cached record for pmid:40141440 is the abstract only (full text not cached;
    HTTP 500), and its author list and abstract do not name Cornell. The second audit flagged this place
    name as unverifiable. This same correction removes 'from Cornell' from level_reason[8] and the Cornell
    affiliation from the study's group (operation 6) for that reason, but leaves the name in the badge
    reason.
operations:
