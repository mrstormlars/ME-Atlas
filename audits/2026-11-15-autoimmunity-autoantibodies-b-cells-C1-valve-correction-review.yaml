  field: subgroups
  index: 0
  text: The immunoadsorption studies included only patients whose illness began after an infection (after
    COVID-19 in one) and who had raised β2 receptor antibodies. In the Swedish study, 79% and 91% of patients
    in its two cohorts, and 25% of controls, had at least one raised receptor antibody.
  sources:
  - pmid:29543914
  - pmid:39759581
  - pmid:34589868
- op: replace_paragraph
  field: badges.diagnostic_marker.reason
  index: 0
  text: 'Receptor antibody levels have been compared with controls in separate cohorts, with mixed results,
    and no study on this card has validated a cut-off in a second, independent patient group. In the Swedish
    study, 25% of controls and 79% and 91% of patients had at least one receptor antibody above the controls''
    90th percentile. The Spanish study applied the test maker''s cut-off, which was not derived from its
    own study population, and it did not separate patients from controls: 27.5% of patients and 13.9%
    of controls had β2 receptor antibodies above it, 18.6% of patients against 58.3% of controls had M4
    receptor antibodies above it, and 55.9% of patients against 58.3% of controls had α1 receptor antibodies
    above it. The third study found no differences.'
  sources:
