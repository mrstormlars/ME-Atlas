pre_card_review:
  verdict: reject
  findings:
  - operation: null
    severity: must_fix
    problem: 'level_reason[3] says: ''The authors read the viral DNA as longstanding, persistent infection
      rather than acute or recent infection.'' In the cached full text (PMC8378328, Discussion), the same
      sentence calls detection of HHV DNA in saliva ''evidence of virus reactivation and shedding''. It
      contrasts longstanding infection with acute or recent (primary) infection, not reactivation with
      latency. The abstract also says the results are ''in accordance with the hypothesis that pathogenesis
      is related to herpesvirus reactivation state''. As written, a reader would take the authors to be
      reading the saliva DNA as latent rather than active, and this is one of the reasons the card gives
      for not reaching level 3.'
    fix: 'Quote the authors accurately, for example: ''The authors describe saliva DNA as evidence of
      reactivation and shedding, and say that, because it matched viral DNA in earlier blood samples,
      these are longstanding infections rather than acute or recent ones.'' Then base the level-3 reasoning
      on the measurement differences (saliva DNA load, subgroup and time-point differences), not on this
      sentence.'
  - operation: null
    severity: must_fix
    problem: 'level_reason[3] ends with ''does not repeat the finding of active infection in blood''.
      This reads as if the London study did not look at blood. In fact, as a screening step, it tested
      plasma by ddPCR in 189 selected UK ME/CFS Biobank samples (ME/CFS, healthy controls and MS) and
      found that ''HHV DNA was rarely detected, with HSV-2, HHV-6A and HHV-6B detected in plasma from
      one or two subjects and the remaining HHVs always negative'' (PMC8378328, Results, Table 1). HHV-7
      was never found in plasma. Plasma DNA is the very marker the level-2 finding rests on: Riga 2023
      found active infection by plasma DNA in 45% of patients and 8.7% of controls. The card leaves this
      result out. The text does not give how many ME/CFS patients were in the plasma screen, so whether
      it is of comparable quality (half of 200 patients) cannot be judged from the cached record. On the
      cited evidence the card supports level 2: a controlled Fukuda study, Riga 2023 with n=200, whose
      double active HHV-6 and HHV-7 result is unreplicated by an independent group. The auditor decides
      the level and any contested mark.'
    fix: Add a sentence, sourced to pmid:34422848, saying that the study's plasma screen of selected Biobank
      samples rarely found HHV DNA (HHV-6A or HHV-6B in one or two people, HHV-7 in none), and that the
      paper does not give the number of ME/CFS patients in that screen. Replace 'does not repeat the finding'
      with wording that says this.
  - operation: null
    severity: must_fix
    problem: 'level_reason[5] calls pmid:35102619 ''a non-randomised study'' and says it ''reported how
      often the viruses became undetectable in blood, not whether symptoms changed''. The cached record
      is the abstract only. The abstract does not say whether allocation was randomised: it says only
      that ''The control group consisted of similar patients with ME/CFS (n = 63) not taking any antiviral
      drugs''. It also does not show that the paper leaves symptoms out; only the abstract does. The study''s
      own finding field correctly says ''symptoms are not reported in the abstract''.'
    fix: Write 'A study of 192 treated patients ... compared with 63 untreated patients (the abstract
      does not say how patients were allocated) reported in its abstract how often the viruses became
      undetectable in blood; the abstract does not report symptoms.'
  - operation: null
    severity: must_fix
    problem: level_reason[7] says that HHV-6 or HHV-7 DNA in blood cells is something 'this card treats
      as a marker of latent rather than active infection'. That is the card's own reasoning, and it plays
      down a contradicting study with no source. The Atlanta abstract (pmid:10913395) itself concludes
      'We found no evidence that active or latent infection with HHV-6A, HHV-6B, HHV-7 ... is associated
      with chronic fatigue syndrome.'
    fix: Source the marker definition to the Riga papers, which define viral DNA in peripheral blood leukocytes
      as a marker of persistent (latent) infection and DNA in cell-free plasma as a marker of active infection
      (pmid:22927850, pmid:36653846). Also state the Atlanta authors' own conclusion, which covers active
      infection (virus isolation was negative in everyone).
  - operation: null
    severity: must_fix
    problem: badges.diagnostic_marker.reason says 'No marker on this card has been tested in a second,
      independent patient group with a verified case definition.' Plasma viral DNA, the marker behind
      level 2, was tested in other patient groups with accepted definitions. The Bulgarian Fukuda cohort
      (pmid:32129496) found HHV-6 DNA in plasma in 1 of 58 patients and 0 of 50 controls (P = 1.00); its
      full text says it 'did not observe any significant differences' in antibody positivity. The London
      study (pmid:34422848, Canadian Consensus Criteria and/or Fukuda) rarely found HHV DNA in plasma.
      The marker was tested and not confirmed. The badge value (false) stands, but its reason misstates
      why.
    fix: 'Write ''No marker on this card has been confirmed in a second, independent patient group with
      a verified case definition'', and add one sentence: plasma HHV-6 DNA was found in 1 of 58 patients
      in the Bulgarian Fukuda study (pmid:32129496). Keep the Ohio dUTPase sentences.'
  - operation: null
    severity: must_fix
    problem: 'subgroups[0] says ''The antiviral trials selected patients by their antibodies to Epstein-Barr
      virus or HHV-6.'' That holds for the two cited trials (pmid:2849717, pmid:23959519). The card has
      two more antiviral studies: pmid:35102619 selected patients by blood leukocyte PCR, not antibodies,
      and the pmid:18019402 abstract says only ''EBV subset'' without naming the selection test. The sentence
      claims more than its sources.'
    fix: Write 'Two antiviral trials selected patients by their antibodies to Epstein-Barr virus or HHV-6.'
  - operation: null
    severity: must_fix
    problem: In links[1], the London part says the study of '30 patients' found 'a negative correlation
      with HHV-6B during acute illness episodes'. In the full text (PMC8378328), that correlation (PEM
      r = -0.647) comes from the sick-day samples of the seven patients who reported an acute illness
      or worsening of symptoms (one mildly or moderately affected, six severely affected), not from all
      30. Also, 'found no positive correlation between HHV-6B or HHV-7 DNA levels and a questionnaire
      score for post-exertional malaise' is not stated in the text. It is inferred from PEM not being
      among the domains the paper lists as correlated, and the per-domain results are in supplementary
      tables that are not cached.
    fix: Write '... did not report a positive correlation between HHV-6B or HHV-7 DNA levels in saliva
      and a questionnaire score for post-exertional malaise, and, in samples from 7 patients during acute
      illness episodes, reported a negative correlation between HHV-6B and that score.'
  - operation: null
    severity: advisory
    problem: level_reason[0] and the pmid:36653846 finding say the paper 'gives no counts' for active
      double HHV-6 and HHV-7 infection. The cached text gives none, but Fig. 4b shows frequencies (%)
      that cannot be read from the cache.
    fix: Write 'the text gives no counts for it'.
  - operation: null
    severity: advisory
    problem: 'level_reason[1] leaves out that the 2012 Riga study (Table 1, PMC3426163) found the same
      double result with counts: active dual HHV-6 + HHV-7 infection in 10 of 108 patients and 0 of 90
      controls (plus triple HHV-6 + HHV-7 + B19 in 4 and 0). This is the same group''s earlier version
      of the level-2 finding, not a replication, and stating it would make that clear.'
    fix: Add the 10 of 108 versus 0 of 90 count, and say that it comes from the same group.
  - operation: null
    severity: advisory
    problem: The glosses 'parvovirus B19 (not a herpesvirus)' (level_reason[0], pmid:36653846 finding)
      and 'anelloviruses (a family of viruses that are not herpesviruses)' (level_reason[7]) are not stated
      in the cited records. They are general knowledge and are correct, but they are unsourced.
    fix: Keep them if general virology glosses are allowed. Otherwise write 'parvovirus B19' and 'anelloviruses'
      without the gloss.
  - operation: null
    severity: advisory
    problem: 'Group names: the pmid:22927850 group says ''Rasa S is an author of both'', but the 2023
      record lists ''Rasa-Dzelzkaleja S''. That they are the same person is an inference. Krumina A and
      Murovska M appear in both author lists. The pmid:37526404 group names ''Lipkin WI'', but the record
      gives ''Ian Lipkin W''.'
    fix: Write 'Krumina A and Murovska M are authors of both', and use the record's form of the Lipkin
      name or say it differs.
operations:
- op: replace_paragraph
  field: level_reason
  index: 0
  text: A study from Riga, Latvia, of 200 patients meeting the Fukuda definition, which does not require
    post-exertional malaise, and 150 healthy controls looked for viral DNA in cell-free blood plasma,
    which the authors use as a marker of active infection. Active double HHV-6 and HHV-7 infection was
    found only in patients (p < 0.0001); the text gives no counts for it. Markers of active HHV-6, HHV-7
    or parvovirus B19 infection together were found in 45% of patients and 8.7% of controls. The card
    is at level 2 because of the herpesvirus-only result of this study. No independent group has repeated
    it, so it is unreplicated.
  sources:
  - pmid:36653846
- op: replace_paragraph
  field: level_reason
  index: 1
  text: An earlier study by the same Riga group, of 108 patients meeting the 1994 CDC (Fukuda) definition
    and 90 healthy controls, found active HHV-6, HHV-7 or parvovirus B19 infection in 70 of 108 patients
    and 12 of 90 controls. Active HHV-7 infection alone was found in 28 patients and 10 controls, active
    dual HHV-6 and HHV-7 infection in 10 of 108 patients and 0 of 90 controls, and the paper reports HHV-6
    in plasma in 16 of 108 patients. This is the same group's earlier version of the level-2 finding,
    not a replication. The two Riga studies may share patients; the papers do not say.
  sources:
  - pmid:22927850
  - pmid:36653846
- op: replace_paragraph
  field: level_reason
  index: 3
  text: 'A study from London, with no authors shared with the Riga studies, measured herpesvirus DNA in
    saliva every month for six months in 30 patients from the UK ME/CFS Biobank (16 severely, 14 mildly
    or moderately affected), meeting the Canadian Consensus Criteria and/or the Fukuda definition, and
    16 healthy controls in the saliva measurements (the abstract says 14 controls). It found higher HHV-6B
    and HHV-7 DNA levels in saliva: HHV-6B was higher in the 16 severely affected patients than in controls
    at three of six monthly time points, and HHV-7 was higher in the mildly or moderately affected patients
    at two time points, with trends at the others. Epstein-Barr virus and herpes simplex virus 1 did not
    differ. The authors describe the saliva DNA as evidence of reactivation and shedding, and say these
    are longstanding, persistent infections rather than acute or recent ones. As a screening step, the
    study also tested plasma from 189 selected Biobank samples by ddPCR and rarely found herpesvirus DNA:
    HSV-2, HHV-6A and HHV-6B in one or two subjects and the remaining herpesviruses, HHV-7 among them,
    always negative. Plasma DNA is the marker the Riga level-2 finding rests on. The cited record does
    not give how many ME/CFS patients were in the plasma screen, so whether it is of comparable quality
    to the 200-patient Riga study cannot be judged from it, and no contested mark is set. The card does
    not reach level 3: the saliva measurement is a DNA load with differences only in subgroups at a few
    time points, and the plasma screen did not find the Riga plasma result.'
  sources:
  - pmid:34422848
  - pmid:36653846
- op: replace_paragraph
  field: level_reason
  index: 5
  text: A third randomised trial, of valacyclovir in a subset of patients with Epstein-Barr virus markers,
    reported a larger rise in an activity score with valacyclovir than with placebo; its abstract gives
    no sample size or statistical test. A study of 192 patients the authors classed as having reactivated
    HHV-6 or HHV-7 infection by PCR of blood white cells, given valaciclovir, valganciclovir or artesunate,
    compared with 63 untreated patients (the abstract does not say how patients were allocated), reported
    in its abstract how often the viruses became undetectable in blood; the abstract does not report symptoms.
  sources:
  - pmid:18019402
  - pmid:35102619
- op: replace_paragraph
  field: level_reason
  index: 7
  text: Some studies whose case definitions are not yet verified found no difference. A study of 26 patients
    and 50 matched controls in Atlanta (52 recruited) isolated no HHV-6 or HHV-7 from anyone's blood cells
    and found no significant difference in HHV-6 or HHV-7 DNA in blood cells, which the Riga papers define
    as a marker of persistent (latent) infection, with DNA in cell-free plasma as the marker of active
    infection. The Atlanta authors concluded that they found no evidence that active or latent infection
    with these viruses was associated with chronic fatigue syndrome. A multicentre search for viral genetic
    material in blood, stool and saliva found no consistent differences between patients and controls
    other than fewer anelloviruses in patients.
  sources:
  - pmid:10913395
  - pmid:37526404
  - pmid:22927850
  - pmid:36653846
- op: replace_paragraph
  field: badges.diagnostic_marker.reason
