card: herpesvirus-reactivation
decision: accept
parts:
  - decision_part: "The case definition of pmid:37526404 changed from unverified to Fukuda, with 285 patients and 201 controls (cohort 1), read from the study's own full text."
    rubric: "A study is recorded with the definition its own text states."
    evidence:
      - source: pmid:37526404
        quote: "ME/CFS cases were enrolled, if they met the 1994 CDC CFS case definition (5), and had not received antibiotics within the three-month period prior to enrollment."
      - source: pmid:37526404
        quote: "Cohort 1 samples included plasma from 285 ME/CFS cases and 201 healthy control individuals older than fourteen years of age and residing in northern California."
      - source: pmid:37526404
        quote: "The study included 106 ME/CFS cases who met both the 1994 CDC and the 2003 Canadian Consensus criteria for ME/CFS (6), and 91 healthy control individuals."
  - decision_part: "The new numbers for pmid:37526404 in level_reason[7] and its finding (plasma MassTag HHV-6 4 cases and 2 controls, HHV-7 not on the panel, case-only unbiased sequencing, saliva HHV-6, HHV-7 and EBV percentages, HHV-6 in blood cells in 1 case) match the full text."
    rubric: "Quality factors applied at every rung: case definition, sample size, controls, preregistration, conflicting results."
    evidence:
      - source: pmid:37526404
        quote: "MassTag PCR identified six samples positive for HHV-6 (4 cases and 2 controls)."
      - source: pmid:37526404
        quote: "We next used unbiased high-throughput sequencing on the Ion Torrent Proton platform to screen the ME/CFS case plasma samples of cohort 1 for additional agents than those targeted by the MassTag PCR."
      - source: pmid:37526404
        quote: "Unbiased sequencing detected pegiviruses, HHV-6, and at high prevalence anelloviruses."
      - source: pmid:37526404
        quote: "HHV-6 44#/48 [41.5%/52.7%, p=0.12&]"
      - source: pmid:37526404
        quote: "HHV-7 66/57 [62.3%/62.6%, p=1]"
      - source: pmid:37526404
        quote: "HHV-4 30/30 [28.3%/33.0%, p=0.54]"
      - source: pmid:37526404
        quote: "Other human viruses detected included HHV-6B (1 case) and anelloviruses (5 cases, 5 controls) without significant group-specific differences (Table 4)."
      - source: pmid:37526404
        quote: "We found no consistent group-specific differences other than a lower prevalence of anelloviruses in cases compared to healthy controls."
  - decision_part: "No contested mark: the now-verified multicentre study does not measure the finding level 2 rests on (active double HHV-6 and HHV-7 infection in the Riga cohort of 200), because its plasma panel had no HHV-7 and its saliva measurement is a different sample type; the card writes this out."
    rubric: "Sample size here means the number of patients in the measurement that bears on the finding, not the whole study when only part of it was measured."
    evidence:
      - source: pmid:36653846
        quote: "200 patients with clinically diagnosed ME/CFS and 150 apparently healthy individuals were enrolled in this study."
      - source: pmid:36653846
        quote: "A significant difference was revealed in the levels of TNF-α, IL-12, and IL-10 among the patient groups without infection, with latent infection/co-infection, active single, double and triple co-infection."
      - source: pmid:37526404
        quote: "Plasma samples were initially screened by a multiplex MassTag PCR (9), applying two primer panels for detection of agents that had been previously associated with ME/CFS by other investigators (Table 2)."
  - decision_part: "level_reason[7] now says one study (Atlanta) has a case definition not yet verified; its numbers stand in the abstract."
    rubric: "Cohorts without a stated case definition."
    evidence:
      - source: pmid:10913395
        quote: "We recruited 26 patients and 52 nonfatigued matched control subjects from Atlanta."
  - decision_part: "Case definitions of the two Ohio dUTPase studies: pmid:28303641 recorded as CCC (patients met CCC and Fukuda), 55 patients and 151 controls in the controlled comparison; pmid:41451845 recorded as Fukuda, 40 patients and 16 controls."
    rubric: "Accepted, flagged on the card as \"does not require PEM\"."
    evidence:
      - source: pmid:28303641
        quote: "The patients in this study met the Canadian Clinical Case Definition (CCC) [Carruthers et al., 2003] and the Fukuda criteria [Fukuda et al., 1994]"
      - source: pmid:28303641
        quote: "compared to the antibody profiles obtained in patients diagnosed with ME/CFS (n = 55) or healthy controls (n = 151)."
      - source: pmid:41451845
        quote: "pre-screened for ME/CFS using the Fukuda case definition without Reeves modification [2]."
      - source: pmid:41451845
        quote: "We examined 873 longitudinal serum samples from ME/CFS patients (n = 40) and 378 from healthy control individuals (n = 16) for differences in human herpesvirus and endogenous retrovirus-K (HERV-K) dUTPase IgG antibodies by ELISA."
  - decision_part: "The diagnostic_marker badge stays false: both dUTPase studies come from the same Ohio group, so the marker has not been tested by an independent research group, as the reworded reason says."
    rubric: "Yes only when a measurable marker linked to the hypothesis has been tested in a second patient group, separate from the first, by an independent research group (independent in the same sense as rung 3), with a stated case definition."
    evidence:
      - source: pmid:41451845
        quote: "The purpose of this study was to expand on and validate our previous findings showing heightened levels of IgG antibodies against the dUTPase protein of multiple herpesviruses [21]"
      - source: pmid:41451845
        quote: "This study was supported by the National Institutes of Health (NIH/NIAID) grant R01 AI084898 to M.E.A. and M.V.W."
      - source: pmid:28303641
        quote: "while the ME/CFS cohort had higher anti-EBV-dUTPase antibodies than in both GWI patients (P = 0.0008) and controls (P < 0.0001)"
  - decision_part: "Level 2 is unchanged and still rests on one controlled Fukuda study with no independent replication."
    rubric: "A controlled study in patients with a recognised case definition supports it."
    evidence:
      - source: pmid:36653846
        quote: "200 patients with clinically diagnosed ME/CFS and 150 apparently healthy individuals were enrolled in this study."
reasons_summary: "The corrected case definitions and numbers for the multicentre virome study and the two Ohio dUTPase studies match their full texts; level 2, no contested mark and a false diagnostic-marker badge still follow."
would_change: "A study with a case definition at least as strict as Fukuda, a control group and at least 100 patients that measured active HHV-6 and HHV-7 infection in cell-free plasma and found no difference would contest level 2. Reading the multicentre plasma HHV-6 result alone (4 of 285 cases, 2 of 201 controls) as a contradiction of the Riga double-infection finding would also change it. An independent group repeating a dUTPase antibody result would reopen the badge. Not used: the Atlanta study (pmid:10913395) has no cached full text, and its role here rests only on its abstract."
