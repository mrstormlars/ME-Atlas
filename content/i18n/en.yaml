# Fixed site text, English. The reference language: every other file in this folder must have exactly these keys,
# the same {placeholders} and the same [[glossary terms]] in each string (checked on every build).
#
# Every value is a single-quoted string (an unquoted yes or no would be read as a boolean). A string is trusted HTML.
# {name} is a value the template supplies. [[Term]] or [[Term|shown text]] marks a glossary term (the English term).
# Rung names and meanings must match the evidence ladder in docs/ME-Atlas-functional-spec.md section 3 (a test checks
# this). None of the banned words (listed in BANNED_WORDS in src/me_atlas/cards.py) may appear in any string. See docs/translation.md.

