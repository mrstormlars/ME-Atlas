# --- causal map page ---
map.h1: 'Causal map'
map.intro: 'This page is a second view of the same hypotheses. The front page shows how far the evidence for each hypothesis has come; this page shows where each one sits in a possible chain from vulnerability to symptoms, and which links between hypotheses have been suggested. A link is itself a hypothesis. It is graded on its own scale (proposed, associated, direction supported), not on the evidence ladder, and it never changes a hypothesis''s level. ME/CFS may be several conditions with different triggers that meet further downstream, so the map does not assume one chain. Nothing here is a finding that one thing causes another. The lists below hold the same content as the drawing, with sources.'
map.layer_empty: 'Nothing is placed in this layer yet.'
