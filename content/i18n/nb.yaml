# --- causal map page ---
map.h1: 'Årsakskart'
map.intro: 'Denne siden er en annen visning av de samme hypotesene. Forsiden viser hvor langt evidensen for hver hypotese har kommet; denne siden viser hvor hver enkelt hører hjemme i en mulig kjede fra sårbarhet til symptomer, og hvilke lenker mellom hypotesene som er foreslått. En lenke er selv en hypotese. Den vurderes på sin egen skala (foreslått, samvariasjon, retning støttet), ikke på evidensstigen, og den endrer aldri nivået til en hypotese. ME/CFS kan være flere tilstander med ulike utløsere som møtes lenger ned, så kartet forutsetter ikke én kjede. Ingenting her er et funn om at én ting forårsaker en annen. Listene under har det samme innholdet som tegningen, med kilder.'
map.layer_empty: 'Ingenting er plassert i dette laget ennå.'
map.unplaced_note: 'Disse hypotesene har ikke noe lag ennå. Revisoren har ikke avgjort noe lag for dem ennå.'
