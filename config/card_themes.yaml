# Which MeSH headings and title/abstract terms each card covers (docs/survey.md).
# The survey counts a record for a card when one of its MeSH headings is on the record, or one of its terms is a
# whole word in the title or abstract. A heading listed here is left out of the theme census (it has a card).
# Start from `uv run python -m me_atlas.survey themes --suggest <slug>` and keep only headings about the hypothesis.
# 1-6 MeSH headings and 0-4 terms per card. `related` (0-8 headings) names census headings that stay in the census
# but sit near the card: they are listed as `near` and the surveying agent is shown the card (docs/survey.md).
# A related heading is not in any card's `mesh` list and not on the stoplist.
# Reviewed in a pull request like config/pubmed_query.txt.

