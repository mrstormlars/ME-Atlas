# Domains for the balanced theme census (docs/survey.md).
# Each MeSH heading that reached the census belongs to one domain, so that `themes --by-domain` can pick the top few
# headings of each mechanism area instead of a list dominated by psychiatric and older headings.
# survey: true  = the census selects the top headings of this domain (mechanism areas, in this order).
# survey: false = counted but never selected: other diagnoses, symptom and function measures, treatments,
#   reactions to illness and refuted hypotheses (founder ruling 2026-11-08, docs/pm/DECISIONS.md).
# A heading is in at most one domain; it is not on the stoplist and not in a card's `mesh` list (the loader checks).
# related_conditions holds other diagnoses (psychiatric ones included); psychological_behavioural holds headings of
# psychological or behavioural causal models; symptom_measures holds symptom and function measures.

