<h1>Fiktive Studie für Müdigkeit</h1>
<p>Die fiktive Studie wird vom Institut für Übungsmedizin in Freedonien betrieben und enthält Fragebogendaten von Personen mit ME/CFS.</p>
<p>Forschende außerhalb des Instituts können den Zugang über einen Antrag beim Zugangsausschuss erhalten, der viermal im Jahr tagt.</p>
