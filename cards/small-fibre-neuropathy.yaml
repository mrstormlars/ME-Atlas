links:
  - to: symptom:orthostatic-intolerance
    support: proposed
    text: >-
      A 2023 review states that small nerve fibre damage can reduce the tightening of veins, as
      seen with abnormal pooling of blood in the legs on standing in postural orthostatic
      tachycardia syndrome (POTS). The observation it cites is in POTS; the review is not a
      study of ME/CFS patients.
    sources: ['pmid:37054777']
