layer: dysfunction
links:
  - to: autoimmunity-autoantibodies-b-cells
    support: proposed
    text: >-
      A 2014 review of possible sources of autoimmunity in ME/CFS proposes that reduced natural
      killer cell function, which it describes as commonly observed, is a source of disrupted
      homeostasis and prolonged effector T cell survival. A 2024 review proposes that
      dysfunction of the TRPM3 ion channel in natural killer cells, characterised by reduced
      calcium flux, suggests a role in ineffective pathogen clearance and a potential route to autoimmunity. Both speak of autoimmunity in general; neither names autoantibodies or B
      cells as the route.
    sources: [pmid:24068616, pmid:38970055]
  - to: herpesvirus-reactivation
    support: proposed
    text: >-
      A 1995 hypothesis paper proposes that the function of natural killer cells, with cytotoxic
      and helper T cell function, is important in preventing reactivation of Epstein-Barr virus,
      cytomegalovirus and other herpesviruses, and that reactivation could lead to the flu-like
      symptoms of CFS. The paper's main argument is that chronic intestinal candidiasis may
      depress immune function and be a causal factor in CFS; its abstract reports no test of the
      herpesvirus step in patients.
