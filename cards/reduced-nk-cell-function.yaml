# Level 3, contested at rung 3: accepted 2026-11-01 as the draft level (DECISIONS.md). Badges are
# AI proposals not covered by that ruling. Nothing here is published.
slug: reduced-nk-cell-function
name: Reduced natural killer (NK) cell function
core_claim:
  text: >-
    The hypothesis proposes that natural killer (NK) cells, immune cells that help defend
    against viral infection, are less able to kill target cells in people with ME/CFS.
  sources: [pmid:27099524, pmid:20520837, pmid:33777500]
level: 3
level_reason:
  - text: >-
      Controlled studies using the Fukuda definition, which does not require post-exertional
      malaise, found lower NK cell killing in patients than in controls. Three come from one
      Australian research group: one of 39 patients and 30 controls, and two of 95 and 65
      patients, the second drawn from the first's cohort.
    sources: ['pmid:27099524', 'pmid:21619669', 'pmid:22571715']
  - text: >-
      A fourth study, of 176 patients and 230 controls, used the CDC clinical diagnostic
      criteria without naming a version, which the rubric ranks equal to Fukuda. It comes from a
      group in Miami with no authors shared with the Australian group's 39-patient study; its
      last author co-authored the 95-patient study with the Australian group, an indirect link.
      The card is at level 3 because an independent group found the same result in a separate
      cohort.
    sources: ['pmid:20520837', 'pmid:27099524', 'pmid:21619669']
  - text: >-
      Against these findings, a study meeting the Canadian Consensus Criteria (48 patients and 52
      controls in the whole study; NK killing measured in 39 patients and 44 controls) found no
      difference (see the contested note), as did a study of 21 patients and 21 controls using a
      CDC definition whose version is not named, a multi-site study of 174 patients and 86
      controls whose patients were diagnosed by expert clinicians without a named case
      definition, and a case-control study of unstated size whose abstract names no case
      definition.
    sources: [pmid:28694809, pmid:7983659, pmid:37013608, pmid:8985207]
  - text: >-
      Two small studies using a CDC definition whose version is not named found lower NK activity
      in 8 patients from one family than in 8 controls, and no patient above 100 lytic units among
      20 patients, without a direct comparison with that study's 50 controls.
    sources: [pmid:9683556, pmid:8148445]
contested:
  rungs: [3]
  reason:
    - text: >-
        A study meeting the Canadian Consensus Criteria (stricter than Fukuda), with 48 patients and
        52 matched healthy controls in the whole study, measured NK killing in 39 patients and 44
        controls in two cohorts analysed separately (24 vs 28 and 15 vs 16) and found no difference.
      sources: [pmid:28694809]
    - text: >-
        With 39 patients in that measurement, the Canadian Consensus Criteria study is of
        comparable quality to the Australian group's Fukuda studies of 39 and 65 patients. It is
        not of comparable quality to the Miami study of 176 patients.
      sources: ['pmid:28694809', 'pmid:27099524', 'pmid:22571715', 'pmid:20520837']
    - text: >-
        Rung 3 rests on the Australian group's 39-patient study and the Miami study as findings
        from independent groups; it is contested because a study of comparable quality contradicts
        the first. Rung 2 still rests on the Miami study, which no comparable study contradicts.
      sources: [pmid:27099524, pmid:20520837, pmid:28694809]
    - text: >-
        A study of 21 patients and 21 matched controls using a CDC definition whose version is not
        named, ranked equal to Fukuda, also found no difference in NK cell activity. With 21
        patients it is of comparable quality to the Australian group's 39-patient study; its
        abstract does not say how many patients had NK activity measured.
      sources: [pmid:7983659, pmid:27099524]
    - text: >-
        A multi-site study of 174 patients and 86 controls also found no difference, but its
        patients were diagnosed by expert clinicians without a named case definition.
      sources: [pmid:37013608]
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        No study on this card reports NK cell killing validated as a diagnostic marker in a
        second, independent patient group. A study of 176 patients and 230 controls using the
        CDC clinical diagnostic criteria (version not named) found NK killing a good predictor
        of CFS status within its own cohort. A Canadian Consensus Criteria study concluded the
        measures were not useful diagnostic markers, a multi-site study concluded the assay was
        not ready for clinical use, and a family study found low antibody-dependent NK killing
        also in relatives without the illness.
      sources: ['pmid:20520837', 'pmid:28694809', 'pmid:37013608', 'pmid:33777500']
  explains_pem:
    value: false
    # Checked: every abstract on this card, and the open full texts of 27099524 (PMC4821384), 20520837 (PMC2876037),
    # 21619669 (PMC3120691), 22571715 (PMC3464733), 28694809 (PMC5483846) and 37013608 (PMC10069115), for exercise,
    # exertion, malaise, PEM and exercise-test terms. The only hits are background text, reference titles, and
    # PMC3464733 Table 1 ("Weakness >24 hours after exercise", 93.8% of patients, 9.5% of controls), from the
    # participants' questionnaire ("Clinical data were collected through self-administered questionnaires").
    reason:
      - text: >-
          Four of the supporting studies (three using Fukuda, one the CDC clinical diagnostic
          criteria with no version named) report no direct measure of post-exertional malaise,
          such as an exercise test repeated on two consecutive days, in their abstracts or open
          full texts. The 65-patient study lists, among its participants' symptoms, the share
          reporting weakness more than 24 hours after exercise; this is a self-reported symptom,
          not a test.
        sources: ['pmid:27099524', 'pmid:20520837', 'pmid:21619669', 'pmid:22571715']
      - text: >-
          The two small supporting studies using a CDC definition whose version is not named report
          no direct measure of post-exertional malaise in their abstracts; no open full text was
          available.
        sources: [pmid:8148445, pmid:9683556]
      - text: >-
          The two studies with a recognised case definition that found no difference, of 48 patients
          (NK killing measured in 39) and 21 patients, report no direct measure of post-exertional malaise in their abstracts, nor
          does the open full text of the first.
        sources: [pmid:28694809, pmid:7983659]
      - text: >-
          The studies shown for context report no direct measure of post-exertional malaise in
          their abstracts; the multi-site study's abstract names it only as a feature of the
          illness. The open full text of the single-patient case report names post-exertional
          malaise only as a symptom and reports exertional symptoms from the patient's own
          account, not from an exertion test.
        sources: ['pmid:37013608', 'pmid:8985207', 'pmid:33777500', 'pmid:16731230', 'pmid:42927120']
subgroups:
  - text: >-
      Two small studies suggest lower NK cell activity may go with more severe illness: one of
      20 patients found the lowest activity in the most severely ill group, and one of 41 patients
      found more symptoms and poorer cognitive test results in patients with low activity.
      Neither abstract names a recognised case definition version.
    sources: [pmid:8148445, pmid:16731230]
