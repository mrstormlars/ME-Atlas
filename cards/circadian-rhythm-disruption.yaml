#
# SCOPE: the circadian timing system: the 24-hour rhythms of rest and activity, core and skin temperature, melatonin
# timing, light exposure and clock genes, compared between patients and controls. Bounded against:
#   - hpa-axis-cortisol: the day-night rhythm of cortisol and ACTH (salivary cortisol profiles, cortisol awakening
#     response, 24-hour ACTH pulsatility) stays on that card. Where a study here also measured cortisol (21532961,
#     9513740, 10606381), only its activity, temperature or melatonin result is used on this card.
#   - sleep: sleep quality, sleep duration and unrefreshing sleep are a symptom node (symptom:sleep-disturbance in
#     content/symptoms.yaml), not this hypothesis. Sleep-wake *timing* (mid-sleep time, phase) is used here.
#   - autonomic-imbalance: 24-hour blood pressure and heart-rate rhythms (9822046) are
#     left to that card; see "Not on the card".
# MEASURE AND DIRECTION: "lower" means a weaker or less regular daily rhythm in patients than in controls (lower
#   amplitude, more fragmentation, less light), "no_difference" no difference in rhythm. Studies whose measure points
#   another way say so in a comment.
#
# LEVEL, RUNG BY RUNG (proposal: 2)
#   Rung 1: met (the controlled studies below).
#   Rung 2: met by 42399727 (Cambras 2026, Barcelona; ICC, 100 v 56, actigraphy in up to 94 v 53, controlled;
#     group comparisons unadjusted, patients older and with higher BMI, which the card states). Full-text Table 1: lower mean light
#     exposure and light amplitude, lower activity mean and amplitude, higher intradaily variability (fragmentation) of
#     activity (p = 0.002) and of wrist temperature (p = 0.008) in patients; interdaily stability of activity did not
#     differ (32.8 v 30.5, p = 0.056, higher in patients); temperature amplitude and stability did not differ.
#   Round-1 correction: 29874259 (Cambras 2018, CCC, 10 v 10) was first proposed as the rung-2 study from its abstract
#     ("the relative amplitude and the stability of the activity rhythm were lower"). Its full-text Table 3 shows the
#     cosinor relative amplitude (R_cos) higher in patients (1.0 v 0.8 in winter; group p = 0.002), no difference in
#     rhythm stability (R, p = 0.52), interdaily variability, acrophase or cosinor amplitude; lower mean activity and
#     M10, a lower share of variance explained by the 24-hour rhythm (PV, group p = 0.045), a weaker 12-hour
#     (post-lunch) component, and lower night-time skin temperature (M5) in winter only. It is kept as `supports` with
#     direction `mixed`, and the card follows the full text.
#   Rung 3: not met. TODO, first priority: verify 15451649 (Tryon 2004). If it has a recognised definition and its
#     "less regular activity-rest cycles" is the same measure as the higher intradaily variability in 42399727, Tryon
#     is the earlier original and 42399727 an independent later repeat, which could meet rung 3. No open full text: a
#     person must read it (docs/citation-check.md, C5).
#   Rung 3 as it stands: 29874259 and 36902264 point partly the same way but come from the same group and clinic (Cambras T,
#     Castro-Marrero J, Alegre J; ME/CFS Unit, Vall d'Hebron, Barcelona), and 42399727 is a secondary analysis of data
#     from the group's earlier studies (its introduction cites 39037125 and 36902264 as those studies), so they are not
#     independent (spec section 3, checklist item 5). The independent studies pointing the same way (15451649 Tryon
#     2004, US, 8 v 10; 28470767 Pedersen 2017, Norway, 120 v 39 adolescents) have no case definition in the abstract
#     and no open full text: `unverified`, cannot count (V9). TODO: verify. 28470767 measured sleep-wake timing and
#     variability rather than light or activity fragmentation; if verified with a recognised definition, whether that
#     counts as repeating the finding is a founder question.
#   Rung 4: not met. The only controlled intervention on the proposed factor, 12423324 (Williams 2002, melatonin and
#     bright light against placebo, 30 patients, case definition not verified), found no change in symptoms and almost
#     no change in the temperature or melatonin rhythm. Recorded as context.
# CONTESTED (proposal: null). The contested rule needs a contradicting study with the same or a stricter case
#   definition than ICC (CCC, ICC or IOM 2015), a control group and at least 47 patients (half of the up to 94 with
#   actigraphy). None on the
#   card meets it: 9513740 (Hamilos 1998, CDC, 7 v 7) and 11318826 (Hamilos 2001, CDC, 10 v 10) found a normal core
#   temperature rhythm but rank below ICC and are far smaller; 21532961 (Rahman 2011, Fukuda, 15 v 15, null on
#   activity and sleep pattern, controls matched on activity level) ranks below ICC and is below half the size.
# ACTIVITY LEVEL: much of the "weaker rhythm" signal in the Barcelona studies is lower activity (mean, M10, absolute
#   cosinor amplitude). 29874259's discussion calls a decrease in activity "a cardinal feature" of proposed CFS/ME
#   definitions, and 42399727's discussion says reverse causation cannot be excluded for light. This is written out on
#   the card (level_reason) as a reading, not used as a grading criterion.
# ABSTRACT AGAINST FULL TEXT: 36902264's abstract says "a higher amplitude of the activity rhythm"; its Table 2
#   (A_Amplitude 1744 ± 80 v 2116 ± 72, adjusted p < 0.009) and results text say lower. 29874259: see rung 2 above.
# CASE DEFINITION WORDING: 42399727 writes "2011 Canadian Consensus Criteria (also commonly referred to as ICC)" and
#   cites Carruthers 2011, "Myalgic encephalomyelitis: International Consensus Criteria" (reference 29); recorded as
#   ICC. 29874259 recorded as CCC because every patient met both CCC and Fukuda (survey entry wrote Fukuda).
# OXFORD: no study on the card has a verified Oxford cohort. The unverified UK studies (8842569, 12423324, Liverpool)
#   could have used Oxford criteria. TODO: verify.
# LONG COVID: no label proposed. 39037125 includes 23 people with post-COVID ME/CFS, but its case definition is
#   unverified (no open full text), so it is recorded with `cohort: me_cfs` (precedent: infection-trigger, 42516718).
# BADGES: diagnostic_marker no; explains_pem no (12213500 recorded the activity rhythm after a maximal
#   treadmill test but tracked no symptoms and has an unverified case definition).
# LAYER AND LINKS (founder ruling 2026-11-08): layer `dysfunction` (a measurable change in daily rhythms, as for the
#   neighbouring hpa-axis-cortisol card). Other readings, written out in level_reason: `mechanism` (8842569: could be
#   a factor "initiating and perpetuating" symptoms) or a consequence of the illness (8842569: could be due to sleep
#   deprivation, social disruption or reduced activity; 42399727: reverse causation). Links:
#   symptom:sleep-disturbance (associated: 42399727 measured light by actigraphy and the PSQI in the same ICC patients;
#   the relation holds for the light-pattern grouping, p = 0.042, not for either light component in the regression,
#   Table 2 overall PSQI row Light1 p = 0.92, Light2 p = 0.70; analyses need actigraphy, so up to 94 patients; 36902264 found no significant correlation between night-time wrist
#   temperature and PSQI in patients; both written into the link text) and symptom:cognitive-impairment (proposed:
#   8842569 states it; 11318826 argues against it for core temperature) and question:what-keeps-it-going (proposed,
#   8842569, expressing the `mechanism` reading, as on hpa-axis-cortisol). 36902264 is `supports` on the card but is
#   also the null for the sleep link; founder ruling: a study's role follows its bearing on the level and the link text
#   carries the null. Not proposed: endothelial-dysfunction.
#   36902264 (ICC) found endothelin-1 associated with the stability of the skin temperature rhythm in the same patients,
#   but its title reads the direction as vascular tone driving skin temperature, which would put the link on the
#   endothelial-dysfunction card (links live on the upstream card); founder ruling 2026-11-08: no link now.
#
# AUTHOR AND COHORT OVERLAPS
#   - Barcelona group (Cambras T, Castro-Marrero J, Alegre J; Zerón-Rugerio MF; Vall d'Hebron ME/CFS Unit):
#     29874259, 36902264, 39037125, 42399727. 42399727 reuses data from 39037125, 36902264 and Domingo et al. (its
#     references 26 to 28 in the sentence on the secondary analysis), so patients likely overlap. TODO: verify.
#   - Hamilos DL and Jones JF (first-author affiliation Denver in 1998, St Louis in 2001): 9513740 and 11318826;
#     whether the 7 patients of 1998 are among the 10 of 2001 is not stated in the abstracts. TODO: verify.
#   - Williams G (Liverpool): 8842569 and 12423324.
#   - Ohashi K (first-author affiliation Tokyo) and Natelson BH: 12213500. No authors shared between the Barcelona
#     studies and 21532961, 15451649 or 28470767 (checked on the cached author lists).
#
# Not on the card (read, left out; reasons also in report.md):
#   - Cortisol and ACTH rhythm studies: belong to hpa-axis-cortisol (18378875, 19124690, 22687333, 26152819,
#     15157948, 15911907, 9813459, 9438265).
#   - 9822046 (van de Luit 1998, 24-hour blood pressure and heart-rate rhythms, 1987 CDC criteria): autonomic card.
#   - 11061525 (Knook 2000, higher nocturnal salivary melatonin, same timing, 13 adolescents v 15): melatonin level,
#     not timing; unverified; left out to avoid padding (no difference in timing, like 10606381).
#   - 16420393 (van Heukelom 2006): uncontrolled melatonin treatment in 29 patients selected for late melatonin
