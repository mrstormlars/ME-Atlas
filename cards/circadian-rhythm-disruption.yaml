#   - 18031961 (Ohinata 2008, 12 children, actigraphy): unverified, sleep-pattern types; covered by 28470767.
#   - 15026831, 24188379: fractal and rest-bout statistics of activity, not the 24-hour rhythm.
#   - 37393850 (Wei 2023): patient serum on mouse fibroblasts; not a patient cohort (survey ruling).
#   - 42548707 (Shao 2026): circadian rhythm sleep-wake disorder diagnoses in 610 CFS patients, no control group,
#     case definition not in the abstract; 1341974 (Camus 1992): fever of unknown origin, not a CFS cohort;
