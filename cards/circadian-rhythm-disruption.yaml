layer: dysfunction
links:
  - to: symptom:sleep-disturbance
    support: associated
    text: >-
      A study of people with ME/CFS diagnosed by the International Consensus Criteria (up to 94 with
      light recordings) measured light exposure by wrist actigraphy and sleep complaints by
      questionnaire in the same patients.
      Patients grouped as having a stable daytime light pattern had better sleep scores than those
      with adverse or low daytime light patterns, in an exploratory comparison without correction
      for multiple tests; in the regression, neither light component was related to the overall
      sleep score. Its authors write that causality cannot be inferred. A study of 67 patients from the
      same group found no significant relation between night-time wrist temperature and the sleep
      score in patients.
    sources: [pmid:42399727, pmid:36902264]
  - to: symptom:cognitive-impairment
    support: proposed
    text: >-
      A 1996 study proposes that disturbed daily rhythms could be a factor in starting and keeping
      up symptoms such as impaired concentration, by analogy with jet lag and shift work; it did not
      test this. A 2001 study that measured core body temperature concluded that the symptoms are
      unlikely to come from a disturbance of that rhythm.
    sources: [pmid:8842569, pmid:11318826]
  - to: question:what-keeps-it-going
    support: proposed
    text: >-
      A 1996 study proposes that disturbed daily rhythms could help keep the main symptoms going, by
      analogy with jet lag and shift work; it did not test this, and its own data could also follow
      from the illness.
    sources: [pmid:8842569]
