slug: circadian-rhythm-disruption
name: Disrupted daily (circadian) rhythms
core_claim:
  text: >-
    The hypothesis proposes that in people with ME/CFS the body's 24-hour timing system is
    disturbed: the daily rhythms of rest and activity, body temperature, melatonin and light
    exposure are weaker, less regular or out of step with each other, and this contributes to
    the symptoms. It is about the timing of these rhythms, not about sleep quality itself, and the
    daily rhythm of cortisol belongs to the card on stress-hormone (HPA axis) function.
  sources: [pmid:42399727, pmid:8842569, pmid:21532961]
level: 2
level_reason:
  - text: >-
      A study from Barcelona of 100 people with ME/CFS diagnosed by the International Consensus
      Criteria and 56 healthy controls recorded light, movement and wrist skin temperature for one
      week; recordings were missing for 6 patients and 3 controls, so the rhythm comparisons rest on
      up to 94 patients and 53 controls (calculated from the reported counts). Patients had less light exposure and a lower amplitude of the light-dark cycle, lower
      and more fragmented activity, and a more fragmented wrist temperature rhythm. The day-to-day
      stability of the activity rhythm did not differ, and the amplitude and stability of the
      temperature rhythm did not differ. These group comparisons were not adjusted for age or body
      mass index, and patients were older (49.5 against 42.9 years) and had a higher body mass index
      (27.0 against 24.4). It was a secondary analysis of data from the group's earlier studies. The card is at level 2 because of this study. No independent group has
      repeated it with a verified case definition, so it is unreplicated.
    sources: [pmid:42399727]
  - text: >-
      Two earlier studies from the same group and clinic point partly the same way; they are not
      independent, and their patients may overlap. In 10 women who met both the Fukuda and the
      Canadian Consensus Criteria and 10 matched controls (8 in summer), patients had lower daily
      activity, a weaker post-lunch dip in activity and lower night-time skin temperature in winter
      only. The abstract says the relative amplitude and stability of the activity rhythm were lower,
      but the full-text table shows the relative amplitude higher in patients and no difference in
      stability or in the timing of the rhythm. In 67 women with ME/CFS diagnosed by the
      International Consensus Criteria and 48 controls, mean activity and the amplitude of the
      activity rhythm were lower in patients (the abstract says higher; the full-text table and
      results say lower), while fragmentation and stability of the activity rhythm did not differ
      and the wrist temperature rhythm did not differ after adjusting for age and body mass index.
    sources: [pmid:29874259, pmid:36902264]
  - text: >-
      Lower mean activity in patients is the one difference all three of these studies share. The
      2018 study notes that a
      decrease in activity is a cardinal feature of proposed definitions of the illness, and the
      2026 study writes that reverse causation cannot be excluded: people with more severe symptoms
      may get less daylight and more night-time light. A 1996 study also notes that the loss of the
      usual link between temperature and melatonin timing it found could follow from sleep
      deprivation, social disruption or reduced physical activity.
      The card therefore cannot say whether disturbed rhythms are a cause or a consequence of the
      illness.
    sources: [pmid:29874259, pmid:36902264, pmid:42399727, pmid:8842569]
  - text: >-
      Studies from other groups that point the same way have case definitions that are not yet
      verified, so they cannot count towards the level. In the US, 8 patients, recorded for 2 to 7
      days, had lower daytime activity and less regular activity-rest cycles than 10 controls,
      recorded for 5 to 7 days. In Norway, 120 adolescents with chronic fatigue syndrome stayed
      longer in bed, had a later mid-sleep time and a more varied sleep-wake rhythm on weekdays than
      39 healthy adolescents.
    sources: [pmid:15451649, pmid:28470767]
  - text: >-
      Other studies found no difference. Two small US studies of patients diagnosed by CDC criteria
      (version not stated, so the definition does not require post-exertional malaise) recorded core
      body temperature continuously: 7 patients and 7 controls had similar 24-hour temperature
      profiles, and in 10 patients and 10 controls the rhythm was nearly indistinguishable, apart
      from the phase of the third harmonic and a tendency to more variability. An Australian study
      of 15 patients and 15 controls, matched for age, sex, body mass index and activity level (so
      similar amounts of activity were partly built into the design), with patients diagnosed by the
      Fukuda definition (which also does not require post-exertional malaise), found no between-group
      difference in the pattern or amount of sleep or activity over five days and no evidence of
      circadian disturbance. Its patients were recruited at the start of a graded-activity
      cognitive-behavioural therapy programme; the authors write that they may have been motivated to
      change their activity-rest patterns, that the sample may not be representative of patients in
      general, and that the results need to be repeated in a larger sample. These studies are smaller
      than the level 2 study, and the CDC and Fukuda definitions rank below the International
      Consensus Criteria, so the card does not treat them as contesting level 2.
    sources: [pmid:9513740, pmid:11318826, pmid:21532961, pmid:42399727]
  - text: >-
      Studies of the internal clock itself are few, small and older, with case definitions not yet
      verified. In 20 patients and 17 controls in the UK, the amplitude and timing of the core
      temperature rhythm and the timing of melatonin onset did not differ, but the usual link
      between temperature timing and melatonin timing was absent in patients. In 8 women with
      chronic fatigue syndrome and matched controls, night-time blood melatonin and the timing of
      melatonin secretion did not differ.
    sources: [pmid:8842569, pmid:10606381]
  - text: >-
      The Barcelona group also linked rhythm measures to other findings in the same patients. In
      31 people with ME/CFS, 23 with ME/CFS after COVID-19 and 31 controls, patients had lower
      activity and worse sleep quality, and their blood lipid profile was associated with
      disturbances in the temperature rhythm; this study's case definition is not yet verified. In
      the level 2 study (up to 94 patients with light recordings), those with a stable daytime light pattern had less
      fatigue and better sleep-questionnaire scores than those with adverse or low daytime light
      patterns in an exploratory comparison; the authors of that study write that causality cannot
      be inferred.
    sources: [pmid:39037125, pmid:42399727]
  - text: >-
      In a UK trial of 30 patients with unexplained fatigue for more than six months (the case
      definition is not yet verified), 12 weeks of evening melatonin and 12 weeks of morning bright
      light, after a placebo period, changed none of the main symptoms, and neither changed the
      temperature rhythm or the timing of melatonin onset, apart from a slight advance of the
      temperature rhythm with light.
    sources: [pmid:12423324]
contested: null
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        No study on this card tests a rhythm measure as a diagnostic marker in a second, independent
        patient group.
      sources: [pmid:42399727, pmid:29874259, pmid:36902264]
  explains_pem:
    value: false
    reason:
      text: >-
        No study on this card measures post-exertional malaise directly and links it to the daily
        rhythms. One study recorded the activity rhythm for six days before and after a maximal
        treadmill test in 10 patients and 6 controls, without tracking symptoms, and its case
        definition is not yet verified.
      sources: [pmid:12213500]
