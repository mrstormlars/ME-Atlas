last_checked:
  date: 2026-11-13
  by: ai_audit
# Causal map (founder ruling 2026-11-06): layer `trigger` per the brief; the card's claim is about what starts the
# illness. The mechanism readings belong to herpesvirus-reactivation and persistent-enterovirus-infection.
# No link to herpesvirus-reactivation: card-reviewer round 2 found that pmid:41901562 does not state that the
# infection reactivated EBV (antibodies measured once, about 21 months after infection, in 15 people, no baseline or
# control group). A source stating that an acute infection reactivates latent herpesviruses would be needed.
# Link to autoimmunity-autoantibodies-b-cells (founder ruling 2026-11-08): step 1 (proposed), resting on pmid:33889154 only;
# its case definition is unverified.
# Link to question:who-is-vulnerable: step 1 (proposed) only. Both sources compare people who did and did not
# develop ME/CFS after the same infection, but their case definitions are unverified, which allows step 1 and never
# step 2 (DECISIONS 2026-11-06).
# Links to circadian-rhythm-disruption and autonomic-imbalance (founder ruling 2026-11-08): both step 1 (proposed). The first rests on a review
# (pmid:39896874, mainly about long COVID); the second on pmid:41598987, whose case definition is unverified and whose
# group is mixed. Both records are on the card as context studies, so the 'Reviews' note above does not cover pmid:39896874.
layer: trigger
links:
  - to: question:who-is-vulnerable
    support: proposed
    text: >-
      Two prospective studies compared people who did and did not develop ME/CFS after the same
      infection. One found that the severity of the acute illness predicted it more than demographic,
      psychological or microbiological factors; the other found more physical symptoms and immune
      differences, but not more psychological symptoms, before the infection in those who later had
      severe ME/CFS. Each finding comes from a single study, and neither study's case definition is
      verified yet.
    sources: [pmid:16950834, pmid:33367564]
  - to: autoimmunity-autoantibodies-b-cells
    support: proposed
    text: >-
      One study in people with ME/CFS reported that, in patients whose illness began with an
      infection, low soluble CD26 was associated with raised autoantibodies against alpha-1
      adrenergic and M3 muscarinic acetylcholine receptors; the authors say these associations
      point to an infection-triggered autoimmune-mediated vascular and immunological
      dysregulation. It was a correlation analysis, not a follow-up from infection to
      autoantibodies; its case definition is not verified, and the finding comes from a single,
      unreplicated study.
    sources: [pmid:33889154]
  - to: circadian-rhythm-disruption
    support: proposed
    text: >-
      A 2025 review proposes that SARS-CoV-2 infection may disrupt circadian rhythms, through changes in clock
      genes, mitochondrial dysfunction and cytokine-driven neuroinflammation, and that this may underlie fatigue
      and sleep disturbance after infection. The review is mainly about long COVID, is not a patient study
      measuring both ends, and itself calls for further research.
    sources: [pmid:39896874]
  - to: autonomic-imbalance
    support: proposed
    text: >-
      A 2025 study of 100 people with serological evidence of acute Coxiella burnetii infection, who presented
      with polymorphic symptoms, dysautonomia or ME/CFS, and 56 matched controls found more autonomic dysfunction
      in the infected group, mainly in parasympathetic regulation, on cardiovascular reflex tests, baroreflex
      effectiveness and short-term heart rate variability indices; long-term heart rate variability measures did
      not differ significantly between the groups. The authors suggest the infection may trigger persistent
      autonomic dysfunction that could contribute to ME/CFS. It was cross-sectional, in a mixed group selected for
      symptoms, with no ME/CFS case definition named in the abstract; the authors say longitudinal studies are
      needed.
    sources: [pmid:41598987]
