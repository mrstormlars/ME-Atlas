#   - Mitochondrial energy production (other card): 20937116, 29065167, 1446478 and other muscle spectroscopy studies.
#   - Unverified case definition, same direction, not needed for the level: 10905542 and 17174731 (Richards, MDA and
#     methaemoglobin higher, 33 v 27 and 31 v 41), 12870659 (protein carbonyls), 12531455 (Vecchiet, TBARS higher,
#     vitamin E lower, 21 v 20), 20035260 (8-OHdG; higher only in patients with ME/CFS and depression).
#   - 11388705 (Manuel y Keenoy 2001): compares Holmes 1988 CFS with fatigued patients who do not meet it, not with
#     healthy controls.
#   - 30563204 (Germain 2018, Fukuda, metabolomics 32 v 19): redox imbalance is the authors' reading of 14 metabolites,
#     not a direct oxidative-stress measure.
#   - Antibody responses to oxidatively modified epitopes (17159817, 18580855, 22614823, 25617880): immune measures.
#   - Trials left out: 26212172 (same trial as 25386668), 20447621 (Alegre 2010, NADH, 77 completers, no difference
#     in most outcomes; case definition not in the abstract), 15377055 (NADH against conventional therapy, no
#     placebo), 35229657 (CoQ10 plus selenium, open-label, no control group), 21246855 (Tuina massage),
#     21044831 (healthy women).
#   - Animal and cell studies (mouse and rat fatigue models).
slug: oxidative-nitrosative-stress
name: Oxidative and nitrosative stress (too many reactive oxygen or nitrogen species for the body's antioxidant defences)
core_claim:
  text: >-
    The hypothesis proposes that in people with ME/CFS reactive oxygen or nitrogen species outweigh the
    body's antioxidant defences, damaging fats, proteins and other molecules and contributing to the
    illness.
  sources: [pmid:16085177, pmid:21455120]
level: 2
level_reason:
  - text: >-
      A study from Dundee, Scotland, with 47 patients meeting the CDC criteria (version not
      named) and 34 healthy volunteers enrolled (the number measured is not stated) found higher
      blood levels of isoprostanes, a marker of oxidative damage to fats, in patients, both in
      those with and in those without cardiovascular risk factors. A study of 56 patients
      meeting the CDC criteria (version not named) and 37 healthy controls, outpatients of the
      Maes Clinics in Antwerp, Belgium, found higher plasma peroxides in patients. Neither
      version of the CDC criteria requires post-exertional malaise. The card is at level 2
      because of these two controlled studies, which used different measures.
    sources: ['pmid:16085177', 'pmid:21455120']
  - text: >-
      Other controlled studies found higher oxidative-stress markers, each on a different
      measure: malondialdehyde and protein carbonyls in 24 women meeting the 1994 CDC definition
      against 19 healthy women in Novi Sad, Serbia; reactive oxygen metabolites in a study from
      Osaka of patients diagnosed by the Fukuda 1994 criteria, whose abstract does not give the
      numbers; and reactive oxygen species inside lymphocytes in 15 patients against 16 controls
      at Stanford, where the difference was found in women but not in men. The Stanford patients
      were diagnosed using the National Academy of Medicine, Fukuda and Canadian Consensus
      criteria; which definition each patient met is not stated. Because the measures differ,
      none of these is a repeat of another, and each is unreplicated.
    sources: ['pmid:23185200', 'pmid:27224647', 'pmid:40627396']
  - text: >-
      The card does not reach level 3: no independent group has found the same result on the same measure
      in a separate cohort with a confirmed recognised case definition. The only other isoprostane study, of
      6 patients and 6 controls in Glasgow, also found higher levels at rest, but its case definition is not
      yet verified. It shares three authors with the Dundee study, so it would not count as an independent
      repeat even with a verified definition.
    sources: [pmid:19422646, pmid:16085177]
  - text: >-
      Malondialdehyde results conflict. An earlier study from the same Novi Sad clinic, of 40 women meeting
      the Fukuda definition and 40 healthy women, found no overall difference between the groups; the
      authors report a difference only after dividing patients by malondialdehyde level, and title the
      paper as showing elevated lipid peroxidation. It is larger than the 24-patient study that found
      higher levels and uses the same definition, so under the rubric the malondialdehyde finding cannot
      carry a level. The two studies share authors, and the overlap between their patients is not stated.
      They may also have used different methods: the 24-patient study used an ELISA test for
      malondialdehyde bound to proteins (OxiSelect MDA Adduct ELISA), and the abstract of the earlier
      study does not give its method. The card's level does not rest on this finding.
    sources: [pmid:21119582, pmid:23185200]
  - text: >-
      Measures of antioxidant defences are mixed. In studies with a recognised definition, antioxidant
      potential in serum was lower in the Osaka study, while glutathione in lymphocytes was higher in both
      sexes in the Stanford study (in men, in two of the three cell types tested). In studies whose case
      definition is not yet verified, plasma coenzyme Q10 was lower in 58 patients than in 22 controls;
      whole-blood glutathione peroxidase activity did not differ between 40 patients and 24 controls;
      glutathione in the brain was lower in 15 patients than in 13 healthy volunteers in one study and did
      not differ in another of 26 people in all.
    sources: [pmid:27224647, pmid:40627396, pmid:20010505, pmid:21552194, pmid:22281935, pmid:19906518]
  - text: >-
      The card does not reach level 4: no controlled trial in patients with a confirmed
      recognised case definition has lowered an oxidative-stress measure and improved the
      illness. A placebo-controlled trial of coenzyme Q10 plus NADH in 73 patients reported less
      fatigue than with placebo and lower lipid peroxides in blood cells of the treated group
      (the abstract does not say whether against placebo or against baseline), but its case
      definition is not yet verified. A larger placebo-controlled trial of the same combination
      from the same unit, in 207 women meeting the Fukuda definition, did not measure oxidative
      stress and reported that fatigue scores changed in parallel in the two groups. A crossover
      trial of NADH alone in 26 patients meeting the CDC criteria reports no oxidative-stress
      measure in its abstract.
    sources: ['pmid:25386668', 'pmid:34444817', 'pmid:10071523']
  - text: >-
      A placebo-controlled trial of ubiquinol, the reduced form of coenzyme Q10, in 43 patients (31
      completed) reported improvement in several symptoms; its case definition is not yet verified.
    sources: [pmid:27125909]
contested: null
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        No study on this card tests a cut-off from one patient group in a second, independent group. In the
        Antwerp study plasma peroxides did not separate patients from controls well (area under the curve
        62.6%, not significant), and the Stanford group's further test was a small case study of three
        people from a family cohort, studied by the same group.
      sources: [pmid:21455120, pmid:40627396]
  explains_pem:
    value: false
    reason:
      text: >-
        No study on this card tracks symptoms after an exertion challenge and links them to oxidative
        stress in the same patients. The Dundee study correlated isoprostane levels with a post-exertional
        malaise symptom score, in the low-risk subgroup only; a symptom score is not a direct measure of
        post-exertional malaise.
      sources: [pmid:16085177]
subgroups:
  - text: >-
      Oxidative stress may differ between women and men: in the Stanford study reactive oxygen species in
      lymphocytes were higher in women with ME/CFS than in healthy women, but not in men, while men
      with ME/CFS showed more oxidative damage to fats inside the cells. Not yet repeated.
    sources: [pmid:40627396]
working_on_it: []
early_signals:
  - text: >-
      A study of n=15 patients and 16 healthy controls found higher levels of reactive oxygen species
      inside lymphocytes in patients, with the difference found in women but not in men. Not yet
      repeated.
    sources: [pmid:40627396]
