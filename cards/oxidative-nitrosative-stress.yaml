# FOUNDER RULING (2026-11-02): level 2, not contested, both badges no (rung 2: pmid:16085177 and pmid:21455120). The proposals below are accepted as ruled.
# DRAFT — AI-drafted (ai_pair) on 2026-11-02. Nothing here is published.
# PROPOSALS FOR THE FOUNDER (not rulings): level 2, contested null, diagnostic marker no, explains PEM no.
# Scope (per brief): blood, cell and brain measures of oxidative or nitrosative stress and antioxidant defences, and
# the controlled antioxidant trials aimed at them. Mitochondrial energy production and exercise tests are left out
# (another card covers them).
# Source rule: every title, year, n, quote and finding below comes from the cached PubMed record
# data/cache/pubmed/<pmid>.xml (abstract), except where `case_definition_source: fulltext` or a comment names a full
# text, which comes from the cached Europe PMC open-access text data/cache/europepmc/PMC<id>.xml (21455120:
# PMC3539515; 23185200: PMC3506242; 40627396: PMC12280928; 34444817: PMC8399248). `uv run python -m
# me_atlas.europepmc casedef` found no open full text for any other study on the card (checked 2026-11-02;
# 25386668 has PMC4346380 and 22281935 has PMC3896084, but neither is open access).
# `direction` is on the measure named in each finding: "higher" for a marker of oxidative damage or of reactive
# oxygen species, "lower" for an antioxidant; `not_applicable` for treatment against placebo.
#
# LEVEL, RUNG BY RUNG (proposal)
#   1: reached (several studies).
#   2: reached on two controlled studies with different measures: 16085177 (Kennedy 2005, Dundee, CDC_unspecified,
#      47 v 34 enrolled, number measured not stated): higher plasma isoprostanes; and 21455120 (Maes 2011, Antwerp,
#      Fukuda via reference 29, 56 v 37 measured): higher plasma peroxides. Other controlled studies with an accepted
#      definition point the same way on different measures: 23185200 (Tomic, Fukuda, MDA and protein
#      carbonyls, 24 v 19), 27224647 (Fukuda S, Fukuda, d-ROMs, n not in abstract), 40627396 (Shankar, Fukuda
#      recorded, lymphocyte ROS, 15 v 16).
#   3: not reached. No independent group has repeated the same measure in a separate cohort with an accepted
#      definition. Isoprostanes: the only other study (19422646, Glasgow, 6 v 6) has an unverified case definition
#      and shares three authors (Kennedy G, Hill A, Belch JJ) with 16085177, so it is not independent either.
#      MDA: 23185200 (higher) is later and smaller than 21119582 (same Novi Sad clinic, Fukuda, 40 v 40, no overall
#      difference); same group, so not a repeat in any case, and by the "larger study settles it" ruling the MDA
#      finding cannot carry a rung. Protein carbonyls: the earlier study (12870659, Smirnova/Pall) is not on the card
#      (case definition not in abstract, no open full text), so 23185200 is a single study. d-ROMs (serum
#      hydroperoxides) and the plasma peroxide assay are different tests; I did not treat them as the same measure.
#      FOUNDER QUESTION: confirm.
#   4: not reached (and level 3 is not reached first). No controlled trial with a verified accepted definition both
#      lowered an oxidative-stress measure and improved the illness. 25386668 (Castro-Marrero 2015, 73 patients) did
#      both, but its case definition is unverified, so it cannot count (V9). The larger trial of the same combination
#      from the same unit, 34444817 (2021, Fukuda, 207 randomised, 144 analysed), did not measure oxidative stress
#      and reported that fatigue scores changed in parallel in the two groups. 10071523 (NADH, CDC_unspecified,
#      crossover, 26) did not measure oxidative stress. 27125909 (ubiquinol) is unverified.
#
# CONTESTED (proposal: null). Rung 2 rests on 16085177 (isoprostanes) and 21455120 (plasma peroxides); no study on
#   the card measures either against them. 21119582 (Fukuda, 40 v 40) contradicts the MDA result of 23185200 (Fukuda, 24 v 19) at comparable
#   quality (same definition, controls, 40 >= half of 24), but rung 2 does not need 23185200, so the level is not
#   contested; the conflict is described on the card. 19906518 (brain glutathione, no difference) and 22281935
#   (lower) are both unverified.
#
# BADGES (proposal): diagnostic marker no — no cut-off from one cohort was tested in a second, independent cohort;
#   21455120 reports a non-significant ROC; 40627396's follow-up was a small case study of three people from a
#   family cohort, studied by the same group. Explains PEM no — no study tracks symptoms after an exertion challenge
#   and links them to oxidative stress; 16085177 correlated isoprostanes with a post-exertional malaise symptom
#   score (low-risk subgroup only), not an exertion test.
#
# LONG COVID: no label. 40627396's long COVID donors were defined by the CDC post-COVID-conditions criteria, not an
#   ME/CFS case definition, so they are not used. 36280755 and 36675440 (Maes group, long COVID) name no ME/CFS
#   case definition in the abstract; not on the card.
#
# AUTHOR AND COHORT OVERLAPS
#   - Maes M / Bosmans E: 21455120, 21552194, 20010505 (Maes Clinics, Antwerp). Patient overlap not stated.
#     TODO: verify.
#   - Novi Sad (Brkic S, Tomic S, Maric D): 21119582 and 23185200, same clinic, both women aged 15-45 meeting the
#     1994 CDC definition; whether 23185200's 24 patients overlap with 21119582's 40 is not stated. TODO: verify.
#   - Vall d'Hebron, Barcelona (Castro-Marrero J, Alegre J): 25386668 and 34444817. 26212172 (not on the card) reports
#     the same registered trial as 25386668 (NCT02063126).
#   - Osaka (Fukuda S, Nojima J): 27224647 and 27125909. Patient overlap not stated.
#   - 16085177 (Dundee) and 19422646 (Glasgow, last author Nimmo MA) share three authors: Kennedy G, Hill A and
#     Belch JJ (PubMed author lists).
#
# TODOs:
#   - 16085177: subgroup sizes (cardiovascular-risk group and low-risk group) not in the abstract; no open full text.
#   - 27224647: number of patients and controls not in the abstract; no open full text. TODO: verify.
#   - 19906518: split of the 26 participants between patients and controls not in the abstract. TODO: verify.
#   - 25386668, 27125909, 19422646, 19906518, 22281935, 21552194, 20010505: case definition not in the abstract and no
#     open full text. TODO: verify.
#   - 40627396: recorded as Fukuda although the sentence also names the NAM (IOM 2015) and Canadian criteria; which
#     definition each patient met is not stated. FOUNDER QUESTION: Fukuda (conservative) or IOM2015?
#
# Not on the card (searched in the cache, read, left out):
#   - Reviews, hypotheses and theory papers: 10790736, 17448611, 21253446, 21892413, 24669210, 24557875, 26454487,
#     34315375, 19436827, 22837795 and others flagged Review. Exception (founder ruling 2026-11-08): the review
