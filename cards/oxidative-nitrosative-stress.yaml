# Causal map (founder ruling 2026-11-06, docs/plan-causal-map.md): layer and links drafted by link-drafter and
# checked by card-reviewer (map mode); run files in data/pipeline/2026-11-06-map/.
# Links to autonomic-imbalance and symptom:sleep-disturbance (founder ruling 2026-11-08): both step 1 (proposed). The first rests on
# pmid:16610951 (unverified case definition, oxidative stress inferred from one gene); the second on the review
# pmid:29759891, retargeted from circadian-rhythm-disruption because the review says the pathways may drive sleep
# abnormalities. Both records are on the card as context studies for these map links only, not for the level; the
# 'Not on the card' note above that lists reviews does not cover them.
layer: dysfunction
links:
  - to: symptom:post-exertional-neuroimmune-exhaustion
    support: associated
    text: >-
      A study of 47 patients meeting the CDC criteria (version not named) and 34 healthy volunteers found that plasma isoprostane levels, a marker of oxidative damage to fats, correlated with symptom scores, including a post-exertional malaise item, in the subgroup without cardiovascular risk factors. The symptom score is not an exertion test. Not yet repeated.
    sources: [pmid:16085177]
  - to: endothelial-dysfunction
    support: proposed
    text: >-
      A 2025 review proposes that endothelial dysfunction in ME/CFS is driven by oxidative and
      nitrosative stress, along with autoantibody-mediated receptor interference, and that this
      may explain orthostatic intolerance and impaired perfusion; this source does not report
      patient data linking them.
    sources: [pmid:41516145]
  - to: hpa-axis-cortisol
    support: proposed
    text: >-
      A 2017 review proposes that activated immune-inflammatory and oxidative and nitrosative
      pathways may underpin the low cortisol and reduced activity of the stress-hormone (HPA)
      axis seen in ME/CFS, and concludes that HPA axis hypoactivity is most likely a consequence
      and not a cause of these pathways. The review groups the two sets of pathways together;
      its abstract reports no patient study that tested the direction.
    sources: [pmid:27766535]
  - to: autonomic-imbalance
    support: proposed
    text: >-
      A 2006 gene-expression study of 111 women with and without unexplained fatigue concluded that its results
      suggest a common link between oxidative stress, immune system dysfunction and potassium imbalance in CFS
      patients, leading to impaired sympatho-vagal balance reflected in abnormal heart rate variability. This is
      the authors' interpretation, not a direct test: the participants had unexplained fatigue and the abstract
      names no ME/CFS case definition; oxidative stress was not measured directly but inferred from the activity
      of one gene (sestrin 1); and the authors say the exact mechanism is unclear. Not repeated.
    sources: [pmid:16610951]
  - to: symptom:sleep-disturbance
    support: proposed
    text: >-
      A 2018 review proposes that interacting immune, oxidative and nitrosative stress, and mitochondrial pathways
      may drive sleep abnormalities in chronic fatigue syndrome and other neuro-immune disorders. It is a
      hypothesis paper and reports no patient data linking the two. Its first author also wrote the 2017 review
      cited on this card's link to hpa-axis-cortisol, so the two review sources are not independent.
    sources: [pmid:29759891]
