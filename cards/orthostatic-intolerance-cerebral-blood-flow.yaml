slug: orthostatic-intolerance-cerebral-blood-flow
name: Reduced blood flow to the brain on standing (orthostatic intolerance)
core_claim:
  text: >-
    The hypothesis proposes that in people with ME/CFS blood flow to the brain falls more than
    normal when they sit up, stand or are tilted upright, often together with orthostatic
    intolerance such as postural orthostatic tachycardia syndrome (POTS) or a fall in blood
    pressure, and that this contributes to their symptoms.
  sources: [pmid:32140630, pmid:7674527]
level: 2
level_reason:
  - text: >-
      A controlled study from a Dutch clinic (Stichting CardioZorg) measured blood flow to the brain with
      ultrasound of the neck arteries during a 30-minute head-up tilt in 429 patients and 44 healthy
      controls. All patients met the Fukuda definition, which does not require post-exertional
      malaise, and 70% also met the International Consensus Criteria. At the end of the tilt,
      blood flow to the brain had fallen by 26% in patients and 7% in controls; the fall was larger
      than in controls in patients with POTS, with delayed orthostatic hypotension and with a
      normal heart rate and blood pressure response. At mid-tilt, patients who reported more
      orthostatic symptoms had a larger fall. No independent group has yet repeated this finding.
      The card is at level 2 because of this study.
    sources: [pmid:32140630]
  - text: >-
      A later study from the same clinic found a similar fall while sitting in 100 severely ill
      patients (24.5%, against 0.4% in 15 healthy controls). Being from the same group, it does
      not count as a repeat by others.
    sources: ['pmid:33050553', 'pmid:32140630']
  - text: >-
      An earlier controlled study from Johns Hopkins University School of Medicine, of 23
      patients meeting the CDC criteria (version not stated, which does not require
      post-exertional malaise) and 14 healthy controls, found an abnormal response to upright
      tilt in 22 of 23 patients and 4 of 14 controls, including stages with the drug
      isoproterenol; in the first stage, without drugs, 70% of patients and no controls. One of
      its authors is also an author of the Dutch study, so the two are not independent.
    sources: ['pmid:7674527', 'pmid:32140630']
  - text: >-
      An independent study from New Jersey, of 62 patients meeting the Fukuda definition and 35
      controls, found an abnormal standing test in 53% of patients and 20% of controls. Only the
      rate of low carbon dioxide in the breath on standing (hypocapnia) differed significantly
      (20.6% against 2.9%); rates of orthostatic tachycardia and of a fall or rise in blood
      pressure did not differ significantly. It did not measure blood flow to the brain, so the
      card does not count it as a repeat of the Dutch finding.
    sources: ['pmid:17263876', 'pmid:32140630']
  - text: >-
      Against the blood-pressure and heart-rate findings, a population-based study from Wichita, of
      58 patients meeting the Fukuda definition and 55 healthy controls, found orthostatic
      instability on tilt in 30% of eligible patients and 48% of controls. With 58 patients enrolled
      (the abstract does not say how many were tilted), an equally ranked definition and a control
      group, it contradicts the 23-patient Johns Hopkins study. Its abstract reports no measure of
      blood flow to the brain.
    sources: [pmid:16378795, pmid:7674527]
  - text: >-
      The card does not reach level 3: no independent group with a verified case definition has
      repeated the fall in blood flow to the brain. Two studies from New York Medical College
      found lower blood flow velocity in the brain on tilt (in one, a fall of 22.5% in 15
      patients against 8.7% in 11 controls), and a study from Osaka Medical College of 28 young
      patients and 20 controls found slower recovery of brain oxygen on standing. A study from
      Johns Hopkins Medical Institutions of 26 patients and 23 controls found no difference in
      blood flow velocity at any of the measured time points (supine, 1 and 5 minutes after
      tilt, 5 and 1 minutes before the end, and at termination). The case definitions of all
      four are not yet verified, so none of them can support or contradict the card.
    sources: ['pmid:22180650', 'pmid:25277740', 'pmid:12006954', 'pmid:12593133']
  - text: >-
      The card does not reach level 4. In a placebo-controlled trial of 100 patients meeting the CDC
      criteria who had a fall in blood pressure on tilt, 7 of 50 given fludrocortisone and 5 of 50 given placebo improved by at least 15 points on a wellness
      scale (P = .76), and the share with a normal tilt test afterwards did not differ. In a
      sham-controlled trial of daily tilt training at home in 38 patients meeting the Fukuda
      definition, standing blood pressure fell 8.0 mmHg less in the training group at 4 weeks, but
      fatigue did not differ at 4 weeks, with a trend towards less fatigue at 6 months, in this
      feasibility study.
    sources: [pmid:11150109, pmid:19912315]
  - text: >-
      Two small studies changed blood flow to the brain directly. In a randomised crossover
      study of 16 patients from the Dutch clinic, compression stockings reduced the fall in
      blood flow to the brain during tilt (14% with stockings, 25% without); symptoms were not
      an outcome and the paper does not name the case definition. In the New York Medical
      College study of 15 patients, phenylephrine, which raises blood pressure, reduced the fall
      in blood flow velocity on tilt (8.1% against 22.5% untreated) and the slowing on a
      working-memory task; its case definition is not yet verified. Neither can count towards
      level 4.
    sources: ['pmid:35056360', 'pmid:25277740']
# Contested: null (proposal). See header: no contradicting study of comparable quality to 32140630 (needs >= 214.5
# patients, Fukuda or stricter, controls). 16378795 contradicts 7674527, which the card does not need for rung 2.
contested: null
badges:
  diagnostic_marker:
    value: false
    reason:
      text: >-
        The Dutch study set a lower limit of normal at a 13% fall in blood flow to the brain,
        from its 44 healthy controls, and found a larger fall in 82% to 100% of patients
        depending on their heart rate and blood pressure response. The later sitting study came
        from the same clinic, so it is not an independent patient group. No independent patient
        group has tested this cut-off.
      sources: ['pmid:32140630', 'pmid:33050553']
  explains_pem:
    # 33585505: full text, "No significant relations were found between the reduction in percentage of CBF and NRS
    # for pain, fatigue, or concentration at all time points assessed (data not shown)." ICC (with Fukuda), but
    # `context`, measures_pem false (a passive tilt is orthostatic stress, not physical or mental effort), and no
    # link to blood flow was found.
    value: false
    reason:
      text: >-
        No study at level 2 or above measures post-exertional malaise and links it to blood flow
        to the brain in the same patients. A study from the Dutch clinic, of patients meeting
        both the criteria for CFS and the criteria for ME, tracked pain, fatigue and
        concentration scores after a tilt test in 278 patients and 30 healthy controls: scores
        rose in patients and were still higher after 7 days. In controls the scores were
        unchanged after the tilt, and at 7 days only the fatigue score had changed, falling. A
        passive tilt is orthostatic stress rather than physical or mental effort, so the card
        does not count it as a direct measure of post-exertional malaise.
      sources: ['pmid:33585505']
subgroups:
  - text: >-
      Studies describe several patterns on standing or tilt: POTS, delayed orthostatic hypotension, a
      fall in blood flow to the brain with a normal heart rate and blood pressure response, and low
      carbon dioxide in the breath (hypocapnia), which in one study was found mostly without heart
      rate or blood pressure changes.
    sources: [pmid:32140630, pmid:17263876]
working_on_it: []
early_signals:
  - text: >-
      A study of n=62 patients and 35 controls found low carbon dioxide in the breath on standing
      (orthostatic hypocapnia) in 20.6% of patients and 2.9% of controls. Not yet repeated by an
      independent group with a verified case definition.
    sources: [pmid:17263876]
