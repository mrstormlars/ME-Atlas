    source_hash: 71ba9da7e01144bc687dc64177f7012a20e125febf4f0f45bf1013ad7af3ba2b
  studies[pmid:36758521].finding:
    text: En studie med 149 pasienter (74 som hadde vært syke i under 4 år og 75 som hadde vært syke i over 10 år; sammendraget
      oppgir 75 og 79 for de to pasientgruppene) og 79 friske kontroller fant tydelige forskjeller i tarmbakterier hovedsakelig
      hos pasientene som hadde vært kortere syke, og rapporterte mindre bakteriell butyratproduksjon og lavere isobutyrat
      i blodplasma i gruppen som hadde vært kortere syk. Artikkelens setning om rekruttering sier at pasientene oppfylte Fukuda-
      og/eller Canadian-kriteriene, mens avsnittet Participants sier at de måtte oppfylle International Chronic Fatigue Syndrome
      Study Group research criteria, Canadian Consensus Criteria og IOM clinical diagnostic criteria; kortet registrerer den
      lavere rangerte Fukuda.
    source_hash: bd01097b2c295e568a8f3b29b6a51afa74a5e277cb3128e05d093d064f8b6a85
  studies[pmid:23791918].finding:
    text: En studie med n=43 pasienter og 36 friske kontroller fra Belgia og Norge fant mer Lactonifactor og Alistipes og
      mindre av flere Firmicutes hos norske pasienter enn hos norske kontroller, med et mindre tydelig skille hos de belgiske
      deltakerne.
    source_hash: 24be4d75d3703c4afa143daef5bce663af4cbcbddab03a13f743056136cc63b7
  studies[pmid:42351611].finding:
    text: En studie med 76 pasienter med ME/CFS som oppfylte IOM 2015-kriteriene, 50 pasienter med langvarig covid og 37 friske
      kontroller fant ingen signifikant forskjell i mangfold innen prøver, små forskjeller i den samlede sammensetningen av
      tarmbakterier med stor overlapping, og mer Sutterella og mindre Lachnospiraceae i begge pasientgruppene. Fulltekstversjonen
      rapporterer at poengsummer for affektive, kognitive og mage-tarm-symptomer hadde svakere eller mindre stabile sammenhenger
      med tarmbakterier enn poengsummer for utmattelse.
    source_hash: e2e6f69ce19d466d00a2b54d0f3417ed37244b70910901f4a3d4d7154df704d8
  studies[pmid:37516837].finding:
    text: En randomisert placebokontrollert pilotstudie med n=11 pasienter fant ingen signifikant endring i skårer for utmattelse
      eller livskvalitet 1 og 6 måneder etter fekal transplantasjon fra en donor eller fra pasientens egen avføring.
    source_hash: 4d7bc3c1d8687c3bf08d194475c5ad657afc55d186ffe538cc2d71945364eb44
  studies[pmid:19338686].finding:
    text: En randomisert placebokontrollert pilotstudie med 39 pasienter (35 fullførte) fant at et probiotikum økte Lactobacillus
      og Bifidobacteria i avføring; skårene for angst falt, men samspillet mellom gruppe og tid var ikke signifikant, og skårene
      for depresjon endret seg ikke signifikant.
    source_hash: ed9040a3ba38252b98588201623c13c26c5cb5b3b05b407a534e497d827b9d7b
  studies[pmid:41516296].finding:
    text: En oversikt over forskning på tarmens mikrobiom ved ME/CFS; sammendraget sier at endringer i mikrobiomet kan føre
      til tydelige nevrokognitive svekkelser gjennom tarm-hjerne-aksen, og at overføring av mikrobielle komponenter utløser
      en immunrespons og systemisk betennelse. Bare bakgrunn, ikke evidens for nivået.
    source_hash: 29735758f779deff899e915aa5c2e5ecb975207ca7655d6fececb2c16b830e8c
  studies[pmid:31330791].finding:
    text: En oversikt fra 2019 over foreslåtte sykdomsmekanismer ved ME/CFS; sammendraget nevner forstyrrelser i immunologiske
      og inflammatoriske veier, autonom og nevrologisk dysfunksjon, avvik i muskel- og mitokondriefunksjon, forskyvninger
      i stoffskiftet, og forstyrrelser i tarmfysiologi eller tarmbakterier. Bare bakgrunn, ikke evidens for nivået.
    source_hash: b1f69c6487526c592b0a92344f9a0cd593273dea5929d89e3f07270e55d49caa
