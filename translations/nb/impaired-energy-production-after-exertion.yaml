  studies[pmid:42051540].finding:
    text: En systematisk oversikt over de patofysiologiske mekanismene bak PEM ved langvarig covid og kronisk utmattelsessyndrom.
      Den foreslår et rammeverk der mitokondriedysfunksjon, immunaktivering og nevroinflammasjon danner en selvforsterkende
      sløyfe. Sitert på kartet som kilde til en foreslått lenke, ikke som evidens for nivået.
