  studies[pmid:37054777].finding:
    text: En oversikt over patofysiologien ved trening ved ME/CFS og langvarig covid. Den peker på at få studier direkte har
      testet hvordan kroppens reaksjoner på trening henger sammen med PEM. Sitert på kartet som kilde til en foreslått lenke,
      ikke som evidens for nivået.
