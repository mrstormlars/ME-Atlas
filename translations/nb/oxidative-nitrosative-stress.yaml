    text: En studie av n=15 pasienter og 16 friske kontroller (fra en studie av 27 pasienter og 25 kontroller) fant høyere
      reaktive oksygenforbindelser i lymfocytter hos pasientene, med forskjellen hos kvinner, men ikke hos menn.
    source_hash: 054eadddb9c81530c966c7ac50b8fc7cc1a9dd505c3c9a127901956977c2361d
  studies[pmid:21119582].finding:
    text: En studie av n=40 kvinner og 40 friske kvinner fant ingen samlet forskjell i malondialdehyd mellom gruppene (forfatterne
      rapporterer en forskjell først etter å ha delt pasientene etter nivå av MDA, og gir artikkelen en tittel som sier at
      den viser forhøyet lipidperoksidasjon); pasientene hadde lavere HDL-kolesterol.
    source_hash: 2e6f352a52a647ddafe31f59f9457fde3b76bb97b225e654cc8f071bc1d3548b
  studies[pmid:19422646].finding:
    text: En studie av n=6 mannlige pasienter og 6 friske kontroller fant høyere isoprostaner i plasma hos pasientene i hvile,
      og forskjellen vedvarte rett etter og 24 timer etter trening.
    source_hash: b1108268274e6708845a395e4ec577b147ebc7f14e106f946e028617a635b98b
  studies[pmid:20010505].finding:
    text: En studie av n=58 pasienter og 22 friske kontroller fant lavere koenzym Q10 i plasma hos pasientene, med opptil
      44,8% av pasientene under den laveste verdien som ble sett hos kontrollene.
    source_hash: 1219cc23a94c801e46f16f5f67d5714f5da2c9293c3d96d60f6073e57da08fa0
  studies[pmid:21552194].finding:
    text: En studie av n=40 pasienter og 24 friske kontroller fant ingen forskjell i aktiviteten til glutationperoksidase
      i fullblod, et antioksidantenzym, mellom pasienter og kontroller.
    source_hash: eeea688bf9acdf7e5851541214f2e1963b1a60a02ac95099284cc4ab5d75f789
  studies[pmid:22281935].finding:
    text: En studie av n=15 pasienter og 13 friske frivillige fant lavere glutation, et antioksidant, i hjernebarken hos pasientene;
      personer med alvorlig depresjon viste det samme.
    source_hash: cb39be951fbfb34a4d80439657b257e73ec2ab7aa064378f90a0c9d4b920d68a
  studies[pmid:19906518].finding:
    text: En studie av n=26 personer til sammen, pasienter og matchede friske kontroller, fant ingen forskjell i glutation
      i hjernen mellom gruppene.
    source_hash: 8beacdadd616413cc629af0d04282d73e658e950b073c246f19fd55006d7078e
  studies[pmid:25386668].finding:
    text: En studie av n=73 pasienter, placebokontrollert, fant mindre utmattelse etter åtte uker med koenzym Q10 pluss NADH
      enn med placebo, og rapporterte lavere lipidperoksider i blodceller i den behandlede gruppen (sammendraget sier ikke
      om det er mot placebo eller mot utgangsnivået).
    source_hash: 5424cf991130f886b8f49b6757a69c885104cd4572e948cbbcb4450cf582d91b
  studies[pmid:34444817].finding:
    text: En placebokontrollert studie av n=207 kvinner (144 fullførte, 72 per gruppe) rapporterte at skårene for utmattelse
      endret seg parallelt i gruppene med koenzym Q10 pluss NADH og placebo over 12 uker; forbedringene den rapporterer i
      utmattelse og livskvalitet gjelder innen den behandlede gruppen.
    source_hash: 2dfcf3e6c8881b58d69ca0ee97c94f7d2508e935b71750c9ce9c0d5686cecedb
  studies[pmid:10071523].finding:
    text: En placebokontrollert crossover-studie av n=26 pasienter fant at 8 av 26 responderte gunstig på NADH og 2 av 26
      på placebo.
    source_hash: bbee3d72cb86f4bd3d9ee3522fc5780edeac3c75fd5c432f2dbcecf048a244bd
  studies[pmid:27125909].finding:
    text: 'En placebokontrollert studie av n=43 pasienter (31 fullførte: 17 fikk ubikinol, 14 placebo) rapporterte at 12 uker
      med ubikinol bedret flere symptomer.'
    source_hash: ad91d4ea2f2f7c7557750840bf6ed473f9eee462ab8b929f1c234722e05a7841
  studies[pmid:41516145].finding:
    text: En oversiktsartikkel om det biologiske nettverket bak ME/CFS. Den foreslår at endoteldysfunksjon drevet av oksidativt
      og nitrosativt stress, sammen med autoantistoffformidlet forstyrrelse av reseptorer, kan forklare ortostatisk intoleranse
      og nedsatt perfusjon. Sitert på kartet som kilde til en foreslått lenke, ikke som evidens for nivået.
    source_hash: ac2d87c13cd95373992655c6cc989e0bd55e61ed1ca1374c4042506a13f1d530
  studies[pmid:27766535].finding:
    text: En narrativ oversiktsartikkel om samspillet mellom immuninflammatoriske og oksidative og nitrosative signalveier
      og lav aktivitet i stresshormonaksen (HPA-aksen) ved ME/CFS. Den konkluderer med at den lave aktiviteten mest sannsynlig
      er en følge av disse signalveiene og ikke en årsak til dem. Sitert på kartet som kilde til en foreslått lenke, ikke
      som evidens for nivået.
    source_hash: 03b322671db920939fb2512c0e5fc69850f187ce9759cb902243986b42500612
  studies[pmid:16610951].finding:
    text: En studie av kliniske data og genuttrykksdata fra 111 kvinner med uforklart utmattelse og kontroller uten utmattelse
      fant at det mest innflytelsesrike genet var sestrin 1 (SESN1), og at hjerterytmevariabilitet under søvn dominerte blant
      de kliniske variablene. Forfatterne skriver at den nøyaktige mekanismen er uklar. Sitert på kartet som kilde til en
      foreslått lenke, ikke som evidens for nivået.
    source_hash: b00bc4ff7dd80aadf8331e071c197faefd19cb80bf60d6a404960b648154bdd7
  studies[pmid:29759891].finding:
    text: En oversiktsartikkel som foreslår et rammeverk der gjensidig samspill mellom immunologiske, oksidative og nitrosative
      stressprosesser og mitokondrielle signalveier kan drive søvnforstyrrelser ved nevroimmune tilstander, med kronisk utmattelsessyndrom,
      bipolar lidelse og multippel sklerose som eksempler. Sitert på kartet som kilde til en foreslått lenke, ikke som evidens
      for nivået.
    source_hash: f095603072b3c37806edec5f104355439f5c06949a097e722f2b5c75960f6e7e
  studies[pmid:43027675].finding:
    text: En studie med n=125 pasienter med ME/CFS, 89 med langvarig covid og 80 friske kontroller målte undergrupper av T-celler
      og serummarkører for oksidativt og nitrosativt stress (blant annet catalase, SOD1, GPX1, MDA, NOS1 og NOS3). Den rapporterte
      at malondialdehyd var en uavhengig prediktor i sammenligningen av ME/CFS og friske kontroller, og at GPX1 skilte mellom
      ME/CFS og langvarig covid. Sammendraget oppgir ikke diagnosekriteriene, så de er ikke kontrollert, og det oppgir ikke
      retningen på forskjellene i markørene. Ikke gjentatt ennå.
    source_hash: bcf4d8b436481c5a0e55b46a58e38788f6e81e86ee7e3b25823f88c6c84d11cc
