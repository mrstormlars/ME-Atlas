slug: oxidative-nitrosative-stress
items:
  name:
    text: Oksidativt og nitrosativt stress (for mange reaktive oksygen- eller nitrogenforbindelser for kroppens antioksidantforsvar)
    source_hash: cb99f728384185a8a25010b31af60665001c93e00e3628b3a063bbd119a4e829
  core_claim:
    text: Hypotesen går ut på at reaktive oksygen- eller nitrogenforbindelser hos personer med ME/CFS overstiger kroppens
      antioksidantforsvar, skader fett, proteiner og andre molekyler og bidrar til sykdommen.
    sources:
    - pmid:16085177
    - pmid:21455120
    source_hash: 1d3d8790eb1c3d0d481bcbd0c84b01c7f69867254cc9ed85e9d7c7a2b499eef3
  level_reason[0]:
    text: En studie fra Dundee i Skottland, med 47 pasienter som oppfylte CDC-kriteriene (versjon ikke oppgitt) og 34 friske
      frivillige som var innrullert (antallet som ble målt er ikke oppgitt), fant høyere nivåer av isoprostaner i blodet,
      en markør for oksidativ skade på fett, hos pasientene, både hos dem med og dem uten risikofaktorer for hjerte- og karsykdom.
      En studie fra Antwerpen av 56 pasienter som oppfylte Fukuda-definisjonen og 37 friske kontroller fant høyere peroksider
      i plasma hos pasientene. Kortet er på nivå 2 på grunn av disse to kontrollerte studiene, som brukte ulike mål.
    sources:
    - pmid:16085177
    - pmid:21455120
    source_hash: 564de93e4691f870bbf4284087f5ff09fbc7bb7752f5fc74f4b44c027631bc90
  level_reason[1]:
    text: 'Andre kontrollerte studier av pasienter som oppfylte Fukuda-definisjonen fant høyere markører for oksidativt stress,
      hver på et ulikt mål: malondialdehyd og proteinkarbonyler hos 24 kvinner mot 19 i Novi Sad i Serbia; reaktive oksygenmetabolitter
      i serum i en studie fra Osaka der sammendraget ikke oppgir tallene; og reaktive oksygenforbindelser inne i lymfocytter
      hos 15 pasienter mot 16 kontroller ved Stanford, der forskjellen ble funnet hos kvinner, men ikke hos menn. Fordi målene
      er ulike, er ingen av disse en replikasjon av en annen, og hver av dem er ikke replikert.'
    sources:
    - pmid:23185200
    - pmid:27224647
    - pmid:40627396
    source_hash: 84e88bd3815d0cf0507adddaaeb07373c69fcf5eca8cadae5a05ecff80bec456
  level_reason[2]:
    text: 'Kortet når ikke nivå 3: ingen uavhengig gruppe har funnet det samme resultatet på det samme målet i en egen kohort
      med bekreftede anerkjente diagnosekriterier. Den eneste andre isoprostanstudien, av 6 pasienter og 6 kontroller i Glasgow,
      fant også høyere nivåer i hvile, men diagnosekriteriene er ikke kontrollert ennå. Den har tre forfattere felles med
      studien fra Dundee, så den ville ikke regnes som en uavhengig replikasjon selv med en kontrollert definisjon.'
    sources:
    - pmid:19422646
    - pmid:16085177
    source_hash: 206959343957ad5b1fe21f36b12ff896322e0f2477b21ae7c1bd0b1e1592d2ca
  level_reason[3]:
    text: 'Resultatene for malondialdehyd er motstridende. En tidligere studie fra den samme klinikken i Novi Sad, av 40 kvinner
      som oppfylte Fukuda-definisjonen og 40 friske kvinner, fant ingen samlet forskjell mellom gruppene; forfatterne rapporterer
      en forskjell først etter å ha delt pasientene etter nivå av malondialdehyd, og gir artikkelen en tittel som sier at
      den viser forhøyet lipidperoksidasjon. Den er større enn studien av 24 pasienter som fant høyere nivåer, og bruker den
      samme definisjonen, så etter rubrikken kan ikke funnet om malondialdehyd bære et nivå. De to studiene har felles forfattere,
      og det er ikke oppgitt hvor mye pasientene overlapper. De kan også ha brukt ulike metoder: studien av 24 pasienter brukte
      en ELISA-test for malondialdehyd bundet til proteiner (OxiSelect MDA Adduct ELISA), og sammendraget til den tidligere
      studien oppgir ikke metoden sin. Kortets nivå bygger ikke på dette funnet.'
    sources:
    - pmid:21119582
    - pmid:23185200
    source_hash: 9fadc03585b12ff8212fba7cc50e750e80394f2b7ec944af442ad1bdc3a9f6f0
  level_reason[4]:
    text: Målene på antioksidantforsvar er blandede. I studier med en anerkjent definisjon var antioksidantpotensialet i serum
      lavere i studien fra Osaka, mens glutation i lymfocytter var høyere hos begge kjønn i studien fra Stanford (hos menn
      i to av de tre celletypene som ble testet). I studier der diagnosekriteriene ikke er kontrollert ennå, var koenzym Q10
      i plasma lavere hos 58 pasienter enn hos 22 kontroller; aktiviteten til glutationperoksidase i fullblod skilte seg ikke
      mellom 40 pasienter og 24 kontroller; glutation i hjernen var lavere hos 15 pasienter enn hos 13 friske frivillige i
      én studie og skilte seg ikke i en annen med 26 personer til sammen.
    sources:
    - pmid:27224647
    - pmid:40627396
    - pmid:20010505
    - pmid:21552194
    - pmid:22281935
    - pmid:19906518
    source_hash: 8de4d463d916eb6f6cbc814ae96547f68ac55aa287780e76e553289dd25369d8
  level_reason[5]:
    text: 'Kortet når ikke nivå 4: ingen kontrollert studie hos pasienter med bekreftede anerkjente diagnosekriterier har
      senket et mål på oksidativt stress og bedret sykdommen. En placebokontrollert studie av koenzym Q10 pluss NADH hos 73
      pasienter rapporterte mindre utmattelse enn med placebo og lavere lipidperoksider i blodceller i den behandlede gruppen
      (sammendraget sier ikke om det er mot placebo eller mot utgangsnivået), men diagnosekriteriene er ikke kontrollert ennå.
      En større placebokontrollert studie av den samme kombinasjonen fra den samme enheten, hos 207 kvinner som oppfylte Fukuda-definisjonen,
      målte ikke oksidativt stress og rapporterte at skårene for utmattelse endret seg parallelt i de to gruppene. En crossover-studie
      av bare NADH hos 26 pasienter som oppfylte CDC-kriteriene målte heller ikke oksidativt stress.'
    sources:
    - pmid:25386668
    - pmid:34444817
    - pmid:10071523
    source_hash: d4dfb997e63d5b7380e353ee822125e2e36fcf68520c2c67989e14cc53877a49
  level_reason[6]:
    text: En placebokontrollert studie av ubikinol, den reduserte formen av koenzym Q10, hos 43 pasienter (31 fullførte) rapporterte
      bedring i flere symptomer; diagnosekriteriene er ikke kontrollert ennå.
    sources:
    - pmid:27125909
    source_hash: 89d49e08e5f0851303b43c7c78297d0e5ac48db92df47c6c8635ae8aecb7675c
  badge_reasons.diagnostic_marker[0]:
    text: Ingen studie på dette kortet tester en grenseverdi fra én pasientgruppe i en andre, uavhengig gruppe. I studien
      fra Antwerpen skilte peroksider i plasma ikke pasientene godt fra kontrollene (areal under kurven 62,6%, ikke signifikant),
      og Stanford-gruppens videre test var en liten kasusstudie av tre personer fra en familiekohort, undersøkt av den samme
      gruppen.
    sources:
    - pmid:21455120
    - pmid:40627396
    source_hash: a78b0e2720618a2b96fe60a7e180ca7b330a7949906f67c3884b45bd7d375cd5
  badge_reasons.explains_pem[0]:
    text: Ingen studie på dette kortet følger symptomer etter en anstrengelsesprøve og kobler dem til oksidativt stress hos
      de samme pasientene. Studien fra Dundee satte nivåene av isoprostaner i sammenheng med en symptomskår for PEM, bare
      i undergruppen med lav risiko; en symptomskår er ikke et direkte mål på PEM.
    sources:
    - pmid:16085177
    source_hash: 6732cef430480e5f5df8b2faa5a60b42956d008b3e5615873db9130069fc42a1
  subgroups[0]:
    text: 'Oksidativt stress kan være ulikt hos kvinner og menn: i studien fra Stanford var reaktive oksygenforbindelser i
      lymfocytter høyere hos kvinner med ME/CFS enn hos friske kvinner, men ikke hos menn, mens menn med ME/CFS hadde mer
      oksidativ skade på fett inne i cellene. Ikke gjentatt ennå.'
    sources:
    - pmid:40627396
    source_hash: a40c2ab9e66fa14e1bdfa5addaccd575bbbfde6d695a8e5e35b9f58eda7bf98c
  early_signals[0]:
    text: En studie av n=15 pasienter og 16 friske kontroller fant høyere nivåer av reaktive oksygenforbindelser inne i lymfocytter
      hos pasientene, med forskjellen funnet hos kvinner, men ikke hos menn. Ikke gjentatt ennå.
    sources:
    - pmid:40627396
    source_hash: 4665ae38450eae601e340e3719adc30fab2babc39ec504ec3c5c354018ccce91
  links[0]:
    text: En studie med 47 pasienter som oppfylte CDC-kriteriene (versjon ikke oppgitt) og 34 friske frivillige fant at isoprostannivåer
      i plasma, en markør for oksidativ skade på fett, samvarierte med symptomskårer, blant dem et spørsmål om PEM, i undergruppen
      uten kardiovaskulære risikofaktorer. Symptomskåren er ikke en anstrengelsestest. Ikke gjentatt ennå.
    sources:
    - pmid:16085177
    source_hash: 550aaeb49899a9d722f2794e2aa0ef3b737001dd7e1de045d5715512d68c4f18
  studies[pmid:16085177].finding:
    text: En studie med n=47 pasienter og 34 friske frivillige som var innrullert (antallet som ble målt er ikke oppgitt)
      fant høyere isoprostaner i plasma hos pasientene; hos pasienter uten risikofaktorer for hjerte- og karsykdom hang nivåene
      av isoprostaner sammen med symptomskårer.
    source_hash: 9a3ec553c36c86fe569972527da1d2ad2f126a8374d9d49f5bf1a289bec34d6c
  studies[pmid:21455120].finding:
    text: En studie av n=56 pasienter og 37 friske kontroller fant høyere peroksider i plasma hos pasientene; antistoffer
      mot oksidert LDL i serum viste bare en ikke-signifikant tendens.
    source_hash: e08a9347237f71652ef7e9f0712f0c4c29047dd1451248388601ffc96d4bbbf9
  studies[pmid:23185200].finding:
    text: En studie av n=24 kvinner og 19 friske kvinner fant høyere malondialdehyd og proteinkarbonyler, markører for oksidativ
      skade på fett og proteiner, hos pasientene.
    source_hash: 35c720478953fbcaa3f4434447144667cd3ed4e34b5d93456d6ccd2826fc58b7
  studies[pmid:27224647].finding:
    text: En studie som sammenlignet pasienter med friske kontroller i hvile (tall er ikke oppgitt i sammendraget) fant høyere
      reaktive oksygenmetabolitter og lavere antioksidantpotensial i serum hos pasientene.
    source_hash: d221479c1665261caa8a8347d2048dcf1a580ef2ba01d98251711341fe66e3ee
  studies[pmid:40627396].finding:
    text: En studie av n=15 pasienter og 16 friske kontroller (fra en studie av 27 pasienter og 25 kontroller) fant høyere
      reaktive oksygenforbindelser i lymfocytter hos pasientene, med forskjellen hos kvinner, men ikke hos menn.
    source_hash: 054eadddb9c81530c966c7ac50b8fc7cc1a9dd505c3c9a127901956977c2361d
  studies[pmid:21119582].finding:
    text: En studie av n=40 kvinner og 40 friske kvinner fant ingen samlet forskjell i malondialdehyd mellom gruppene (forfatterne
      rapporterer en forskjell først etter å ha delt pasientene etter nivå av MDA, og gir artikkelen en tittel som sier at
      den viser forhøyet lipidperoksidasjon); pasientene hadde lavere HDL-kolesterol.
    source_hash: 2e6f352a52a647ddafe31f59f9457fde3b76bb97b225e654cc8f071bc1d3548b
  studies[pmid:19422646].finding:
    text: En studie av n=6 mannlige pasienter og 6 friske kontroller fant høyere isoprostaner i plasma hos pasientene i hvile,
      og forskjellen vedvarte rett etter og 24 timer etter trening.
    source_hash: b1108268274e6708845a395e4ec577b147ebc7f14e106f946e028617a635b98b
  studies[pmid:20010505].finding:
    text: En studie av n=58 pasienter og 22 friske kontroller fant lavere koenzym Q10 i plasma hos pasientene, med opptil
      44,8% av pasientene under den laveste verdien som ble sett hos kontrollene.
    source_hash: 1219cc23a94c801e46f16f5f67d5714f5da2c9293c3d96d60f6073e57da08fa0
  studies[pmid:21552194].finding:
    text: En studie av n=40 pasienter og 24 friske kontroller fant ingen forskjell i aktiviteten til glutationperoksidase
      i fullblod, et antioksidantenzym, mellom pasienter og kontroller.
    source_hash: eeea688bf9acdf7e5851541214f2e1963b1a60a02ac95099284cc4ab5d75f789
  studies[pmid:22281935].finding:
    text: En studie av n=15 pasienter og 13 friske frivillige fant lavere glutation, et antioksidant, i hjernebarken hos pasientene;
      personer med alvorlig depresjon viste det samme.
    source_hash: cb39be951fbfb34a4d80439657b257e73ec2ab7aa064378f90a0c9d4b920d68a
  studies[pmid:19906518].finding:
    text: En studie av n=26 personer til sammen, pasienter og matchede friske kontroller, fant ingen forskjell i glutation
      i hjernen mellom gruppene.
    source_hash: 8beacdadd616413cc629af0d04282d73e658e950b073c246f19fd55006d7078e
  studies[pmid:25386668].finding:
    text: En studie av n=73 pasienter, placebokontrollert, fant mindre utmattelse etter åtte uker med koenzym Q10 pluss NADH
      enn med placebo, og rapporterte lavere lipidperoksider i blodceller i den behandlede gruppen (sammendraget sier ikke
      om det er mot placebo eller mot utgangsnivået).
    source_hash: 5424cf991130f886b8f49b6757a69c885104cd4572e948cbbcb4450cf582d91b
  studies[pmid:34444817].finding:
    text: En placebokontrollert studie av n=207 kvinner (144 fullførte, 72 per gruppe) rapporterte at skårene for utmattelse
      endret seg parallelt i gruppene med koenzym Q10 pluss NADH og placebo over 12 uker; forbedringene den rapporterer i
      utmattelse og livskvalitet gjelder innen den behandlede gruppen.
    source_hash: 2dfcf3e6c8881b58d69ca0ee97c94f7d2508e935b71750c9ce9c0d5686cecedb
  studies[pmid:10071523].finding:
    text: En placebokontrollert crossover-studie av n=26 pasienter fant at 8 av 26 responderte gunstig på NADH og 2 av 26
      på placebo.
    source_hash: bbee3d72cb86f4bd3d9ee3522fc5780edeac3c75fd5c432f2dbcecf048a244bd
  studies[pmid:27125909].finding:
    text: 'En placebokontrollert studie av n=43 pasienter (31 fullførte: 17 fikk ubikinol, 14 placebo) rapporterte at 12 uker
      med ubikinol bedret flere symptomer.'
    source_hash: ad91d4ea2f2f7c7557750840bf6ed473f9eee462ab8b929f1c234722e05a7841
