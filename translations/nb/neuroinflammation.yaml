slug: neuroinflammation
items:
  name:
    text: Nevroinflammasjon (betennelse i hjernen / aktivering av gliaceller)
    source_hash: 65a0fe052cd9c65a3d92be6e4049c50648c20b1c1c1e3a83d34efb48618a8299
  core_claim:
    text: Hypotesen går ut på at betennelse i hjernen, blant annet aktivering av mikroglia eller astrocytter, er til stede
      ved ME/CFS og henger sammen med symptomene.
    sources:
    - pmid:24665088
    - pmid:30617782
    source_hash: e9f14a13d914c613bc30badf8e9372e15161dc7dddfe2ce00665ab16a663763e
  level_reason[0]:
    text: En kontrollert diffusjons-MR-studie av 67 pasienter, med en diagnose i samsvar med Canadian Consensus Criteria bekreftet
      av to klinikere, og 67 friske kontroller fant utbredte forskjeller i hvit substans som forfatterne tolker som nevroinflammasjon.
      Dette er studien nivået bygger på, og ingen annen studie på dette kortet gjentar dette målet (ikke replikert). Forfatterne
      kaller metoden et indirekte mål på nevroinflammasjon. En publisert rettelse endret tolkningen av én markør fra cellulær
      infiltrasjon til endring i cellenes form eller en kronisk uttømming av mikroglia, og la til en tolkning av den lavere
      hindered water ratio som cytotoksisk-liknende ødem og ikke vasogent ødem.
    sources:
    - pmid:41834684
    - pmid:42227214
    source_hash: 54052f3b3536d9eabb2243d2c6c99be5646b2595ab075260f92722270bd41bd3
  level_reason[1]:
    text: 'Mindre bildestudier med diagnosekriterier som ikke er kontrollert ennå, peker i samme retning: en PET-studie av
      9 pasienter fant høyere binding av en markør for aktiverte mikroglia eller astrocytter, og en MR-spektroskopistudie
      av 15 pasienter fant høyere temperatur i hjernen i flere områder og et høyere kolin/kreatin-forhold i venstre fremre
      cingulære cortex.'
    sources:
    - pmid:24665088
    - pmid:30617782
    source_hash: 98eed7b3ca29be2baeaa33507f740a0bc4537a991a5a88580c3740183b725a6c
  level_reason[2]:
    text: En PET-studie av 9 pasienter diagnostisert etter Fukuda-kriteriene, med det samme sporstoffet som den tidligere
      PET-studien av 9 pasienter, fant ingen statistisk signifikant forskjell fra 9 friske kontroller.
    sources:
    - pmid:34815320
    - pmid:24665088
    source_hash: 45137298de089e06b4588997b3b000ae5f3b38153471f7abda838bbf5c4a67f4
  level_reason[3]:
    text: 'Denne PET-studien med Fukuda-kriteriene gjør ikke nivå 2 omstridt. Den er ikke av sammenlignbar kvalitet med diffusjons-MR-studien
      av 67 pasienter som nivået bygger på: Fukuda-definisjonen rangeres under Canadian Consensus Criteria, og de 9 pasientene
      er færre enn halvparten av 67. Den måler også noe annet (binding av PET-sporstoff, ikke diffusjons-MR), så den motsier
      ikke funnet som nivået bygger på. Den tidligere PET-studien, hvis funn den ikke gjentok, teller ikke med for nivå 2,
      fordi diagnosekriteriene ikke er kontrollert ennå.'
    sources:
    - pmid:34815320
    - pmid:41834684
    - pmid:24665088
    source_hash: 023fba2d8d59b7e97da1399b3f1e7a18f1460d10261c916477e6e0d465e19cc3
  level_reason[4]:
    text: En MR-spektroskopistudie på 7 tesla av 22 pasienter definert etter Fukuda fant lavere myo-inositol, noe forfatterne
      skriver ville være forenlig med dysfunksjon i gliaceller.
    sources:
    - pmid:34609538
    source_hash: d2388c5161fcd861bdc60d2fb73980763bc640bf6031558be5f2609d4badf463
  badge_reasons.diagnostic_marker[0]:
    text: Én studie foreslo diffusjonsindekser som mulige markører for nevroinflammasjon, men verken sammendragene eller de
      tre åpne fulltekstene rapporterer at en slik markør er testet i en andre, uavhengig pasientgruppe.
    sources:
    - pmid:41834684
    source_hash: f6aa779cc415723c38096c3c3d8cade3c932c53cc6ccce1f194626caaa2e1648
  badge_reasons.explains_pem[0]:
    text: De tre studiene med åpen fulltekst rapporterer ikke noe direkte mål på PEM, verken i sammendragene eller i fulltekstene
      som er kontrollert.
    sources:
    - pmid:34815320
    - pmid:41834684
    - pmid:34609538
    source_hash: c2b807bc0091825bdafee464e3cdc1ca7cc302317f866dac91fb3bd2711cb107
  badge_reasons.explains_pem[1]:
    text: De tre andre studiene rapporterer ikke noe direkte mål på PEM i sammendragene; ingen åpen fulltekst var tilgjengelig.
    sources:
    - pmid:24665088
    - pmid:30617782
    - pmid:12598734
    source_hash: 0f8390efaf77cfa08fd778542745626f2051bea2cb71dffa5f356c8af5a85af3
  links[0]:
    text: En PET-studie med n=9 pasienter og 10 friske kontroller, der diagnosekriteriene ikke er verifisert, fant at bindingen
      av en markør for aktiverte mikroglia eller astrocytter i noen hjerneområder samvarierte med skårer for kognitiv svikt.
      En senere PET-studie med n=9 kvinner definert etter Fukuda-kriteriene fant ingen forskjell fra kontrollene. Ikke replikert.
    sources:
    - pmid:24665088
    - pmid:34815320
    source_hash: 4ed1103839f54158da485bd71af72af6d87c9425bd3889c44dad549841c97130
  links[1]:
    text: En PET-studie med n=9 pasienter og 10 friske kontroller, der diagnosekriteriene ikke er verifisert, fant at bindingen
      av en markør for aktiverte mikroglia eller astrocytter i noen hjerneområder samvarierte med smerteskårer. En senere
      PET-studie med n=9 kvinner definert etter Fukuda-kriteriene fant ingen forskjell fra kontrollene. Ikke replikert.
    sources:
    - pmid:24665088
    - pmid:34815320
    source_hash: 24c6237ef6371572776d5e2a79af5b10c8d5b25edd96eaa51c5e1d22ea6a4cba
  links[2]:
    text: En oversiktsartikkel foreslår at aktiverte mikroglia og astrocytter kan frigjøre inflammatoriske cytokiner og nitrogenoksid
      som kan endre uttrykket av døgnrytmeregulatorer som CLOCK. Den brukte kronisk utmattelsessyndrom som én av tre eksempeltilstander
      og var ikke en pasientstudie av denne sammenhengen.
    sources:
    - pmid:29759891
    source_hash: 20eb4eb27eccb48c13f26553c8eb66a0ea39ee2fafeae43c03a7b45741cd9379
  studies[pmid:24665088].finding:
    text: En studie av n=9 pasienter og 10 friske kontroller fant at bindingen av PET-sporstoffet 11C-(R)-PK11195, som markerer
      et protein uttrykt av aktiverte mikroglia eller astrocytter, var 45%-199% høyere i cingulære cortex, hippocampus, amygdala,
      thalamus, midthjernen og pons hos pasientene, og at bindingen i noen av disse områdene hang sammen med skårer for kognitiv
      svikt, smerte og depresjon.
    source_hash: f8d00c170991364c92d7e3f2680e354e19bd250f1af8b3344fcae00ad5a63940
  studies[pmid:34815320].finding:
    text: En studie av n=9 kvinner med CFS og 9 friske kvinner, ved siden av 10 kvinner med Q-feber-utmattelsessyndrom, fant
      ingen statistisk signifikant forskjell i bindingspotensial for 11C-PK11195 mellom pasienter og kontroller, og en negativ
      sammenheng mellom binding og symptomalvorlighet i CFS-gruppen.
    source_hash: 092f464edd4f6f17c2aa3f0fa1f0302cdfc5bd850669a36354fd3b058664655b
  studies[pmid:30617782].finding:
    text: En studie av n=15 kvinner med ME/CFS og 15 friske kontroller matchet på alder og kjønn, med MR-spektroskopi av hele
      hjernen, fant forskjeller i stoffskiftestoffer i flere områder, mest tydelig et høyere kolin/kreatin-forhold i venstre
      fremre cingulære cortex, og høyere temperatur i hjernen i høyre insula, putamen, frontal cortex, thalamus og lillehjernen;
      forfatterne skriver at funnene kan tyde på nevroinflammasjon.
    source_hash: c9451c642369765107a58db53e513cc4ba5d1e158cb90c879c26a613ab676531
  studies[pmid:41834684].finding:
    text: En studie av n=67 pasienter og 67 matchede friske kontroller med en diffusjons-MR-modell for avbildning av nevroinflammasjon
      fant utbredte forskjeller i hvit substans, blant annet et lavere forhold for hindret vann og lavere begrenset fraksjon
      og en høyere fibrefraksjon, som forfatterne tolker som nevroinflammasjon i hvit substans; konvensjonell diffusion tensor
      imaging viste minimale forskjeller mellom gruppene.
    source_hash: 16c23e8c1f34397acf6b7c24124eb5b2a6acab8899e4865eafd23f01e6e83091
  studies[pmid:34609538].finding:
    text: En studie av n=22 pasienter og 13 friske kontroller med MR-spektroskopi på 7 tesla av fremre cingulære cortex fant
      lavere myo-inositol hos pasientene, noe forfatterne skriver ville være forenlig med dysfunksjon i gliaceller; lavere
      glutation og total kreatin forble ikke signifikante når N-acetylaspartat ble brukt som referanse.
    source_hash: 9760894de874e5d97cfa22742db6ded248c5db40cf66d358fbf626c198f6efe5
  studies[pmid:12598734].finding:
    text: En studie av n=8 pasienter sammenlignet med friske kontroller matchet på alder og kjønn fant et høyere signal fra
      kolinholdige forbindelser i venstre basalganglier, som forfatterne antyder kan gjenspeile raskere omsetning av cellemembraner
      på grunn av gliose eller endret signalering inne i membranen, uten regional strukturell eller inflammatorisk patologi.
    source_hash: 019c324d47d867dbf659675516515d2effbe0c0b196b7a5f8c7024f74da878d3
  studies[pmid:29759891].finding:
    text: En oversiktsartikkel som foreslår et rammeverk der systemisk betennelse kan aktivere mikroglia og astrocytter, hvis
      cytokiner og nitrogenoksid kan påvirke uttrykket av døgnrytmeregulatorer som CLOCK. Den tar kronisk utmattelsessyndrom,
      bipolar lidelse og multippel sklerose som eksempeltilstander. Sitert på kartet som kilde til en foreslått lenke, ikke
      som evidens for nivået.
    source_hash: cfa1e6c94e6bc36c1547950f985c66807ec886ae00d3c9d4427483757f93be5d
  studies[pmid:42227214].finding:
    text: En publisert rettelse (erratum) til pmid:41834684, ikke en ny pasientstudie. Den endrer tolkningen av den lavere
      restricted fraction (NII-RF) fra økt infiltrasjon av inflammatoriske celler til endring i cellenes form eller en kronisk
      uttømming av mikroglia. Den tolker den lavere hindered water ratio som cellesvelling eller cytotoksisk-liknende ødem
      og ikke vasogent ødem, og fjerner én setning i Discussion. Rettelsen oppgir ingen endring i gruppeforskjellene i Table
      2.
    source_hash: 0324b0d4caafbab366e3bb0fd6246b88e16808fbf2fd0d29ae38b862bcca08ec
