slug: hpa-axis-cortisol
items:
  name:
    text: Endret funksjon i stresshormonsystemet (HPA-aksen) og lavt kortisol
    source_hash: 522bc7f0663f0165e4a395ae68c9d24ca4cedc51a03e858e7837f5337aeeffb5
  core_claim:
    text: 'Hypotesen går ut på at hypotalamus-hypofyse-binyre-aksen (HPA-aksen), hormonsystemet som styrer stresshormonet
      kortisol, hos personer med ME/CFS fungerer under det normale: kortisolproduksjonen er lav, eller kortisolresponsen på
      stimulering er svekket, og dette bidrar til symptomene.'
    sources:
    - pmid:1659582
    - pmid:9669518
    - pmid:9757853
    source_hash: 64beed09b84709fe28b74d16eb24a2ec23caa8f146aee9c84548ad3ba0a5c36e
  level_reason[0]:
    text: En studie fra Dinan-gruppen med 14 pasienter diagnostisert etter CDC-kriteriene (versjon ikke oppgitt, så definisjonen
      krever ikke PEM) og 14 friske frivillige ga kortikotropinfrigjørende hormon (CRH), hjernens signal som setter i gang
      HPA-aksen. Frigjøringen av ACTH, hypofysehormonet som stimulerer binyrene, og av kortisol var lavere hos pasientene;
      basalt ACTH og kortisol skilte seg ikke. Kortet er på nivå 2 på grunn av denne studien. En annen studie fra samme gruppe,
      med 20 pasienter og 20 friske frivillige, fant en mindre økning i kortisol etter en lav dose (1 mikrogram) ACTH; 9 av
      20 pasienter og 2 av 20 frivillige besto ikke testen ved en grense som forfatterne kaller vilkårlig. Ingen annen gruppe
      har gjentatt noen av testene med samme resultat.
    sources:
    - pmid:9669518
    - pmid:9713562
    source_hash: caf7cabb6dd2435f6a5aac68169f512cba609b5e26db09dfdae38c5e683116c8
  level_reason[1]:
    text: En studie fra King's College London, uten felles forfattere med Dinan-studiene, testet 37 pasienter som oppfylte
      CDC-kriteriene (versjon ikke oppgitt) og 28 friske kontroller. Fritt kortisol i urin over 24 timer var lavere hos pasientene
      (antall målt er ikke oppgitt i sammendraget). Studien brukte den samme CRH-testen som Dinan-gruppen. Kortisol i utgangspunktet
      før CRH-testen var høyere hos pasientene. ACTH-responsene på CRH og på to andre provokasjonstester var normale, like
      i de to gruppene, og forfatterne skriver at resultatene deres "do not support previous findings" om reduserte sentrale
      responser i HPA-aksen. Kortisolresponsene på CRH og på d-fenfluramin viste en tendens til å være lavere hos pasientene,
      som bare var signifikant etter justering for ACTH-responsene.
    sources:
    - pmid:11502777
    source_hash: e00eaf835b406d5a847237211241b524ec1419bc4c621a7552fc4a460e690b59
  level_reason[2]:
    text: Kortet er ikke på nivå 3 fordi ingen uavhengig studie har gjentatt det samme resultatet. Studien fra London ga den
      samme CRH-testen og fant normale ACTH-responser, med en lavere kortisolrespons bare etter justering. En studie fra Napoli
      og Stanford med 30 kvinner diagnostisert etter Fukuda-, Canada- og Institute of Medicine-kriteriene og 25 friske kontroller
      fant lavere ACTH- og kortisolnivåer hos pasientene, men dette er et annet blodmål, og sammendraget sier ikke om verdiene
      var i hvile eller stimulerte. En studie fra Uppsala med pasienter som oppfylte Canada-kriteriene fant ingen forskjell
      i kortisol i plasma om morgenen.
    sources:
    - pmid:9669518
    - pmid:11502777
    - pmid:34254637
    - pmid:40713801
    source_hash: 76360dbc1ef1425d3c1f1e3731c16de47e1a0908069ff5701dfd4b14e5fe7b72
  level_reason[3]:
    text: Andre studier med anerkjente diagnosekriterier fant ikke det samme. En studie fra London med 20 pasienter som oppfylte
      CDC-kriteriene og 20 matchede kontroller brukte den samme ACTH-testen med lav dose som Dinan-gruppen og fant ingen forskjeller
      i kortisol i utgangspunktet eller i kortisolresponsene. En studie fra Uppsala med 24 pasienter som oppfylte Canada-kriteriene,
      International Consensus Criteria og IOM 2015-kriteriene og 24 matchede kontroller fant ingen signifikant forskjell i
      kortisol i plasma om morgenen, målt med massespektrometri; kortisol skilte seg heller ikke før korreksjon for multippel
      testing, og heller ikke hos kvinner eller menn analysert hver for seg. En studie fra Østerrike og Chile (Canada- og/eller
      Fukuda-kriteriene) av kvinner (20 med lett eller moderat og 24 med alvorlig sykdom, 12 kontroller) og menn (8 og 6,
      17 kontroller) fant lavere kortisol bare hos menn med lett eller moderat sykdom; etter korreksjon for multippel testing
      var ikke kortisol blant hormonene som skilte seg mellom gruppene.
    sources:
    - pmid:10594524
    - pmid:40713801
    - pmid:38724880
    source_hash: ab271f989502e381437fd013f63bd0ca2050551e7a2feb521968c4214cfca4ff
  level_reason[4]:
    text: 'Flere studier kan ikke telle mot nivået fordi diagnosekriteriene deres ennå ikke er kontrollert. De peker i begge
      retninger: lavere kortisol i plasma om kvelden og lavere kortisol i urin hos 30 pasienter sammenlignet med 72 frivillige;
      lavere kortisol i urin hos 121 klinikkpasienter sammenlignet med 64 personer uten sykdommen; en flatere økning i kortisol
      i spytt om morgenen hos kvinner, men ikke menn, i en befolkningsbasert studie av 75 personer med sykdommen og 110 friske
      kontroller; og ingen forskjell i kortisol i spytt eller urin hos 22 pasienter i en studie fra Oxford.'
    sources:
    - pmid:1659582
    - pmid:11282703
    - pmid:18160468
    - pmid:9494707
    source_hash: eb193da85dfae3f99bef5da1358e5149d39a9d88e7b6fded7af1abf78f9d2059
  level_reason[5]:
    text: I en placebokontrollert studie fra US National Institutes of Health tok 56 kvinner og 14 menn som oppfylte CDC-definisjonen
      fra 1988 (som ikke krever PEM) hydrokortison, en kortisoltablett, eller placebo i omtrent 12 uker. Studiens hovedmål,
      andelen pasienter som ble bedre på en velværeskala, skilte seg ikke (20 av 30 på hydrokortison, 19 av 35 på placebo,
      P = 0,31). Flere pasienter på hydrokortison ble bedre med 5 poeng eller mer (53% mot 29%, P = 0,04), et sekundært mål;
      andre selvvurderingsskalaer viste ingen forskjell, og kroppens egen kortisolrespons ble undertrykt hos 12 pasienter
      på hydrokortison og ingen på placebo. På studiens hovedmål nås ikke nivå 4.
    sources:
    - pmid:9757853
    source_hash: 2ed42b7bc07fef9adf198206440b71e32df59dbd8c2dbd609110aa81137f7345
  level_reason[6]:
    text: En større placebokontrollert crossover-studie fra Leuven i Belgia, med 100 pasienter som oppfylte CDC-definisjonen
      fra 1994 (Fukuda), der 80 fullførte tre måneder med 5 mg hydrokortison sammen med 50 mikrogram fludrokortison og tre
      måneder med placebo, fant ingen forskjell i utmattelse, velvære eller noe annet mål. Den brukte en lavere hydrokortisondose
      og la til fludrokortison, så den testet ikke den samme behandlingen som NIH-studien.
    sources:
    - pmid:12829200
    - pmid:9757853
    source_hash: 7dbb3e6755c7754d2b1985b7da1c2f8492425c1ea0e57bbf1d94b0df450a6b3a
  level_reason[7]:
    text: En crossover-studie fra London med 32 pasienter fant at utmattelsen sank mer på hydrokortison i lav dose enn på
      placebo (p = 0,009), men diagnosekriteriene er ennå ikke kontrollert, så den kan ikke telle mot nivå 4. HPA-studien
      fra London, fra samme gruppe, behandlet 32 av pasientene sine med hydrokortison i samme type crossover; det er ikke
      oppgitt om dette er de samme pasientene. Hos pasientene som ble bedre, økte kortisolresponsen på CRH, og den svekkede
      responsen som var sett tidligere, snudde. Dette er en endring hos pasientene som ble bedre, ikke en sammenligning med
      kontroller, og den er ikke gjentatt. En studie av fludrokortison alene hos 100 pasienter som oppfylte CDC-kriteriene
      fant ingen forskjell fra placebo; den ble testet som behandling av lavt blodtrykk ved stående, ikke av lavt kortisol.
    sources:
    - pmid:9989716
    - pmid:11502777
    - pmid:11150109
    source_hash: 129f5b2022d6d120db57688a4f6abd434a72fa3b3d74d01b716fdcf661679acc
  contested_reason[0]:
    text: Nivå 2 bygger på en studie av 14 pasienter diagnostisert etter CDC-kriteriene (versjon ikke oppgitt) og 14 friske
      frivillige, som fant lavere frigjøring av ACTH og kortisol etter kortikotropinfrigjørende hormon (CRH) hos pasientene.
    sources:
    - pmid:9669518
    source_hash: e7aa90f1d9cce2a98f50d0c96405b0d91153910bbc4397a7783c62302cb45069
