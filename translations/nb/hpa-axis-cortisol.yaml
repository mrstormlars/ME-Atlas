  badge_reasons.explains_pem[0]:
    text: 'Ingen studie på dette kortet måler PEM direkte og knytter den til kortisol. En studie, hvis diagnosekriterier ennå
      ikke er kontrollert, målte hormoner etter en maksimal tredemølletest: ACTH 4 minutter etter anstrengelsen var lavere
      hos pasientene enn hos stillesittende kontroller, og dagen etter skilte ikke hormonnivåene seg; sammendraget oppgir
      ikke noe symptommål.'
    sources:
    - pmid:11150897
    source_hash: 1650559952808b2768be95060037f650040b8dcf5b70f2beacf0831e0a06402e
  subgroups[0]:
    text: To studier tyder på kjønnsforskjeller, med ulike mål; resultatet for menn bygger på 8 pasienter. Ikke gjentatt.
      En befolkningsbasert studie, hvis diagnosekriterier ennå ikke er kontrollert, fant en svekket profil for kortisol i
      spytt om morgenen hos kvinner, men ikke hos menn. En studie som oppfylte Canada- og/eller Fukuda-kriteriene fant lavere
      kortisol i plasma hos menn med lett eller moderat sykdom (n=8) i den BH-justerte parvise sammenligningen. En studie
      som oppfylte Canada-kriteriene, International Consensus Criteria og IOM 2015-kriteriene fant ingen signifikant forskjell
      i kortisol i plasma hos kvinner (16 pasienter) eller menn (8 pasienter) analysert hver for seg.
    sources:
    - pmid:18160468
    - pmid:38724880
