  contested_reason[2]:
    text: De to studiene brukte ulike CRH-preparater, noe regelen om sammenlignbar kvalitet ikke tar stilling til. Regelen
      krever de samme eller strengere diagnosekriterier (CDC-kriteriene i begge), en kontrollgruppe og minst halvparten så
      mange pasienter (37 mot 14), og den senere studien oppfyller alle tre, så den er av sammenlignbar kvalitet og motsier
      studien som nivå 2 bygger på. Trinn 2 er derfor omstridt. Studien med 30 kvinner og 25 friske kontroller (Fukuda-, Canada-
      og Institute of Medicine-kriteriene) rapporterte også lavere ACTH og kortisol og støtter også trinnet; sammendraget
      sier ikke om verdiene var i hvile eller stimulerte. Om studien av kortisol i plasma med 24 pasienter som oppfylte Canada-kriteriene,
      International Consensus Criteria og IOM 2015-kriteriene og 24 kontroller, som ikke fant noen forskjell, motsier det,
      kan ikke avgjøres ut fra sammendragene, fordi det avhenger av hva som er målt.
    sources:
    - pmid:11502777
    - pmid:9669518
    - pmid:34254637
    - pmid:40713801
    source_hash: 96baa2fd82ee410358478de547df6db66d1ac479e7a1749012c9359b2fb2d770
