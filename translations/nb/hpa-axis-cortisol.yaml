  links[0]:
    text: En oversiktsartikkel fra 2025 sier at unormale nivåer av hormoner i HPA-aksen ved ME/CFS har vært satt i sammenheng
      med mer søvnvansker. Oversiktsartikkelen testet ikke dette selv. En studie av 121 klinikkpasienter og 64 sammenligningspersoner,
      med diagnosekriterier som ennå ikke er verifisert, fant lavere fritt kortisol i urin over 24 timer hos pasientene og
      rapporterte at de lavere nivåene ikke hang sammen med søvnforstyrrelse. En studie av 24 pasienter som oppfylte Canadian-,
      International- og IOM 2015-kriteriene og 24 matchede kontroller fant at ingen av de utforskende korrelasjonene mellom
      steroidnivåer i blodet og skårer på to symptomskalaer (der den ene har søvnforstyrrelse blant sine punkter) var signifikante
      etter korreksjon for flere sammenligninger.
    sources:
    - pmid:41516296
    - pmid:11282703
    - pmid:40713801
    source_hash: 3cb7fe3d50275cf89f4dcb138a4a9ac9e8ee625ff7574850df211fe6a9b4d194
  links[1]:
    text: Den samme oversiktsartikkelen fra 2025 sier at unormale nivåer av hormoner i HPA-aksen ved ME/CFS har vært satt
      i sammenheng med mer konsentrasjonsvansker. Oversiktsartikkelen testet ikke dette selv. En studie av 24 pasienter som
      oppfylte Canadian-, International- og IOM 2015-kriteriene og 24 matchede kontroller fant at ingen av de utforskende
      korrelasjonene mellom steroidnivåer i blodet og skårer på to symptomskalaer (en skala for mental utmattelse og en skala
      for flere organsystemer som har kognitiv dysfunksjon blant sine punkter) var signifikante etter korreksjon for flere
      sammenligninger.
    sources:
    - pmid:41516296
    - pmid:40713801
    source_hash: d1be75bdfcee5003a9577cbb031b31c55142d44784347119ed938d78568286eb
  links[2]:
    text: En oversiktsartikkel fra 2019 antyder at koblingen mellom kortisolstyrte stressresponser og tarmen via HPA-aksen
      kan fungere dårlig ved ME/CFS på grunn av det lave kortisolet som tidligere arbeid har antydet. Det kan legge til enda
      en forstyrret reguleringssløyfe som kan bidra til å opprettholde en endret homeostase. Den lister også opp dysregulering
      av HPA-aksen blant tilstander som kan flytte celler over i en alternativ stabil hviletilstand. Dette ble ikke studert
      direkte hos pasienter.
    sources:
    - pmid:31330791
    source_hash: 4ad10fc77173a207f5714f6283b234c63c8507fc180117d55e67cfdd83ee6a59
  studies[pmid:9669518].finding:
    text: En studie med n=14 pasienter og 14 friske frivillige fant lavere frigjøring av ACTH (P < 0,005) og kortisol (P <
      0,05) etter kortikotropinfrigjørende hormon hos pasientene, uten forskjell i basalt ACTH eller kortisol.
    source_hash: 66449e62be37fad6952ede993e090c656ea9c6414f3456e7e80b67666e38799c
  studies[pmid:9713562].finding:
    text: En studie med n=20 pasienter og 20 friske frivillige fant en mindre økning i kortisol etter 1 mikrogram ACTH hos
      pasientene (P < 0,05), uten forskjell i kortisol i utgangspunktet eller etter 30 minutter; 9 pasienter og 2 frivillige
      besto ikke testen ved en grense på en økning på 250 nmol/l, som forfatterne kaller vilkårlig.
    source_hash: 3f54074a6220982099604fe0b75deef787850b538fd9881dfb544e7dd7f7f784
  studies[pmid:11502777].finding:
    text: En studie med n=37 pasienter og 28 friske kontroller fant lavere fritt kortisol i urin over 24 timer hos pasientene
      (antall målt er ikke oppgitt i sammendraget), høyere kortisol i utgangspunktet før CRH-testen og like ACTH-responser
      på tre provokasjonstester; lavere kortisolresponser på CRH og d-fenfluramin var en tendens, som bare var signifikant
      etter justering for ACTH-responsene.
    source_hash: 912c88e76a57353a6d1b560907cec14dac35e6c73f118c4f78214e9339922bdd
  studies[pmid:34254637].finding:
    text: En studie med n=30 kvinner og 25 friske kontroller fant lavere ACTH- og kortisolnivåer hos pasientene, og antistoffer
      mot hypofysen hos 56% og mot hypotalamus hos 33% av pasientene og hos ingen av kontrollene.
    source_hash: 1535b9d628123ecb32ba0fda31f33e81b96fbcb13a920b1f8fb4bf974b0baa4f
  studies[pmid:9757853].finding:
    text: En placebokontrollert studie med 56 kvinner og 14 menn fant ingen forskjell i andelen som ble bedre på en velværeskala
      (20 av 30 på hydrokortison, 19 av 35 på placebo, P = 0,31); gjennomsnittlig bedring i velvære var 6,3 mot 1,7 poeng
      (P=0,06), 53% mot 29% ble bedre med 5 poeng eller mer (P = 0,04), og gjennomsnittlig bedring var høyere på flere dager
      på hydrokortison (P<0,001); andre selvvurderingsskalaer viste ingen statistisk evidens for bedring, og undertrykt binyrefunksjon
      forekom hos 12 pasienter på hydrokortison og ingen på placebo.
    source_hash: 5fa5ec3bc6fe73c9162bb634ff2c62b1eb761c05253243f87600bee19c4522ff
  studies[pmid:12829200].finding:
    text: En placebokontrollert crossover-studie med n=80 pasienter som fullførte begge armene (100 inkludert) fant ingen
      forskjell mellom hydrokortison i lav dose sammen med fludrokortison og placebo i utmattelse eller velvære.
    source_hash: 4d4e9a74f5ad722a9774a4e9bac22dc74da967378ec6bf1292786c0ef54fc658
  studies[pmid:10594524].finding:
    text: En studie med n=20 pasienter og 20 matchede friske kontroller fant ingen forskjeller i kortisol i utgangspunktet
      eller i kortisolresponsene på 1 mikrogram ACTH (Synacthen).
    source_hash: 196b43545f618d9e1e5f5566a42376ca27f41b0dbe124aec8d10772e396b3463
  studies[pmid:40713801].finding:
    text: En studie med n=24 pasienter og 24 kontroller matchet på alder og kjønn fant ingen forskjell i kortisol i plasma,
      selv før korreksjon for multippel testing (gjennomsnitt 138,064 hos kontrollene og 135,157 hos pasientene, p 0,718),
      og ingen hos kvinner eller menn analysert hver for seg.
    source_hash: 8f59adacc3ded0bf69b244a362ad24bd271948daaabf3a05c31f1d8d3f64c3ad
  studies[pmid:38724880].finding:
    text: En studie av kvinner (20 med lett eller moderat og 24 med alvorlig sykdom, 12 friske kontroller) og menn (8 og 6,
      17 friske kontroller) fant at kortisol i testen av de tre gruppene ikke var blant hormonene som skilte seg etter korreksjon
      for multippel testing; i den BH-justerte parvise sammenligningen hadde menn med lett eller moderat sykdom (n=8) lavere
      kortisol i plasma enn mannlige kontroller (n=17; p = 0,0260), og det ble ikke rapportert noen forskjell i kortisol hos
      kvinner.
    source_hash: 36dc57abd2fd2d7298564d8fcce82930f335fd0f780b6f95cd7e4e9308a3dc6a
  studies[pmid:9989716].finding:
    text: En placebokontrollert crossover-studie med n=32 pasienter fant at utmattelsen sank med 7,2 poeng på hydrokortison
      i lav dose og 3,3 poeng på placebo (p = 0,009); 9 pasienter på hydrokortison og 3 på placebo nådde en forhåndsbestemt
      grense nær skåren i befolkningen.
    source_hash: f9068bc3ea08313394c449552c46329fc53f16d9b83779ad6355e72319a32ebf
  studies[pmid:11150109].finding:
    text: En placebokontrollert studie med n=100 pasienter med nevralt mediert hypotensjon fant at 7 av 50 på fludrokortison
      og 5 av 50 på placebo ble bedre med minst 15 poeng på en velværeskala (P = 0,76).
    source_hash: 2465b3b71255e1fd79ca95a5fcc76f8c7d0d6db92c51c4bea423cdc936e5d8c8
  studies[pmid:1659582].finding:
    text: En studie med n=30 pasienter og 72 frivillige fant lavere kortisol i plasma om kvelden og lavere fritt kortisol
      i urin over 24 timer, høyere ACTH om kvelden og en mindre ACTH-respons på CRH hos pasientene, uten forskjell i CRH i
      spinalvæsken.
    source_hash: 1e93054648ab02a9c5e207483b57613b9bdc8d92ba6a5a18c0a89c3c89c5156a
  studies[pmid:11282703].finding:
    text: En studie med n=121 klinikkpasienter og 64 sammenligningspersoner fant lavere fritt kortisol i urin over 24 timer
      hos pasientene, med eller uten psykisk sykdom.
    source_hash: 34b96c1fdca38768466a568a79f3b546995f3a3b338d6de52d7b49fca623bd05
  studies[pmid:18160468].finding:
    text: En studie med n=75 personer med sykdommen og 110 friske kontroller fra den generelle befolkningen fant en svekket
      profil for kortisol i spytt om morgenen hos kvinner, men like profiler hos menn.
    source_hash: 09c4cd40917f80106f92fbd2c87652175c859eb2bf55cad3cefe90cd66187147
  studies[pmid:9494707].finding:
    text: En studie med n=22 pasienter og en kontrollgruppe fant ingen forskjell i kortisol i spytt eller urin over 24 timer.
    source_hash: c6d0ffd13e734befb9310a9e428b8dd253963f64055c887f72e31826bdc3be32
  studies[pmid:11150897].finding:
    text: En studie av pasienter og matchede stillesittende kontroller (antall står ikke i sammendraget) fant ingen forskjell
      i basale hormoner, lavere ACTH 4 minutter etter en maksimal tredemølletest hos pasientene, og ingen forskjeller dagen
      etter.
    source_hash: c6c6ad52fb492737d3ce23b488139a53848d84539772b13bfc67bd72da7fb71d
