slug: hpa-axis-cortisol
items:
  name:
    text: Endret funksjon i stresshormonsystemet (HPA-aksen) og lavt kortisol
    source_hash: 522bc7f0663f0165e4a395ae68c9d24ca4cedc51a03e858e7837f5337aeeffb5
  core_claim:
    text: 'Hypotesen går ut på at hypotalamus-hypofyse-binyre-aksen (HPA-aksen), hormonsystemet som styrer stresshormonet
      kortisol, hos personer med ME/CFS fungerer under det normale: kortisolproduksjonen er lav, eller kortisolresponsen på
      stimulering er svekket, og dette bidrar til symptomene.'
    sources:
    - pmid:1659582
    - pmid:9669518
    - pmid:9757853
    source_hash: 64beed09b84709fe28b74d16eb24a2ec23caa8f146aee9c84548ad3ba0a5c36e
  level_reason[0]:
    text: En studie fra Dinan-gruppen med 14 pasienter diagnostisert etter CDC-kriteriene (versjon ikke oppgitt, så diagnosekriteriene
      krever ikke PEM) og 14 friske frivillige ga 100 mikrogram ovint kortikotropinfrigjørende hormon (CRH), hjernens signal
      som setter i gang HPA-aksen. Frigjøringen av ACTH, hypofysehormonet som stimulerer binyrene, og av kortisol var lavere
      hos pasientene; basalt ACTH og kortisol skilte seg ikke. En studie med 30 kvinner og 25 friske kontroller (Fukuda, Canadian
      og Institute of Medicine criteria) rapporterte også lavere ACTH-/kortisolnivåer; den er en kontrollert studie med anerkjente
      diagnosekriterier og støtter også nivå 2, forenlig med hver av de to delene av kjernepåstanden, selv om sammendraget
      ikke sier om verdiene var hvileverdier eller stimulerte verdier. En andre studie fra Dinan-gruppen, med 20 pasienter
      og 20 friske frivillige, fant en mindre økning i kortisol etter en lav dose (1 mikrogram) ACTH; 9 av 20 pasienter og
      2 av 20 frivillige besto ikke testen ved en grense som forfatterne kaller vilkårlig. En tidligere studie der diagnosekriteriene
      ikke er verifisert, fant et mindre ACTH-svar på CRH, så den kan ikke telle med. Ingen annen gruppe har gjentatt noen
      av Dinan-testene med samme resultat og verifiserte diagnosekriterier.
    sources:
    - pmid:9669518
    - pmid:34254637
    - pmid:9713562
    - pmid:1659582
    source_hash: 8f80bdf59f3acf6fef23e1887a2e249671e10f00d89de410de8df605c1a2c4a7
  level_reason[1]:
    text: En studie uten felles forfattere med Dinan-studiene testet 37 pasienter som oppfylte CDC-kriteriene (versjon ikke
      oppgitt) og 28 friske kontroller. Fritt kortisol i urin over 24 timer var lavere hos pasientene (antall målt er ikke
      oppgitt i sammendraget). Den ga humant CRH, mens Dinan-studien ga 100 mikrogram CRH fra sau (dosen er ikke oppgitt i
      sammendraget av studien med 37 pasienter), så de to studiene brukte ulike CRH-preparater. Kortisol i utgangspunktet
      før testen med humant CRH var høyere hos pasientene. ACTH-responsene på CRH og på to andre provokasjonstester var normale,
      like i de to gruppene, og forfatterne skriver at resultatene deres "do not support previous findings" om reduserte sentrale
      responser i HPA-aksen. Kortisolresponsene på CRH og på d-fenfluramin viste en tendens til å være lavere hos pasientene,
      som bare var signifikant etter justering for ACTH-responsene.
    sources:
    - pmid:11502777
    - pmid:9669518
    source_hash: 44cfae893daf4d466388d42bdd67b50ff16b42b0949ce52c7b1c96be654f44ba
  level_reason[2]:
    text: Kortet er ikke på nivå 3 fordi ingen uavhengig studie har gjentatt det samme resultatet. Studien med 37 pasienter
      ga humant CRH, ikke CRH fra sau, og fant normale ACTH-responser, med en lavere kortisolrespons bare etter justering,
      så den gjentok ikke den svekkede ACTH-responsen. Studien med 30 kvinner og 25 friske kontroller rapporterte lavere ACTH-
      og kortisolnivåer, men sammendraget sier ikke om verdiene var i hvile eller stimulerte, så det kan ikke avgjøres ut
      fra sammendraget om den gjentar Dinans CRH-resultat. En studie med pasienter som oppfylte Canada-kriteriene, International
      Consensus Criteria og IOM 2015-kriteriene fant ingen forskjell i kortisol i plasma. Om studien av kortisol i plasma
      med 24 pasienter og 24 kontroller motsier studien med 30 kvinner (Fukuda-, Canada- og Institute of Medicine-kriteriene),
      kan ikke avgjøres ut fra sammendragene, fordi sammendraget av studien med 30 kvinner ikke sier om verdiene var i hvile
      eller stimulerte.
    sources:
    - pmid:9669518
    - pmid:11502777
    - pmid:34254637
    - pmid:40713801
    source_hash: f927df412d78d52d18b7508791c6ab9b84a62b90b6a029d5e9ccb5e6f3fa5585
  level_reason[3]:
    text: Andre studier med anerkjente diagnosekriterier fant ikke det samme. En studie med 20 pasienter som oppfylte CDC-kriteriene
      og 20 matchede kontroller ga den samme ACTH-dosen på 1 mikrogram som Dinan-gruppen (prøvetakingen var annerledes) og
      fant ingen forskjeller i kortisol i utgangspunktet eller i kortisolresponsene. En studie med 24 pasienter som oppfylte
      Canada-kriteriene, International Consensus Criteria og IOM 2015-kriteriene og 24 matchede kontroller fant ingen signifikant
      forskjell i kortisol i plasma, målt med massespektrometri; kortisol skilte seg heller ikke før korreksjon for multippel
      testing, og heller ikke hos kvinner eller menn analysert hver for seg. En studie av kvinner (20 med lett eller moderat
      og 24 med alvorlig sykdom, 12 kontroller) og menn (8 og 6, 17 kontroller), som oppfylte Canada- og/eller Fukuda-kriteriene,
      rapporterte to resultater. I testen av de tre gruppene var kortisol ikke blant hormonene som skilte seg etter korreksjon
      for multippel testing. I parvis sammenligning justert med Benjamini-Hochberg-metoden (BH) hadde menn med lett eller
      moderat sykdom (n=8) lavere kortisol enn mannlige kontroller (n=17; p = 0,0260), og det ble ikke rapportert noen forskjell
      i kortisol hos kvinner.
    sources:
    - pmid:10594524
    - pmid:40713801
    - pmid:38724880
    source_hash: a11895a04367739b59c9f21ab1c471857f2c1ded1f6a435e4bcfa81da23da1f2
  level_reason[4]:
    text: 'Flere studier kan ikke telle mot nivået fordi diagnosekriteriene deres ennå ikke er kontrollert. De peker i begge
      retninger: lavere kortisol i plasma om kvelden og lavere kortisol i urin hos 30 pasienter sammenlignet med 72 frivillige;
      lavere kortisol i urin hos 121 klinikkpasienter sammenlignet med 64 personer uten sykdommen; en flatere økning i kortisol
      i spytt om morgenen hos kvinner, men ikke menn, i en befolkningsbasert studie av 75 personer med sykdommen og 110 friske
      kontroller; og ingen forskjell i kortisol i spytt eller urin hos 22 pasienter.'
    sources:
    - pmid:1659582
    - pmid:11282703
    - pmid:18160468
    - pmid:9494707
    source_hash: b94f6584e8a2389e39b46449290de0879b7dd82d82c269c827513a1428ecc362
  level_reason[5]:
    text: 'I en placebokontrollert studie med 56 kvinner og 14 menn som oppfylte CDC-definisjonen fra 1988 (som ikke krever
      PEM) tok pasientene hydrokortison, en kortisoltablett, eller placebo i omtrent 12 uker. Antallet pasienter som ble bedre
      på en velværeskala skilte seg ikke (20 av 30 på hydrokortison, 19 av 35 på placebo, P = 0,31). De som fikk hydrokortison
      hadde en større bedring i gjennomsnittlig velværescore (6,3 mot 1,7 poeng; P=0,06), flere av dem registrerte en bedring
      på 5 poeng eller mer (53% mot 29%, P = 0,04), og de hadde en høyere gjennomsnittlig bedring på flere dager (P<0,001).
      Statistisk evidens for bedring ble ikke sett med andre selvvurderingsskalaer, og undertrykt respons i binyrenes glukokortikoider
      ble dokumentert hos 12 pasienter på hydrokortison og ingen på placebo. Nivå 4 nås ikke: resultatene innenfor denne ene
      studien er blandede, den er ikke gjentatt med den samme behandlingen (en senere crossover-studie testet en lavere dose
      sammen med fludrokortison), og diagnosekriteriene i crossover-studien som favoriserte hydrokortison er ikke kontrollert.'
    sources:
    - pmid:9757853
    - pmid:12829200
    - pmid:9989716
    source_hash: 066d5da0972e502fc83136cec755408c549d63e78c769ab2cfc20dadd8a0e74d
  level_reason[6]:
    text: En større placebokontrollert crossover-studie med 100 pasienter som oppfylte CDC-definisjonen fra 1994 (Fukuda),
      der 80 fullførte tre måneder med 5 mg hydrokortison sammen med 50 mikrogram fludrokortison og tre måneder med placebo,
      fant ingen forskjell i utmattelse, velvære eller de andre målene som er rapportert i sammendraget. Den brukte en lavere
      hydrokortisondose og la til fludrokortison, så den testet ikke den samme behandlingen som studien fra 1998.
    sources:
    - pmid:12829200
    - pmid:9757853
    source_hash: 8c1d73d02f98e83b50ca64dc3da956d26d743b6fb91ddd1f1fa0496c366584f3
  level_reason[7]:
    text: En crossover-studie med 32 pasienter fant at utmattelsen sank mer på hydrokortison i lav dose enn på placebo (p
      = 0,009), men diagnosekriteriene er ennå ikke kontrollert, så den kan ikke telle mot nivå 4. HPA-studien med 37 pasienter
      behandlet 32 av pasientene sine med hydrokortison i samme type crossover; det er ikke oppgitt om dette er de samme pasientene.
      Sett over alle deltakerne skilte ikke ACTH- og kortisolresponsene på humant CRH og på insulin-stresstesten seg mellom
      aktiv behandling og placebo. Hos pasientene som ble bedre, økte kortisolresponsen på CRH, og den svekkede responsen
      som var sett tidligere, snudde. Dette er en endring hos pasientene som ble bedre, ikke en sammenligning med kontroller,
      og den er ikke gjentatt. En studie av fludrokortison alene hos 100 pasienter som oppfylte CDC-kriteriene fant ingen
      forskjell fra placebo; den ble testet som behandling av lavt blodtrykk ved stående, ikke av lavt kortisol.
    sources:
    - pmid:9989716
    - pmid:11502777
    - pmid:11150109
    source_hash: 7fec6b0e06cafb08f370004ca6d80d55b7069b5fde2284dd602340f8edd56e4f
  contested_reason[0]:
