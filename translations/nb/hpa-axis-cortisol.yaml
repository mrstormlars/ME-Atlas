      justering for ACTH-responsene. Forfatterne skriver at resultatene deres "do not support previous findings" om reduserte
      sentrale responser i HPA-aksen.
    sources:
    - pmid:11502777
    source_hash: 9d33d7fb909721e729cc7d187f5a3bc9a3ba5e2c7ce91eda94c245e35019b8d7
  contested_reason[2]:
    text: Studien fra London har diagnosekriterier av samme rang, en kontrollgruppe og minst halvparten så mange pasienter
      (37 mot 14), så den er av sammenlignbar kvalitet og motsier studien som nivå 2 bygger på. Trinn 2 er derfor omstridt.
    sources:
    - pmid:11502777
    - pmid:9669518
    source_hash: 6551f6afc142673e385b2cb707022739e6c652c9f00a1e78ea080b620a0900fd
  contested_reason[3]:
    text: Dinan-gruppens studie med ACTH i lav dose er ikke nødvendig for nivå 2, som bygger på CRH-studien. Med den samme
      ACTH-testen med 1 mikrogram fant studien en mindre økning i kortisol hos 20 pasienter enn hos 20 frivillige, og en studie
      fra London fant ingen forskjell mellom 20 pasienter og 20 kontroller; begge brukte CDC-kriteriene og en kontrollgruppe.
    sources:
    - pmid:9713562
    - pmid:10594524
    source_hash: 9bfab81229debd39f1235fdf2d858f7872b36b2d9b3d56488dc8a0f69226a5bf
  badge_reasons.diagnostic_marker[0]:
    text: 'En studie brukte en grense på ACTH-testen med lav dose, som forfatterne kaller vilkårlig: 9 av 20 pasienter og
      2 av 20 friske frivillige besto den ikke. En annen gruppe som brukte den samme testen hos 20 pasienter og 20 kontroller
      fant ingen forskjell mellom dem, så markøren holdt ikke i en uavhengig kohort.'
    sources:
    - pmid:9713562
    - pmid:10594524
    source_hash: 531f672925769c45c5ded17fbe2a342a93bf7e5fc8af24384799efe7324038f4
  badge_reasons.explains_pem[0]:
    text: 'Ingen studie på dette kortet måler PEM direkte og knytter den til kortisol. En studie, hvis diagnosekriterier ennå
      ikke er kontrollert, målte hormoner etter en maksimal tredemølletest: ACTH 4 minutter etter anstrengelsen var lavere
      hos pasientene enn hos stillesittende kontroller, og dagen etter skilte ikke hormonnivåene seg; sammendraget oppgir
      ikke noe symptommål.'
    sources:
    - pmid:11150897
    source_hash: 1650559952808b2768be95060037f650040b8dcf5b70f2beacf0831e0a06402e
  subgroups[0]:
    text: To studier tyder på kjønnsforskjeller, med ulike mål; resultatet for menn bygger på 8 pasienter. Ikke gjentatt.
