  studies[pmid:34829952].finding:
    text: En studie der 39 av de 40 pasientene og 40 friske kontroller ble målt, fant lavere serumkynurenin (p = 0,012) og
      serotonin, høyere 3-hydroksykynurenin, og høyere forholdstall kynurensyre/kynurenin og 3-hydroksykynurenin/kynurenin
      hos pasientene.
    source_hash: aed277b273681cd45a9d37080b29908da1dcaf0350b5a1d00a0d6492a822ffba
  studies[pmid:40903540].finding:
    text: En studie med n=56 pasienter og 52 friske kontroller fant, før en treningstest, et høyere forhold mellom kynurensyre
      og kynurenin i plasma og et lavere forhold mellom kynurenin og tryptofan hos pasientene; 3-metoksyantranilat etter trening
      var forbundet med en generell utmattelsesskåre hos pasientene.
    source_hash: 54b008f08c1d099428b28b30156749793d3cbbd02cfec3de87d6aa77ab0f91ab
  studies[pmid:34423789].finding:
    text: En studie med n=83 pasienter og 35 friske kontroller fant lavere kynurensyre i serum i hver av tre metabolske undergrupper
      av pasienter sammenlignet med kontroller, med serumtryptofan lavere i én undergruppe og høyere i en annen.
    source_hash: 01767f1c2d7d83fec88fa24fec53bd1ed336b8e4c5f1de40435181fc5a550d8d
  studies[pmid:39302151].finding:
    text: En studie med n=38 pasienter og 24 friske kontroller fant lavere 3-hydroksykynurenin og 3-hydroksyantranilsyre i
      plasma og et høyere forhold mellom kynurenin og 3-hydroksykynurenin hos pasientene, og markerte ingen signifikant forskjell
      i forholdet mellom kynurenin og kynurensyre (Figure 2c).
    source_hash: 8c87ca12a7ca1c150a06cd7dcff06d2f2b3b68c6e6890357803d5581e2716492
  studies[pmid:42325052].finding:
    text: En studie som inkluderte 32 pasienter og 35 kontroller, med avføringsmetabolitter målt hos n=19 pasienter og 23
      kontroller, fant høyere tryptofan, indol og indolacetat i avføringen hos pasientene; aktiveringen av arylhydrokarbonreseptoren
      med avføringskulturer var ikke forskjellig.
    source_hash: 4beda4782c32e68d04d14933318e206e02c58af1430dd396c005f93cf26019e5
  studies[pmid:25227994].finding:
    text: En studie med n=5 kvinner fant at akutt tryptofanuttømming senket plasmaforholdet mellom tryptofan og andre store
      nøytrale aminosyrer med 96%, men ikke endret utmattelse, depresjonsskåre eller konsentrasjon sammenlignet med placebo;
      den testet serotoninsiden av tryptofanmetabolismen, ikke kynureninveien.
    source_hash: 43bc99a1d8410db2626d59ab07798c1c1738012824b6f7f09864236b6992c18d
  studies[pmid:38015302].finding:
    text: En studie av pasienter og friske kontroller (antall er ikke oppgitt i sammendraget) fant høyere kynurenin i plasma,
      som korrelerte med symptomenes alvorlighetsgrad, og lavere 3-hydroksykynurenin, 3-hydroksyantranilsyre, kinolinsyre
      og pikolinsyre hos pasientene.
    source_hash: 16b90dd3115b06bbe52ee3941fa66b975800579488ae8c262875d00a1458ca6b
  studies[pmid:34090138].finding:
    text: En studie med n=49 kvinner med CFS, 57 med fibromyalgi og 54 friske kontroller fant et lavere forhold mellom kynurensyre
      og kinolinsyre i plasma ved CFS enn hos kontrollene.
    source_hash: f84160d6fa1f8fac44029b77069b070e24c6159d5eb57e562122d30c26cbbee6
  studies[pmid:15982993].finding:
    text: En studie med n=23 pasienter og 42 friske kontroller fant 48% høyere fritt tryptofan i serum og 19% høyere totalt
      tryptofan hos pasientene.
    source_hash: 06714e6272c8e48bbb03d7984aabf02c99b565195d430c3ace544a516fe5d9d8
  studies[pmid:11352361].finding:
    text: En studie ved University of Oxford (kasusdefinisjon og antall er ikke oppgitt i sammendraget) fant lavere fritt
      tryptofan i plasma hos pasienter enn hos friske kontroller.
    source_hash: 00f98ea55351e472c542628d91dcd041193684e9c12caf3489eb28661f734801
  studies[pmid:20384451].finding:
    text: En studie av pasienter med bare CFS, CFS med fibromyalgi og friske kontroller (antall er ikke oppgitt i sammendraget)
      fant at "Plasma tryptophan and kynurenine concentrations did not differ among groups."
    source_hash: b22893ad7402b4c67943239aea86fe68d286245d2c4255601c993492fb702e00
