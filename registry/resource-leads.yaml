# Leads for the catalogue of ME/CFS data resources (docs/plan-data-catalogue.md).
# A lead is a place to look, not a statement about the resource. Per lead: `id` (kebab-case slug), `url` (the
# resource's own page) and, when the way to get access is on another page, `access_url`. Nothing else: no name, no
# description, no value. Every value the site shows comes from the stored page (`resources fetch`, `resources plan`).
leads:
- id: ausme
  url: https://emerge.org.au/ausme/
  access_url: https://emerge.org.au/for-researchers/
- id: decodeme
  url: https://institute-genetics-cancer.ed.ac.uk/decodeme-the-worlds-largest-mecfs-study/researcher-access
- id: mapmecfs
  url: https://mapmecfs.org/about
- id: me-cfs-research-register
  url: https://mrr.mecfs-research.org/en
- id: omf-data-center
  url: https://www.omf.ngo/data-sharing-in-the-omf-me-cfs-data-center/
- id: searchmecfs
  url: https://searchmecfs.org/
- id: solve-together
  url: https://solvecfs.org/research/solve-together/
- id: uk-me-cfs-biobank
  url: https://cureme.lshtm.ac.uk/index.php/biobank/
  access_url: https://cureme.lshtm.ac.uk/index.php/biobank/apply/
